sonar.projectKey=PatrickFrome_Compute
sonar.organization=patrickfrome
sonar.projectName=Compute / METAENGINE Browser
sonar.sourceEncoding=UTF-8

# The release gate owns the deployable Browser surface. Native Guardian bytes are
# compiled with /W4 /WX and physically self-tested on Windows by a separate gate;
# generated installers, dependencies and durable evidence are never source input.
sonar.sources=apps/metaengine-browser/src,apps/metaengine-browser/scripts,apps/metaengine-browser/supabase,apps/metaengine-browser/ui,apps/metaengine-browser/native
sonar.tests=apps/metaengine-browser/test
sonar.test.inclusions=apps/metaengine-browser/test/**/*.test.mjs
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-*/**,**/native-dist/**,**/*.min.js,**/*.map,**/*.exe,**/*.blockmap
sonar.javascript.node.maxspace=4096
sonar.scm.provider=git
