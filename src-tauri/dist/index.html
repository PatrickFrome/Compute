<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>ME2 OS · запуск…</title>
  <style>
    html, body { margin: 0; height: 100%; background: #09090b; color: #e4e4e7;
      font-family: ui-sans-serif, system-ui, sans-serif; display: grid; place-items: center; }
    .box { text-align: center; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 9999px;
      background: #f59e0b; margin-right: 10px; animation: pulse 1.2s ease-in-out infinite; }
    .dot.ok { background: #10b981; animation: none; }
    .dot.down { background: #f43f5e; animation: none; }
    @keyframes pulse { 50% { opacity: .3; } }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: .02em; }
    p { color: #a1a1aa; font-size: 13px; margin: 6px 0 0; }
    code { color: #d4d4d8; background: #18181b; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="box" aria-live="polite">
    <h1><span id="dot" class="dot"></span>ME2 OS</h1>
    <p id="msg">Поднимаю me2-daemon (sidecar) и жду <code>:3041/health</code>…</p>
  </main>
  <script>
    const dot = document.getElementById("dot");
    const msg = document.getElementById("msg");
    let tries = 0;
    const timer = setInterval(async () => {
      try {
        const r = await fetch("http://127.0.0.1:3041/health", { cache: "no-store" });
        const j = await r.json();
        if (j.ok) {
          clearInterval(timer);
          dot.className = "dot ok";
          msg.textContent = "Демон " + j.version + " готов (" + j.actions + "/47 действий) — открываю Mission Control…";
          setTimeout(() => location.replace("http://127.0.0.1:3041/"), 450);
          return;
        }
      } catch { /* daemon ещё не слушает */ }
      if (++tries > 60) {
        clearInterval(timer);
        dot.className = "dot down";
        msg.textContent = "Демон не поднялся за 30с — смотри sidecar.log в каталоге данных приложения.";
      }
    }, 500);
    document.addEventListener("me2-sidecar-down", () => {
      clearInterval(timer);
      dot.className = "dot down";
      msg.textContent = "Sidecar не отвечает — смотри sidecar.log в каталоге данных приложения.";
    });
  </script>
</body>
</html>
