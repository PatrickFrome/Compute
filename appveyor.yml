version: 1.0.{build}

image: Ubuntu2404
skip_tags: true
clone_depth: 50

build: off
deploy: off

test_script:
  - sh: set -euo pipefail; python3 --version; node --version; git --version
  - sh: set -euo pipefail; python3 -m unittest tests.a1.test_zero_spend_runner -v
  - sh: set -euo pipefail; python3 coordination/execution/zero_spend_runner.py --provider appveyor --output evidence/appveyor-zero-spend.json
  - sh: >-
      set -euo pipefail;
      python3 -c "import json,pathlib; d=json.loads(pathlib.Path('evidence/appveyor-zero-spend.json').read_text()); assert d['provider']['kind']=='appveyor'; assert d['source']['git_sha']==d['source']['expected_git_sha']; assert d['authority']['authority_effect'] is False; assert d['authority']['execution_authority'] is False; assert d['authority']['persistent_worker_proof'] is False; assert d['authority']['w1_verified'] is False; assert all(x['passed'] for x in d['checks']); print(d['contract']['provider_neutral_result_sha256'])"

artifacts:
  - path: evidence/appveyor-zero-spend.json
    name: a1-appveyor-zero-spend-evidence
