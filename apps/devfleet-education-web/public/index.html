<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf8"><meta name="description" content="Темы, уроки, тетради и чаты — личное пространство для обучения.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>DevFleet Education</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css">
</head><body>
<a class="skip-link" href="#lesson-title">К уроку</a>
<div class="app" id="app">
 <aside class="sidebar" id="sidebar" aria-label="Темы">
  <a class="brand" href="#/material-03-01"><img src="/assets/logo.svg" width="27" height="27" alt=""><span>Education</span></a>
  <label class="search"><span data-icon="search"></span><input id="topic-search" type="search" placeholder="Найти тему" aria-label="Найти тему"><kbd>/</kbd></label>
  <div class="nav-caption">Темы</div>
  <nav id="course-tree" aria-label="Темы и уроки"></nav>
 </aside>
 <main class="workspace" id="workspace">
  <header class="topbar">
   <button id="menu-toggle" class="icon-button mobile-menu" aria-label="Открыть темы" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button>
   <div class="breadcrumb" id="subject-name"></div>
   <button id="open-notebook" class="quiet notebook-toggle" aria-expanded="false" aria-controls="drawer"><span data-icon="notebook"></span><span>Тетрадь</span></button>
  </header>
  <section class="lesson-reader" id="lesson-reader" aria-label="Урок">
   <article class="lesson-content">
    <div class="lesson-heading"><span class="lesson-number" id="lesson-level"></span>
     <details class="action-menu"><summary aria-label="Действия с уроком" title="Действия с уроком"><span data-icon="more"></span></summary><div class="menu-items">
      <button id="edit-lesson">Редактировать урок</button><button id="add-image">Добавить изображение</button><button id="undo-lesson" disabled>Отменить изменение</button>
     </div></details>
    </div>
    <h1 id="lesson-title" tabindex="-1">Урок</h1>
    <div id="lesson-body"></div>
    <section id="lesson-modules" aria-label="Материалы урока"></section>
    <section id="lesson-images" aria-label="Изображения урока"></section>
    <footer class="lesson-end"><button id="ask-selection" class="quiet"><span data-icon="chat"></span>Обсудить</button><button id="next-lesson" class="quiet">Следующий урок <span data-icon="arrow-right"></span></button></footer>
   </article>
  </section>
  <div id="splitter" class="splitter" role="separator" tabindex="0" aria-label="Изменить высоту чата" aria-orientation="horizontal" aria-valuemin="20" aria-valuemax="60" aria-valuenow="30"><span></span></div>
  <section class="chat-panel" id="chat-panel" aria-label="Чат урока">
   <header class="chat-header"><div class="chat-heading"><span data-icon="chat"></span><strong>Чат</strong><span id="chat-topic"></span></div><button id="pair-chat" class="quiet pair-button" aria-pressed="false">Подключить рядом</button>
    <details class="action-menu"><summary aria-label="Действия с чатом" title="Действия с чатом"><span data-icon="more"></span></summary><div class="menu-items">
     <button id="pair-help">Беседы рядом — подключение</button><button id="pair-disconnect" hidden>Отключить переключение</button><button id="bind-chat">Привязать беседу</button><button id="preview-context">Посмотреть контекст</button><button id="request-patch">Попросить улучшить урок</button><button id="apply-reply">Внести ответ в урок</button>
    </div></details>
   </header>
   <div class="chat-intro"><span id="chat-destination">ChatGPT</span><span id="chat-location">Обычный ChatGPT в твоём аккаунте.</span></div>
   <div class="composer">
    <label class="sr-only" for="question">Вопрос по уроку</label>
    <textarea id="question" rows="2" maxlength="4000" placeholder="Спросить об уроке…"></textarea>
    <div class="compose-actions"><label class="share-option"><input id="share-notes" type="checkbox">С тетрадью</label><span id="draft-status" role="status" class="draft-status"></span>
     <button id="open-chatgpt" class="primary" title="Скопировать вопрос и материал и открыть ChatGPT">В ChatGPT <span data-icon="external"></span></button>
    </div>
   </div>
  </section>
 </main>
 <aside id="drawer" class="notebook" hidden aria-label="Тетрадь урока">
  <header class="notebook-header"><h2>Тетрадь</h2><div class="notebook-actions">
   <details class="action-menu"><summary aria-label="Данные тетради" title="Данные тетради"><span data-icon="more"></span></summary><div class="menu-items"><button id="export-data">Скачать копию</button><button id="import-data">Импортировать копию</button></div></details>
   <button id="close-drawer" class="icon-button" aria-label="Закрыть тетрадь"><span data-icon="close"></span></button>
  </div></header>
  <div class="notebook-body"><h3 id="notebook-topic"></h3>
   <form id="note-form"><label class="sr-only" for="note-title">Название записи</label><input id="note-title" maxlength="100" placeholder="Название записи">
    <label class="sr-only" for="note-body">Текст записи</label><textarea id="note-body" rows="7" maxlength="5000" placeholder="Запиши главное своими словами…" required></textarea>
    <div class="form-actions"><button type="button" id="cancel-note" class="quiet" hidden>Отмена</button><button type="submit" class="secondary" id="save-note">Сохранить</button></div>
   </form>
   <div id="notes-list"></div>
  </div>
 </aside>
</div>
<button id="nav-backdrop" class="mobile-backdrop" aria-label="Закрыть темы" hidden></button>
<button id="drawer-backdrop" class="mobile-backdrop notebook-backdrop" aria-label="Закрыть тетрадь" hidden></button>
<dialog id="modal"><header class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="Закрыть окно"><span data-icon="close"></span></button></header><div id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="data-file" accept="application/json,.json" hidden><input type="file" id="image-file" accept="image/png,image/jpeg" hidden>
<noscript><div class="fatal">Для открытия уроков включи JavaScript в браузере.</div></noscript>
<script type="module" src="/src/app.mjs"></script>
</body></html>
