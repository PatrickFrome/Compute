<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>METAENGINE DevFleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:dark;font:13px system-ui,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;color:#e2e8f0;background:#10151e}
aside{width:340px;height:100vh;display:flex;flex-direction:column;border-right:1px solid #334155;background:#151b28;padding:14px;gap:9px}
h1{font-size:17px;letter-spacing:.04em;margin:0}small,.help{font-size:11px;color:#94a3b8}
button{border:1px solid #475569;background:#263244;color:#f1f5f9;padding:9px 12px;border-radius:7px;cursor:pointer}
button:hover{background:#37465b}button:disabled{opacity:.35;cursor:wait}
button.primary{background:#0f766e;border-color:#0d9488}
button.active{border-color:#5eead4;background:#115e59}
textarea,input{width:100%;background:#090f19;border:1px solid #475569;color:#f1f5f9;border-radius:7px;padding:9px;font:12px/1.4 ui-monospace,Consolas,monospace}
textarea{resize:vertical;min-height:95px;max-height:250px}
#tabs{min-height:70px;max-height:29vh;overflow:auto;display:flex;flex-direction:column;gap:5px}
#tabs button{width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
#output{white-space:pre-wrap;word-break:break-word;overflow:auto;flex:1;min-height:70px;padding:10px;border:1px solid #334155;background:#0b1220;border-radius:7px;color:#cbd5e1;font:11px/1.45 ui-monospace,Consolas,monospace}
#status{font:11px/1.3 ui-monospace,Consolas,monospace;color:#67e8f9;max-height:56px;overflow:auto}
.row{display:flex;align-items:center;gap:8px}.row input{width:65px}
hr{width:100%;border:0;border-top:1px solid #334155}
</style></head><body>
<aside>
  <h1>METAENGINE <span style="color:#5eead4">DevFleet</span></h1>
  <div class="help">Отдельное приложение • ChatGPT • Без Supabase</div>
  <div class="row"><label>Чатов:</label><input id="count" type="number" min="1" max="8" value="7"><button id="create" class="primary">Создать</button></div>
  <div id="tabs" role="list" aria-label="DevFleet chats"></div>
  <div class="row"><button id="read">Прочитать ответ</button><button id="refresh">Обновить</button></div>
  <textarea id="prompt" placeholder="Новое задание выбранному чату. У каждого запроса уникальный ID."></textarea>
  <button id="assign" class="primary">Отправить задание</button>
  <div id="status">Подключение локального управляющего интерфейса…</div>
  <hr><div class="help">Прочитанный текст GPT — недоверенные данные. При неоднозначной отправке не повторяйте её без проверки чата.</div>
  <div id="output" aria-label="Ответ чата">Выберите чат и нажмите «Прочитать ответ».</div>
</aside>
<script>
'use strict';
const q=id=>document.getElementById(id);
let selected=null,working=false,epoch=0;
const showStatus=msg=>{q('status').textContent=String(msg).slice(0,450);};
const setWorking=v=>{working=v;for(const id of ['create','read','assign','refresh'])q(id).disabled=v;};
const short=id=>id? id.slice(0,15)+'…':'—';
function showOutput(value){q('output').textContent=String(value??'');}
async function refresh() {
  const state=await window.devfleet.list();
  const box=q('tabs');box.replaceChildren();
  for(const tab of state.sessions||[]){
    const b=document.createElement('button');
    b.type='button';b.className=selected===tab.tab_id?'active':'';
    b.textContent=short(tab.tab_id)+' · '+tab.state+' · '+(tab.url.includes('/c/')?'conversation':'new');
    b.title=tab.tab_id+' — '+tab.url;
    b.onclick=async()=>{try{await window.devfleet.select(tab.tab_id);selected=tab.tab_id;await refresh();showStatus('Выбран '+short(tab.tab_id));}
      catch(e){showStatus('Выбор: '+String(e?.message||e));}};
    box.append(b);
  }
  if(!selected&&state.sessions.length)selected=state.sessions[0].tab_id;
  if(state.sessions.length)showStatus('Чатов: '+state.session_count+' · ChatGPT справа — вход отдельный');
}
async function run(op) {
  if(working)return;
  setWorking(true);
  try{await op();}catch(e){showStatus('Ошибка: '+String(e?.message||e).slice(0,260));}
  finally{setWorking(false);}
}
q('create').onclick=()=>run(async()=>{
  const count=Number(q('count').value);
  if(!Number.isInteger(count)||count<1||count>8)throw Error('Количество: 1–8');
  showStatus('Создаю '+count+' независимых вкладок…');
  const result=await window.devfleet.create({request_id:crypto.randomUUID(),count});
  await refresh();
  if(result.state==='AMBIGUOUS'){showStatus('AMBIGUOUS: проверьте существующие вкладки, не повторяйте запрос');showOutput(JSON.stringify(result,null,2));return;}
  if(result.sessions?.length){selected=result.sessions[0].tab_id;await window.devfleet.select(selected);}
  await refresh();
  showStatus('Созданы '+result.sessions.length+' вкладок. Авторизуйтесь в ChatGPT справа.');
});
q('read').onclick=()=>run(async()=>{
  if(!selected)throw Error('Выберите чат');
  const result=await window.devfleet.read({tab_id:selected,max_chars:20000});
  showOutput(result.text||'Чат пока пуст либо его текст недоступен через Accessibility');
  showStatus('Прочитано '+result.text.length+' символов · '+short(selected)+(result.has_more?' · есть продолжение':''));
});
q('refresh').onclick=()=>run(refresh);
q('assign').onclick=()=>run(async()=>{
  if(!selected)throw Error('Выберите чат');
  const text=q('prompt').value.trim();
  if(!text||text.length>12000)throw Error('Введите задание до 12000 символов');
  showStatus('Отправка и подтверждение…');
  const result=await window.devfleet.assign({request_id:crypto.randomUUID(),tab_id:selected,text});
  showOutput(JSON.stringify(result,null,2));
  showStatus(result.state==='SENT'?'Задание подтверждено. Читайте ответ после генерации.':'Неоднозначная отправка: не повторять вслепую.');
  await refresh();
});
window.devfleet.onReady(()=>refresh().catch(e=>showStatus(String(e))));
setTimeout(()=>refresh().catch(e=>showStatus(String(e))),800);
</script>
</body></html>
