  <script data-adaptive-context-rail>(() => {
  const rail = document.getElementById('verticalTabs');
  const search = document.getElementById('tabSearch');
  if (!rail || !search) return;

  const ADAPTIVE_AGENT_THRESHOLD = 8;
  const ADAPTIVE_AGENT_VISIBLE = 5;
  const DISCLOSURE_SELECTOR = '[data-adaptive-agent-disclosure]';
  let expanded = false;
  let applying = false;

  function disclosure(total, hidden) {
    const row = document.createElement('div');
    row.className = 'railSectionHead';
    row.dataset.adaptiveAgentDisclosure = 'true';

    const label = document.createElement('span');
    label.textContent = `Agents · ${total}`;

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'miniButton';
    toggle.textContent = expanded ? '−' : `+${hidden}`;
    toggle.title = expanded ? 'Collapse agent tabs' : `Show ${hidden} more agent tabs`;
    toggle.setAttribute('aria-label', toggle.title);
    toggle.addEventListener('click', () => {
      expanded = !expanded;
      applyAdaptiveDensity();
    });

    row.append(label, toggle);
    return row;
  }

  function collapsedKeepSet(rows) {
    const keep = new Set();
    for (const row of rows) {
      if (row.classList.contains('active') || row.querySelector('.tabStateDot.bad,.tabStateDot.warn')) keep.add(row);
    }
    for (const row of rows) {
      if (keep.size >= ADAPTIVE_AGENT_VISIBLE) break;
      keep.add(row);
    }
    return keep;
  }

  function applyAdaptiveDensity() {
    if (applying) return;
    applying = true;
    observer.disconnect();
    try {
      rail.querySelector(DISCLOSURE_SELECTOR)?.remove();
      const rows = [...rail.querySelectorAll('.verticalTab.agent')];
      for (const row of rows) row.hidden = false;

      const searching = search.value.trim().length > 0;
      if (searching || rows.length <= ADAPTIVE_AGENT_THRESHOLD) {
        if (rows.length <= ADAPTIVE_AGENT_THRESHOLD) expanded = false;
        return;
      }

      const keep = expanded ? new Set(rows) : collapsedKeepSet(rows);
      const hiddenRows = rows.filter((row) => !keep.has(row));
      for (const row of hiddenRows) row.hidden = true;

      const anchor = rows[0];
      if (anchor) anchor.before(disclosure(rows.length, hiddenRows.length));
    } finally {
      observer.observe(rail, { childList: true });
      applying = false;
    }
  }

  const observer = new MutationObserver(() => queueMicrotask(applyAdaptiveDensity));
  observer.observe(rail, { childList: true });
  search.addEventListener('input', () => queueMicrotask(applyAdaptiveDensity));
  queueMicrotask(applyAdaptiveDensity);
})();</script>
  <script data-brain-task-first-v1>(() => {
  const WORKBENCH_SCHEMA = 'metaengine.browser-brain.collaboration-workbench.v1';
  const MAX_UI_CONTEXTS = 8;
  const MAX_UI_TASKS_PER_CONTEXT = 3;
  const MAX_UI_BLOCKERS = 12;
  const MAX_UI_ARTIFACTS = 16;
  const nav = document.getElementById('opsNav');
  const content = document.getElementById('opsContent');
  const systems = document.getElementById('systems');
  const presence = document.querySelector('.brainPresence');
  let latest = null;
  let nowActive = true;

  function node(tag, className = '', value = null) {
    const out = document.createElement(tag);
    if (className) out.className = className;
    if (value != null) out.textContent = String(value);
    return out;
  }

  function safeText(value, fallback = '—') {
    const out = String(value ?? '').trim();
    return out || fallback;
  }

  function shorten(value, max = 42) {
    const out = safeText(value);
    return out.length > max ? `${out.slice(0, Math.max(1, max - 1))}…` : out;
  }

  function toneFor(state) {
    const value = String(state || '').toUpperCase();
    if (['ACTIVE', 'READY', 'COMPLETED', 'OK', 'CURRENT'].includes(value)) return 'good';
    if (['BLOCKED', 'PENDING', 'BOUND_UNVERIFIED', 'DEGRADED'].includes(value)) return 'warn';
    if (['FAILED', 'AMBIGUOUS', 'LOST', 'ERROR', 'FROZEN'].includes(value)) return 'bad';
    return 'neutral';
  }

  function heroBlock(title, subtitle, badge) {
    const wrap = node('div', 'opsHero');
    const top = node('div', 'opsHeroTop');
    top.append(node('strong', '', title), node('span', 'heroBadge', badge));
    wrap.append(top, node('small', '', subtitle));
    return wrap;
  }

  function metricBlock(label, value, tone = 'neutral') {
    const card = node('div', `metricCard ${tone}`);
    card.append(node('span', '', label), node('strong', '', safeText(value)));
    return card;
  }

  function sectionBlock(title, subtitle = '') {
    const wrap = node('section', 'opsSection');
    const header = node('div', 'opsSectionTitle');
    header.append(node('strong', '', title), node('span', '', subtitle));
    const list = node('div', 'kvList');
    wrap.append(header, list);
    return { wrap, list };
  }

  function kv(label, value, tone = 'neutral') {
    const row = node('div', 'kvRow');
    row.append(node('span', '', label), node('b', tone, safeText(value)));
    return row;
  }

  function entity(title, subtitle, tags = []) {
    const row = node('div', 'entityRow');
    const top = node('div', 'entityTop');
    top.append(node('strong', '', title), node('span', '', subtitle));
    const meta = node('div', 'entityMeta');
    for (const tag of tags) meta.append(node('span', `tinyTag ${tag.tone || ''}`.trim(), tag.value));
    row.append(top, meta);
    return row;
  }

  function unavailable(reason = 'UNAVAILABLE') {
    return Object.freeze({
      schema: WORKBENCH_SCHEMA,
      valid: false,
      reason,
      contexts: Object.freeze([]),
      context_count: 0,
      total_task_count: 0,
      visible_task_count: 0,
      authority_effect: false,
    });
  }

  function workbench(next) {
    const collaboration = next?.supervisor?.realtime_process_plane?.browser_brain?.collaboration_fabric;
    const candidate = collaboration?.workbench;
    if (!candidate || candidate.schema !== WORKBENCH_SCHEMA) return unavailable('NOT_EXPOSED');
    if (
      candidate.bounded !== true
      || candidate.advisory_only !== true
      || candidate.projection_is_authority !== false
      || candidate.scheduler_authority !== false
      || candidate.execution_authority !== false
      || candidate.command_leasing !== false
      || candidate.authority_effect !== false
      || candidate.message_bodies_exposed !== false
      || candidate.raw_page_content_exposed !== false
      || !Array.isArray(candidate.contexts)
      || candidate.contexts.length > 128
    ) return unavailable('INVALID_PROJECTION');
    for (const context of candidate.contexts) {
      if (
        !context
        || context.authority_effect !== false
        || !Array.isArray(context.tasks)
        || context.tasks.length > 256
        || !context.progress
        || !Array.isArray(context.progress.active_agents)
        || !Array.isArray(context.blockers)
        || !Array.isArray(context.artifact_refs)
      ) return unavailable('INVALID_CONTEXT');
      for (const task of context.tasks) {
        if (
          !task
          || task.scheduler_authority !== false
          || task.execution_authority !== false
          || task.authority_effect !== false
        ) return unavailable('INVALID_TASK');
      }
    }
    return Object.freeze({ ...candidate, valid: true, reason: 'EXACT_ZERO_AUTHORITY_PROJECTION' });
  }

  function memorySnapshot(next) {
    const memory = next?.supervisor?.realtime_process_plane?.browser_brain?.collaboration_fabric?.episodic_memory;
    if (
      !memory
      || memory.schema !== 'metaengine.browser-brain.episodic-memory.v1'
      || memory.bounded_memory !== true
      || memory.scheduler_authority !== false
      || memory.execution_authority !== false
      || memory.authority_effect !== false
    ) return null;
    return memory;
  }

  function aggregateProgress(wb) {
    const out = { ready: 0, active: 0, blocked: 0, completed: 0, failed: 0 };
    for (const context of wb.contexts || []) {
      for (const key of Object.keys(out)) out[key] += Math.max(0, Number(context.progress?.[key] || 0));
    }
    return out;
  }

  function primaryContext(wb) {
    return (wb.contexts || []).find((context) => (context.tasks || []).some((task) => task.status === 'ACTIVE'))
      || (wb.contexts || []).find((context) => (context.tasks || []).some((task) => task.status === 'BLOCKED' || task.status === 'FAILED'))
      || (wb.contexts || []).find((context) => (context.tasks || []).some((task) => task.status === 'READY'))
      || wb.contexts?.[0]
      || null;
  }

  function renderNow(next) {
    latest = next || latest;
    if (!nowActive || !content) return;
    const wb = workbench(latest);
    for (const button of nav?.querySelectorAll('button') || []) button.classList.toggle('active', button.dataset.brainNow === 'true');
    const fragment = document.createDocumentFragment();

    if (!wb.valid) {
      fragment.append(heroBlock(
        'Now unavailable',
        'The Collaboration Workbench projection is missing or failed its exact zero-authority contract. Tasks are not inferred from tabs, URLs, titles, or page content.',
        wb.reason,
      ));
      const contract = sectionBlock('Projection contract', 'fail closed');
      contract.list.append(
        kv('Schema', WORKBENCH_SCHEMA, 'neutral'),
        kv('Task inference', 'DISABLED', 'good'),
        kv('Page/model authority', 'NONE', 'good'),
        kv('Scheduler authority', 'NONE', 'good'),
      );
      fragment.append(contract.wrap);
      content.replaceChildren(fragment);
      return;
    }

    const progress = aggregateProgress(wb);
    const memory = memorySnapshot(latest);
    const focus = primaryContext(wb);
    const focusTask = focus?.tasks?.[0] || null;
    const attention = progress.blocked + progress.failed;

    fragment.append(heroBlock(
      focusTask ? shorten(focusTask.objective, 72) : 'No active collaboration task',
      focusTask
        ? `${safeText(focus.context_id)} · exact task/progress ledger · no page-text inference`
        : 'The Brain is live and waiting for the next bounded collaboration objective.',
      attention > 0 ? `${attention} blocker${attention === 1 ? '' : 's'}` : (progress.active > 0 ? `${progress.active} active` : 'clear'),
    ));

    const grid = node('div', 'opsGrid');
    grid.append(
      metricBlock('Active', progress.active, progress.active ? 'good' : 'neutral'),
      metricBlock('Blocked', progress.blocked + progress.failed, attention ? 'bad' : 'good'),
      metricBlock('Ready', progress.ready, progress.ready ? 'warn' : 'neutral'),
      metricBlock('Tasks', wb.total_task_count, 'neutral'),
    );
    fragment.append(grid);

    if (focusTask) {
      const why = sectionBlock('Why / current binding', 'only projected facts');
      why.list.append(
        kv('Status', focusTask.status, toneFor(focusTask.status)),
        kv('Owner', focusTask.owner_agent_id || 'UNASSIGNED', focusTask.owner_agent_id ? 'good' : 'neutral'),
        kv('Progress revision', focusTask.progress_revision, 'neutral'),
        kv('Dependencies', focusTask.dependencies?.length ? focusTask.dependencies.join(', ') : 'NONE', focusTask.dependencies?.length ? 'warn' : 'good'),
        kv('Capabilities', focusTask.required_capabilities?.length ? focusTask.required_capabilities.join(', ') : 'NONE', 'neutral'),
        kv('Routing rationale', 'NOT PROJECTED', 'muted'),
      );
      fragment.append(why.wrap);
    }

    const work = sectionBlock('Current work', `${Math.min(wb.contexts.length, MAX_UI_CONTEXTS)}/${wb.context_count} context(s)`);
    work.list.className = 'entityList';
    let shownTasks = 0;
    for (const context of wb.contexts.slice(0, MAX_UI_CONTEXTS)) {
      for (const task of context.tasks.slice(0, MAX_UI_TASKS_PER_CONTEXT)) {
        shownTasks += 1;
        work.list.append(entity(
          shorten(task.objective, 56),
          shorten(context.context_id, 24),
          [
            { value: task.status, tone: toneFor(task.status) },
            { value: task.owner_agent_id ? shorten(task.owner_agent_id, 22) : 'unassigned', tone: task.owner_agent_id ? 'neutral' : 'warn' },
            { value: `r${task.progress_revision}`, tone: 'neutral' },
          ],
        ));
      }
    }
    if (!shownTasks) work.list.append(kv('State', 'NO VISIBLE TASKS', 'neutral'));
    fragment.append(work.wrap);

    const blockers = [];
    for (const context of wb.contexts) {
      for (const item of context.blockers || []) {
        blockers.push({ ...item, context_id: context.context_id });
        if (blockers.length >= MAX_UI_BLOCKERS) break;
      }
      if (blockers.length >= MAX_UI_BLOCKERS) break;
    }
    const blocked = sectionBlock('Blockers', blockers.length ? `${blockers.length} projected` : 'clear');
    if (blockers.length) {
      blocked.list.className = 'entityList';
      for (const item of blockers) blocked.list.append(entity(
        shorten(item.blocker || 'Blocked task', 58),
        shorten(item.context_id, 24),
        [{ value: shorten(item.task_id, 22), tone: 'bad' }, { value: `r${item.progress_revision}`, tone: 'neutral' }],
      ));
    } else blocked.list.append(kv('State', 'CLEAR', 'good'));
    fragment.append(blocked.wrap);

    const agents = new Set();
    const artifacts = [];
    for (const context of wb.contexts) {
      for (const agent of context.progress.active_agents || []) agents.add(agent);
      for (const task of context.tasks || []) if (task.owner_agent_id) agents.add(task.owner_agent_id);
      for (const ref of context.artifact_refs || []) {
        if (!artifacts.includes(ref) && artifacts.length < MAX_UI_ARTIFACTS) artifacts.push(ref);
      }
    }

    const team = sectionBlock('Team', `${agents.size} projected agent(s)`);
    if (agents.size) team.list.append(...[...agents].slice(0, 16).map((agent) => kv(shorten(agent, 30), 'ACTIVE / OWNER', 'good')));
    else team.list.append(kv('Agents', 'NONE PROJECTED', 'neutral'));
    fragment.append(team.wrap);

    const evidence = sectionBlock('Artifacts', artifacts.length ? `${artifacts.length} immutable ref(s)` : 'none');
    if (artifacts.length) evidence.list.append(...artifacts.map((ref) => kv(shorten(ref, 38), 'REFERENCE', 'good')));
    else evidence.list.append(kv('Artifact refs', 'NONE', 'neutral'));
    fragment.append(evidence.wrap);

    const timeline = sectionBlock('Timeline', 'bounded ledger activity');
    for (const context of wb.contexts.slice(0, 6)) {
      timeline.list.append(kv(shorten(context.context_id, 28), context.last_activity_at || `seq ${context.last_activity_seq}`, 'neutral'));
    }
    if (!wb.contexts.length) timeline.list.append(kv('Activity', 'NONE', 'neutral'));
    fragment.append(timeline.wrap);

    const memorySection = sectionBlock('Memory', memory ? 'durable episodic summary' : 'not exposed');
    memorySection.list.append(
      kv('Episodes', memory?.episode_count ?? 'UNKNOWN', memory ? 'good' : 'neutral'),
      kv('Semantic facts', memory?.semantic_fact_count ?? 'UNKNOWN', memory ? 'good' : 'neutral'),
      kv('Playbooks', memory?.procedural_playbook_count ?? 'UNKNOWN', memory ? 'good' : 'neutral'),
      kv('Immutable provenance', memory?.immutable_provenance === true ? 'YES' : 'UNKNOWN', memory?.immutable_provenance === true ? 'good' : 'neutral'),
    );
    fragment.append(memorySection.wrap);

    const contract = sectionBlock('Authority contract', wb.contexts_truncated || wb.contexts.some((row) => row.tasks_truncated) ? 'bounded projection is truncated' : 'bounded exact projection');
    contract.list.append(
      kv('Projection authority', 'NONE', 'good'),
      kv('Command leasing', 'NONE', 'good'),
      kv('Page/model content', 'NOT EXPOSED', 'good'),
      kv('Message bodies', 'NOT EXPOSED', 'good'),
      kv('Work cycle limit', wb.work_cycle_limit == null ? 'NONE' : wb.work_cycle_limit, wb.work_cycle_limit == null ? 'good' : 'bad'),
    );
    fragment.append(contract.wrap);

    content.replaceChildren(fragment);
  }

  function updateHealthSummary() {
    if (!systems) return;
    let summary = systems.querySelector('[data-health-summary]');
    if (!summary) {
      summary = node('span', 'tinyTag neutral');
      summary.dataset.healthSummary = 'true';
      systems.append(summary);
    }
    const bad = systems.querySelectorAll('.systemChip.bad').length;
    const warn = systems.querySelectorAll('.systemChip.warn').length;
    summary.className = `tinyTag ${bad ? 'bad' : (warn ? 'warn' : 'good')}`;
    summary.textContent = bad ? `Degraded ${bad}` : (warn ? `Attention ${warn}` : 'Healthy');
    systems.setAttribute('aria-label', `Browser health: ${summary.textContent}`);
  }

  function updatePresence(next) {
    if (!presence) return;
    const wb = workbench(next);
    const progress = wb.valid ? aggregateProgress(wb) : null;
    const dot = node('i');
    dot.setAttribute('aria-hidden', 'true');
    const label = !wb.valid
      ? 'Brain · tasks unavailable'
      : (progress.blocked + progress.failed > 0
        ? `Brain · ${progress.blocked + progress.failed} blocked`
        : (progress.active > 0 ? `Brain · ${progress.active} active` : 'Brain · live'));
    presence.replaceChildren(dot, document.createTextNode(label));
    presence.setAttribute('aria-label', label);
  }

  function install() {
    if (!nav || !content) return;
    nav.querySelector('button[data-agentic-section="skills"]')?.remove();
    const system = nav.querySelector('button[data-section="overview"]');
    if (system) system.textContent = 'System';

    const button = node('button', 'active', 'Now');
    button.type = 'button';
    button.dataset.brainNow = 'true';
    nav.prepend(button);
    button.addEventListener('click', () => {
      nowActive = true;
      try { agenticSection = null; } catch {}
      renderNow(latest);
    });
    nav.addEventListener('click', (event) => {
      const target = event.target.closest('button');
      if (!target || target.dataset.brainNow === 'true') return;
      nowActive = false;
      button.classList.remove('active');
    });

    const railTitle = document.querySelector('.contextRail .railHeader strong');
    if (railTitle) railTitle.textContent = 'Sessions & Agents';
    const search = document.getElementById('tabSearch');
    if (search) search.placeholder = 'Search sessions, agents, workspaces';

    window.metaengineShell.onSnapshot((next) => {
      latest = next;
      updateHealthSummary();
      updatePresence(next);
      renderNow(next);
    });
    window.metaengineShell.snapshot().then((next) => {
      latest = next;
      queueMicrotask(() => {
        updateHealthSummary();
        updatePresence(next);
        renderNow(next);
      });
    }).catch(() => {
      renderNow(latest);
    });
  }

  install();
})();</script>
</body>
</html>
