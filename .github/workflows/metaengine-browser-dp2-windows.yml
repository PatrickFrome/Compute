name: METAENGINE Browser Native Supervisor Windows Gate
on:
  push:
    branches:
      - 'work/metaengine-browser-native-supervisor-v1'
      - 'work/convergence-supervisor-keepalive-v1'
permissions:
  contents: write
concurrency:
  group: metaengine-browser-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-install-dp-launch:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install browser dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund
      - name: Stamp monotonic development version
        if: github.ref_name == 'work/convergence-supervisor-keepalive-v1'
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $version = "0.6.1-dev.${{ github.run_number }}.${{ github.run_attempt }}"
          npm pkg set version=$version
          "browser_version=$version" | Set-Content "$env:RUNNER_TEMP\browser-version.txt"
      - name: Parse and contract gates
        working-directory: apps/metaengine-browser
        run: |
          npm run check
          npm test
      - name: Build single NSIS candidate with update metadata
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx --yes electron-builder@26.15.7 --win nsis --x64 --config electron-builder.test.json --publish never
          $installer = Get-ChildItem dist-test -Filter 'METAENGINE-Browser-Test-Setup-*.exe' -File | Select-Object -First 1
          $blockmap = Get-ChildItem dist-test -Filter 'METAENGINE-Browser-Test-Setup-*.exe.blockmap' -File | Select-Object -First 1
          $latest = Join-Path (Get-Location) 'dist-test\latest.yml'
          if (-not $installer) { throw 'installer_missing' }
          if (-not $blockmap) { throw 'blockmap_missing' }
          if (-not (Test-Path $latest)) { throw 'latest_yml_missing' }
          Add-Content -Path $latest -Value "stagingPercentage: 100"
          $installer.FullName | Set-Content "$env:RUNNER_TEMP\installer-path.txt"
          $blockmap.FullName | Set-Content "$env:RUNNER_TEMP\blockmap-path.txt"
          $latest | Set-Content "$env:RUNNER_TEMP\latest-yml-path.txt"
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$env:RUNNER_TEMP\installer-sha256.txt"
          $asar = Join-Path (Resolve-Path 'dist-test\win-unpacked\resources').Path 'app.asar'
          $listing = npx --yes @electron/asar list $asar
          $listingText = (($listing -join "`n") -replace '\\','/')
          foreach ($required in @('/src/supervisor-device-identity.mjs','/src/native-supervisor-client.mjs','/src/native-browser-control.mjs','/src/supervisor-keepalive.mjs','/src/supervisor-lifecycle-runtime.mjs','/src/self-update-runtime.mjs','/src/host-resilience-runtime.mjs','/src/browser-sentinel.mjs','/src/browser-sentinel-worker.cjs')) {
            if (-not $listingText.Contains($required)) { throw "packaged_supervisor_module_missing:$required" }
          }
          $updateConfig = Join-Path (Resolve-Path 'dist-test\win-unpacked\resources').Path 'app-update.yml'
          if (-not (Test-Path $updateConfig)) { throw 'packaged_update_config_missing' }
          "native_supervisor_keepalive_self_update_host_resilience_sentinel_modules=present" | Set-Content "$env:RUNNER_TEMP\supervisor-package-proof.txt"
          "app_update_config=present" | Add-Content "$env:RUNNER_TEMP\supervisor-package-proof.txt"
          "single_build_promotion=true" | Add-Content "$env:RUNNER_TEMP\supervisor-package-proof.txt"
          "staging_percentage=100" | Add-Content "$env:RUNNER_TEMP\supervisor-package-proof.txt"
      - name: Install exact generated Setup EXE
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $installer = Get-Content "$env:RUNNER_TEMP\installer-path.txt"
          $before = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content "$env:RUNNER_TEMP\installer-sha256.txt").Trim()
          if ($before -ne $expected) { throw 'installer_digest_changed_before_install' }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "installer_exit_$($install.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test\METAENGINE Browser Test.exe'
          if (-not (Test-Path $app)) { throw "installed_browser_missing:$app" }
          $app | Set-Content "$env:RUNNER_TEMP\installed-app-path.txt"
      - name: Verify packaged Development Plane lifecycle
        shell: powershell
        run: |
          $app = Get-Content "$env:RUNNER_TEMP\installed-app-path.txt"
          $p = Start-Process -FilePath $app -ArgumentList '--metaengine-devplane-smoke' -PassThru
          $deadline = (Get-Date).AddSeconds(35)
          do {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { break }
          } while ((Get-Date) -lt $deadline)
          if (-not $p.HasExited) {
            try { $p.Kill($true) } catch {}
            throw 'packaged_devplane_smoke_timeout'
          }
          if ($p.ExitCode -ne 0) { throw "packaged_devplane_smoke_exit_$($p.ExitCode)" }
          "packaged_devplane_smoke_exit=$($p.ExitCode)" | Set-Content "$env:RUNNER_TEMP\dp-proof.txt"
      - name: Launch installed browser and verify window
        shell: powershell
        env:
          METAENGINE_DISABLE_SELF_UPDATE: '1'
        run: |
          $app = Get-Content "$env:RUNNER_TEMP\installed-app-path.txt"
          $p = Start-Process -FilePath $app -PassThru
          $deadline = (Get-Date).AddSeconds(25)
          $windowReady = $false
          do {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { throw "installed_browser_exited_early:$($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0) { $windowReady = $true; break }
          } while ((Get-Date) -lt $deadline)
          if (-not $windowReady) {
            try { $p.Kill($true) } catch {}
            throw 'installed_browser_main_window_missing'
          }
          $title = $p.MainWindowTitle
          "pid=$($p.Id)" | Set-Content "$env:RUNNER_TEMP\launch-proof.txt"
          "main_window_handle=$($p.MainWindowHandle)" | Add-Content "$env:RUNNER_TEMP\launch-proof.txt"
          "main_window_title=$title" | Add-Content "$env:RUNNER_TEMP\launch-proof.txt"
          "installed_path=$app" | Add-Content "$env:RUNNER_TEMP\launch-proof.txt"
          if ($title -notmatch 'METAENGINE Browser') {
            try { $p.Kill($true) } catch {}
            throw "installed_browser_title_unexpected:$title"
          }
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "installed_browser_exited_after_supervisor_bootstrap:$($p.ExitCode)" }
          try { $p.CloseMainWindow() | Out-Null } catch {}
          if (-not $p.WaitForExit(5000)) { try { $p.Kill($true) } catch {} }
      - name: Crash sentinel physical recovery smoke
        shell: powershell
        env:
          METAENGINE_DISABLE_SELF_UPDATE: '1'
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\installed-app-path.txt").Trim()
          $p = Start-Process -FilePath $app -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { throw "sentinel_source_browser_exited_early:$($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0) { break }
          } while ((Get-Date) -lt $deadline)
          if ($p.MainWindowHandle -eq 0) { try { $p.Kill($true) } catch {}; throw 'sentinel_source_window_missing' }
          Start-Sleep -Seconds 6
          $oldPid = $p.Id
          $p.Kill($true)
          $p.WaitForExit()
          $recoverDeadline = (Get-Date).AddSeconds(30)
          $recovered = $null
          do {
            Start-Sleep -Seconds 1
            $rows = Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -ne $oldPid -and $_.ExecutablePath -eq $app }
            $recovered = $rows | Sort-Object ProcessId | Select-Object -First 1
            if ($recovered) { break }
          } while ((Get-Date) -lt $recoverDeadline)
          if (-not $recovered) { throw 'browser_sentinel_relaunch_not_observed' }
          $rp = Get-Process -Id $recovered.ProcessId -ErrorAction Stop
          $windowDeadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 500
            $rp.Refresh()
            if ($rp.HasExited) { throw "recovered_browser_exited_early:$($rp.ExitCode)" }
            if ($rp.MainWindowHandle -ne 0) { break }
          } while ((Get-Date) -lt $windowDeadline)
          if ($rp.MainWindowHandle -eq 0) { try { $rp.Kill($true) } catch {}; throw 'recovered_browser_window_missing' }
          "source_pid=$oldPid" | Set-Content "$env:RUNNER_TEMP\sentinel-proof.txt"
          "recovered_pid=$($rp.Id)" | Add-Content "$env:RUNNER_TEMP\sentinel-proof.txt"
          "exact_executable=$app" | Add-Content "$env:RUNNER_TEMP\sentinel-proof.txt"
          "recovery=PASS" | Add-Content "$env:RUNNER_TEMP\sentinel-proof.txt"
          try { $rp.CloseMainWindow() | Out-Null } catch {}
          if (-not $rp.WaitForExit(5000)) { try { $rp.Kill($true) } catch {} }
      - name: Stage exact verified release evidence
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-single | Out-Null
          $installer = Get-Content "$env:RUNNER_TEMP\installer-path.txt"
          $latest = (Get-Content "$env:RUNNER_TEMP\latest-yml-path.txt").Trim()
          $expected = (Get-Content "$env:RUNNER_TEMP\installer-sha256.txt").Trim()
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'verified_installer_digest_changed_before_promotion' }
          Copy-Item $installer 'release-single\METAENGINE-Browser-Supervisor-Keepalive-Setup.exe'
          Copy-Item "$env:RUNNER_TEMP\installer-sha256.txt" 'release-single\METAENGINE-Browser-Supervisor-Keepalive-Setup.exe.sha256'
          Copy-Item $latest 'release-single\latest.yml'
          Copy-Item "$env:RUNNER_TEMP\dp-proof.txt" 'release-single\development-plane-proof.txt'
          Copy-Item "$env:RUNNER_TEMP\supervisor-package-proof.txt" 'release-single\supervisor-package-proof.txt'
          Copy-Item "$env:RUNNER_TEMP\launch-proof.txt" 'release-single\launch-proof.txt'
          Copy-Item "$env:RUNNER_TEMP\sentinel-proof.txt" 'release-single\sentinel-proof.txt'
          if (Test-Path "$env:RUNNER_TEMP\browser-version.txt") { Copy-Item "$env:RUNNER_TEMP\browser-version.txt" 'release-single\browser-version.txt' }
          git rev-parse HEAD | Set-Content 'release-single\git-head.txt'
          $manifest = [ordered]@{
            schema = 'metaengine.browser.verified-release-manifest.v1'
            version = (node -p "require('./package.json').version")
            git_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            installer_sha256 = $actual
            single_build_promotion = $true
            crash_sentinel_physical_recovery = $true
            development_channel = $true
            staging_percentage = 100
            production_safe = $false
          } | ConvertTo-Json -Depth 4
          $manifest | Set-Content 'release-single\verified-release-manifest.json'
      - name: Upload verified installer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metaengine-browser-supervisor-keepalive-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/metaengine-browser/release-single/
          if-no-files-found: error
      - name: Bind immutable release tag to verified source
        if: github.ref_name == 'work/convergence-supervisor-keepalive-v1'
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $existing = $null
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null | Set-Content "$env:RUNNER_TEMP\existing-tag.json"
          if ($LASTEXITCODE -eq 0) {
            $existing = Get-Content "$env:RUNNER_TEMP\existing-tag.json" | ConvertFrom-Json
            if ($existing.object.sha -ne $env:GITHUB_SHA) { throw "release_tag_points_to_other_commit:${tag}:$($existing.object.sha)" }
          } else {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "release_tag_create_failed:${tag}" }
          }
          "release_tag=$tag" | Set-Content "$env:RUNNER_TEMP\release-tag.txt"
      - name: Publish exact verified self-update prerelease
        if: github.ref_name == 'work/convergence-supervisor-keepalive-v1'
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ((Get-Content "$env:RUNNER_TEMP\release-tag.txt") -replace '^release_tag=','').Trim()
          $installer = Get-Item (Get-Content "$env:RUNNER_TEMP\installer-path.txt")
          $blockmap = Get-Item (Get-Content "$env:RUNNER_TEMP\blockmap-path.txt")
          $latest = Get-Item (Get-Content "$env:RUNNER_TEMP\latest-yml-path.txt")
          $manifest = Get-Item 'release-single\verified-release-manifest.json'
          $expected = (Get-Content "$env:RUNNER_TEMP\installer-sha256.txt").Trim()
          $actual = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'release_installer_digest_not_verified_candidate' }
          gh release create $tag $installer.FullName $blockmap.FullName $latest.FullName $manifest.FullName --verify-tag --prerelease --title "METAENGINE Browser $tag" --notes "Development self-update candidate. Exact artifact passed contract tests, NSIS install, Development Plane smoke, installed Browser launch, crash-sentinel recovery, and digest revalidation. Not production-safe until Authenticode publisher verification is sealed."
          if ($LASTEXITCODE -ne 0) { throw "verified_release_publish_failed:${tag}" }
