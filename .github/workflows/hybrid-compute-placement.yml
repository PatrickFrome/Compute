name: Hybrid Compute Placement Contracts
on:
  pull_request:
    paths:
      - 'infra/hybrid-compute/**'
      - '.github/workflows/hybrid-compute-placement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  placement-contracts:
    name: Placement contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source syntax check
        run: node --check infra/hybrid-compute/placement.mjs
      - name: Pure placement regression
        run: node --test infra/hybrid-compute/placement.test.mjs
