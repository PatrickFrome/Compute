name: Client V1 C5 Useful Work Projection

on:
  push:
    branches:
      - 'work/client-v1-c5-useful-work-projection-v1'
    paths:
      - 'apps/me2-ui/src/components/me2/shell/me2-shell.tsx'
      - 'apps/metaengine-browser/src/client-goal-journal.mjs'
      - 'apps/metaengine-browser/src/client-useful-work-proof.mjs'
      - 'apps/metaengine-browser/src/preload-shell.cjs'
      - 'apps/metaengine-browser/src/main.mjs'
      - 'apps/metaengine-browser/test/client-v1-c5-useful-work-projection.test.mjs'
      - 'research/METAENGINE_CLIENT_V1_C5_USEFUL_WORK_PROJECTION_CHECKPOINT_2026-10-06.md'
      - '.github/workflows/client-v1-c5-useful-work-projection.yml'
  pull_request:
    paths:
      - 'apps/me2-ui/src/components/me2/shell/me2-shell.tsx'
      - 'apps/metaengine-browser/src/client-goal-journal.mjs'
      - 'apps/metaengine-browser/src/client-useful-work-proof.mjs'
      - 'apps/metaengine-browser/src/preload-shell.cjs'
      - 'apps/metaengine-browser/src/main.mjs'
      - 'apps/metaengine-browser/test/client-v1-c5-useful-work-projection.test.mjs'
      - 'research/METAENGINE_CLIENT_V1_C5_USEFUL_WORK_PROJECTION_CHECKPOINT_2026-10-06.md'
      - '.github/workflows/client-v1-c5-useful-work-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  useful-work-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup frozen Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Setup frozen Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.3'

      - name: Prove read-only projection contracts
        working-directory: apps/metaengine-browser
        run: |
          node --test             test/client-v1-c5-useful-work-projection.test.mjs             test/client-v1-c5-useful-work-restart.test.mjs             test/client-v1-c5-useful-work-proof.test.mjs             test/client-v1-execution-proof-integrity.test.mjs

      - name: Install frozen ME2 UI dependencies
        working-directory: apps/me2-ui
        run: bun install --frozen-lockfile

      - name: Build strict ME2 UI production bundle
        working-directory: apps/me2-ui
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build

      - name: Prove source checkout unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git diff --name-only HEAD --             apps/me2-ui/src/components/me2/shell/me2-shell.tsx             apps/metaengine-browser/src/client-goal-journal.mjs             apps/metaengine-browser/src/client-useful-work-proof.mjs             apps/metaengine-browser/src/preload-shell.cjs             apps/metaengine-browser/src/main.mjs             apps/metaengine-browser/test/client-v1-c5-useful-work-projection.test.mjs)"
