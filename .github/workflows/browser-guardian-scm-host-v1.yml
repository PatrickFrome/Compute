name: METAENGINE Browser Guardian SCM Host V1

on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/native/browser-guardian-scm/**'
      - 'apps/metaengine-browser/test/browser-guardian-scm-host-contract.test.mjs'
      - '.github/workflows/browser-guardian-scm-host-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-scm-host:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Run zero-authority source contract
        working-directory: apps/metaengine-browser
        shell: powershell
        run: node --test test/browser-guardian-scm-host-contract.test.mjs

      - name: Compile exact production Guardian staging bundle
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'metaengine-guardian-scm'
          & ./scripts/build-guardian-native-staging.ps1 -OutputDir $outDir
          if ($LASTEXITCODE -ne 0) { throw "guardian_staging_build_exit_$LASTEXITCODE" }
          $exe = Join-Path $outDir 'METAENGINEBrowserGuardian.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'guardian_native_exe_missing' }
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -notmatch '^[0-9a-f]{64}$') { throw 'guardian_native_digest_invalid' }
          "GUARDIAN_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GUARDIAN_SHA256=$digest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove read-only native contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $line = (& $env:GUARDIAN_EXE --contract-json | Where-Object { $_.Trim() } | Select-Object -Last 1)
          if (-not $line) { throw 'guardian_contract_output_missing' }
          $row = $line | ConvertFrom-Json
          if ($row.schema -ne 'metaengine.browser-guardian.scm-host.v1') { throw 'guardian_contract_schema_invalid' }
          if ($row.service_name -ne 'METAENGINEBrowserGuardian') { throw 'guardian_contract_service_name_invalid' }
          if ($row.service_type -ne 'SERVICE_WIN32_OWN_PROCESS') { throw 'guardian_contract_service_type_invalid' }
          foreach ($field in @('browser_authority','task_authority','scheduler_authority','page_model_text_authority','release_authority','process_effect_policy_authority','automatic_retry_allowed','authority_effect')) {
            if ($row.$field -ne $false) { throw "guardian_contract_authority_invalid_$field" }
          }
          if ($row.bounded_process_effect_adapter -ne $true -or $row.child_process_dispatch_implemented -ne $true -or $row.native_write_ahead_effect_barrier -ne $true) { throw 'guardian_bounded_adapter_contract_missing' }
          $actuator = (& $env:GUARDIAN_EXE --update-actuator-contract-json | ConvertFrom-Json)
          foreach ($field in @('native_write_ahead_effect_barrier','at_most_one_dispatch_per_effect_id','enrolled_p256_challenge_required','first_binding_requires_server_admin_ticket','ticket_single_use_server_revalidation_required')) {
            if ($actuator.$field -ne $true) { throw "guardian_actuator_fence_missing_$field" }
          }
          foreach ($field in @('caller_supplied_path_allowed','caller_supplied_url_allowed','caller_supplied_shell_allowed','automatic_retry_allowed')) {
            if ($actuator.$field -ne $false) { throw "guardian_actuator_authority_invalid_$field" }
          }
          if ($row.service_installation_implemented -ne $false) { throw 'guardian_service_install_authority_unexpected' }

      - name: Prove real Windows SCM lifecycle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'METAENGINEBrowserGuardian'
          $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($existing) { throw 'guardian_test_service_preexists' }

          try {
            $createArgs = @(
              'create', $serviceName,
              'binPath=', "`"$env:GUARDIAN_EXE`"",
              'start=', 'demand',
              'obj=', 'LocalSystem',
              'DisplayName=', 'METAENGINE Browser Guardian CI'
            )
            & sc.exe @createArgs | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "guardian_sc_create_exit_$LASTEXITCODE" }

            & sc.exe start $serviceName | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "guardian_sc_start_exit_$LASTEXITCODE" }

            $running = $false
            for ($i = 0; $i -lt 30; $i++) {
              $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'" -ErrorAction SilentlyContinue
              if ($service -and $service.State -eq 'Running') { $running = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $running) { throw 'guardian_scm_running_readback_timeout' }

            & sc.exe stop $serviceName | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "guardian_sc_stop_exit_$LASTEXITCODE" }

            $stopped = $false
            for ($i = 0; $i -lt 30; $i++) {
              $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'" -ErrorAction SilentlyContinue
              if ($service -and $service.State -eq 'Stopped') { $stopped = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $stopped) { throw 'guardian_scm_stopped_readback_timeout' }

            @{
              schema = 'metaengine.browser-guardian.scm-host-ci-proof.v1'
              source_head = '${{ github.event.pull_request.head.sha || github.sha }}'
              exe_sha256 = $env:GUARDIAN_SHA256
              service_name = $serviceName
              running_readback = $running
              stopped_readback = $stopped
              bounded_process_effect_adapter = $true
              native_write_ahead_effect_barrier = $true
              installer_dispatch_exercised = $false
              authority_effect = $false
            } | ConvertTo-Json -Depth 4 | Write-Host
          }
          finally {
            & sc.exe stop $serviceName 2>$null | Out-Null
            & sc.exe delete $serviceName 2>$null | Out-Null
          }

      - name: Prove source checkout unchanged
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git diff --name-only HEAD -- apps/metaengine-browser/native/browser-guardian-scm apps/metaengine-browser/test/browser-guardian-scm-host-contract.test.mjs .github/workflows/browser-guardian-scm-host-v1.yml)"
