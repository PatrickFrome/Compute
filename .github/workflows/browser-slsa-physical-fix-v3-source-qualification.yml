name: Browser SLSA Physical Fix V3 Source Qualification

on:
  push:
    branches:
      - 'work/build-slsa-physical-fix-v3'
    paths:
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/package-lock.json'
      - 'apps/metaengine-browser/scripts/qualified-installer-consumer.ps1'
      - 'apps/metaengine-browser/test/qualified-installer-consumer-verify.ps1'
      - 'apps/metaengine-browser/test/qualified-installer-consumer-contract.test.mjs'
      - '.github/workflows/browser-slsa-physical-fix-v3-source-qualification.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact fix source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Install exact Browser dependencies
        working-directory: apps/metaengine-browser
        run: npm ci --no-audit --no-fund

      - name: Parse shared qualified-installer consumer
        working-directory: apps/metaengine-browser
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/qualified-installer-consumer.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          )
          if($errors.Count -ne 0){ throw $errors[0].Message }

      - name: Prove local re-verification ignores ambient physical push auto-fence
        working-directory: apps/metaengine-browser
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/physical/build-slsa-provenance-v1
        run: |
          ./test/qualified-installer-consumer-verify.ps1
          if ($LASTEXITCODE -ne 0) { throw "qualified_installer_consumer_verify_failed:$LASTEXITCODE" }

      - name: Prove shared consumer contract
        working-directory: apps/metaengine-browser
        run: node --test test/qualified-installer-consumer-contract.test.mjs

      - name: Prove complete Browser Node regression
        working-directory: apps/metaengine-browser
        run: npm test

      - name: Prove source qualification has zero physical authority
        shell: python
        run: |
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/browser-slsa-physical-fix-v3-source-qualification.yml').read_text(encoding='utf-8').lower()
          runtime = workflow.split('      - name: prove source qualification has zero physical authority', 1)[0]
          forbidden = [
              'id-token: write',
              'attestations: write',
              'artifact-metadata: write',
              'contents: write',
              'actions: write',
              'gh release',
              'electron-builder',
              'promotion_authorized=true',
              'authority_effect=true',
          ]
          for token in forbidden:
              if token in runtime:
                  raise SystemExit(f'slsa_physical_fix_v3_source_forbidden:{token}')

          package = json.loads(Path('apps/metaengine-browser/package.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('apps/metaengine-browser/package-lock.json').read_text(encoding='utf-8'))
          version = str(package.get('version') or '')
          if not __import__('re').fullmatch(r'0\.7\.0-dev\.[0-9]+\.1', version):
              raise SystemExit(f'slsa_physical_fix_v3_package_identity_invalid:{version}')
          if lock.get('version') != version or lock.get('packages', {}).get('', {}).get('version') != version:
              raise SystemExit('slsa_physical_fix_v3_package_identity_drift')

          print('slsa_physical_fix_v3_source_contract_pass')

      - name: Prove exact source checkout unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
