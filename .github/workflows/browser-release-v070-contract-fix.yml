name: Browser release v0.7 trusted-contract fix

on:
  push:
    branches:
      - work/browser-successor-convergence-all-fixes-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: work/browser-successor-convergence-all-fixes-v1
          fetch-depth: 0
      - name: Generalize trusted fast release target to exact source core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/metaengine-browser-self-update-fast-e2e.yml')
          s=p.read_text(encoding='utf-8')
          old="""          if ($sourcePackageVersion -notmatch '^0\\.6\\.6-dev\\.[0-9]+\\.1$') { throw \"source_package_version_not_trusted_dev_shape:$sourcePackageVersion\" }"""
          new="""          if ($sourcePackageVersion -notmatch '^\\d+\\.\\d+\\.\\d+-dev\\.[0-9]+\\.1$') { throw \"source_package_version_not_trusted_dev_shape:$sourcePackageVersion\" }"""
          if s.count(old)!=1: raise SystemExit(f'source_version_fence_cardinality:{s.count(old)}')
          s=s.replace(old,new)
          pattern=r'(?m)^(\s*)\$target = "0\.6\.6-dev\.\$env:GITHUB_RUN_ID\.1"\s*$'
          def repl(m):
              i=m.group(1)
              return '\n'.join([
                  i+'$sourcePackageVersion = [string](node -p "require(\'./package.json\').version")',
                  i+"if ($sourcePackageVersion -notmatch '^\\d+\\.\\d+\\.\\d+-dev\\.[0-9]+\\.1$') { throw \"source_package_version_not_trusted_dev_shape:$sourcePackageVersion\" }",
                  i+"$sourceCore = $sourcePackageVersion -replace '-dev\\.[0-9]+\\.1$',''",
                  i+'$target = "$sourceCore-dev.$env:GITHUB_RUN_ID.1"',
              ])
          s,n=re.subn(pattern,repl,s,count=1)
          if n!=1: raise SystemExit(f'target_line_cardinality:{n}')
          old_target="""          if ($target -notmatch '^0\\.6\\.6-dev\\.[0-9]+\\.1$') { throw \"target_version_invalid:$target\" }"""
          new_target="""          if ($target -notmatch '^\\d+\\.\\d+\\.\\d+-dev\\.[0-9]+\\.1$') { throw \"target_version_invalid:$target\" }"""
          if s.count(old_target)!=1: raise SystemExit(f'target_fence_cardinality:{s.count(old_target)}')
          s=s.replace(old_target,new_target)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '$sourceCore = $sourcePackageVersion' .github/workflows/metaengine-browser-self-update-fast-e2e.yml
          grep -Fq '$target = "$sourceCore-dev.$env:GITHUB_RUN_ID.1"' .github/workflows/metaengine-browser-self-update-fast-e2e.yml
          rm .github/workflows/browser-release-v070-contract-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/metaengine-browser-self-update-fast-e2e.yml .github/workflows/browser-release-v070-contract-fix.yml
          git commit -m 'ci(browser): derive fast release target from exact source core'
          git push origin HEAD:work/browser-successor-convergence-all-fixes-v1
