name: Browser Agent Result Installer Source Qualification

on:
  push:
    branches:
      - 'work/client-v1-agent-result-installer-v1'
      - 'work/client-v1-live-result-readback-v1'
      - 'work/client-v1-admission-recovery-v1'
      - 'work/client-v1-admission-readiness-submit-fence-v1'
      - 'work/guardian-observation-failure-backoff-v1'
    paths:
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/package-lock.json'
      - 'apps/metaengine-browser/CONVERGENCE_CANDIDATE.md'
      - 'apps/metaengine-browser/src/**'
      - 'apps/metaengine-browser/test/**'
      - 'apps/me2-ui/src/**'
      - '.github/workflows/browser-agent-result-installer-source-qualification.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact versioned source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Install frozen Browser dependencies
        working-directory: apps/metaengine-browser
        run: npm ci --no-audit --no-fund

      - name: Prove full Browser regression
        working-directory: apps/metaengine-browser
        run: npm test

      - name: Setup exact Bun runtime for ME2 UI source proof
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.3'

      - name: Prove ME2 UI TypeScript and production build
        if: matrix.os == 'ubuntu-24.04'
        env:
          ME2_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_ui="$GITHUB_WORKSPACE/apps/me2-ui"
          source_lock_sha="$(sha256sum "$source_ui/bun.lock" | awk '{print $1}')"
          ui_root="$RUNNER_TEMP/me2-ui-source-proof"
          rm -rf "$ui_root"
          cp -a "$source_ui" "$ui_root"
          cd "$ui_root"
          bun ci
          test "$(sha256sum bun.lock | awk '{print $1}')" = "$source_lock_sha"
          bun run build

      - name: Prove Windows R97 Client visual flow without packaging
        if: matrix.os == 'windows-2025'
        shell: pwsh
        env:
          ME2_BUILD_SHA: ${{ github.sha }}
          METAENGINE_R85_VISUAL_EVIDENCE_DIR: ${{ runner.temp }}\r85-source-visual
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string](bun --version) -ne '1.3.3') { throw 'client_source_visual_bun_version_drift' }
          $sourceUi = Join-Path $env:GITHUB_WORKSPACE 'apps\me2-ui'
          $sourceLock = Join-Path $sourceUi 'bun.lock'
          $sourceLockSha = (Get-FileHash $sourceLock -Algorithm SHA256).Hash.ToLowerInvariant()
          $visualUi = Join-Path $env:RUNNER_TEMP 'me2-ui-source-visual'
          Remove-Item $visualUi -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force $sourceUi $visualUi
          $visualLock = Join-Path $visualUi 'bun.lock'
          if ((Get-FileHash $visualLock -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sourceLockSha) {
            throw 'client_source_visual_lock_copy_drift'
          }
          Push-Location $visualUi
          try {
            bun ci
            if ($LASTEXITCODE -ne 0) { throw 'client_source_visual_bun_ci_failed' }
            if ((Get-FileHash $visualLock -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sourceLockSha) {
              throw 'client_source_visual_bun_ci_lock_mutation'
            }
            bun run build
            if ($LASTEXITCODE -ne 0) { throw 'client_source_visual_build_failed' }
            node scripts/pack-me2-ui.mjs
            if ($LASTEXITCODE -ne 0) { throw 'client_source_visual_pack_failed' }
          } finally { Pop-Location }
          $uiDist = Join-Path $visualUi 'me2-ui-dist'
          node apps/metaengine-browser/scripts/verify-me2-ui-bundle.mjs --root $uiDist --expected-sha $env:ME2_BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'client_source_visual_bundle_invalid' }
          $env:METAENGINE_R85_VISUAL_UI_DIR = $uiDist
          New-Item -ItemType Directory -Force -Path $env:METAENGINE_R85_VISUAL_EVIDENCE_DIR | Out-Null
          Push-Location apps/metaengine-browser
          try {
            node --check test/me2-r85-visual-evidence.mjs
            if ($LASTEXITCODE -ne 0) { throw 'client_source_visual_harness_parse_failed' }
            $electron = Join-Path (Resolve-Path '.\node_modules\electron\dist').Path 'electron.exe'
            # Electron is a GUI subsystem executable on Windows, so PowerShell's
            # call operator can return before the harness has written its terminal
            # evidence. Use a bounded Process wait instead of racing the evidence
            # read. This is source-only qualification; no Browser installer runs.
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $electron
            $psi.WorkingDirectory = (Get-Location).Path
            $psi.UseShellExecute = $false
            $psi.ArgumentList.Add('.\test\me2-r85-visual-evidence.mjs')
            $visual = [System.Diagnostics.Process]::new()
            $visual.StartInfo = $psi
            if (-not $visual.Start()) { throw 'client_source_visual_process_start_failed' }
            if (-not $visual.WaitForExit(135000)) {
              try { $visual.Kill($true) } catch {}
              throw 'client_source_visual_process_timeout'
            }
            if ($visual.ExitCode -ne 0) { throw "client_source_visual_electron_exit_$($visual.ExitCode)" }
          } finally { Pop-Location }
          $evidencePath = Join-Path $env:METAENGINE_R85_VISUAL_EVIDENCE_DIR 'r85-visual-evidence.json'
          if (-not (Test-Path $evidencePath -PathType Leaf)) { throw 'client_source_visual_evidence_missing' }
          $evidence = Get-Content $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.schema -ne 'metaengine.browser.r97-visual-evidence.v1' -or $evidence.ok -ne $true) {
            throw 'client_source_visual_evidence_invalid'
          }
          if ([string]$evidence.source_head -ne [string]$env:ME2_BUILD_SHA) { throw 'client_source_visual_source_head_drift' }
          Write-Host ($evidence | ConvertTo-Json -Compress -Depth 8)

      - name: Prove one producer SLSA topology and version reservation
        run: node --test tests/browser-slsa-provenance-verification.test.mjs tests/browser-slsa-physical-topology.test.mjs

      - name: Prove Windows updater verification under physical push environment
        working-directory: apps/metaengine-browser
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/physical/build-slsa-provenance-v1
        run: |
          ./test/qualified-installer-consumer-verify.ps1
          if ($LASTEXITCODE -ne 0) { throw "qualified_installer_consumer_verify_failed:$LASTEXITCODE" }

      - name: Prove qualification is source only
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/browser-agent-result-installer-source-qualification.yml').read_text(encoding='utf-8').lower()
          runtime = workflow.split('      - name: prove qualification is source only', 1)[0]
          for forbidden in ['id-token: write', 'attestations: write', 'contents: write', 'actions: write', 'gh release', 'electron-builder', 'workflow_dispatch', 'start-process']:
              if forbidden in runtime:
                  raise SystemExit(f'agent_installer_source_forbidden:{forbidden}')
          print('agent_installer_source_only_pass')

      - name: Prove exact source unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
