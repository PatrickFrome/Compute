name: Browser Agent Result Installer Source Qualification

on:
  push:
    branches:
      - 'work/client-v1-agent-result-installer-v1'
      - 'work/client-v1-live-result-readback-v1'
    paths:
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/package-lock.json'
      - 'apps/metaengine-browser/CONVERGENCE_CANDIDATE.md'
      - 'apps/metaengine-browser/src/**'
      - 'apps/metaengine-browser/test/**'
      - 'apps/me2-ui/src/**'
      - 'apps/me2-ui/package.json'
      - 'apps/me2-ui/bun.lock'
      - '.github/workflows/browser-agent-result-installer-source-qualification.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact versioned source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Install frozen Browser dependencies
        working-directory: apps/metaengine-browser
        run: npm ci --no-audit --no-fund

      - name: Prove full Browser regression
        working-directory: apps/metaengine-browser
        run: npm test

      - name: Prove one producer SLSA topology and version reservation
        run: node --test tests/browser-slsa-provenance-verification.test.mjs tests/browser-slsa-physical-topology.test.mjs

      - name: Prove Windows updater verification under physical push environment
        working-directory: apps/metaengine-browser
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/physical/build-slsa-provenance-v1
        run: |
          ./test/qualified-installer-consumer-verify.ps1
          if ($LASTEXITCODE -ne 0) { throw "qualified_installer_consumer_verify_failed:$LASTEXITCODE" }

      - name: Prove qualification is source only
        shell: python
        run: |
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/browser-agent-result-installer-source-qualification.yml').read_text(encoding='utf-8').lower()
          runtime = re.sub(r'(?ms)^      - name: prove qualification is source only\n.*?(?=^      - name:|\Z)', '', workflow, count=1)
          for forbidden in ['id-token: write', 'attestations: write', 'contents: write', 'actions: write', 'gh release', 'electron-builder', 'workflow_dispatch', 'start-process']:
              if forbidden in runtime:
                  raise SystemExit(f'agent_installer_source_forbidden:{forbidden}')
          print('agent_installer_source_only_pass')

      - name: Prove exact source unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD

  client-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact Client source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Setup frozen UI toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.3'

      - name: Build frozen standalone Client UI in isolated staging
        shell: pwsh
        env:
          ME2_BUILD_SHA: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string](bun --version) -ne '1.3.3') { throw 'client_ui_bun_version_drift' }
          $sourceUi = Join-Path $env:GITHUB_WORKSPACE 'apps/me2-ui'
          $uiRoot = Join-Path $env:RUNNER_TEMP 'client-ui-source'
          Copy-Item -LiteralPath $sourceUi -Destination $uiRoot -Recurse
          $lockPath = Join-Path $uiRoot 'bun.lock'
          $packagePath = Join-Path $uiRoot 'package.json'
          $lockBefore = (Get-FileHash -LiteralPath $lockPath -Algorithm SHA256).Hash
          $packageBefore = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
          Push-Location $uiRoot
          try {
            bun ci
            if ($LASTEXITCODE -ne 0) { throw 'client_ui_frozen_install_failed' }
            bun run build
            if ($LASTEXITCODE -ne 0) { throw 'client_ui_standalone_build_failed' }
          } finally { Pop-Location }
          if ((Get-FileHash -LiteralPath $lockPath -Algorithm SHA256).Hash -ne $lockBefore) { throw 'client_ui_lock_mutation' }
          if ((Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash -ne $packageBefore) { throw 'client_ui_package_mutation' }

      - name: Prove exact Client source and lock unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
