name: W1 Codespaces Provenance DB Contract

on:
  push:
    branches: [work/w1-sandbox-launcher-prep]
    paths:
      - 'supabase/migrations/20260826061500_w1_github_codespaces_provenance_receipt_v1.sql'
      - 'tests/test_w1_codespaces_provenance_db_contract.py'
      - '.github/workflows/w1-codespaces-provenance-db-contract.yml'

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run adversarial provenance DB contract
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_w1_codespaces_provenance_db_contract -v

      - name: Assert prep-only provenance boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260826061500_w1_github_codespaces_provenance_receipt_v1.sql').read_text().lower()
          required = (
              "2026-03-10", "https://api.github.com", "application/vnd.github+json",
              "pending_provider_provenance_readback", "expires_at>clock_timestamp()",
              "stopped_provider_snapshot_sha256", "before update or delete",
              "provider_action_verified boolean not null default false",
              "authenticated_provider_provenance_verified boolean not null default false",
          )
          for token in required:
              assert token in p, token
          forbidden = (
              'apply migration', 'provider mutation',
              'grant execute on function public.h205f22_w1_codespaces_provenance_ingest_v1(uuid,jsonb) to authenticated',
              'grant execute on function public.h205f22_w1_codespaces_provenance_ingest_v1(uuid,jsonb) to anon',
              'provider_action_verified=true', 'w1_verified=true', 'authority_effect=true',
          )
          for token in forbidden:
              assert token not in p, token
          print('W1 Codespaces provenance DB receipt contract: PASS')
          PY
