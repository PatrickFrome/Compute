name: METAENGINE Browser Release Attestation V1

on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact physically-qualified Browser source SHA
        required: true
        type: string
      package_version:
        description: Exact physically-qualified Browser package version
        required: true
        type: string
      producer_run_id:
        description: Exact Browser Windows Package Smoke producer run id
        required: true
        type: string

concurrency:
  group: browser-release-attestation-${{ inputs.source_head }}
  cancel-in-progress: false

permissions: {}

jobs:
  attest:
    name: release-boundary-attestation
    outputs:
      material_artifact_id: ${{ steps.upload_material.outputs.artifact-id }}
      installer_name: ${{ steps.prepare.outputs.installer_name }}
      installer_sha256: ${{ steps.prepare.outputs.installer_sha256 }}
      qualification_attestation_id: ${{ steps.qualification_attestation.outputs.attestation-id }}
      qualification_attestation_url: ${{ steps.qualification_attestation.outputs.attestation-url }}
      sbom_attestation_id: ${{ steps.sbom_attestation.outputs.attestation-id }}
      sbom_attestation_url: ${{ steps.sbom_attestation.outputs.attestation-url }}
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact attestation verifier source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact physically-qualified source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_head }}
          path: candidate-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact verification Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Reverify one-built candidate and terminal physical matrix
        id: prepare
        working-directory: candidate-src/apps/metaengine-browser
        shell: powershell
        env:
          ME2_GITHUB_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $sourceHead = '${{ inputs.source_head }}'.Trim().ToLowerInvariant()
          $packageVersion = '${{ inputs.package_version }}'.Trim()
          $producerRunIdText = '${{ inputs.producer_run_id }}'.Trim()
          if ($sourceHead -notmatch '^[a-f0-9]{40}$') { throw 'release_attestation_source_head_invalid' }
          if (-not $packageVersion) { throw 'release_attestation_package_version_missing' }
          if ($producerRunIdText -notmatch '^[0-9]+$') { throw 'release_attestation_producer_run_id_invalid' }
          $producerRunId = [int64]$producerRunIdText

          $actualHead = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualHead -ne $sourceHead) { throw "release_attestation_checkout_drift:$actualHead" }
          $actualVersion = [string](node -p "require('./package.json').version")
          if ($actualVersion -ne $packageVersion) { throw "release_attestation_package_version_drift:$actualVersion" }

          $workRoot = Join-Path $env:RUNNER_TEMP 'release-attestation-candidate'
          $bindingPath = Join-Path $workRoot 'consumer-binding.json'
          .\scripts\qualified-installer-consumer.ps1 -Mode Acquire -ExpectedHead $sourceHead -WorkRoot $workRoot -ConfigPath (Join-Path (Get-Location) 'electron-builder.test.json') -BindingPath $bindingPath
          if ($LASTEXITCODE -ne 0) { throw 'release_attestation_candidate_acquire_failed' }

          $binding = Get-Content $bindingPath -Raw | ConvertFrom-Json
          if (
            $binding.schema -ne 'metaengine.browser.qualified-installer-consumer-binding.v1' -or
            [string]$binding.source_head -ne $sourceHead -or
            [int64]$binding.producer_run_id -ne $producerRunId -or
            [int64]$binding.producer_run_attempt -ne 1 -or
            [string]$binding.installer_sha256 -notmatch '^[a-f0-9]{64}$' -or
            [string]$binding.build_identity_sha256 -notmatch '^[a-f0-9]{64}$' -or
            $binding.build_identity_verified -ne $true -or
            $binding.dependency_resolution_verified -ne $true -or
            $binding.package_lock_verified -ne $true -or
            $binding.me2_ui_bun_lock_verified -ne $true -or
            $binding.authority_effect -ne $false
          ) { throw 'release_attestation_candidate_binding_invalid' }

          .\scripts\qualified-installer-consumer.ps1 -Mode Verify -ExpectedHead $sourceHead -BindingPath $bindingPath -ConfigPath (Join-Path (Get-Location) 'electron-builder.test.json')
          if ($LASTEXITCODE -ne 0) { throw 'release_attestation_candidate_reverify_failed' }

          $producerProofPath = Join-Path $env:RUNNER_TEMP 'release-attestation-producer-proof.json'
          @{
            schema='metaengine.browser.release-attestation-producer-proof.v1'
            source_head=$sourceHead
            producer_run_id=[int64]$binding.producer_run_id
            producer_run_number=[int64]$binding.producer_run_number
            producer_run_attempt=[int64]$binding.producer_run_attempt
            authority_effect=$false
          } | ConvertTo-Json -Depth 4 | Set-Content $producerProofPath -Encoding utf8

          .\scripts\qualified-installer-consumer.ps1 -Mode Wait -ExpectedHead $sourceHead -BindingPath $bindingPath -ProofPath $producerProofPath -TimeoutMinutes 5 -WaitIntervalSeconds 10
          if ($LASTEXITCODE -ne 0) { throw 'release_attestation_producer_not_terminal_success' }

          $payloadRoot = Split-Path -Parent ([string]$binding.installer_path)
          $composedSbomPath = Join-Path $payloadRoot 'browser-composed-sbom.cdx.json'
          $composedEvidencePath = Join-Path $payloadRoot 'browser-composed-sbom-evidence.json'
          foreach ($path in @([string]$binding.installer_path, [string]$binding.provenance_path, $composedSbomPath, $composedEvidencePath)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "release_attestation_material_missing:$path" }
          }

          $composed = Get-Content $composedEvidencePath -Raw | ConvertFrom-Json
          $sbom = Get-Content $composedSbomPath -Raw | ConvertFrom-Json
          $composedRawSha = (Get-FileHash $composedSbomPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerRawSha = (Get-FileHash ([string]$binding.installer_path) -Algorithm SHA256).Hash.ToLowerInvariant()
          $rootHash = [string](($sbom.metadata.component.hashes | Where-Object { $_.alg -eq 'SHA-256' } | Select-Object -First 1).content)
          if (
            $composed.schema -ne 'metaengine.browser.composed-sbom-evidence.v1' -or
            [string]$composed.source_head -ne $sourceHead -or
            [string]$composed.package_version -ne $packageVersion -or
            [string]$composed.installer_sha256 -ne [string]$binding.installer_sha256 -or
            [string]$composed.build_identity_sha256 -ne [string]$binding.build_identity_sha256 -or
            [string]$composed.composed_semantic_inventory_sha256 -notmatch '^[a-f0-9]{64}$' -or
            [string]$composed.composition_aggregate -ne 'incomplete' -or
            $composed.authority_effect -ne $false -or
            $installerRawSha -ne [string]$binding.installer_sha256 -or
            $rootHash -ne [string]$binding.installer_sha256 -or
            [string]$sbom.compositions[0].aggregate -ne 'incomplete'
          ) { throw 'release_attestation_composed_sbom_binding_invalid' }

          $headers = @{
            Authorization = "Bearer $env:ME2_GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'metaengine-release-attestation-v1'
          }
          $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$sourceHead&per_page=100"
          $runResponse = Invoke-RestMethod -Method Get -Uri $runsUri -Headers $headers
          $requiredNames = @(
            'Browser Windows Package Smoke',
            'Browser Windows Installed Chat Qualification',
            'METAENGINE Browser Final Runtime Activation V1',
            'METAENGINE Browser Windows Autonomous Soak V1',
            'METAENGINE Browser Self Update E2E',
            'METAENGINE Browser Shell V1',
            'METAENGINE Browser Critical Audit V1',
            'METAENGINE Browser Shell-First Dirty Profile V1',
            'METAENGINE Browser Host Resilience Login Start V1',
            'Browser Workspace Reincarnation V1'
          )
          $matrix = @()
          foreach ($name in $requiredNames) {
            $candidate = @(
              $runResponse.workflow_runs |
              Where-Object { [string]$_.name -eq $name -and [string]$_.head_sha -eq $sourceHead } |
              Sort-Object -Property run_number -Descending |
              Select-Object -First 1
            )
            if ($candidate.Count -ne 1) { throw "release_attestation_required_workflow_missing:$name" }
            $run = $candidate[0]
            if ([string]$run.status -ne 'completed' -or [string]$run.conclusion -ne 'success') {
              throw "release_attestation_required_workflow_not_success:$name:$($run.status):$($run.conclusion)"
            }
            if ($name -eq 'Browser Windows Package Smoke' -and [int64]$run.id -ne $producerRunId) {
              throw "release_attestation_package_smoke_producer_drift:$($run.id):$producerRunId"
            }
            $matrix += [ordered]@{
              name=[string]$run.name
              run_id=[int64]$run.id
              run_number=[int64]$run.run_number
              run_attempt=[int64]$run.run_attempt
              conclusion=[string]$run.conclusion
            }
          }

          $matrixPath = Join-Path $env:RUNNER_TEMP 'release-attestation-qualification-matrix.json'
          @{
            schema='metaengine.browser.release-qualification-matrix.v1'
            repository=$env:GITHUB_REPOSITORY
            source_head=$sourceHead
            package_version=$packageVersion
            producer_run_id=$producerRunId
            workflows=$matrix
            terminal_green=$true
            promotion_authorized=$false
            authority_effect=$false
          } | ConvertTo-Json -Depth 8 | Set-Content $matrixPath -Encoding utf8

          $slsaArtifactName = "metaengine-browser-package-slsa-verification-$sourceHead"
          $slsaArtifactsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$producerRunId/artifacts?per_page=100"
          $slsaArtifactResponse = Invoke-RestMethod -Method Get -Uri $slsaArtifactsUri -Headers $headers
          $slsaArtifacts = @(
            $slsaArtifactResponse.artifacts |
            Where-Object {
              [string]$_.name -eq $slsaArtifactName -and
              $_.expired -ne $true -and
              [int64]$_.workflow_run.id -eq $producerRunId -and
              [string]$_.workflow_run.head_sha -eq $sourceHead
            }
          )
          if ($slsaArtifacts.Count -ne 1) {
            throw "release_attestation_slsa_artifact_cardinality_invalid:$($slsaArtifacts.Count)"
          }
          $slsaArtifact = $slsaArtifacts[0]
          $slsaArtifactId = [int64]$slsaArtifact.id
          $slsaArtifactDigest = ([string]$slsaArtifact.digest).Trim().ToLowerInvariant()
          if ($slsaArtifactId -le 0 -or $slsaArtifactDigest -notmatch '^sha256:[a-f0-9]{64}$') {
            throw 'release_attestation_slsa_artifact_identity_invalid'
          }

          $slsaArtifactZip = Join-Path $env:RUNNER_TEMP 'release-package-slsa-verification.zip'
          $slsaArtifactRoot = Join-Path $env:RUNNER_TEMP 'release-package-slsa-verification'
          Remove-Item $slsaArtifactZip -Force -ErrorAction SilentlyContinue
          Remove-Item $slsaArtifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -UseBasicParsing -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$slsaArtifactId/zip" -Headers $headers -OutFile $slsaArtifactZip
          Expand-Archive -LiteralPath $slsaArtifactZip -DestinationPath $slsaArtifactRoot -Force

          $slsaEvidencePath = Join-Path $slsaArtifactRoot 'browser-package-slsa-provenance-evidence.json'
          $slsaVerificationPath = Join-Path $slsaArtifactRoot 'browser-package-slsa-verification.json'
          foreach ($path in @($slsaEvidencePath,$slsaVerificationPath)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "release_attestation_slsa_material_missing:$path" }
          }
          $slsaEvidence = Get-Content $slsaEvidencePath -Raw | ConvertFrom-Json
          $expectedSlsaBuilder = "https://github.com/$env:GITHUB_REPOSITORY/.github/workflows/browser-windows-package-smoke.yml@refs/heads/physical/build-slsa-provenance-v1"
          $expectedSlsaVerifier = "github-slsa-package-smoke:$producerRunId:$([int]$binding.producer_run_attempt)"
          if (
            $slsaEvidence.schema -ne 'metaengine.browser-fabric.provenance-evidence.v1' -or
            $slsaEvidence.verified -ne $true -or
            $slsaEvidence.builder_trusted -ne $true -or
            [string]$slsaEvidence.builder_id -ne $expectedSlsaBuilder -or
            [string]$slsaEvidence.source_sha -ne $sourceHead -or
            [string]$slsaEvidence.subject_name -ne [string]$binding.installer_name -or
            [string]$slsaEvidence.subject_sha256 -ne [string]$binding.installer_sha256 -or
            [string]$slsaEvidence.predicate_type -ne 'https://slsa.dev/provenance/v1' -or
            [string]$slsaEvidence.verifier_id -ne $expectedSlsaVerifier -or
            $slsaEvidence.authority_effect -ne $false
          ) {
            throw 'release_attestation_slsa_evidence_binding_invalid'
          }
          $slsaEvidenceSha = (Get-FileHash $slsaEvidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $slsaVerificationSha = (Get-FileHash $slsaVerificationPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($slsaEvidenceSha -notmatch '^[a-f0-9]{64}$' -or $slsaVerificationSha -notmatch '^[a-f0-9]{64}$') {
            throw 'release_attestation_slsa_material_digest_invalid'
          }

          $predicatePath = Join-Path $env:RUNNER_TEMP 'release-attestation-predicate.json'
          @{
            schema='metaengine.browser.release-qualification-attestation.v1'
            repository=$env:GITHUB_REPOSITORY
            source_head=$sourceHead
            package_version=$packageVersion
            installer_name=[string]$binding.installer_name
            installer_sha256=[string]$binding.installer_sha256
            build_identity_sha256=[string]$binding.build_identity_sha256
            dependency_resolution_sha256=[string]$binding.dependency_resolution_sha256
            package_lock_sha256=[string]$binding.package_lock_sha256
            composed_sbom_raw_sha256=$composedRawSha
            composed_sbom_semantic_inventory_sha256=[string]$composed.composed_semantic_inventory_sha256
            composed_sbom_aggregate='incomplete'
            producer_workflow='browser-windows-package-smoke.yml'
            producer_run_id=[int64]$binding.producer_run_id
            producer_run_number=[int64]$binding.producer_run_number
            producer_run_attempt=[int64]$binding.producer_run_attempt
            qualification_workflows=$matrix
            physical_qualification_terminal_green=$true
            slsa_provenance_verified=$true
            slsa_builder_trusted=$true
            slsa_builder_id=$expectedSlsaBuilder
            slsa_predicate_type='https://slsa.dev/provenance/v1'
            slsa_verifier_id=$expectedSlsaVerifier
            slsa_evidence_artifact_id=$slsaArtifactId
            slsa_evidence_artifact_digest=$slsaArtifactDigest
            slsa_provenance_evidence_sha256=$slsaEvidenceSha
            slsa_verification_material_sha256=$slsaVerificationSha
            automatic_promotion=$false
            promotion_authorized=$false
            authority_effect=$false
          } | ConvertTo-Json -Depth 10 | Set-Content $predicatePath -Encoding utf8

          "installer_path=$([string]$binding.installer_path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_name=$([string]$binding.installer_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_sha256=$([string]$binding.installer_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sbom_path=$composedSbomPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "predicate_path=$predicatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "matrix_path=$matrixPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "slsa_evidence_path=$slsaEvidencePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "slsa_verification_path=$slsaVerificationPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "slsa_evidence_artifact_id=$slsaArtifactId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "slsa_evidence_artifact_digest=$slsaArtifactDigest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "slsa_provenance_evidence_sha256=$slsaEvidenceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "slsa_verification_material_sha256=$slsaVerificationSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest release qualification for exact installer
        id: qualification_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.installer_path }}
          predicate-type: https://metaengine.dev/attestations/browser-release-qualification/v1
          predicate-path: ${{ steps.prepare.outputs.predicate_path }}

      - name: Attest composed CycloneDX SBOM for exact installer
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.installer_path }}
          sbom-path: ${{ steps.prepare.outputs.sbom_path }}

      - name: Materialize portable attestation material
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $materialRoot = "$env:RUNNER_TEMP\release-attestation-material"
          New-Item -ItemType Directory -Path $materialRoot -Force | Out-Null

          $qualificationBundle = '${{ steps.qualification_attestation.outputs.bundle-path }}'
          $sbomBundle = '${{ steps.sbom_attestation.outputs.bundle-path }}'
          foreach ($path in @(
            $qualificationBundle,
            $sbomBundle,
            '${{ steps.prepare.outputs.predicate_path }}',
            '${{ steps.prepare.outputs.matrix_path }}',
            '${{ steps.prepare.outputs.sbom_path }}',
            '${{ steps.prepare.outputs.slsa_evidence_path }}',
            '${{ steps.prepare.outputs.slsa_verification_path }}'
          )) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "release_attestation_material_missing:$path" }
          }

          Copy-Item $qualificationBundle (Join-Path $materialRoot 'release-qualification-attestation.bundle.json') -Force
          Copy-Item $sbomBundle (Join-Path $materialRoot 'release-sbom-attestation.bundle.json') -Force
          Copy-Item '${{ steps.prepare.outputs.predicate_path }}' (Join-Path $materialRoot 'release-attestation-predicate.json') -Force
          Copy-Item '${{ steps.prepare.outputs.matrix_path }}' (Join-Path $materialRoot 'release-attestation-qualification-matrix.json') -Force
          Copy-Item '${{ steps.prepare.outputs.sbom_path }}' (Join-Path $materialRoot 'browser-composed-sbom.cdx.json') -Force
          Copy-Item '${{ steps.prepare.outputs.slsa_evidence_path }}' (Join-Path $materialRoot 'package-slsa-provenance-evidence.json') -Force
          Copy-Item '${{ steps.prepare.outputs.slsa_verification_path }}' (Join-Path $materialRoot 'package-slsa-verification.json') -Force

          @{
            schema='metaengine.browser.release-attestation-material.v1'
            repository=$env:GITHUB_REPOSITORY
            signer_source_sha=$env:GITHUB_SHA
            signer_source_ref=$env:GITHUB_REF
            source_head='${{ inputs.source_head }}'
            package_version='${{ inputs.package_version }}'
            producer_run_id=[int64]'${{ inputs.producer_run_id }}'
            installer_name='${{ steps.prepare.outputs.installer_name }}'
            installer_sha256='${{ steps.prepare.outputs.installer_sha256 }}'
            qualification_attestation_id='${{ steps.qualification_attestation.outputs.attestation-id }}'
            sbom_attestation_id='${{ steps.sbom_attestation.outputs.attestation-id }}'
            slsa_evidence_artifact_id=[int64]'${{ steps.prepare.outputs.slsa_evidence_artifact_id }}'
            slsa_evidence_artifact_digest='${{ steps.prepare.outputs.slsa_evidence_artifact_digest }}'
            slsa_provenance_evidence_sha256='${{ steps.prepare.outputs.slsa_provenance_evidence_sha256 }}'
            slsa_verification_material_sha256='${{ steps.prepare.outputs.slsa_verification_material_sha256 }}'
            cryptographic_verification=$false
            promotion_authorized=$false
            release_published=$false
            authority_effect=$false
          } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $materialRoot 'release-attestation-material.json') -Encoding utf8

      - name: Upload immutable attestation material for independent verification
        id: upload_material
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-release-attestation-material-${{ inputs.source_head }}
          path: ${{ runner.temp }}/release-attestation-material/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify:
    name: release-boundary-independent-verification
    needs: attest
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact verifier source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact physically-qualified source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_head }}
          path: candidate-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact verification Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Download exact attestation material by immutable artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.attest.outputs.material_artifact_id }}
          path: material
          digest-mismatch: error

      - name: Reacquire and reverify exact one-built installer
        id: candidate
        working-directory: candidate-src/apps/metaengine-browser
        shell: powershell
        env:
          ME2_GITHUB_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $sourceHead = '${{ inputs.source_head }}'.Trim().ToLowerInvariant()
          $expectedName = '${{ needs.attest.outputs.installer_name }}'
          $expectedSha = '${{ needs.attest.outputs.installer_sha256 }}'
          $workRoot = Join-Path $env:RUNNER_TEMP 'release-attestation-verify-candidate'
          $bindingPath = Join-Path $workRoot 'consumer-binding.json'

          .\scripts\qualified-installer-consumer.ps1 -Mode Acquire -ExpectedHead $sourceHead -WorkRoot $workRoot -ConfigPath (Join-Path (Get-Location) 'electron-builder.test.json') -BindingPath $bindingPath
          if ($LASTEXITCODE -ne 0) { throw 'release_attestation_verify_candidate_acquire_failed' }
          .\scripts\qualified-installer-consumer.ps1 -Mode Verify -ExpectedHead $sourceHead -BindingPath $bindingPath -ConfigPath (Join-Path (Get-Location) 'electron-builder.test.json')
          if ($LASTEXITCODE -ne 0) { throw 'release_attestation_verify_candidate_reverify_failed' }

          $binding = Get-Content $bindingPath -Raw | ConvertFrom-Json
          if (
            [string]$binding.installer_name -ne $expectedName -or
            [string]$binding.installer_sha256 -ne $expectedSha -or
            [int64]$binding.producer_run_id -ne [int64]'${{ inputs.producer_run_id }}' -or
            [int64]$binding.producer_run_attempt -ne 1 -or
            $binding.authority_effect -ne $false
          ) {
            throw 'release_attestation_verify_candidate_binding_drift'
          }

          $producerProofPath = Join-Path $env:RUNNER_TEMP 'release-attestation-verify-producer-proof.json'
          @{
            schema='metaengine.browser.release-attestation-verify-producer-proof.v1'
            source_head=$sourceHead
            producer_run_id=[int64]$binding.producer_run_id
            producer_run_number=[int64]$binding.producer_run_number
            producer_run_attempt=[int64]$binding.producer_run_attempt
            authority_effect=$false
          } | ConvertTo-Json -Depth 4 | Set-Content $producerProofPath -Encoding utf8
          .\scripts\qualified-installer-consumer.ps1 -Mode Wait -ExpectedHead $sourceHead -BindingPath $bindingPath -ProofPath $producerProofPath -TimeoutMinutes 5 -WaitIntervalSeconds 10
          if ($LASTEXITCODE -ne 0) { throw 'release_attestation_verify_producer_not_terminal_success' }

          "installer_path=$([string]$binding.installer_path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Snapshot trusted roots and independently verify exact attestations
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $installer = '${{ steps.candidate.outputs.installer_path }}'
          $installerName = '${{ needs.attest.outputs.installer_name }}'
          $installerSha = '${{ needs.attest.outputs.installer_sha256 }}'
          $qualificationBundle = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\material" -Recurse -Filter 'release-qualification-attestation.bundle.json' | Select-Object -First 1).FullName
          $sbomBundle = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\material" -Recurse -Filter 'release-sbom-attestation.bundle.json' | Select-Object -First 1).FullName
          $predicatePath = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\material" -Recurse -Filter 'release-attestation-predicate.json' | Select-Object -First 1).FullName
          $sbomPath = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\material" -Recurse -Filter 'browser-composed-sbom.cdx.json' | Select-Object -First 1).FullName
          $materialReceiptPath = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\material" -Recurse -Filter 'release-attestation-material.json' | Select-Object -First 1).FullName
          $slsaEvidenceMaterialPath = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\material" -Recurse -Filter 'package-slsa-provenance-evidence.json' | Select-Object -First 1).FullName
          $slsaVerificationMaterialPath = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\material" -Recurse -Filter 'package-slsa-verification.json' | Select-Object -First 1).FullName
          foreach ($path in @($installer,$qualificationBundle,$sbomBundle,$predicatePath,$sbomPath,$materialReceiptPath,$slsaEvidenceMaterialPath,$slsaVerificationMaterialPath)) {
            if (-not $path -or -not (Test-Path $path -PathType Leaf)) { throw "release_attestation_independent_verify_material_missing:$path" }
          }

          $materialReceipt = Get-Content $materialReceiptPath -Raw | ConvertFrom-Json
          $materialSlsaEvidenceSha = (Get-FileHash $slsaEvidenceMaterialPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialSlsaVerificationSha = (Get-FileHash $slsaVerificationMaterialPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialSlsaEvidence = Get-Content $slsaEvidenceMaterialPath -Raw | ConvertFrom-Json
          $materialPredicate = Get-Content $predicatePath -Raw | ConvertFrom-Json
          if (
            $materialReceipt.schema -ne 'metaengine.browser.release-attestation-material.v1' -or
            [string]$materialReceipt.signer_source_sha -ne $env:GITHUB_SHA -or
            [string]$materialReceipt.signer_source_ref -ne $env:GITHUB_REF -or
            [string]$materialReceipt.source_head -ne '${{ inputs.source_head }}' -or
            [string]$materialReceipt.installer_sha256 -ne $installerSha -or
            [int64]$materialReceipt.slsa_evidence_artifact_id -le 0 -or
            [string]$materialReceipt.slsa_evidence_artifact_digest -notmatch '^sha256:[a-f0-9]{64}$' -or
            [string]$materialReceipt.slsa_provenance_evidence_sha256 -ne $materialSlsaEvidenceSha -or
            [string]$materialReceipt.slsa_verification_material_sha256 -ne $materialSlsaVerificationSha -or
            [string]$materialPredicate.slsa_provenance_evidence_sha256 -ne $materialSlsaEvidenceSha -or
            [string]$materialPredicate.slsa_verification_material_sha256 -ne $materialSlsaVerificationSha -or
            $materialSlsaEvidence.schema -ne 'metaengine.browser-fabric.provenance-evidence.v1' -or
            $materialSlsaEvidence.verified -ne $true -or
            $materialSlsaEvidence.builder_trusted -ne $true -or
            [string]$materialSlsaEvidence.source_sha -ne '${{ inputs.source_head }}' -or
            [string]$materialSlsaEvidence.subject_name -ne $installerName -or
            [string]$materialSlsaEvidence.subject_sha256 -ne $installerSha -or
            [string]$materialSlsaEvidence.predicate_type -ne 'https://slsa.dev/provenance/v1' -or
            $materialSlsaEvidence.authority_effect -ne $false -or
            $materialReceipt.cryptographic_verification -ne $false -or
            $materialReceipt.promotion_authorized -ne $false -or
            $materialReceipt.release_published -ne $false -or
            $materialReceipt.authority_effect -ne $false
          ) {
            throw 'release_attestation_material_receipt_invalid'
          }

          $ghVersion = [string]((& gh --version | Select-Object -First 1))
          if (-not $ghVersion) { throw 'release_attestation_gh_cli_version_missing' }

          $trustedRoot = "$env:RUNNER_TEMP\release-attestation-trusted-root.jsonl"
          $trustedRootLines = & gh attestation trusted-root
          if ($LASTEXITCODE -ne 0) { throw 'release_attestation_trusted_root_fetch_failed' }
          $trustedRootLines | Set-Content -LiteralPath $trustedRoot -Encoding utf8
          if (-not (Test-Path $trustedRoot -PathType Leaf) -or [int64](Get-Item $trustedRoot).Length -le 0) {
            throw 'release_attestation_trusted_root_missing'
          }

          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/browser-release-attestation-v1.yml"
          $qualificationVerification = "$env:RUNNER_TEMP\release-qualification-verification.json"
          $sbomVerification = "$env:RUNNER_TEMP\release-sbom-verification.json"
          $slsaVerification = "$env:RUNNER_TEMP\release-slsa-provenance-verification.json"
          $verificationProof = "$env:RUNNER_TEMP\release-attestation-verification-proof.json"

          $qualificationArgs = @(
            'attestation','verify',$installer,
            '--repo',$env:GITHUB_REPOSITORY,
            '--bundle',$qualificationBundle,
            '--custom-trusted-root',$trustedRoot,
            '--predicate-type','https://metaengine.dev/attestations/browser-release-qualification/v1',
            '--signer-workflow',$signerWorkflow,
            '--signer-digest',$env:GITHUB_SHA,
            '--source-digest',$env:GITHUB_SHA,
            '--source-ref',$env:GITHUB_REF,
            '--cert-oidc-issuer','https://token.actions.githubusercontent.com',
            '--deny-self-hosted-runners',
            '--format','json'
          )
          $qualificationJson = & gh @qualificationArgs
          if ($LASTEXITCODE -ne 0) { throw 'release_qualification_attestation_cryptographic_verify_failed' }
          $qualificationJson | Set-Content -LiteralPath $qualificationVerification -Encoding utf8

          $sbomArgs = @(
            'attestation','verify',$installer,
            '--repo',$env:GITHUB_REPOSITORY,
            '--bundle',$sbomBundle,
            '--custom-trusted-root',$trustedRoot,
            '--predicate-type','https://cyclonedx.org/bom',
            '--signer-workflow',$signerWorkflow,
            '--signer-digest',$env:GITHUB_SHA,
            '--source-digest',$env:GITHUB_SHA,
            '--source-ref',$env:GITHUB_REF,
            '--cert-oidc-issuer','https://token.actions.githubusercontent.com',
            '--deny-self-hosted-runners',
            '--format','json'
          )
          $sbomJson = & gh @sbomArgs
          if ($LASTEXITCODE -ne 0) { throw 'release_sbom_attestation_cryptographic_verify_failed' }
          $sbomJson | Set-Content -LiteralPath $sbomVerification -Encoding utf8

          $producerVerificationDocument = Get-Content $slsaVerificationMaterialPath -Raw | ConvertFrom-Json
          if (@($producerVerificationDocument).Count -ne 1 -or -not $producerVerificationDocument[0].attestation.bundle) {
            throw 'release_slsa_producer_bundle_material_invalid'
          }
          $slsaBundle = "$env:RUNNER_TEMP\release-package-slsa-provenance.bundle.json"
          $producerVerificationDocument[0].attestation.bundle | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $slsaBundle -Encoding utf8
          if (-not (Test-Path $slsaBundle -PathType Leaf) -or [int64](Get-Item $slsaBundle).Length -le 0) {
            throw 'release_slsa_producer_bundle_material_missing'
          }

          $packageSignerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/browser-windows-package-smoke.yml"
          $slsaArgs = @(
            'attestation','verify',$installer,
            '--repo',$env:GITHUB_REPOSITORY,
            '--bundle',$slsaBundle,
            '--custom-trusted-root',$trustedRoot,
            '--predicate-type','https://slsa.dev/provenance/v1',
            '--signer-workflow',$packageSignerWorkflow,
            '--signer-digest','${{ inputs.source_head }}',
            '--source-digest','${{ inputs.source_head }}',
            '--source-ref','refs/heads/physical/build-slsa-provenance-v1',
            '--cert-oidc-issuer','https://token.actions.githubusercontent.com',
            '--deny-self-hosted-runners',
            '--format','json'
          )
          $slsaJson = & gh @slsaArgs
          if ($LASTEXITCODE -ne 0) { throw 'release_slsa_provenance_cryptographic_verify_failed' }
          $slsaJson | Set-Content -LiteralPath $slsaVerification -Encoding utf8

          $nodeArgs = @(
            "$env:GITHUB_WORKSPACE\scripts\release-attestation-verification.mjs",
            '--qualification-verification',$qualificationVerification,
            '--sbom-verification',$sbomVerification,
            '--slsa-verification',$slsaVerification,
            '--predicate',$predicatePath,
            '--sbom',$sbomPath,
            '--trusted-root',$trustedRoot,
            '--expected-installer-name',$installerName,
            '--expected-installer-sha256',$installerSha,
            '--signer-workflow',$signerWorkflow,
            '--signer-source-sha',$env:GITHUB_SHA,
            '--signer-source-ref',$env:GITHUB_REF,
            '--gh-cli-version',$ghVersion,
            '--out',$verificationProof
          )
          & node @nodeArgs
          if ($LASTEXITCODE -ne 0) { throw 'release_attestation_semantic_independent_verify_failed' }

          $proof = Get-Content $verificationProof -Raw | ConvertFrom-Json
          if (
            $proof.schema -ne 'metaengine.browser.release-attestation-verification.v1' -or
            $proof.cryptographic_verification -ne $true -or
            $proof.signer_identity_verified -ne $true -or
            $proof.semantic_binding_verified -ne $true -or
            $proof.trusted_root_snapshot_bound -ne $true -or
            $proof.self_hosted_runner_denied -ne $true -or
            $proof.slsa_cryptographic_verification -ne $true -or
            $proof.slsa_builder_trusted -ne $true -or
            [string]$proof.slsa_predicate_type -ne 'https://slsa.dev/provenance/v1' -or
            [string]$proof.slsa_statement_sha256 -notmatch '^[a-f0-9]{64}$' -or
            $proof.automatic_promotion -ne $false -or
            $proof.promotion_authorized -ne $false -or
            $proof.release_published -ne $false -or
            $proof.authority_effect -ne $false
          ) {
            throw 'release_attestation_independent_verify_proof_invalid'
          }

          @{
            schema='metaengine.browser.release-attestation-result.v2'
            repository=$env:GITHUB_REPOSITORY
            signer_source_sha=$env:GITHUB_SHA
            signer_source_ref=$env:GITHUB_REF
            source_head='${{ inputs.source_head }}'
            package_version='${{ inputs.package_version }}'
            producer_run_id=[int64]'${{ inputs.producer_run_id }}'
            installer_sha256=$installerSha
            attestation_material_artifact_id=[int64]'${{ needs.attest.outputs.material_artifact_id }}'
            qualification_attestation_id='${{ needs.attest.outputs.qualification_attestation_id }}'
            qualification_attestation_url='${{ needs.attest.outputs.qualification_attestation_url }}'
            sbom_attestation_id='${{ needs.attest.outputs.sbom_attestation_id }}'
            sbom_attestation_url='${{ needs.attest.outputs.sbom_attestation_url }}'
            trusted_root_sha256=[string]$proof.trusted_root_sha256
            qualification_statement_sha256=[string]$proof.qualification_statement_sha256
            sbom_statement_sha256=[string]$proof.sbom_statement_sha256
            slsa_statement_sha256=[string]$proof.slsa_statement_sha256
            slsa_cryptographic_verification=$true
            slsa_builder_trusted=$true
            slsa_predicate_type='https://slsa.dev/provenance/v1'
            cryptographic_verification=$true
            independent_verifier_no_signing_authority=$true
            signer_identity_verified=$true
            semantic_binding_verified=$true
            promotion_authorized=$false
            release_published=$false
            authority_effect=$false
          } | ConvertTo-Json -Depth 7 | Set-Content "$env:RUNNER_TEMP\release-attestation-result.json" -Encoding utf8

      - name: Upload independently verified release-attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-release-attestation-verified-${{ inputs.source_head }}
          path: |
            material/**
            ${{ runner.temp }}/release-attestation-result.json
            ${{ runner.temp }}/release-attestation-trusted-root.jsonl
            ${{ runner.temp }}/release-qualification-verification.json
            ${{ runner.temp }}/release-sbom-verification.json
            ${{ runner.temp }}/release-slsa-provenance-verification.json
            ${{ runner.temp }}/release-package-slsa-provenance.bundle.json
            ${{ runner.temp }}/release-attestation-verification-proof.json
          if-no-files-found: error
          retention-days: 90
