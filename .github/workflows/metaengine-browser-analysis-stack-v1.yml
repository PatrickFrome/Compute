name: METAENGINE Browser Analysis Stack V1

on:
  push:
    branches:
      - work/metaengine-browser-analysis-stack-v1
      - release/self-update-ambiguity-live-v2
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: metaengine-browser-analysis-stack-${{ github.sha }}
  cancel-in-progress: false

env:
  EXACT_HEAD: ${{ github.sha }}

jobs:
  metaengine-static-and-architecture:
    name: metaengine-static-and-architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install Browser dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund --no-package-lock

      - name: METAENGINE invariant static gate
        working-directory: apps/metaengine-browser
        run: node scripts/security-static-gate.mjs

      - name: Parse exact Browser source
        working-directory: apps/metaengine-browser
        run: npm run check

      - name: Install pinned Semgrep CE
        run: python -m pip install --disable-pip-version-check --no-input semgrep==1.177.0

      - name: Semgrep METAENGINE security policy
        working-directory: apps/metaengine-browser
        run: semgrep scan --config .semgrep/metaengine.yml --error --metrics=off src scripts supabase ui smoke/dp

      - name: Biome legacy baseline diagnostics
        working-directory: apps/metaengine-browser
        continue-on-error: true
        run: npx --yes @biomejs/biome@2.5.13 lint src scripts supabase ui

      - name: Madge dependency-cycle diagnostics
        working-directory: apps/metaengine-browser
        continue-on-error: true
        shell: bash
        run: npx --yes madge@8.0.0 --circular --warning src | tee madge-circular.txt

      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-analysis-diagnostics-${{ env.EXACT_HEAD }}-${{ github.run_attempt }}
          path: apps/metaengine-browser/madge-circular.txt
          if-no-files-found: warn
          retention-days: 30

  codeql-javascript:
    name: codeql-javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze JavaScript with CodeQL
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:javascript-typescript

  trivy-advisory:
    name: trivy-advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Trivy filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/metaengine-browser
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-metaengine-browser
