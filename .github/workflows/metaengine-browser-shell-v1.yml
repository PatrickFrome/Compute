name: METAENGINE Browser Shell V1
on:
  push:
    branches: ['work/metaengine-browser-shell-v1']
  pull_request:
    paths:
      - 'apps/metaengine-browser/**'
      - 'coordination/browser-compute/**'
      - '.github/workflows/metaengine-browser-shell-v1.yml'
permissions:
  contents: read
jobs:
  shell-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install shell dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund
      - name: Materialize Electron binary without launching Chromium
        working-directory: apps/metaengine-browser
        env:
          ELECTRON_GET_NO_PROGRESS: '1'
        run: npx install-electron --no
      - name: Configure Chromium sandbox on Ubuntu CI
        working-directory: apps/metaengine-browser
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          test -f node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%U:%G %a' node_modules/electron/dist/chrome-sandbox)" = 'root:root 4755'
      - name: Electron binary gate
        working-directory: apps/metaengine-browser
        run: |
          set -euo pipefail
          test -x node_modules/electron/dist/electron
          node -e "const fs=require('node:fs'); const p=require('electron'); if(!fs.existsSync(p)) process.exit(2); console.log(p)"
      - name: Parse gate
        working-directory: apps/metaengine-browser
        run: npm run check
      - name: Contract tests
        working-directory: apps/metaengine-browser
        run: npm test
      - name: Security static gate
        run: |
          grep -q 'app.enableSandbox()' apps/metaengine-browser/src/main.mjs
          grep -q 'nodeIntegration: false' apps/metaengine-browser/src/browser-policy.mjs
          grep -q 'contextIsolation: true' apps/metaengine-browser/src/browser-policy.mjs
          grep -q 'sandbox: true' apps/metaengine-browser/src/browser-policy.mjs
          grep -q 'cookie_transfer_to_compute_space: false' apps/metaengine-browser/src/browser-policy.mjs
          ! grep -R -E 'executeJavaScript|Runtime\.evaluate|--remote-debugging-port|--no-sandbox|chat\.z\.ai|GLM_ZAI|STRICT_GLM_FIRST' apps/metaengine-browser --exclude-dir=node_modules
          ! grep -R -E 'nodeIntegration:[[:space:]]*true|sandbox:[[:space:]]*false' apps/metaengine-browser --exclude-dir=node_modules
      - name: Preserve B-line contracts
        working-directory: coordination/browser-compute
        run: node --test tests/*.test.mjs
      - name: Electron renderer diagnostic
        id: renderer_smoke
        continue-on-error: true
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s xvfb-run -a npm run smoke | tee /tmp/metaengine-browser-smoke.jsonl
      - name: Record renderer diagnostic status
        if: always()
        run: |
          mkdir -p evidence-out
          if grep -q '"ok":true' /tmp/metaengine-browser-smoke.jsonl 2>/dev/null; then
            echo 'renderer_smoke=PASS' | tee evidence-out/renderer-smoke-status.txt
          else
            echo 'renderer_smoke=NOT_PROVED_ON_HOSTED_UBUNTU' | tee evidence-out/renderer-smoke-status.txt
            sudo dmesg | tail -n 120 > evidence-out/kernel-diagnostics.txt 2>&1 || true
          fi
      - name: Evidence bundle
        if: always()
        run: |
          cp research/METAENGINE_BROWSER_SHELL_STEP1_RESEARCH_2026-08-29.md evidence-out/
          test ! -f /tmp/metaengine-browser-smoke.jsonl || cp /tmp/metaengine-browser-smoke.jsonl evidence-out/
          git rev-parse HEAD > evidence-out/git-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: metaengine-browser-shell-v1-${{ github.sha }}
          path: evidence-out/
