name: W1 S2 PID1 Evidence Consumer Audit

on:
  push:
    branches: [work/w1-sandbox-launcher-prep]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile and negative-test consumer auditor
        run: |
          set -euo pipefail
          python3 -m py_compile controller/w1/s2_pid1_evidence_consumer_audit.py
          python3 -m unittest tests.test_w1_s2_pid1_evidence_consumer_audit -v
      - name: Audit current repository PID1 evidence consumers
        run: |
          set -euo pipefail
          mkdir -p out
          python3 controller/w1/s2_pid1_evidence_consumer_audit.py \
            --root . \
            --output out/w1-s2-pid1-evidence-consumer-audit.json
          cat out/w1-s2-pid1-evidence-consumer-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('out/w1-s2-pid1-evidence-consumer-audit.json').read_text())
          assert r['schema'] == 'metaengine.compute.w1-s2-pid1-evidence-consumer-audit.h205f22.v1'
          assert r['outcome'] == 'PASS_PID1_EVIDENCE_CONSUMER_AUDIT_NONAUTHORITY'
          assert all(r['evidence']['checks'].values())
          assert r['evidence']['legacy_schema_consumers'] == []
          assert r['evidence']['legacy_layout_consumers'] == []
          assert r['evidence']['current_schema_consumers']
          assert r['runtime_isolation_verified'] is False
          assert r['w1_verified'] is False
          assert r['authority_effect'] is False
          print('PID1 evidence consumer audit: PASS_NONAUTHORITY')
          print('evidence_sha256=' + r['evidence_sha256'])
          PY
      - name: Upload non-authority consumer receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w1-s2-pid1-evidence-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/w1-s2-pid1-evidence-consumer-audit.json
          if-no-files-found: error
          retention-days: 14
