  pull_request:
    paths:
      - 'apps/metaengine-browser/src/codex-cli-sandbox-probe.mjs'
      - 'apps/metaengine-browser/test/codex-cli-sandbox-probe*.test.mjs'
      - 'apps/metaengine-browser/src/client-native-*.mjs'
      - 'apps/metaengine-browser/src/client-prepared-goal.mjs'
      - 'apps/metaengine-browser/test/client-prepared-goal.test.mjs'
      - 'apps/metaengine-browser/src/client-goal-journal.mjs'
      - 'apps/metaengine-browser/src/main.mjs'
      - 'apps/metaengine-browser/src/supervisor-device-identity.mjs'
      - 'apps/metaengine-browser/src/host-owner-genesis-custody-w74.mjs'
