            'apps/metaengine-browser/test/browser-parent-suspension-cycle.test.mjs',
          ];
          const native=[
            'infra/client-state-runtime/native-coding-setup.pg17.test.mjs',
            'infra/client-state-runtime/native-coding-physical-custody.pg17.test.mjs',
            'infra/client-state-runtime/native-coding-physical-restart.pg17.test.mjs',
