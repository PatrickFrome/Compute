name: DevOS Session UI Patch Temp V3

on:
  pull_request:
    paths:
      - '.github/workflows/devos-session-ui-patch-temp-v3.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Prove exact parent and patch source
        env:
          EXPECTED_PARENT: c403f1eac3c2c9cb0c65c6e2a26718611d21049f
          EXPECTED_BRANCH: work/metaengine-devos-session-surface-ui-v1
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f .github/workflows/devos-session-ui-patch-temp.yml
          test -f .github/workflows/devos-session-ui-patch-temp-v2.yml
          test -f .github/workflows/devos-session-ui-patch-temp-v3.yml
          test -f apps/metaengine-browser/ui/app.js

      - name: Reuse verified deterministic patch body and run targeted gates
        run: |
          set -euo pipefail
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/devos-session-ui-patch-temp-v2.yml \
            | sed '1d;$d;s/^          //' > /tmp/devos-session-ui-patch.py
          test -s /tmp/devos-session-ui-patch.py
          python3 /tmp/devos-session-ui-patch.py
          node --check apps/metaengine-browser/ui/app.js
          cd apps/metaengine-browser
          node --test test/browser-devos-selected-session-surfaces.test.mjs test/browser-devos-session-surface-ui.test.mjs

      - name: Commit UI slice and remove all temporary patchers
        run: |
          set -euo pipefail
          rm .github/workflows/devos-session-ui-patch-temp.yml
          rm .github/workflows/devos-session-ui-patch-temp-v2.yml
          rm .github/workflows/devos-session-ui-patch-temp-v3.yml
          git config user.name 'METAENGINE CI'
          git config user.email 'actions@github.com'
          git add apps/metaengine-browser/ui/app.js .github/workflows/devos-session-ui-patch-temp.yml .github/workflows/devos-session-ui-patch-temp-v2.yml .github/workflows/devos-session-ui-patch-temp-v3.yml
          git commit -m 'feat(browser): wire Session-first DevOS surface controls'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
