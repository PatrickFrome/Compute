name: Client W69 Source-only Windows R97 Visual

on:
  push:
    branches:
      - 'work/metaengine-client-wave11-w69-20261015'
    paths:
      - 'apps/me2-ui/**'
      - 'apps/metaengine-browser/test/**'
      - '.github/workflows/client-wave10-w62-source-r97.yml'
  pull_request:
    paths:
      - 'apps/me2-ui/**'
      - 'apps/metaengine-browser/test/client-visual-readiness-w54.test.mjs'
      - 'apps/metaengine-browser/test/me2-r85-visual-evidence.mjs'
      - 'apps/metaengine-browser/test/r94-workflow-shell-ia.test.mjs'
      - 'apps/metaengine-browser/test/r100-ui-authority-surface-prune.test.mjs'
      - '.github/workflows/client-wave10-w62-source-r97.yml'

permissions:
  contents: read

jobs:
  exact-source-windows-r97:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ME2_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      METAENGINE_R85_VISUAL_UI_DIR: ${{ github.workspace }}\apps\metaengine-browser\me2-ui-dist
    steps:
      - name: Checkout exact W62 source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Frozen Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.3'
      - name: Assert immutable candidate head and absence of production effects
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:ME2_BUILD_SHA) { throw 'w62_source_head_mismatch' }
          if ((bun --version).Trim() -ne '1.3.3') { throw 'w62_bun_version_mismatch' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'w62_source_diff_invalid' }
      - name: R97 navigation and false-readiness negative suites
        shell: pwsh
        run: |
          node --test apps/metaengine-browser/test/client-visual-readiness-w54.test.mjs apps/metaengine-browser/test/client-v1-admin-connectivity.test.mjs apps/metaengine-browser/test/r94-workflow-shell-ia.test.mjs apps/metaengine-browser/test/r100-ui-authority-surface-prune.test.mjs apps/metaengine-browser/test/browser-agentic-workbench-ui.test.mjs apps/metaengine-browser/test/browser-closed-loop-audit-fixes.test.mjs apps/metaengine-browser/test/me2-ui-chatgpt-convergence.test.mjs apps/metaengine-browser/test/r97-visual-capture-digest-w69.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'w62_r97_source_contract_failed' }
      - name: Install disposable Electron harness from frozen Browser lock
        working-directory: apps/metaengine-browser
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'w62_disposable_browser_npm_ci_failed' }
          if (-not (Test-Path '.\\node_modules\\electron\\dist\\electron.exe' -PathType Leaf)) { throw 'w62_electron_missing' }
      - name: Frozen UI typecheck, build and pack without package identity reservation
        working-directory: apps/me2-ui
        shell: pwsh
        run: |
          bun ci
          if ($LASTEXITCODE -ne 0) { throw 'w62_me2_bun_ci_failed' }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'w62_me2_typecheck_failed' }
          bun run build
          if ($LASTEXITCODE -ne 0) { throw 'w62_me2_build_failed' }
          bun run pack
          if ($LASTEXITCODE -ne 0) { throw 'w62_me2_pack_failed' }
      - name: Verify and stage exact-head UI (no installer or installed Owner)
        shell: pwsh
        run: |
          node apps/metaengine-browser/scripts/verify-me2-ui-bundle.mjs --root apps/me2-ui/me2-ui-dist --expected-sha $env:ME2_BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'w62_source_ui_manifest_invalid' }
          Copy-Item -Recurse -Force apps/me2-ui/me2-ui-dist apps/metaengine-browser/me2-ui-dist
          node apps/metaengine-browser/scripts/verify-me2-ui-bundle.mjs --root apps/metaengine-browser/me2-ui-dist --expected-sha $env:ME2_BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'w62_staged_ui_manifest_invalid' }
      - name: Capture physical Electron R97 screenshot/negative-state evidence in temporary CI
        working-directory: apps/metaengine-browser
        env:
          METAENGINE_R85_VISUAL_EVIDENCE_DIR: ${{ runner.temp }}\client-w69-r97-evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check test/me2-r85-visual-evidence.mjs
          if ($LASTEXITCODE -ne 0) { throw 'w62_r97_harness_parse_failed' }
          New-Item -ItemType Directory -Force -Path $env:METAENGINE_R85_VISUAL_EVIDENCE_DIR | Out-Null
          $electron = (Resolve-Path '.\\node_modules\\electron\\dist\\electron.exe').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'w62-r97.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'w62-r97.stderr.log'
          $process = Start-Process -FilePath $electron -ArgumentList '.\\test\\me2-r85-visual-evidence.mjs' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null = $process.Handle
          if (-not $process.WaitForExit(135000)) {
            cmd.exe /d /c "taskkill.exe /PID $($process.Id) /T /F >nul 2>&1 & exit /b 0" | Out-Null
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'w62_r97_timeout'
          }
          $process.WaitForExit()
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "w62_r97_visual_exit_$($process.ExitCode)" }
          $json = Join-Path $env:METAENGINE_R85_VISUAL_EVIDENCE_DIR 'r85-visual-evidence.json'
          if (-not (Test-Path $json -PathType Leaf)) { throw 'w62_r97_receipt_missing' }
          $evidence = Get-Content $json -Raw | ConvertFrom-Json
          if ($evidence.schema -ne 'metaengine.browser.r97-visual-evidence.v1' -or $evidence.source_head -ne $env:ME2_BUILD_SHA) { throw 'w62_r97_receipt_source_drift' }
          foreach ($key in @('primary_me2_ui_captured','remote_browser_transport_blocked','exact_main_workspace','advanced_surfaces_settings_only','command_search_available','command_palette_legibility_verified','command_palette_focus_verified','native_geometry_verified','narrow_agent_picker_verified','goal_status_focus_verified','settings_routes_verified','settings_loading_bounded','connected_not_ready_verified','positive_readiness_verified','paused_readiness_verified','stale_readiness_cleared','selection_fail_closed','ime_submission_guard_verified','goal_submit_once_verified','presentation_only')) {
            if ($evidence.$key -ne $true) { throw "w62_r97_negative_or_visual_gate_failed:$key" }
          }
          if ($evidence.ok -ne $true) { throw 'w69_r97_visual_not_complete' }
          if ($evidence.legacy_shell_captured -ne $false -or $evidence.remote_browser_content_captured -ne $false -or $evidence.authority_effect -ne $false) { throw 'w62_r97_authority_leak' }
          if (-not (@($evidence.blocked_remote_browser_ports) -contains '3042') -or -not (@($evidence.blocked_remote_browser_ports) -contains '3043')) { throw 'w62_r97_remote_port_fence_missing' }
      - name: Check every captured screenshot digest and exact source head
        shell: pwsh
        env:
          METAENGINE_R85_VISUAL_EVIDENCE_DIR: ${{ runner.temp }}\client-w69-r97-evidence
        run: |
          node apps/metaengine-browser/scripts/verify-r97-visual-captures-w69.mjs $env:METAENGINE_R85_VISUAL_EVIDENCE_DIR $env:ME2_BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'w69_r97_screenshot_integrity_failed' }
      - name: Preserve CI-only R97 receipt and screenshots, even when red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w69-r97-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\client-w69-r97-evidence\*.png
            ${{ runner.temp }}\client-w69-r97-evidence\r85-visual-evidence.json
          if-no-files-found: ignore
          retention-days: 7
