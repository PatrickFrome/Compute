name: METAENGINE Browser Final Runtime Activation V1

on:
  push:
    branches:
      - release/self-update-ambiguity-live-v2
      - physical/build-slsa-provenance-v1
  pull_request:
    paths:
      - 'apps/metaengine-browser/src/**'
      - 'apps/metaengine-browser/test/final-runtime-activation-contract.test.mjs'
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/electron-builder.test.json'
      - 'apps/metaengine-browser/scripts/installer-provenance.mjs'
      - 'apps/metaengine-browser/scripts/qualified-installer-consumer.ps1'
      - 'apps/me2-ui/**'
      - 'apps/me2-daemon/**'
      - 'apps/metaengine-browser/scripts/qualify-installed-owner-consumer.mjs'
      - 'apps/metaengine-browser/scripts/qualify-installed-client-launch.mjs'
      - 'apps/metaengine-browser/test/installed-owner-consumer.test.mjs'
      - 'infra/client-state-runtime/**'
      - 'supabase/migrations/**'
      - '.github/workflows/browser-final-runtime-activation-v1.yml'

concurrency:
  group: browser-final-runtime-activation-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  windows-final-runtime-activation:
    # Local runtime qualification requires its own explicitly selected profile.
    if: github.event_name != 'pull_request' || (github.head_ref != 'work/client-owned-state-runtime-v1' && github.head_ref != 'work/client-runtime-restart-singleton-v1' && github.head_ref != 'work/client-restored-pg17-runtime-repair-v1' && github.head_ref != 'work/client-mcp-offline-installer-qualification-v1' && github.head_ref != 'work/client-mcp-db-connect-operator-v1' && github.head_ref != 'work/client-installed-pg17-setup-wizard-v1' && github.head_ref != 'work/client-github-chat-control-v1' && github.head_ref != 'work/client-github-chat-egress-redaction-v1' && github.head_ref != 'work/client-pg17-auto-prepare-durable-v1' && github.head_ref != 'work/client-github-chat-result-egress-v1' && github.head_ref != 'work/client-pg17-private-windows-acl-v1' && github.head_ref != 'work/client-pg17-private-windows-acl-r2-v1' && github.head_ref != 'work/client-pg17-private-windows-acl-r3-v1' && github.head_ref != 'work/client-pg17-private-windows-acl-r4-v1' && github.head_ref != 'work/client-autonomous-continuity-v1')
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'

      - name: Install Browser dependencies
        working-directory: apps/metaengine-browser
        run: npm ci --no-audit --no-fund

      - name: Install frozen disposable runtime fixture dependency
        working-directory: infra/client-state-runtime
        run: npm ci --no-audit --no-fund
      - name: Parse activation and proven Browser sources
        working-directory: apps/metaengine-browser
        run: npm run check

      - name: Prove activation contract and VEF fail-closed semantics
        working-directory: apps/metaengine-browser
        run: node --test test/final-runtime-activation-contract.test.mjs test/installed-owner-consumer.test.mjs

      - name: Acquire provenanced exact-head installer from Package Smoke
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          ME2_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = '${{ github.event.pull_request.head.sha || github.sha }}'
          $bindingPath = "$env:RUNNER_TEMP\provenanced-installer\consumer-binding.json"
          .\scripts\qualified-installer-consumer.ps1 -Mode Acquire -ExpectedHead $expectedHead -WorkRoot "$env:RUNNER_TEMP\provenanced-installer" -ConfigPath (Join-Path (Get-Location) 'electron-builder.test.json') -BindingPath $bindingPath
          if ($LASTEXITCODE -ne 0) { throw 'qualified_installer_consumer_acquire_failed' }
          $binding = Get-Content $bindingPath -Raw | ConvertFrom-Json
          if ($binding.schema -ne 'metaengine.browser.qualified-installer-consumer-binding.v1') { throw 'qualified_installer_consumer_binding_invalid' }
          Add-Content -Path $env:GITHUB_ENV -Value "ME2_INSTALLER_BINDING_PATH=$bindingPath" -Encoding utf8
          $installer = Get-Item ([string]$binding.installer_path)
          if (-not $installer) { throw 'final_runtime_installer_missing' }
          Copy-Item $installer.FullName "$env:RUNNER_TEMP\$($installer.Name)"
          Copy-Item $installer.FullName "$env:RUNNER_TEMP\final-runtime-candidate.exe"

      - name: Install and prove all Final runtime modules READY
        working-directory: infra/client-state-runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\final-runtime-candidate.exe"
          $binding = Get-Content $env:ME2_INSTALLER_BINDING_PATH -Raw | ConvertFrom-Json
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$binding.installer_sha256) { throw 'final_runtime_installer_binding_changed' }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "final_runtime_installer_exit_$($install.ExitCode)" }
          $ErrorActionPreference = 'Stop'
          $head = '${{ github.event.pull_request.head.sha || github.sha }}'
          $version = [string](node -p "require('../../apps/metaengine-browser/package.json').version")
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test'
          $bundle = Join-Path $installRoot 'resources\client-state-runtime'
          $manifest = Get-Content (Join-Path $bundle 'offline-runtime-bundle.json') -Raw | ConvertFrom-Json
          $bundleSha = [string]$manifest.bundle_sha256
          if ($bundleSha -notmatch '^[a-f0-9]{64}$') { throw 'owner_consumer_bundle_digest_invalid' }
          # Every run generates empty schema from reviewed source on a NEW cluster.
          # No user Keeper, Owner, credential file or profile is imported.
          $nodeTemp = (node -p "require('node:os').tmpdir()").Trim()
          if (-not [IO.Path]::IsPathRooted($nodeTemp)) { throw 'owner_consumer_os_temp_invalid' }
          $schema = Join-Path $nodeTemp ('owner-consumer-schema-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $schema -ErrorAction Stop | Out-Null
          $evidence = Join-Path $env:RUNNER_TEMP ('owner-consumer-evidence-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $env:LOCAL_STATE_TEST_ATTACHED_BUNDLE_DIRECTORY = $bundle
          $env:LOCAL_STATE_TEST_ATTACHED_BUNDLE_SHA256 = $bundleSha
          $env:LOCAL_STATE_TEST_PROJECT_PG_BIN_DIR = Join-Path $bundle 'runtime/postgresql/bin'
          $env:LOCAL_STATE_TEST_GENERATED_SCHEMA_DIRECTORY = $schema
          npm run test:attached-onboarding
          if ($LASTEXITCODE -ne 0) { throw 'owner_consumer_generated_schema_failed' }
          $dump = Join-Path $schema 'generated-empty-schema-pg17.dump'
          $schemaSha = (Get-Content (Join-Path $schema 'generated-empty-schema-pg17.sha256') -Raw).Trim()
          if ($schemaSha -notmatch '^[a-f0-9]{64}$' -or $schemaSha -ne (Get-FileHash $dump -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'owner_consumer_schema_pin_drift' }
          $env:LOCAL_STATE_TEST_ATTACHED_SCHEMA_DUMP = $dump
          $env:LOCAL_STATE_TEST_ATTACHED_SCHEMA_DUMP_SHA256 = $schemaSha
          $env:LOCAL_STATE_TEST_ATTACHED_INSTALL_ROOT = $installRoot
          $env:LOCAL_STATE_TEST_ATTACHED_INSTALL_SOURCE_HEAD = $head
          $env:LOCAL_STATE_TEST_ATTACHED_INSTALL_VERSION = $version
          $env:LOCAL_STATE_TEST_ATTACHED_INSTALL_EVIDENCE_DIRECTORY = $evidence
          $env:LOCAL_STATE_TEST_ATTACHED_CONSUMER = 'FINAL_RUNTIME_ACTIVATION'
          node --test --test-concurrency=1 attached-bundled-runtime.integration.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'owner_consumer_physical_qualification_failed' }
          $positive = Get-Content (Join-Path $evidence 'installed-owner-consumer-proof.json') -Raw | ConvertFrom-Json
          if ($positive.schema -ne 'metaengine.browser.installed-owner-consumer-proof.v1' -or $positive.state -ne 'PASSED_ISOLATED_REAL_RUNTIME' -or $positive.consumer -ne 'FINAL_RUNTIME_ACTIVATION' -or $positive.source_head -ne $head -or $positive.package_version -ne $version -or $positive.bundle_sha256 -ne $bundleSha -or $positive.disposable_pg_cleanup_confirmed -ne $true -or $positive.fixture_directory_removed -ne $true -or $positive.process_cleanup_confirmed -ne $true -or $positive.runtime_ports_closed -ne $true -or $positive.attached_postgres_incarnation_preserved -ne $true -or $positive.installed_source_bytes_verified -ne $true -or $positive.live_agent_execution -ne $false -or $positive.production_ready -ne $false -or $positive.authority_effect -ne $false) { throw 'owner_consumer_receipt_invalid' }
          $binding = Get-Content $env:ME2_INSTALLER_BINDING_PATH -Raw | ConvertFrom-Json
          $proof = @{
            schema='metaengine.browser.final-runtime-activation-proof.v1'
            source_head=$head
            package_version=$version
            installer_sha256=[string]$binding.installer_sha256
            producer_run_id=[int64]$binding.producer_run_id
            producer_run_number=[int64]$binding.producer_run_number
            producer_run_attempt=[int64]$binding.producer_run_attempt
            producer_event=[string]$binding.producer_event
            producer_completed_at_acquire=[bool]$binding.producer_completed_at_acquire
            producer_terminal_success=$false
            owner_consumer=$positive
            schema_archive_sha256=$schemaSha
            generated_schema_owner_qualified=$true
            fixture_disposable_pg_cleanup_confirmed=$true
            live_agent_execution=$false
            production_ready=$false
            promotion_authorized=$false
            automatic_retry_allowed=$false
            authority_effect=$false
          }
          $activation = $positive.activation
          if ($activation.host_agent_state -ne 'READY' -or $activation.signer_state -ne 'READY' -or $activation.fast_control_production_mutation_authority -ne $false -or $activation.authority_effect -ne $false) { throw 'final_runtime_activation_readback_invalid' }
          $proof.activation = $activation
          $proof.exact_head_verified = $true
          $proof.installed_runtime_verified = $positive.real_local_runtime_attested
          $proof.browser_identity_signer_active = ($activation.signer_state -eq 'READY')
          $proof.typed_browser_executor_active = $activation.browser_execution_via_typed_ipc
          $proof.host_agent_active = ($activation.host_agent_state -eq 'READY')
          $proof.verified_execution_framework_active = $activation.verified_execution_outcomes_active
          $proof.fast_control_read_side_active = $activation.fast_control_read_side_active
          $proof.fast_control_production_mutation_authority = $false
          $proof.native_supervisor_single_scheduler = $true
          $proof.second_scheduler = $false
          $proof.signed = $false
          $proof.published = $false
          $proof | ConvertTo-Json -Depth 10 | Set-Content "$env:RUNNER_TEMP\final-runtime-activation-proof.json" -Encoding utf8
      - name: Require bound Package Smoke producer terminal success
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          ME2_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ME2_INSTALLER_BINDING_PATH) { throw 'final_runtime_package_binding_path_missing' }
          .\scripts\qualified-installer-consumer.ps1 -Mode Wait -ExpectedHead '${{ github.event.pull_request.head.sha || github.sha }}' -BindingPath $env:ME2_INSTALLER_BINDING_PATH -ProofPath "$env:RUNNER_TEMP\final-runtime-activation-proof.json"
          if ($LASTEXITCODE -ne 0) { throw 'final_runtime_package_producer_not_qualified' }

      - name: Upload exact-head activated Windows installer and proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-final-runtime-activated-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/METAENGINE-Browser-Test-Setup-*-x64.exe
            ${{ runner.temp }}/final-runtime-activation-proof.json
            ${{ runner.temp }}/final-runtime-normal.out
            ${{ runner.temp }}/final-runtime-normal.err
            ${{ runner.temp }}/owner-consumer-evidence-*/installed-launch-progress.json
            ${{ runner.temp }}/owner-consumer-evidence-*/installed-launch-failure.json
          if-no-files-found: error
          retention-days: 30
