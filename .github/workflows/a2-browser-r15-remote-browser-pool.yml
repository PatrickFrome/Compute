name: A2 Browser R15 Remote Browser Pool

on:
  push:
    branches:
      - work/a2-browser-r15-remote-browser-pool
    paths:
      - 'coordination/browser-shared/remote-browser-pool-v1.mjs'
      - 'tests/a2_r15_*.test.mjs'
      - 'research/A2_BROWSER_R15_**'
      - '.github/workflows/a2-browser-r15-remote-browser-pool.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  r15-pool-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact R14 parent and source boundary
        shell: bash
        run: |
          set -euo pipefail
          PARENT=3b92715ef9f3a9a087cdb495191d05f2a0c1f10f
          git merge-base --is-ancestor "$PARENT" "$GITHUB_SHA"
          git diff --name-only "$PARENT" "$GITHUB_SHA" | tee "$RUNNER_TEMP/r15-changed-files.txt"
          if git diff --name-only "$PARENT" "$GITHUB_SHA" | grep -Eq '(^|/)(package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.(toml|lock))$'; then
            echo 'R15 must add no source dependency packages' >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Static pool authority and determinism boundary
        shell: bash
        run: |
          set -euo pipefail
          FILE=coordination/browser-shared/remote-browser-pool-v1.mjs
          node --check "$FILE"
          ! grep -Eq 'chrome\.|Input\.dispatch|Runtime\.evaluate|fetch\(|WebSocket|child_process|exec\(|eval\(' "$FILE"
          ! grep -q 'localeCompare' "$FILE"
          grep -q 'raw_engine_exposed===false' "$FILE"
          grep -q 'context_isolation===true' "$FILE"
          grep -q 'automatic_retry_allowed:false' "$FILE"
          grep -q 'pool_dispatch_incarnation_mismatch' "$FILE"
          grep -q "health==='UNHEALTHY'" "$FILE"
          grep -q "\['HEALTHY','DRAINING'\]" "$FILE"

      - name: R15 adversarial pool tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/a2_r15_*.test.mjs

      - name: R14 through R8 regression fence
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/a2_r14_*.test.mjs tests/a2_r13_*.test.mjs tests/a2_r12_*.test.mjs tests/a2_r11_*.test.mjs tests/a2_r10_*.test.mjs tests/a2_r9_*.test.mjs
          node --test tests/a2_r8a_*.test.mjs tests/a2_r8b_*.test.mjs tests/a2_r8c_*.test.mjs tests/a2_r8d_*.test.mjs

      - name: Build deterministic R15 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist/a2-browser-r15
          mkdir -p "$OUT/evidence"
          cp "$RUNNER_TEMP/r15-changed-files.txt" "$OUT/evidence/R15_CHANGED_FILES.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/evidence/SOURCE_COMMIT.txt"
          printf '%s\n' '3b92715ef9f3a9a087cdb495191d05f2a0c1f10f' > "$OUT/evidence/PARENT_R14_COMMIT.txt"
          cat > "$OUT/evidence/R15_CLAIMS.json" <<'JSON'
          {"milestone":"R15_REMOTE_BROWSER_POOL","one_resource_one_lease":true,"exact_incarnation_binding":true,"context_isolation_required":true,"raw_engine_exposed_eligible":false,"node_loss_post_effect":"AMBIGUOUS","automatic_retry":false,"auth_state_migration":false,"graceful_drain_preserves_existing":true,"draining_accepts_new_leases":false,"deterministic_tie_break":true,"browser_authority":false,"new_source_dependency_packages":0}
          JSON
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf "$OUT/A2_BROWSER_R15_REMOTE_POOL.tar" \
            coordination/browser-shared/remote-browser-pool-v1.mjs \
            tests/a2_r15_*.test.mjs \
            research/A2_BROWSER_R15_REMOTE_BROWSER_POOL_PRE_RESEARCH_2026-08-29.md \
            research/A2_BROWSER_R15_REMOTE_BROWSER_POOL_POST_RESEARCH_2026-08-29.md \
            "$OUT/evidence"
          sha256sum "$OUT/A2_BROWSER_R15_REMOTE_POOL.tar" > "$OUT/R15_SHA256SUMS.txt"

      - name: Attest R15 evidence
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/a2-browser-r15/A2_BROWSER_R15_REMOTE_POOL.tar

      - name: Upload R15 evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: a2-browser-r15-${{ github.sha }}
          path: |
            dist/a2-browser-r15/A2_BROWSER_R15_REMOTE_POOL.tar
            dist/a2-browser-r15/R15_SHA256SUMS.txt
            dist/a2-browser-r15/evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
