name: Client Live Mechanics Recovery
on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/**'
      - 'coordination/client-v1/edge/**'
      - 'coordination/client-v1/sql/qualification/**'
      - 'supabase/migrations/*cognitive*'
      - 'supabase/migrations/*readonly_issuer_parity*'
      - 'supabase/migrations/*claim_class_preservation*'
      - 'supabase/migrations/*native_device_transport_bootstrap*'
      - '.github/workflows/client-live-mechanics-recovery-v1.yml'
      - '.github/browser-ci-resource-observation.mjs'
      - '.github/windows-native-read-observation.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-mechanics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # Controlled diagnostic budget: 10-minute Windows-only probe plus the
    # existing 20-minute full suite and setup headroom. No contention claim.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 35 || 20 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install locked Browser dependencies
        working-directory: apps/metaengine-browser
        run: npm ci --no-audit --no-fund
      - name: Build the native job helper before Windows runtime contracts
        if: runner.os == 'Windows'
        working-directory: apps/metaengine-browser
        run: node scripts/prepare-codex-cli-job-runtime.mjs
      - name: Provision locked official Electron before timed Windows qualification
        if: runner.os == 'Windows'
        working-directory: apps/metaengine-browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = Join-Path $env:RUNNER_TEMP 'qualified-electron-runtime.json'
          node scripts/qualified-electron-runtime.mjs --out $receiptPath
          if ($LASTEXITCODE -ne 0) { throw 'qualification_electron_materialization_failed' }
          $runtime = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($runtime.schema -ne 'metaengine.browser.qualified-electron-runtime.v1' `
              -or $runtime.package_version -ne '44.0.0' `
              -or $runtime.binary_sha256 -notmatch '^[a-f0-9]{64}$' `
              -or $runtime.authority_effect -ne $false) { throw 'qualification_electron_receipt_invalid' }
          $productVersion = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($runtime.executable).ProductVersion).Trim()
          # Electron 44 RC string version is 44.0.0; its fixed numeric revision is 0.
          if ($productVersion -notmatch '^44\.0\.0(?:\.0)?$') {
            throw 'qualification_electron_product_version_drift'
          }
          $version = [version]$productVersion
          if ($version.Major -ne 44 -or $version.Minor -ne 0 -or $version.Build -ne 0 `
              -or $version.Revision -notin @(-1, 0)) {
            throw 'qualification_electron_product_version_drift'
          }
          if (((Get-FileHash -Algorithm SHA256 -LiteralPath $runtime.executable).Hash).ToLowerInvariant() -ne $runtime.binary_sha256) {
            throw 'qualification_electron_binary_changed'
          }
      - name: Prove the prior installed wiring stalls behind advisory capture
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          idle_proof_source=src/idle-progress-predecessor-proof.mjs
          idle_proof_log="$RUNNER_TEMP/idle-progress-predecessor-proof.log"
          trap 'rm -f "$idle_proof_source"' EXIT
          git show 45d73aa24b852d9de93e9af9c62808e65136c33b:apps/metaengine-browser/src/native-supervisor-client-core-base.mjs > "$idle_proof_source"
          set +e
          METAENGINE_IDLE_PROGRESS_SUBJECT=../src/idle-progress-predecessor-proof.mjs node --test --test-name-pattern="slow advisory capture cannot starve" test/native-supervisor-idle-progress.test.mjs > "$idle_proof_log" 2>&1
          idle_proof_status=$?
          set -e
          cat "$idle_proof_log"
          test "$idle_proof_status" = 1
          node --input-type=module -e 'import fs from "node:fs"; if (!fs.readFileSync(process.argv[1], "utf8").includes("DevOS must progress before an advisory CAPTURE settles")) process.exit(1)' "$idle_proof_log"
          rm -f "$idle_proof_source"
      - name: Parse runtime contracts
        id: qualification_prerequisites
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --test test/live-mechanics-native-probe-workflow.test.mjs
          node --test test/windows-native-read-observation.test.mjs
      - name: Isolated Windows native diagnostic (not contention proof)
        id: windows_native_probe
        if: runner.os == 'Windows'
        timeout-minutes: 10
        working-directory: apps/metaengine-browser
        shell: bash
        env:
          NATIVE_PROBE_LOG: ${{ runner.temp }}/windows-native-probe-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.log
        run: |
          set -euo pipefail
          node ../../.github/browser-ci-resource-observation.mjs isolated-windows-native 2>&1 | tee "$NATIVE_PROBE_LOG"
          node --test --test-concurrency=1 \
            test/codex-cli-runner.test.mjs \
            test/codex-cli-sandbox-probe.test.mjs \
            test/native-coding-host-observers.test.mjs \
            test/windows-local-computer-executor.test.mjs \
            test/codex-cli-windows-output-order.test.mjs \
            test/codex-cli-windows-job-birth-physical.test.mjs \
            2>&1 | tee -a "$NATIVE_PROBE_LOG"
      - name: Publish isolated Windows native diagnostic before the full suite
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.windows_native_probe.outcome == 'success' || steps.windows_native_probe.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-probe-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-native-probe-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.log
          if-no-files-found: error
      - name: Exercise all Browser mechanics including real local IPC
        # Explicit status function retains full coverage after a failed/timed-out
        # probe. That failure still fails this job; cancellation remains honored.
        if: ${{ !cancelled() && steps.qualification_prerequisites.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: apps/metaengine-browser
        shell: bash
        # Only Linux selects the filesystem-only Electron mode; Windows keeps
        # real main-process ASAR qualification and the suite concurrency intact.
        env:
          METAENGINE_TEST_ELECTRON_MODE: ${{ matrix.os == 'ubuntu-24.04' && 'ASAR_NODE' || 'MAIN_PROCESS' }}
        run: |
          set -euo pipefail
          node ../../.github/browser-ci-resource-observation.mjs full-browser-suite
          node --test --test-concurrency=4 'test/*.test.mjs'
      - name: Observe failed Windows native reads without replacing qualification
        # Read-only timing evidence with a separate diagnostic ceiling. The
        # original failed probe remains failed; no production timeout changes.
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_native_probe.outcome == 'failure' }}
        timeout-minutes: 3
        run: node .github/windows-native-read-observation.mjs
      - name: Inspect generated artifacts and prove tracked source unchanged
        if: ${{ !cancelled() && steps.qualification_prerequisites.outcome == 'success' }}
        shell: bash
        run: |
          git status --porcelain=v1 --untracked-files=all
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- apps/metaengine-browser/src apps/metaengine-browser/native apps/metaengine-browser/scripts)"

  cognitive-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.11@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
        env:
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qualification"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: qualification-only
      PGDATABASE: qualification
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Qualify real PostgreSQL contracts
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f coordination/client-v1/sql/qualification/COGNITIVE_ACCEPTOR_FIXTURE_V1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007061415_cognitive_delta_live_acceptor_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007062908_cognitive_broadcast_correlation_readback_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007063940_cognitive_durable_latest_batch_v1.sql
          psql -v ON_ERROR_STOP=1 -f coordination/client-v1/sql/qualification/COGNITIVE_ACCEPTOR_QUALIFICATION_V1.sql
          psql -v ON_ERROR_STOP=1 -f coordination/client-v1/sql/qualification/NATIVE_READONLY_ISSUER_FIXTURE_V1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007061807_native_supervisor_readonly_issuer_parity_v1.sql
          psql -v ON_ERROR_STOP=1 -f coordination/client-v1/sql/qualification/NATIVE_READONLY_ISSUER_QUALIFICATION_V1.sql
          psql -v ON_ERROR_STOP=1 -f coordination/client-v1/sql/qualification/NATIVE_DEVICE_BOOTSTRAP_FIXTURE_V1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007101028_native_device_transport_bootstrap_v1.sql
          psql -v ON_ERROR_STOP=1 -f coordination/client-v1/sql/qualification/NATIVE_DEVICE_BOOTSTRAP_QUALIFICATION_V1.sql
