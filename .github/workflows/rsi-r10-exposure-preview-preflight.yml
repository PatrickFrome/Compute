name: RSI R10 Exposure Preview Preflight

on:
  push:
    branches:
      - 'work/browser-final-2026-convergence-rsi-r10-runtime-exposure-preview-v1'

permissions:
  contents: read

concurrency:
  group: rsi-r10-exposure-preview-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exposure-preview-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Run focused RSI R10 zero-effect tests
        working-directory: apps/metaengine-browser
        run: node --test test/rsi-runtime-skill-lifecycle.test.mjs test/rsi-exploration-graduation-hold.test.mjs test/rsi-skill-exposure-release-transition-proof.test.mjs
