name: AOP1 live deploy

on:
  push:
    branches:
      - "work/aop1-autonomous-orchestration"
    paths:
      - "orchestration/cloudflare/**"
      - ".github/workflows/aop1-live-deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aop1-live-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Exchange GitHub OIDC for deploy-only Cloudflare capability
        shell: bash
        env:
          BROKER_URL: https://xpeibufgzjknrhbhpffp.supabase.co/functions/v1/metaengine-aop1-github-oidc-deploy-h205f22
        run: |
          set -euo pipefail
          oidc="$(curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=metaengine-h205f22-aop1-deploy" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != "null"
          code="$(curl --silent --show-error \
            -X POST "$BROKER_URL" \
            -H "Authorization: Bearer $oidc" \
            -H 'Content-Type: application/json' \
            -o /tmp/aop1-deploy-bundle.json \
            -w '%{http_code}')"
          if [ "$code" != "200" ]; then
            reason="$(jq -r '.error // "deploy_exchange_denied"' /tmp/aop1-deploy-bundle.json 2>/dev/null || printf '%s' deploy_exchange_denied)"
            echo "AOP1 deploy exchange denied: $reason" >&2
            rm -f /tmp/aop1-deploy-bundle.json
            exit 1
          fi
          jq -e --arg sha "$GITHUB_SHA" '
            .schema == "metaengine.compute.aop1-deploy-bundle.h205f22.v1"
            and .oidc_exchange_one_time == true
            and .github_sha == $sha
            and .authority_effect == false
            and (.bundle.vercel_ai_gateway_api_key_sha256 | test("^[0-9a-f]{64}$"))
          ' /tmp/aop1-deploy-bundle.json >/dev/null
          cf_token="$(jq -r '.bundle.cloudflare_api_token' /tmp/aop1-deploy-bundle.json)"
          cf_account="$(jq -r '.bundle.cloudflare_account_id' /tmp/aop1-deploy-bundle.json)"
          vercel_gateway_key="$(jq -r '.bundle.vercel_ai_gateway_api_key' /tmp/aop1-deploy-bundle.json)"
          vercel_gateway_sha="$(jq -r '.bundle.vercel_ai_gateway_api_key_sha256' /tmp/aop1-deploy-bundle.json)"
          test -n "$cf_token" && test "$cf_token" != "null"
          test "$cf_account" != "null"
          test -n "$vercel_gateway_key" && test "$vercel_gateway_key" != "null"
          echo "::add-mask::$cf_token"
          echo "::add-mask::$cf_account"
          echo "::add-mask::$vercel_gateway_key"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$cf_token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$cf_account" >> "$GITHUB_ENV"
          printf 'VERCEL_AI_GATEWAY_API_KEY=%s\n' "$vercel_gateway_key" >> "$GITHUB_ENV"
          printf 'VERCEL_AI_GATEWAY_API_KEY_SHA256=%s\n' "$vercel_gateway_sha" >> "$GITHUB_ENV"
          rm -f /tmp/aop1-deploy-bundle.json
          unset oidc cf_token cf_account vercel_gateway_key vercel_gateway_sha

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Wrangler toolchain
        working-directory: orchestration/cloudflare
        run: npm install --no-audit --no-fund

      - name: Provision required Queues idempotently
        working-directory: orchestration/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          for queue in metaengine-h205f22-aop-wake metaengine-h205f22-aop-dlq; do
            if npx wrangler queues info "$queue" >/dev/null 2>&1; then
              echo "Queue exists: $queue"
            else
              echo "Creating queue: $queue"
              npx wrangler queues create "$queue"
            fi
          done

      - name: Install Vercel AI Gateway key as Worker secret
        working-directory: orchestration/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_AI_GATEWAY_API_KEY"
          printf '%s' "$VERCEL_AI_GATEWAY_API_KEY" | npx wrangler secret put VERCEL_AI_GATEWAY_API_KEY
          echo "Vercel AI Gateway Worker secret installed; expected sha256=$VERCEL_AI_GATEWAY_API_KEY_SHA256"

      - name: Deploy Worker with Vercel duel rail configured
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: orchestration/cloudflare
          wranglerVersion: "4.125.0"
          command: deploy

      - name: Drop deploy and gateway capabilities from subsequent step environments
        shell: bash
        run: |
          printf 'CLOUDFLARE_API_TOKEN=\nCLOUDFLARE_ACCOUNT_ID=\nVERCEL_AI_GATEWAY_API_KEY=\n' >> "$GITHUB_ENV"

      - name: Resolve deployment URL and verify orchestration health
        id: health
        shell: bash
        env:
          RAW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          url="$(printf '%s' "$RAW_DEPLOYMENT_URL" | awk '{print $1}')"
          if [ -z "$url" ]; then
            echo "Deployment URL missing from wrangler-action output" >&2
            exit 1
          fi
          case "$url" in http://*|https://*) ;; *) url="https://$url" ;; esac
          url="${url%/}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          converged=false
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 20 "$url/health" -o /tmp/aop1-health.json \
              && jq -e '
                .status == "ok"
                and .executor_configured == true
                and .duel_executor_configured == true
                and .duel_vercel_rail_configured == true
                and .duel_protocol == "MICROSTEP_LOCKSTEP_V2"
                and .duel_transport == "DB_WEBHOOK+DIRECT_IDEMPOTENT_WORKFLOW+ATOMIC_DB_PAIR+DUAL_RAIL_RACE"
                and .duel_start_path == "DIRECT_WORKFLOW_CREATE_BATCH_NO_QUEUE_NO_DO"
                and .duel_hot_path_readback == "LEASE_THEN_DB_SELECTED_PAIR_RECEIPT"
                and .duel_latency_policy == "FIRST_VALID_EXACT_MODEL_RESPONSE_WINS"
                and .duel_critical_shadow_ms == 0
                and .supervisor_capability_configured == true
                and .github_configured == false
                and .github_auth_mode == "none"
                and .snapshot.invariant == "NO_MANUAL_HANDOFF_V1"
              ' /tmp/aop1-health.json >/dev/null; then
              converged=true
              break
            fi
            sleep 2
          done
          if [ "$converged" != "true" ]; then
            echo "AOP1 health endpoint never converged to exact deployed invariants" >&2
            cat /tmp/aop1-health.json >&2 || true
            exit 1
          fi
          echo "AOP1 live health: PASS; Vercel+Cloudflare zero-wait dual-rail race is configured."

      - name: Register exact live Worker endpoint for database-triggered duel wake
        shell: bash
        env:
          BROKER_URL: https://xpeibufgzjknrhbhpffp.supabase.co/functions/v1/metaengine-aop1-github-oidc-deploy-h205f22
          RUNTIME_URL: ${{ steps.health.outputs.url }}
        run: |
          set -euo pipefail
          url="${RUNTIME_URL%/}"
          oidc="$(curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=metaengine-h205f22-aop1-deploy" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != "null"
          body="$(jq -nc --arg runtime_url "$url" '{action:"register_runtime",runtime_url:$runtime_url}')"
          code="$(curl --silent --show-error \
            -X POST "$BROKER_URL" \
            -H "Authorization: Bearer $oidc" \
            -H 'Content-Type: application/json' \
            --data "$body" \
            -o /tmp/aop1-runtime-registration.json \
            -w '%{http_code}')"
          if [ "$code" != "200" ]; then
            cat /tmp/aop1-runtime-registration.json >&2
            exit 1
          fi
          jq -e --arg url "$url" --arg sha "$GITHUB_SHA" '
            .schema == "metaengine.compute.aop-runtime-endpoint.h205f22.v1"
            and .registered == true
            and .runtime_url == $url
            and .github_sha == $sha
            and .canonical == false
            and .authority_effect == false
          ' /tmp/aop1-runtime-registration.json >/dev/null
          rm -f /tmp/aop1-runtime-registration.json
          unset oidc body
          echo "AOP runtime endpoint registration: PASS. LOCKSTEP_V2 inserts trigger the direct idempotent Workflow path without cron/Queue/DO hot-path hops."

      - name: Record delivery boundary
        run: |
          echo "AOP1 deploy complete. Normal duel start: DB event -> pg_net -> signed Worker endpoint -> idempotent Workflow binding; inference: Vercel and Cloudflare race per exact model slot, first valid response wins."
