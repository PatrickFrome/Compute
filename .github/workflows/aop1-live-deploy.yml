name: AOP1 live deploy

on:
  push:
    branches:
      - "work/aop1-autonomous-orchestration"
    paths:
      - "orchestration/cloudflare/**"
      - ".github/workflows/aop1-live-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aop1-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Detect one-time Cloudflare capability
        id: capability
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AOP1_SUPABASE_SERVICE_ROLE_KEY }}
          AOP_SUPERVISOR_TOKEN: ${{ secrets.AOP1_SUPERVISOR_TOKEN }}
          AOP_GITHUB_TOKEN: ${{ secrets.AOP1_GITHUB_TOKEN }}
          CF_AI_TOKEN: ${{ secrets.AOP1_CF_AI_TOKEN }}
          AOP_WAKE_SECRET: ${{ secrets.AOP1_WAKE_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SERVICE_ROLE_KEY AOP_SUPERVISOR_TOKEN AOP_GITHUB_TOKEN CF_AI_TOKEN AOP_WAKE_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::AOP1 live deployment capability is incomplete: ${name} is not configured."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AOP1 remains NOT_LIVE_DEPLOYED; code/CI validation continues independently."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.capability.outputs.configured == 'true'
        with:
          node-version: "22"

      - name: Install pinned Wrangler toolchain
        if: steps.capability.outputs.configured == 'true'
        working-directory: orchestration/cloudflare
        run: npm install --no-audit --no-fund

      - name: Provision required Queues idempotently
        if: steps.capability.outputs.configured == 'true'
        working-directory: orchestration/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for queue in metaengine-h205f22-aop-wake metaengine-h205f22-aop-dlq; do
            if npx wrangler queues info "$queue" >/dev/null 2>&1; then
              echo "Queue exists: $queue"
            else
              echo "Creating queue: $queue"
              npx wrangler queues create "$queue"
            fi
          done

      - name: Deploy Worker and upload runtime secrets
        if: steps.capability.outputs.configured == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: orchestration/cloudflare
          wranglerVersion: "4.125.0"
          command: deploy
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            AOP_WAKE_SECRET
            AOP_SUPERVISOR_TOKEN
            GITHUB_TOKEN
            CF_ACCOUNT_ID
            CF_AI_TOKEN
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AOP1_SUPABASE_SERVICE_ROLE_KEY }}
          AOP_WAKE_SECRET: ${{ secrets.AOP1_WAKE_SECRET }}
          AOP_SUPERVISOR_TOKEN: ${{ secrets.AOP1_SUPERVISOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AOP1_GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.AOP1_CF_AI_TOKEN }}

      - name: Resolve deployment URL and verify health
        if: steps.capability.outputs.configured == 'true'
        id: health
        shell: bash
        env:
          RAW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          url="$(printf '%s' "$RAW_DEPLOYMENT_URL" | awk '{print $1}')"
          if [ -z "$url" ]; then
            echo "Deployment URL missing from wrangler-action output" >&2
            exit 1
          fi
          case "$url" in
            http://*|https://*) ;;
            *) url="https://$url" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 20 "$url/health" -o /tmp/aop1-health.json; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "AOP1 health endpoint did not become ready" >&2
              exit 1
            fi
            sleep 5
          done
          jq -e '
            .status == "ok"
            and .executor_configured == true
            and .github_configured == true
            and .supervisor_capability_configured == true
            and .snapshot.invariant == "NO_MANUAL_HANDOFF_V1"
          ' /tmp/aop1-health.json >/dev/null
          echo "AOP1 live health canary: PASS"

      - name: Send authenticated autonomous wake
        if: steps.capability.outputs.configured == 'true'
        shell: bash
        env:
          AOP1_URL: ${{ steps.health.outputs.url }}
          AOP_WAKE_SECRET: ${{ secrets.AOP1_WAKE_SECRET }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/aop1-wake.json --write-out '%{http_code}' \
            -X POST "$AOP1_URL/wake" \
            -H "Authorization: Bearer $AOP_WAKE_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"reason":"LIVE_DEPLOY_ACTIVATION","source":"github-actions","payload":{"invariant":"NO_MANUAL_HANDOFF_V1"}}')"
          test "$code" = "202"
          jq -e '.accepted == true and .wake.reason == "LIVE_DEPLOY_ACTIVATION"' /tmp/aop1-wake.json >/dev/null
          echo "AOP1 live wake canary: ACCEPTED"

      - name: Truth boundary when capability is absent
        if: steps.capability.outputs.configured != 'true'
        run: |
          echo "CONTROL_PLANE_IMPLEMENTED / CLOUDFLARE_RUNTIME_CODE_READY / NOT_LIVE_DEPLOYED"
