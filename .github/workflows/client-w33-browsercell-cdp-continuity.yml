name: METAENGINE Client W33 BrowserCell CDP Continuity

on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/src/browsercell-cdp-continuity-readback.mjs'
      - 'apps/metaengine-browser/test/browsercell-cdp-continuity-readback.test.mjs'
      - '.github/workflows/client-w33-browsercell-cdp-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-continuity-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout exact source SHA without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fail closed on source SHA drift
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Syntax + focused hermetic continuity tests (no browser, DB or network)
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          node --check src/browsercell-cdp-continuity-readback.mjs
          node --check test/browsercell-cdp-continuity-readback.test.mjs
          node --test test/browsercell-cdp-continuity-readback.test.mjs
      - name: Verify exact checkout unchanged
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
