name: METAENGINE Client W24 Source Identity

on:
  pull_request:
    paths:
      - '.github/workflows/metaengine-client-w24-source-identity.yml'
      - 'apps/metaengine-browser/scripts/client-windows-source-identity.cjs'
      - 'apps/metaengine-browser/scripts/installer-provenance.mjs'
      - 'apps/metaengine-browser/test/client-windows-source-identity.test.mjs'
      - 'apps/metaengine-browser/test/installer-provenance-v3.test.mjs'

permissions:
  contents: read

jobs:
  hermetic-source-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source head (not PR merge ref)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact source SHA
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - name: Setup frozen Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Pure source, provenance and adversarial dependency falsification
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/metaengine-browser/scripts/client-windows-source-identity.cjs
          node --check apps/metaengine-browser/scripts/installer-provenance.mjs
          node --test apps/metaengine-browser/test/client-windows-source-identity.test.mjs apps/metaengine-browser/test/installer-provenance-v3.test.mjs
      - name: Assert no generated tree changes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
