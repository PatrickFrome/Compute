# coordination-digest.yml — PAP-1.3 L2 (housekeeping, not authority clock)
#
# Notification contract (ChatGPT correction accepted): exit-1 does NOT
# guarantee an email (GitHub notifications are user-configurable). The
# durable channel is a labeled GitHub issue, created/updated on attention.
# Cron is off the hour (17 6 * * * = 09:17 Europe/Moscow) because GitHub
# schedules are best-effort and hour-start slots congest.
# Requires repo secrets: SUPABASE_URL, PAP_TRANSPORT_JWT (RLS-scoped
# authenticated JWT — see shared/proposals/glm/pap-transport-rls-v1.md).
# Merge path: ChatGPT PR per PAP-1.3 §5 (GitHub = its channel).

name: coordination-digest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for digest.py when it lands in-repo)
        uses: actions/checkout@v4

      - name: Run coordination zone digest
        id: digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_STORAGE_READ_KEY: ${{ secrets.PAP_TRANSPORT_JWT }}
          BUCKET: computefabric-parallel-glm
        run: |
          set +e
          python3 coordination/coordination-ci/digest.py --strict --out digest.md
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0   # attention state handled by the issue step, not by failure

      - name: Open or update coordination attention issue
        if: steps.digest.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="[PAP] Coordination attention required"
          LABEL="pap-coordination"
          # ensure the label exists (needs issues:write)
          gh label create "$LABEL" --color B60205 \
            --description "PAP coordination zone requires agent attention" \
            --force 2>/dev/null || true
          NUMBER=$(gh issue list --label "$LABEL" --state open \
            --json number --jq '.[0].number' || true)
          BODY_FILE=digest.md
          {
            echo "Auto-generated by coordination-digest workflow at $(date -u +%FT%TZ)."
            echo "Digest details below. This issue replaces unreliable email notifications."
            echo
            cat "$BODY_FILE"
          } > issue-body.md
          if [ -n "${NUMBER:-}" ]; then
            gh issue comment "$NUMBER" --body-file issue-body.md
            gh issue edit "$NUMBER" --title "$TITLE" >/dev/null
          else
            gh issue create --title "$TITLE" --label "$LABEL" \
              --body-file issue-body.md
          fi

      - name: Close stale attention issue (backlog cleared)
        if: steps.digest.outputs.rc != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABEL="pap-coordination"
          NUMBER=$(gh issue list --label "$LABEL" --state open \
            --json number --jq '.[0].number' || true)
          if [ -n "${NUMBER:-}" ]; then
            gh issue comment "$NUMBER" --body \
              "Backlog cleared at $(date -u +%FT%TZ). Closing."
            gh issue close "$NUMBER"
          fi
