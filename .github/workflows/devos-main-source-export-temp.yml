name: DevOS Main Source Patch Temp

on:
  pull_request:
    paths:
      - '.github/workflows/devos-main-source-export-temp.yml'

permissions:
  contents: write

jobs:
  patch-main:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Prove exact remote head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          REMOTE="$(git ls-remote --heads origin "refs/heads/$EXPECTED_BRANCH" | cut -f1)"
          test "$REMOTE" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply deterministic main-process activation wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/metaengine-browser/src/main.mjs')
          text = path.read_text(encoding='utf-8')

          old_import = "import { createDevOSPresentationFocusState } from './metaengine-devos-presentation-focus.mjs';\nimport { projectWorkspaceWorkbench } from './workspace-workbench-projection.mjs';"
          new_import = "import { createDevOSPresentationFocusState } from './metaengine-devos-presentation-focus.mjs';\nimport { applyDevOSPresentationActivation } from './metaengine-devos-presentation-activation-runtime.mjs';\nimport { projectWorkspaceWorkbench } from './workspace-workbench-projection.mjs';"
          if text.count(old_import) != 1:
              raise SystemExit('unexpected presentation import anchor count')
          text = text.replace(old_import, new_import, 1)

          anchor = "async function shellSnapshot() {"
          helpers = """function currentDevOSPresentationProjection() {
            return projectWorkspaceWorkbench({
              tabs: registry.snapshot(),
              fleet: fleet?.snapshot() || null,
              supervisor: nativeSupervisor?.snapshot() || null,
              presentation_focus: devosPresentationFocus.snapshot(),
            }).devos;
          }

          function selectBrowserTabForPresentation(tabId) {
            const id = String(tabId || '');
            const tab = registry.get(id);
            const view = views.get(id);
            if (!tab) throw new Error('tab_not_found');
            if (!view || view.webContents.isDestroyed()) throw new Error('tab_binding_not_live');
            registry.select(id);
            attachSelected();
            invalidatePerception();
            return tab;
          }

          function applyPresentationFocusIntent(request) {
            return applyDevOSPresentationActivation({
              devos: currentDevOSPresentationProjection(),
              request,
              presentationFocus: devosPresentationFocus,
              selectBrowserTab: selectBrowserTabForPresentation,
            });
          }

          """
          if text.count(anchor) != 1:
              raise SystemExit('unexpected shellSnapshot anchor count')
          text = text.replace(anchor, helpers + anchor, 1)

          old_handlers = """ipcMain.handle('metaengine:shell:presentation-focus:select-session', async (event, sessionId) => {
            assertShellSender(event);
            const state = devosPresentationFocus.selectSession(sessionId);
            await publishSnapshot();
            return state;
          });
          ipcMain.handle('metaengine:shell:presentation-focus:select-surface', async (event, sessionId, surfaceId) => {
            assertShellSender(event);
            const state = devosPresentationFocus.selectSurface(sessionId, surfaceId);
            await publishSnapshot();
            return state;
          });"""
          new_handlers = """ipcMain.handle('metaengine:shell:presentation-focus:select-session', async (event, sessionId) => {
            assertShellSender(event);
            const result = applyPresentationFocusIntent({ intent: 'SESSION', session_id: sessionId });
            if (result.applied || result.browser_activation_performed) await publishSnapshot();
            return result;
          });
          ipcMain.handle('metaengine:shell:presentation-focus:select-surface', async (event, sessionId, surfaceId) => {
            assertShellSender(event);
            const result = applyPresentationFocusIntent({ intent: 'SURFACE', session_id: sessionId, surface_id: surfaceId });
            if (result.applied || result.browser_activation_performed) await publishSnapshot();
            return result;
          });"""
          if text.count(old_handlers) != 1:
              raise SystemExit('unexpected presentation handler anchor count')
          text = text.replace(old_handlers, new_handlers, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/devos-main-source-export-temp.yml
          git diff --check
          node --check apps/metaengine-browser/src/main.mjs
          node --test \
            apps/metaengine-browser/test/metaengine-devos-presentation-activation.test.mjs \
            apps/metaengine-browser/test/metaengine-devos-presentation-activation-runtime.test.mjs
          test "$(git status --porcelain=v1 | wc -l | tr -d ' ')" = '2'
          git status --short

      - name: Commit exact wiring and remove patch workflow
        env:
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/metaengine-browser/src/main.mjs .github/workflows/devos-main-source-export-temp.yml
          git commit -m 'feat(browser): wire exact DevOS presentation activation'
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
