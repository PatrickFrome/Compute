name: DevOS Main Source Export Temp

on:
  pull_request:
    paths:
      - '.github/workflows/devos-main-source-export-temp.yml'

permissions:
  contents: read

jobs:
  export-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f apps/metaengine-browser/src/main.mjs

      - name: Export main source only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devos-main-source-${{ github.event.pull_request.head.sha }}
          path: apps/metaengine-browser/src/main.mjs
          if-no-files-found: error
          retention-days: 1
