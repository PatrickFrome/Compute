name: Browser Lockfile Refresh V3 One Shot

on:
  push:
    branches:
      - 'work/build-lockfile-material-v1'
    paths:
      - 'apps/metaengine-browser/package.json'
      - '.github/workflows/browser-lockfile-refresh-v3.yml'

permissions:
  contents: write

concurrency:
  group: browser-lockfile-refresh-v3-one-shot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup frozen Browser toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Regenerate lockfile only under exact npm
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const builder=lock.packages?.['node_modules/electron-builder'];
          if (!builder || builder.version !== '26.15.7') throw new Error('electron_builder_lock_missing_or_wrong');
          const root=lock.packages?.[''];
          if (root?.devDependencies?.['electron-builder'] !== '26.15.7') throw new Error('electron_builder_root_lock_spec_wrong');
          NODE
          node scripts/package-lock-material.mjs --root . --out "$RUNNER_TEMP/package-lock-material.json"

      - name: Prove clean install from refreshed lock without lifecycle effects
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p "require('electron-builder/package.json').version")" = "26.15.7"
          node scripts/dependency-resolution-digest.mjs --out "$RUNNER_TEMP/dependency-resolution.json"

      - name: Commit refreshed lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git add -- apps/metaengine-browser/package-lock.json
          test -z "$(git diff --name-only --cached -- ':!apps/metaengine-browser/package-lock.json')"
          if git diff --cached --quiet; then
            echo "package_lock_already_current=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock electron-builder 26.15.7 toolchain"
          git push origin HEAD:work/build-lockfile-material-v1
