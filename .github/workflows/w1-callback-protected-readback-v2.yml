name: W1 Callback Protected Readback V2 (Legacy Contract Only)

on:
  push:
    branches:
      - work/main-roadmap-accelerators-v12
    paths:
      - "controller/w1/w1_callback_provider_readback_guard_v2.py"
      - "controller/w1/w1_callback_provider_readback_guard.py"
      - "controller/w1/w1_callback_ingress_readiness_guard.py"
      - "tests/test_w1_callback_provider_readback_guard_v2.py"
      - ".github/workflows/w1-callback-protected-readback-v2.yml"
      - ".github/workflows/w1-callback-protected-binding.yml"

permissions: {}

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify legacy v2 is contract-only and run inventory-readback tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile \
            controller/w1/w1_callback_provider_readback_guard_v2.py \
            controller/w1/w1_callback_provider_readback_guard.py \
            controller/w1/w1_callback_ingress_readiness_guard.py
          python3 -m unittest -v tests.test_w1_callback_provider_readback_guard_v2
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('.github/workflows/w1-callback-protected-readback-v2.yml').read_text()
          forbidden=(
              'workflow_'+'dispatch:',
              'id-token:'+' write',
              'secrets.'+'W1_',
              'configure-'+'aws-credentials',
              'ACTIONS_ID_TOKEN_'+'REQUEST',
              'aws sts assume-role-with-'+'web-identity',
              'W1_AWS_OIDC_'+'SUB',
          )
          for token in forbidden:
              assert token not in raw, token
          current=Path('.github/workflows/w1-callback-protected-binding.yml').read_text()
          assert ('workflow_'+'dispatch:') in current
          assert 'actions/oidc/customization/sub' in current
          PY
