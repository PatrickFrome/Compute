name: A1 Zero-Spend Execution Fabric

on:
  pull_request:
    branches: [main]
    paths:
      - 'coordination/execution/**'
      - 'coordination/sync/**'
      - 'coordination/gpt-worker/**'
      - 'coordination/e2b/**'
      - 'tests/a1/**'
      - 'spec/a1/**'
      - 'appveyor.yml'
      - '.github/workflows/a1-zero-spend-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-primary-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      H205F22_EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact comparable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run contract and sync-envelope unit tests
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.a1.test_zero_spend_runner \
            tests.a1.test_cross_provider_verify \
            tests.a1.test_sync_task_runner -v

      - name: Run provider-neutral execution contract
        run: |
          set -euo pipefail
          python3 coordination/execution/zero_spend_runner.py \
            --provider github-actions \
            --output evidence/github-actions-zero-spend.json

      - name: Verify evidence is non-authority and task-bound
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/github-actions-zero-spend.json')
          d=json.loads(p.read_text())
          assert d['provider']['kind']=='github-actions'
          assert d['source']['git_sha']==d['source']['expected_git_sha']
          assert d['source']['expected_git_sha_source']=='H205F22_EXPECTED_GIT_SHA'
          assert d['sync_task']['task_id']=='SYNC-L4.7-001'
          assert d['sync_task']['sync_epoch_sha256']=='5c0a35c4123190251059b0c092becd33d44efa9d7ed2466add650c3569938e4c'
          assert d['authority']['authority_effect'] is False
          assert d['authority']['execution_authority'] is False
          assert d['authority']['persistent_worker_proof'] is False
          assert d['authority']['w1_verified'] is False
          assert all(x['passed'] for x in d['checks'])
          PY

      - name: Upload execution and sync-task evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a1-github-zero-spend-evidence
          path: |
            evidence/github-actions-zero-spend.json
            evidence/sync-task-result.json
          if-no-files-found: error
          retention-days: 30

  cross-provider-readback:
    needs: github-primary-executor
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      H205F22_EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      H205F22_APPVEYOR_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact comparable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reproduce GitHub provider-neutral baseline
        run: |
          set -euo pipefail
          python3 coordination/execution/zero_spend_runner.py \
            --provider github-actions \
            --output evidence/github-readback-baseline.json

      - name: Persisted readback and compare AppVeyor artifact
        run: |
          set -euo pipefail
          python3 coordination/execution/cross_provider_verify.py \
            --github-evidence evidence/github-readback-baseline.json \
            --branch "$H205F22_APPVEYOR_BRANCH" \
            --attempts 60 \
            --interval-seconds 10 \
            --output evidence/cross-provider-readback.json

      - name: Enforce non-authority verification scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/cross-provider-readback.json')
          d=json.loads(p.read_text())
          assert d['evidence_class']=='CROSS_PROVIDER_REPRODUCED_VERIFIED'
          assert d['verification_scope']=='EPHEMERAL_CI_EXECUTION_ONLY'
          assert d['identity_source']=='PERSISTED_APPVEYOR_ARTIFACT_BYTES'
          assert d['providers']==['github-actions','appveyor']
          assert d['authority']['authority_effect'] is False
          assert d['authority']['execution_authority'] is False
          assert d['authority']['persistent_worker_proof'] is False
          assert d['authority']['w1_verified'] is False
          PY

      - name: Upload cross-provider persisted-readback receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a1-cross-provider-readback
          path: evidence/cross-provider-readback.json
          if-no-files-found: error
          retention-days: 30
