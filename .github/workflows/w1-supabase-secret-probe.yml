name: W1 Supabase GitHub Approval Capability Probe

on:
  push:
    branches:
      - ops/w1-env-approval-20260825
    paths:
      - .github/workflows/w1-supabase-secret-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe GitHub user-token presence without reading token values
        env:
          PROBE_NONCE: 'OfzX3Hx6f6nb57kBJtTwxP4NzdUIGRwGKPTcKEHjo8s'
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            -H "x-metaengine-nonce: ${PROBE_NONCE}" \
            -H 'content-type: application/json' \
            'https://xpeibufgzjknrhbhpffp.supabase.co/functions/v1/metaengine-github-approval-probe-h205f22' \
            --data '{}'
