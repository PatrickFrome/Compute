name: W1 Vercel Secret Capability Probe

on:
  push:
    branches: [ops/w1-codespaces-probe-20260825]
    paths:
      - '.github/workflows/w1-vercel-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Invoke nonce-bound Supabase capability probe
        env:
          NONCE: 8714e5c6751c24710f72ee260ca5431550a4bcf6a5959f7900d831c83de01861
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "x-metaengine-nonce: ${NONCE}" \
            -H 'content-type: application/json' \
            'https://xpeibufgzjknrhbhpffp.supabase.co/functions/v1/metaengine-vercel-sandbox-capability-probe-h205f22' \
            | tee result.json
          python3 - <<'PY'
          import json
          x=json.load(open('result.json'))
          assert x.get('ok') is True
          assert x.get('secret_values_returned') is False
          PY
