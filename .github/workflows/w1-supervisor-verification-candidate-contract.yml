name: W1 Supervisor Verification Candidate Contract

on:
  push:
    branches: [work/w1-sandbox-launcher-prep]
    paths:
      - 'controller/w1/w1_supervisor_verification_candidate.py'
      - 'controller/w1/w1_verification_candidate.py'
      - 'controller/w1/github_codespaces_lifecycle_provenance.py'
      - 'tests/test_w1_supervisor_verification_candidate.py'
      - '.github/workflows/w1-supervisor-verification-candidate-contract.yml'

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile supervisor candidate
        run: |
          set -euo pipefail
          python3 -m py_compile controller/w1/w1_supervisor_verification_candidate.py

      - name: Run adversarial supervisor candidate tests
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_w1_supervisor_verification_candidate -v

      - name: Assert terminal non-authority boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('controller/w1/w1_supervisor_verification_candidate.py').read_text()
          required = (
              'READY_FOR_FRESH_SUPERVISOR_VERIFICATION_NONAUTHORITY',
              'ready_for_fresh_supervisor_verification',
              'fresh_supervisor_w1_verification_under_current_authority',
              'authenticated_provider_provenance_verified',
              'provider_action_verified',
              'provider_storage_contract_verified',
              'supervisor_verified',
              'persistent_worker_proof',
              'worker_admitted',
              'w1_verified',
              'authority_effect',
          )
          for token in required:
              assert token in text, token
          forbidden = (
              '"supervisor_verified": True',
              '"persistent_worker_proof": True',
              '"worker_admitted": True',
              '"w1_verified": True',
              '"canonical": True',
              '"authority_effect": True',
          )
          for token in forbidden:
              assert token not in text, token
          print('W1 supervisor verification candidate: PASS_NONAUTHORITY')
          PY
