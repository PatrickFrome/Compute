name: A2 Browser R8D Durable Extension Click Bridge

on:
  push:
    branches:
      - work/a2-browser-r8d-durable-extension-click-bridge
    paths:
      - 'coordination/browser-shared/extension-typed-click-actuator-v1.mjs'
      - 'coordination/chat-control-plane/extension/supervisor-authority.js'
      - 'supabase/functions/a2-browser-supervisor-v4/index.ts'
      - 'tests/a2_r8d_*.test.mjs'
      - 'research/A2_BROWSER_R8D_**'
      - '.github/workflows/a2-browser-r8d-durable-extension-click-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  r8d-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify parent and source boundary
        shell: bash
        run: |
          set -euo pipefail
          PARENT=fd1204431d09c2e837b82b9429e1ffad9cdfff58
          git merge-base --is-ancestor "$PARENT" "$GITHUB_SHA"
          git diff --name-only "$PARENT" "$GITHUB_SHA" | tee "$RUNNER_TEMP/r8d-changed-files.txt"
          if git diff --name-only "$PARENT" "$GITHUB_SHA" | grep -Eq '(^|/)(package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.(toml|lock))$'; then
            echo 'R8D must add no source dependency packages' >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Static and authority contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check coordination/browser-shared/extension-typed-click-actuator-v1.mjs
          node --check coordination/chat-control-plane/extension/supervisor-authority.js
          node --check tests/a2_r8d_extension_typed_click_actuator.test.mjs
          node --check tests/a2_r8d_durable_fence_bridge.test.mjs
          node --check tests/a2_r8d_supervisor_typed_click.test.mjs
          grep -q '"TYPED_CLICK"' coordination/chat-control-plane/extension/supervisor-authority.js
          grep -q 'supervisor_typed_click_armed_required' coordination/chat-control-plane/extension/supervisor-authority.js
          grep -q "required_mode: 'CONTROL'" coordination/browser-shared/extension-typed-click-actuator-v1.mjs
          grep -q 'required_armed: true' coordination/browser-shared/extension-typed-click-actuator-v1.mjs
          grep -q 'automatic_retry_allowed: false' coordination/browser-shared/extension-typed-click-actuator-v1.mjs
          ! grep -q 'Input\.dispatchMouseEvent' coordination/browser-shared/extension-typed-click-actuator-v1.mjs

      - name: R8D positive and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/a2_r8d_extension_typed_click_actuator.test.mjs tests/a2_r8d_durable_fence_bridge.test.mjs tests/a2_r8d_supervisor_typed_click.test.mjs

      - name: R8A-R8C regression gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/a2_r8a_*.test.mjs tests/a2_r8b_*.test.mjs tests/a2_r8c_*.test.mjs

      - name: Canonical MV3 syntax and deterministic package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=coordination/chat-control-plane/extension
          OUT=dist/a2-browser-r8d
          node --check "$ROOT/background-entry.js"
          node --check "$ROOT/operator-typed-click-outcome.js"
          node --check "$ROOT/supervisor-device-transport.js"
          python3 scripts/a2_build_extension.py \
            --source "$ROOT" \
            --package-manifest "$ROOT/runtime-package-manifest.json" \
            --stage "$OUT/stage" \
            --zip "$OUT/R8D_GENERIC.zip" \
            --evidence-dir "$OUT/build-evidence" \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          test -s "$OUT/stage/supervisor-authority.js"
          grep -q '"TYPED_CLICK"' "$OUT/stage/supervisor-authority.js"
          test "$(find "$OUT/stage" -type f | wc -l)" = "47"

      - name: Build deterministic R8D evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist/a2-browser-r8d
          mkdir -p "$OUT/evidence"
          cp "$RUNNER_TEMP/r8d-changed-files.txt" "$OUT/evidence/R8D_CHANGED_FILES.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/evidence/SOURCE_COMMIT.txt"
          printf '%s\n' 'fd1204431d09c2e837b82b9429e1ffad9cdfff58' > "$OUT/evidence/PARENT_VERIFIED_COMMIT.txt"
          cat > "$OUT/evidence/R8D_CLAIMS.json" <<'JSON'
          {"milestone":"R8D_DURABLE_EXTENSION_CLICK_BRIDGE_V1","durable_brain_in_mv3":false,"one_fence_invocation_one_typed_command":true,"remote_transport_auto_retry":false,"local_control_required":true,"local_armed_required":true,"fresh_extension_perception_after_seal":true,"page_exactly_once_claimed":false,"new_source_dependency_packages":0}
          JSON
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf "$OUT/A2_BROWSER_R8D_EVIDENCE.tar" \
            coordination/browser-shared/extension-typed-click-actuator-v1.mjs \
            coordination/chat-control-plane/extension/supervisor-authority.js \
            tests/a2_r8d_extension_typed_click_actuator.test.mjs \
            tests/a2_r8d_durable_fence_bridge.test.mjs \
            tests/a2_r8d_supervisor_typed_click.test.mjs \
            research/A2_BROWSER_R8D_DURABLE_EXTENSION_CLICK_BRIDGE_PRE_RESEARCH_2026-08-29.md \
            "$OUT/evidence"
          sha256sum "$OUT/A2_BROWSER_R8D_EVIDENCE.tar" "$OUT/R8D_GENERIC.zip" > "$OUT/R8D_SHA256SUMS.txt"

      - name: Attest R8D evidence
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/a2-browser-r8d/A2_BROWSER_R8D_EVIDENCE.tar
            dist/a2-browser-r8d/R8D_GENERIC.zip

      - name: Upload R8D evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: a2-browser-r8d-${{ github.sha }}
          path: dist/a2-browser-r8d/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
