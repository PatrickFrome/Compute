name: Repair Supervisor Process Boundary Ambiguity R5

on:
  push:
    branches:
      - repair/supervisor-process-boundary-ambiguity-r1

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[r5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/supervisor-process-boundary-ambiguity-r1
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply R5 repair
        run: python3 scripts/apply-supervisor-process-boundary-ambiguity-r5.py

      - name: Syntax check
        run: |
          node --check apps/metaengine-browser/src/supervisor-keepalive.mjs
          node --check apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs

      - name: Focused R4 and R5 tests
        run: |
          node --test apps/metaengine-browser/test/supervisor-bootstrap-ambiguity-repair-r4.test.mjs
          node --test apps/metaengine-browser/test/supervisor-process-boundary-ambiguity-r5.test.mjs

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/metaengine-browser/src/supervisor-keepalive.mjs \
                  apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs \
                  apps/metaengine-browser/test/supervisor-process-boundary-ambiguity-r5.test.mjs
          git commit -m 'fix(browser): recover process-boundary bootstrap ambiguity [r5-applied]'
          git push origin HEAD:repair/supervisor-process-boundary-ambiguity-r1
