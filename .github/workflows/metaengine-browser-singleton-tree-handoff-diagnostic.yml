name: METAENGINE Browser Singleton Tree Handoff Diagnostic

on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/**'
      - '.github/workflows/metaengine-browser-singleton-tree-handoff-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: metaengine-browser-singleton-tree-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-tree-handoff:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund
      - name: Build and install diagnostic package
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $version = "0.6.3-dev.${{ github.run_number }}.10"
          npm pkg set version=$version
          Remove-Item dist-test -Recurse -Force -ErrorAction SilentlyContinue
          npx --yes electron-builder@26.15.7 --win nsis --x64 --config electron-builder.test.json --publish never
          $installer = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$version-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw 'tree_handoff_installer_missing' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "tree_handoff_install_exit_$($install.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test\METAENGINE Browser Test.exe'
          if (-not (Test-Path $app)) { throw 'tree_handoff_app_missing' }
          $app | Set-Content "$env:RUNNER_TEMP\tree-handoff-app.txt"
      - name: Prove full process-tree handoff
        shell: powershell
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\tree-handoff-app.txt").Trim()
          $rows = @()
          for ($i = 1; $i -le 4; $i++) {
            $primaryOut = "$env:RUNNER_TEMP\tree-$i-primary.out"
            $primaryErr = "$env:RUNNER_TEMP\tree-$i-primary.err"
            $successorOut = "$env:RUNNER_TEMP\tree-$i-successor.out"
            $successorErr = "$env:RUNNER_TEMP\tree-$i-successor.err"
            $primary = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput $primaryOut -RedirectStandardError $primaryErr
            $null = $primary.Handle
            $ready = (Get-Date).AddSeconds(5)
            while ((-not (Test-Path $primaryOut) -or (Get-Item $primaryOut -ErrorAction SilentlyContinue).Length -eq 0) -and (Get-Date) -lt $ready) { Start-Sleep -Milliseconds 50 }
            $primary.Refresh()
            if ($primary.HasExited) { throw "tree_handoff_primary_exited_early:${i}:$($primary.ExitCode)" }
            $releaseStart = Get-Date
            & taskkill.exe /PID $primary.Id /T /F | Out-Null
            $deadline = (Get-Date).AddSeconds(5)
            while (-not $primary.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 50; $primary.Refresh() }
            if (-not $primary.HasExited) { throw "tree_handoff_primary_tree_not_terminated:$i" }
            $successor = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput $successorOut -RedirectStandardError $successorErr
            $null = $successor.Handle
            $probeDeadline = (Get-Date).AddSeconds(5)
            while ((-not (Test-Path $successorOut) -or (Get-Item $successorOut -ErrorAction SilentlyContinue).Length -eq 0) -and -not $successor.HasExited -and (Get-Date) -lt $probeDeadline) { Start-Sleep -Milliseconds 25; $successor.Refresh() }
            $successor.Refresh()
            $exitCode = if ($successor.HasExited) { $successor.ExitCode } else { $null }
            $line = if (Test-Path $successorOut) { Get-Content $successorOut | Where-Object { $_.Trim() } | Select-Object -Last 1 } else { $null }
            $acquired = $false
            if ($line) {
              try {
                $row = $line | ConvertFrom-Json
                $acquired = ($row.primary_instance -eq $true -and -not $successor.HasExited)
              } catch {}
            }
            $latencyMs = [int]((Get-Date) - $releaseStart).TotalMilliseconds
            $rows += [pscustomobject]@{ iteration=$i; acquire_latency_ms=$latencyMs; successor_exit=$exitCode; acquired=$acquired }
            if (-not $acquired) {
              Get-Content $successorOut -ErrorAction SilentlyContinue
              Get-Content $successorErr -ErrorAction SilentlyContinue
              Get-Process | Where-Object { $_.ProcessName -like 'METAENGINE*' -or $_.ProcessName -like 'electron*' } | Select-Object ProcessName,Id,Path | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\tree-handoff-processes.json"
              throw "tree_handoff_successor_not_primary:$i"
            }
            & taskkill.exe /PID $successor.Id /T /F | Out-Null
            Start-Sleep -Milliseconds 150
          }
          $rows | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\tree-handoff.json"
          'physical_singleton_tree_handoff=PASS'
      - name: Persist tree handoff evidence
        if: always()
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tree-handoff-evidence'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in @('tree-handoff-app.txt','tree-handoff.json','tree-handoff-processes.json')) {
            $src = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $src) { Copy-Item $src (Join-Path $dir $name) -Force }
          }
          Get-ChildItem $env:RUNNER_TEMP -Filter 'tree-*.out' -ErrorAction SilentlyContinue | Copy-Item -Destination $dir -Force
          Get-ChildItem $env:RUNNER_TEMP -Filter 'tree-*.err' -ErrorAction SilentlyContinue | Copy-Item -Destination $dir -Force
      - name: Upload tree handoff evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-singleton-tree-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/tree-handoff-evidence
          if-no-files-found: error
          retention-days: 14
