name: Main Roadmap Cycle Oracle

on:
  push:
    branches:
      - work/main-roadmap-accelerators-v1
      - work/main-roadmap-accelerators-v2
      - work/main-roadmap-accelerators-v3
      - work/main-roadmap-accelerators-v4
      - work/main-roadmap-accelerators-v5
      - work/w1-sandbox-launcher-prep
    paths:
      - 'controller/roadmap/**'
      - 'tests/test_main_roadmap_cycle_oracle.py'
      - 'tests/test_main_roadmap_projection_guard.py'
      - 'tests/test_main_roadmap_lease_truth_guard.py'
      - 'tests/test_main_roadmap_lease_truth_guard_v2.py'
      - 'tests/test_main_roadmap_lease_reconciliation_sql_contract.py'
      - 'tests/test_roadmap_alignment_lease_truth_projection_sql_contract.py'
      - 'tests/fixtures/main_roadmap_live_snapshot_20260827.json'
      - 'supabase/prep/main_roadmap_lease_truth_snapshot_v1.sql'
      - 'supabase/migrations/20260827201500_main_roadmap_lease_reconciliation_v1.sql'
      - 'supabase/migrations/20260827202500_roadmap_alignment_lease_truth_projection_v2.sql'
      - 'docs/ROADMAP_EXECUTION_PROTOCOL.md'
      - 'research/main-roadmap-accelerators/**'
      - '.github/workflows/main-roadmap-cycle-oracle.yml'
      - '.github/workflows/main-roadmap-projection-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compile deterministic roadmap guards
        run: |
          set -euo pipefail
          python3 -m py_compile \
            controller/roadmap/roadmap_cycle_oracle.py \
            controller/roadmap/roadmap_lease_truth_guard.py \
            controller/roadmap/roadmap_lease_truth_guard_v2.py

      - name: Run positive and adversarial contracts
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_main_roadmap_cycle_oracle \
            tests.test_main_roadmap_lease_truth_guard \
            tests.test_main_roadmap_lease_truth_guard_v2 \
            tests.test_main_roadmap_lease_reconciliation_sql_contract \
            tests.test_roadmap_alignment_lease_truth_projection_sql_contract -v

      - name: Prove read-only snapshot contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sql = Path('supabase/prep/main_roadmap_lease_truth_snapshot_v1.sql').read_text(encoding='utf-8').lower()
          assert 'statement_timestamp()' in sql
          assert 'compute_fabric_level2_canonical_mapping_h205f22' in sql
          assert "state = 'active'" in sql
          assert "status = 'active'" in sql
          for forbidden in (' insert ', ' update ', ' delete ', ' create ', ' alter ', ' drop ', ' truncate '):
              assert forbidden not in f' {sql} ', forbidden
          print('main-roadmap lease snapshot read-only contract: PASS')
          PY

      - name: Prove non-authority boundary is source-visible
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = '\n'.join(
              Path(path).read_text(encoding='utf-8')
              for path in (
                  'controller/roadmap/roadmap_cycle_oracle.py',
                  'controller/roadmap/roadmap_lease_truth_guard.py',
                  'controller/roadmap/roadmap_lease_truth_guard_v2.py',
              )
          )
          required = [
              '"provider_mutation_authorized": False',
              '"edge_deployment_authorized": False',
              '"pr_merge_authorized": False',
              '"authority_effect": False',
              '"database_mutation_authorized": False',
              '"checkpoint_promotion_authorized": False',
              'merge-base',
              '--is-ancestor',
          ]
          for marker in required:
              assert marker in source, marker
          print('main-roadmap cycle + lease guards non-authority boundary: PASS')
          PY
