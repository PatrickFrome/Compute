name: W1 Provider-Neutral Lifecycle DB Contract

on:
  push:
    branches: [work/w1-provider-neutral-lifecycle-v2, work/w1-sandbox-launcher-prep]
    paths:
      - 'supabase/migrations/20260825023000_w1_provider_neutral_lifecycle_receipt_v2.sql'
      - '.github/workflows/w1-provider-neutral-lifecycle-db-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260825023000_w1_provider_neutral_lifecycle_receipt_v2.sql'
      - '.github/workflows/w1-provider-neutral-lifecycle-db-contract.yml'

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate additive fail-closed SQL contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260825023000_w1_provider_neutral_lifecycle_receipt_v2.sql').read_text()
          low = p.lower()
          required = (
              'compute_fabric_canonical_evidence_json_h205f22',
              "if v_type = 'number' then",
              "^-?(0|[1-9][0-9]*)$",
              'non-integral numbers are forbidden in canonical evidence json',
              'compute_fabric_worker_lifecycle_receipt_v2_h205f22',
              'h205f22_w1_lifecycle_receipt_ingest_v2',
              'github_codespaces', 'vercel_sandbox', 'aws_ec2',
              'stop_resume', 'reboot',
              'pending_provider_validation',
              'provider_identity_verified=false',
              'lifecycle_action_verified=false',
              'accepted=false',
              'persistent_worker_proof', 'worker_admitted', 'w1_verified',
              'requires_authenticated_provider_validation',
              'requires_persisted_readback_composition',
              'service_role',
          )
          for token in required:
              assert token in low, token

          # Provider hashes must use the evidence canonicalizer, not the identity
          # canonicalizer (which intentionally rejects all JSON numbers).
          assert low.count('compute_fabric_canonical_evidence_json_h205f22(') >= 6
          assert 'compute_fabric_canonical_json_h205f22(p_pre_provider_snapshot)' not in low
          assert 'compute_fabric_canonical_json_h205f22(p_post_provider_snapshot)' not in low
          assert 'create or replace function destruktion_meta.compute_fabric_canonical_json_h205f22' not in low

          # V2 must be additive: the legacy AWS reboot receipt is altered nowhere.
          forbidden = (
              'alter table destruktion_meta.compute_fabric_worker_reboot_receipt_h205f22',
              'drop table destruktion_meta.compute_fabric_worker_reboot_receipt_h205f22',
              'drop function public.h205f22_w1_admission_candidate_readback_v1',
              'grant execute on function public.h205f22_w1_lifecycle_receipt_ingest_v2(text,text,text,text,text,timestamptz,timestamptz,jsonb,jsonb,jsonb) to authenticated',
              'grant execute on function public.h205f22_w1_lifecycle_receipt_ingest_v2(text,text,text,text,text,timestamptz,timestamptz,jsonb,jsonb,jsonb) to anon',
          )
          for token in forbidden:
              assert token not in low, token

          assert "verification_status text not null default 'pending_provider_validation'" in low
          assert 'provider_identity_verified boolean not null default false check (provider_identity_verified=false)' in low
          assert 'lifecycle_action_verified boolean not null default false check (lifecycle_action_verified=false)' in low
          assert 'accepted boolean not null default false check (accepted=false)' in low
          assert 'canonical boolean not null default false check (canonical=false)' in low
          assert 'authority_effect boolean not null default false check (authority_effect=false)' in low
          print('provider-neutral lifecycle DB contract: PASS')
          PY
