name: electron-build

# P0 Foundation (R21): клиент ME2 OS = Electron shell (primary) + sidecar me2-daemon.
# В dev-песочнице нет дисплея/Electron-кэша — единственная верифицируемая сборка = CI.
# push → smoke-build (--dir) + artifact; тег v* → установщики (dmg/AppImage/portable).

on:
  workflow_dispatch:
  push:
    branches: [sandbox/me2-os]
    paths:
      - "electron/**"
      - "mini-services/me2-daemon/**"
      - ".github/workflows/electron-build.yml"
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: windows-2022
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build daemon sidecar (bun --compile → standalone)
        shell: bash
        run: |
          cd mini-services/me2-daemon
          bun install --frozen-lockfile || bun install
          EXT="${{ runner.os == 'Windows' && '.exe' || '' }}"
          mkdir -p ../../electron/dist-sidecar
          bun build --compile index.ts --outfile "../../electron/dist-sidecar/me2-daemon-${{ matrix.triple }}${EXT}"

      - name: Syntax-check shell scripts (node --check)
        shell: bash
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node -e "JSON.parse(require('fs').readFileSync('electron/package.json','utf8')); console.log('electron/package.json valid')"

      - name: Build ME2 OS (smoke dir / full installers on tags)
        shell: bash
        working-directory: electron
        env:
          # На тегах — полные установщики; на push — быстрый unpacked smoke-build
          FULL: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: |
          npm install --no-fund --no-audit
          if [ "$FULL" = "1" ]; then
            npx electron-builder --publish never
          else
            npx electron-builder --dir
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: me2-os-client-${{ matrix.triple }}
          path: |
            electron/release/**
          if-no-files-found: error

      - name: Draft release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            electron/release/*.dmg
            electron/release/*.AppImage
            electron/release/*.exe
