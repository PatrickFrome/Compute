name: W1 Codespaces Actions Capability Probe

on:
  push:
    branches: [work/w1-provider-neutral-lifecycle-v2]
    paths:
      - '.github/workflows/w1-codespaces-actions-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe user Codespaces API read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/codespaces.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user/codespaces)
          echo "HTTP_STATUS=$code"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/codespaces.json')
          try:
              data = json.loads(p.read_text())
          except Exception:
              print('JSON_PARSE=false')
              raise SystemExit(0)
          print('JSON_PARSE=true')
          if isinstance(data, dict):
              print('HAS_TOTAL_COUNT=' + str(isinstance(data.get('total_count'), int)).lower())
              spaces = data.get('codespaces')
              if isinstance(spaces, list):
                  print('CODESPACE_COUNT=' + str(len(spaces)))
                  matches = [x for x in spaces if isinstance(x, dict) and x.get('name') == 'psychic-goggles-p79456q477c6wvq']
                  print('TARGET_VISIBLE=' + str(bool(matches)).lower())
              else:
                  print('TARGET_VISIBLE=false')
              if 'message' in data:
                  print('API_MESSAGE=' + str(data['message'])[:160].replace('\n',' '))
          PY
          if [ "$code" = "200" ]; then
            echo 'ACTIONS_CODESPACES_READ_CAPABLE=true'
          else
            echo 'ACTIONS_CODESPACES_READ_CAPABLE=false'
          fi
          exit 0
