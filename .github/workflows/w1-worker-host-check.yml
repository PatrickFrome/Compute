name: W1 Worker Host Capability Check

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe host capabilities v3 (decisive)
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe

          sudo -n unshare -m true 2>/dev/null && echo "YES" > /tmp/probe/sudo_unshare_mnt.txt || echo "NO" > /tmp/probe/sudo_unshare_mnt.txt

          python3 -c "
import ctypes, os, errno
libc = ctypes.CDLL(None, use_errno=True)
# openat2 with proper struct: struct open_how { __u64 flags; __u64 mode; __u64 resolve; }
class OpenHow(ctypes.Structure):
    _fields_ = [('flags', ctypes.c_uint64), ('mode', ctypes.c_uint64), ('resolve', ctypes.c_uint64)]
how = OpenHow(0, 0, 0x8)  # RESOLVE_BENEATH
r = libc.syscall(437, -100, b'.', ctypes.byref(how), ctypes.sizeof(how))
e = ctypes.get_errno()
print('openat2_resolve_beneath: ' + ('OK fd='+str(r) if r >= 0 else 'FAIL errno='+errno.errorcode.get(e,str(e))))
if r >= 0: os.close(r)
# pidfd on child
r = os.fork()
if r == 0:
    import time; time.sleep(30); os._exit(0)
import time; time.sleep(0.2)
fd = libc.syscall(434, r, 0)
e2 = ctypes.get_errno()
print('pidfd_open(child): ' + ('OK fd='+str(fd) if fd >= 0 else 'FAIL errno='+errno.errorcode.get(e2,str(e2))))
if fd >= 0:
    sig = libc.syscall(424, fd, 0, 19)  # pidfd_send_signal SIGSTOP=19... use 0 first
    print('pidfd_send_signal(SIG=0): ' + ('OK' if sig == 0 else 'FAIL errno='+str(ctypes.get_errno())))
    libc.syscall(424, fd, 9, 0)  # SIGKILL child to clean up
    os.close(fd)
os.waitpid(r, 0)
" > /tmp/probe/syscalls.txt 2>&1 || true

          python3 -c "
import ctypes, os
libc = ctypes.CDLL(None, use_errno=True)
# Install REAL seccomp filter: allow read/write/exit/exit_group/rt_sigreturn, kill everything else (BPF)
BPF = bytes.fromhex('2000000015000000000000001500000003000000' '15000000000000ff060000003500000000000000')
# Encode classic BPF: RET KILL for all except allowed syscalls
import struct
prog = b''
# load syscall nr
prog += struct.pack('<HBBI', 0x20, 0, 0, 4)      # ld [4] (seccomp_data.arch+nr at offset 4? nr at offset 0 after nr field...)
# simplify: strict filter = all syscalls except whitelist
prog  = struct.pack('<HBBI', 0x20, 0, 0, 0)      # ld [0] = nr
for allowed in (0, 1, 3, 60, 231, 15):           # read write close exit exit_group rt_sigreturn
    prog += struct.pack('<HBBI', 0x15, 0, 1, allowed)  # jeq allowed, +1
prog += struct.pack('<HBBI', 0x06, 0, 0, 0x00030000)  # ret SECCOMP_RET_KILL_PROCESS... use ERR
# NOTE: this filter would kill our own process if applied now; just verify INSTALL path works in a child
prog = prog[:8]
prog = struct.pack('<HBBI', 0x06, 0, 0, 0x7ffc0000)  # ret ALLOW (harmless filter)
r = libc.prctl(38, 1, 0, 0, 0)  # no_new_privs
print('no_new_privs: ' + ('OK' if r == 0 else 'FAIL'))
FILT = 1
r2 = libc.prctl(22, FILT, len(prog)//8, prog, 0)  # PR_SET_SECCOMP=22, MODE_FILTER=2? PR_SET_SECCOMP + SECCOMP_MODE_FILTER=2
print('seccomp_install_probe: ' + ('OK' if r2 == 0 else 'FAIL errno='+str(ctypes.get_errno())))
print('seccomp_after: ' + open('/proc/self/status').read().split('Seccomp:')[1].split()[0] + ' filters=' + open('/proc/self/status').read().split('Seccomp_filters:')[1].split()[0])
" > /tmp/probe/seccomp.txt 2>&1 || true

          sudo -n bash -c 'mkdir -p /sys/fs/cgroup/w1probe && echo "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null; echo "max 100000" > /sys/fs/cgroup/w1probe/cpu.max; echo "536870912" > /sys/fs/cgroup/w1probe/memory.max; echo "64" > /sys/fs/cgroup/w1probe/pids.max; echo YES > /tmp/probe/cgroup_setup.txt' 2>/dev/null || echo "NO" > /tmp/probe/cgroup_setup.txt
          sudo -n rmdir /sys/fs/cgroup/w1probe 2>/dev/null || true

          {
            echo "## W1 Capability Report v3 DECISIVE (ubuntu-latest)"
            echo "- kernel: $(uname -r)"
            echo "- cgroup_v2: mounted=YES controllers=$(cat /sys/fs/cgroup/cgroup.controllers | tr ' ' ',')"
            echo "- cgroup_subtree_setup(cpu+mem+pids): $(cat /tmp/probe/cgroup_setup.txt 2>/dev/null || echo NO)"
            echo "- sudo_unshare_mount_ns: $(cat /tmp/probe/sudo_unshare_mnt.txt)"
            echo "- uid: $(id -u) (runner nonroot) + sudo"
            echo "- syscalls (correct API):"
            sed 's/^/    - /' /tmp/probe/syscalls.txt
            echo "- seccomp install:"
            sed 's/^/    - /' /tmp/probe/seccomp.txt
            echo "- ram_mb: $(free -m | awk '/^Mem:/{print $2}') | cpus: $(nproc)"
          } | tee "$GITHUB_STEP_SUMMARY"
