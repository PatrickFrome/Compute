name: W1 Worker Host Capability Check

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe host capabilities v2
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          python3 -c "import ctypes,os,errno; libc=ctypes.CDLL(None,use_errno=True); r=libc.syscall(434,os.getpid(),0); e=ctypes.get_errno(); print('pidfd_open(434): '+('OK fd='+str(r) if r>=0 else 'FAIL errno='+errno.errorcode.get(e,e))); r2=libc.syscall(437,-100,b'.',0,0x8); e2=ctypes.get_errno(); print('openat2_resolve_beneath(rel): '+('OK fd='+str(r2) if r2>=0 else 'FAIL errno='+errno.errorcode.get(e2,e2))); print('no_new_privs: '+('OK' if libc.prctl(38,1,0,0,0)==0 else 'FAIL'))" > /tmp/probe/syscalls.txt 2>&1 || true
          sudo -n true 2>/dev/null && echo "YES" > /tmp/probe/sudo.txt || echo "NO" > /tmp/probe/sudo.txt
          unshare -m true 2>/dev/null && echo "YES" > /tmp/probe/unshare_mnt.txt || echo "NO" > /tmp/probe/unshare_mnt.txt
          unshare -Um true 2>/dev/null && echo "YES" > /tmp/probe/unshare_usermnt.txt || echo "NO" > /tmp/probe/unshare_usermnt.txt
          if [ -f /sys/fs/cgroup/cgroup.controllers ]; then echo "YES" > /tmp/probe/cgroup2.txt; cat /sys/fs/cgroup/cgroup.controllers | tr ' ' ',' > /tmp/probe/controllers.txt; else echo "NO" > /tmp/probe/cgroup2.txt; echo "none" > /tmp/probe/controllers.txt; fi
          sudo -n mkdir -p /sys/fs/cgroup/w1test 2>/dev/null && echo "YES" > /tmp/probe/cgroup_write.txt || echo "NO" > /tmp/probe/cgroup_write.txt
          sudo -n rmdir /sys/fs/cgroup/w1test 2>/dev/null || true
          which bun node python3 git > /tmp/probe/toolchain.txt 2>&1 || true
          ls /usr/bin/seccomp-tools /usr/sbin/*seccomp* 2>/dev/null > /tmp/probe/seccomp_tools.txt || echo "none" > /tmp/probe/seccomp_tools.txt
          {
            echo "## W1 Worker Host Capability Report v2 (ubuntu-latest)"
            echo "- kernel: $(uname -r)"
            echo "- cgroup_v2_mounted: $(cat /tmp/probe/cgroup2.txt)"
            echo "- cgroup_controllers: $(cat /tmp/probe/controllers.txt)"
            echo "- cgroup_subtree_writable: $(cat /tmp/probe/cgroup_write.txt)"
            echo "- sudo: $(cat /tmp/probe/sudo.txt)"
            echo "- unshare_mount_ns: $(cat /tmp/probe/unshare_mnt.txt)"
            echo "- unshare_user_mount: $(cat /tmp/probe/unshare_usermnt.txt)"
            echo "- uid: $(id -u)"
            echo "- seccomp_self: $(grep Seccomp /proc/self/status | tr '\n' ' ')"
            echo "- syscalls:"
            sed 's/^/    - /' /tmp/probe/syscalls.txt
            echo "- ram_mb: $(free -m | awk '/^Mem:/{print $2}') | cpus: $(nproc)"
          } | tee "$GITHUB_STEP_SUMMARY"
