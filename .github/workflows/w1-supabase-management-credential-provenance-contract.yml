name: W1 Supabase Management Credential Provenance V13

on:
  push:
    branches:
      - work/main-roadmap-accelerators-v13
    paths:
      - "controller/w1/w1_supabase_management_credential_provenance_guard.py"
      - "tests/test_w1_supabase_management_credential_provenance_guard.py"
      - "research/W1_SUPABASE_MANAGEMENT_CREDENTIAL_PROVENANCE_V13.md"
      - ".github/workflows/w1-supabase-management-credential-provenance-contract.yml"

permissions: {}

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile and run credential-provenance contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python3 -m py_compile controller/w1/w1_supabase_management_credential_provenance_guard.py
          python3 -m unittest -v tests.test_w1_supabase_management_credential_provenance_guard

      - name: Prove source-only non-authority workflow surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('.github/workflows/w1-supabase-management-credential-provenance-contract.yml').read_text()
          forbidden=(
              'workflow_'+'dispatch:',
              'id-token:'+' write',
              'secrets'+'.',
              'vars'+'.',
              'api.'+'supabase.com',
              'oauth/'+'token',
              'curl'+' ',
              'edge_functions:'+'write',
          )
          for token in forbidden:
              assert token not in raw, token
          guard=Path('controller/w1/w1_supabase_management_credential_provenance_guard.py').read_text()
          assert 'provider_credential_scope_verified' in guard
          assert 'IDJAG_REQUIRES_TEAM_OR_ENTERPRISE' in guard
          assert 'UNVERIFIED_USER_ACCOUNT_AUTHORITY' in guard
          assert 'REQUESTED_SCOPE_NOT_PROVIDER_INTROSPECTED' in guard
          assert 'authority_effect' in guard
          PY
