name: DevOS Release Finalize Temp

on:
  push:
    branches:
      - 'work/metaengine-devos-multisurface-v1'
    paths:
      - '.github/workflows/devos-release-finalize-temp.yml'
      - '.github/scripts/devos-release-finalize-temp.mjs'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: work/metaengine-devos-multisurface-v1
          fetch-depth: 0

      - name: Prove exact remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin refs/heads/work/metaengine-devos-multisurface-v1 | cut -f1)" = "${GITHUB_SHA}"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Apply and prove exact release patch
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/devos-release-finalize-temp.mjs
          git diff --check
          node --check apps/metaengine-browser/src/main.mjs
          node --test apps/metaengine-browser/test/browser-chatgpt-fast-open.test.mjs apps/metaengine-browser/test/browser-devos-multisurface-release-contract.test.mjs
          grep -F "chatgpt_preconnect_armed" .github/workflows/browser-windows-package-smoke.yml
          grep -F "installed_chatgpt_preconnect_not_armed" .github/workflows/browser-windows-package-smoke.yml

      - name: Push proven non-workflow release fix
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/browser-windows-package-smoke.yml
          git diff --check
          cat > /tmp/expected <<'EOF'
          apps/metaengine-browser/src/main.mjs
          apps/metaengine-browser/test/browser-chatgpt-fast-open.test.mjs
          apps/metaengine-browser/test/browser-devos-multisurface-release-contract.test.mjs
          EOF
          sed -i 's/^          //' /tmp/expected
          git diff --name-only | sort -u > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/metaengine-browser/src/main.mjs apps/metaengine-browser/test/browser-chatgpt-fast-open.test.mjs apps/metaengine-browser/test/browser-devos-multisurface-release-contract.test.mjs
          git commit -m "fix(release): prove ChatGPT fast connect runtime"
          git push origin HEAD:refs/heads/work/metaengine-devos-multisurface-v1
