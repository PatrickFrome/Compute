name: METAENGINE Browser Singleton Diagnostic

on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/**'
      - '.github/workflows/metaengine-browser-singleton-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: metaengine-browser-singleton-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-singleton:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund
      - name: Build and install diagnostic package
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $version = "0.6.3-dev.${{ github.run_number }}.9"
          npm pkg set version=$version
          Remove-Item dist-test -Recurse -Force -ErrorAction SilentlyContinue
          npx --yes electron-builder@26.15.7 --win nsis --x64 --config electron-builder.test.json --publish never
          $installer = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$version-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw 'singleton_diag_installer_missing' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "singleton_diag_install_exit_$($install.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test\METAENGINE Browser Test.exe'
          if (-not (Test-Path $app)) { throw 'singleton_diag_app_missing' }
          $app | Set-Content "$env:RUNNER_TEMP\singleton-app.txt"
      - name: Prove primary remains live while secondary is rejected
        shell: powershell
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\singleton-app.txt").Trim()
          $firstOut = "$env:RUNNER_TEMP\singleton-first.out"
          $firstErr = "$env:RUNNER_TEMP\singleton-first.err"
          $secondOut = "$env:RUNNER_TEMP\singleton-second.out"
          $secondErr = "$env:RUNNER_TEMP\singleton-second.err"
          $first = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput $firstOut -RedirectStandardError $firstErr
          $null = $first.Handle
          $deadline = (Get-Date).AddSeconds(10)
          while ((-not (Test-Path $firstOut) -or (Get-Item $firstOut -ErrorAction SilentlyContinue).Length -eq 0) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
          $first.Refresh()
          if (-not (Test-Path $firstOut)) { throw 'singleton_diag_primary_no_output' }
          Get-Content $firstOut -ErrorAction SilentlyContinue
          Get-Content $firstErr -ErrorAction SilentlyContinue
          if ($first.HasExited) { throw "singleton_diag_primary_exited_early:$($first.ExitCode)" }
          $firstRow = (Get-Content $firstOut | Where-Object { $_.Trim() } | Select-Object -Last 1) | ConvertFrom-Json
          if ($firstRow.primary_instance -ne $true) { throw 'singleton_diag_primary_identity_invalid' }
          $second = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput $secondOut -RedirectStandardError $secondErr
          $null = $second.Handle
          if (-not $second.WaitForExit(5000)) {
            try { Stop-Process -Id $second.Id -Force } catch {}
            try { Stop-Process -Id $first.Id -Force } catch {}
            Get-Content $secondOut -ErrorAction SilentlyContinue
            Get-Content $secondErr -ErrorAction SilentlyContinue
            throw 'singleton_diag_secondary_did_not_exit'
          }
          "secondary_exit=$($second.ExitCode)"
          Get-Content $secondOut -ErrorAction SilentlyContinue
          Get-Content $secondErr -ErrorAction SilentlyContinue
          $first.Refresh()
          if ($first.HasExited) { throw "singleton_diag_secondary_displaced_primary:$($first.ExitCode)" }
          try { Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue } catch {}
          'physical_singleton_diagnostic=PASS'
      - name: Characterize bounded restart lock handoff
        shell: powershell
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\singleton-app.txt").Trim()
          $rows = @()
          for ($i = 1; $i -le 8; $i++) {
            $primaryOut = "$env:RUNNER_TEMP\handoff-$i-primary.out"
            $primaryErr = "$env:RUNNER_TEMP\handoff-$i-primary.err"
            $successorOut = "$env:RUNNER_TEMP\handoff-$i-successor.out"
            $successorErr = "$env:RUNNER_TEMP\handoff-$i-successor.err"
            $contenderOut = "$env:RUNNER_TEMP\handoff-$i-contender.out"
            $contenderErr = "$env:RUNNER_TEMP\handoff-$i-contender.err"
            $primary = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput $primaryOut -RedirectStandardError $primaryErr
            $null = $primary.Handle
            $ready = (Get-Date).AddSeconds(5)
            while ((-not (Test-Path $primaryOut) -or (Get-Item $primaryOut -ErrorAction SilentlyContinue).Length -eq 0) -and (Get-Date) -lt $ready) { Start-Sleep -Milliseconds 50 }
            $primary.Refresh()
            if ($primary.HasExited) { throw "handoff_primary_exited_early:$i:$($primary.ExitCode)" }
            $releaseStart = Get-Date
            Stop-Process -Id $primary.Id -Force
            $primary.WaitForExit(5000) | Out-Null
            $successor = $null
            $acquired = $false
            $attempts = 0
            $deadline = (Get-Date).AddSeconds(5)
            while (-not $acquired -and (Get-Date) -lt $deadline) {
              $attempts++
              Remove-Item $successorOut,$successorErr -Force -ErrorAction SilentlyContinue
              $successor = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput $successorOut -RedirectStandardError $successorErr
              $null = $successor.Handle
              $probeDeadline = (Get-Date).AddMilliseconds(750)
              while ((-not (Test-Path $successorOut) -or (Get-Item $successorOut -ErrorAction SilentlyContinue).Length -eq 0) -and -not $successor.HasExited -and (Get-Date) -lt $probeDeadline) { Start-Sleep -Milliseconds 25; $successor.Refresh() }
              if (Test-Path $successorOut) {
                $line = Get-Content $successorOut | Where-Object { $_.Trim() } | Select-Object -Last 1
                if ($line) {
                  try {
                    $row = $line | ConvertFrom-Json
                    if ($row.primary_instance -eq $true -and -not $successor.HasExited) { $acquired = $true }
                  } catch {}
                }
              }
              if (-not $acquired) {
                try { if (-not $successor.HasExited) { Stop-Process -Id $successor.Id -Force } } catch {}
                Start-Sleep -Milliseconds 50
              }
            }
            if (-not $acquired) { throw "handoff_successor_never_acquired:$i" }
            $latencyMs = [int]((Get-Date) - $releaseStart).TotalMilliseconds
            $contender = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput $contenderOut -RedirectStandardError $contenderErr
            $null = $contender.Handle
            if (-not $contender.WaitForExit(3000)) {
              try { Stop-Process -Id $contender.Id -Force } catch {}
              try { Stop-Process -Id $successor.Id -Force } catch {}
              throw "handoff_contender_did_not_exit:$i"
            }
            $successor.Refresh()
            if ($successor.HasExited) { throw "handoff_contender_displaced_successor:$i:$($successor.ExitCode)" }
            $rows += [pscustomobject]@{ iteration=$i; acquire_latency_ms=$latencyMs; acquire_attempts=$attempts; contender_exit=$contender.ExitCode }
            try { Stop-Process -Id $successor.Id -Force } catch {}
            $successor.WaitForExit(3000) | Out-Null
            Start-Sleep -Milliseconds 100
          }
          $rows | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\singleton-handoff.json"
          $max = ($rows | Measure-Object -Property acquire_latency_ms -Maximum).Maximum
          "singleton_handoff_max_acquire_ms=$max"
          if ($max -gt 3000) { throw "handoff_release_latency_excessive:$max" }
          'physical_singleton_handoff=PASS'
      - name: Persist singleton diagnostic evidence
        if: always()
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'singleton-diagnostic-evidence'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in @('singleton-first.out','singleton-first.err','singleton-second.out','singleton-second.err','singleton-app.txt','singleton-handoff.json')) {
            $src = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $src) { Copy-Item $src (Join-Path $dir $name) -Force }
          }
          Get-ChildItem $env:RUNNER_TEMP -Filter 'handoff-*.out' -ErrorAction SilentlyContinue | Copy-Item -Destination $dir -Force
          Get-ChildItem $env:RUNNER_TEMP -Filter 'handoff-*.err' -ErrorAction SilentlyContinue | Copy-Item -Destination $dir -Force
          Get-Process | Where-Object { $_.ProcessName -like 'METAENGINE*' } | Select-Object ProcessName,Id,HasExited | ConvertTo-Json | Set-Content (Join-Path $dir 'metaengine-processes.json')
      - name: Upload singleton diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-singleton-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/singleton-diagnostic-evidence
          if-no-files-found: error
          retention-days: 14
