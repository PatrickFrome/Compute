name: W1 Two-Plane Safety V2 Contract
on:
  push:
    branches:
      - work/w1-two-plane-safety-v2-prep
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile v2 contracts
        run: |
          python3 -m py_compile \
            worker/native_linux/rootless_worker_launcher_v2.py \
            worker/native_linux/two_plane_safety_witness_v2.py
      - name: Run adversarial v2 tests
        run: python3 -m unittest -v tests.test_w1_two_plane_safety_v2
      - name: Assert non-authority outputs remain explicit
        run: |
          grep -q '"safety_verified": False' worker/native_linux/two_plane_safety_witness_v2.py
          grep -q '"worker_admitted": False' worker/native_linux/two_plane_safety_witness_v2.py
          grep -q '"w1_verified": False' worker/native_linux/two_plane_safety_witness_v2.py
