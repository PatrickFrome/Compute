name: METAENGINE Browser Bootstrap Windows Gate
on:
  push:
    branches:
      - 'work/convergence-browser-bootstrap-v1'
permissions:
  contents: write
concurrency:
  group: metaengine-browser-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap-in-place:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund
      - name: Stamp bootstrap version
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $version = "0.6.2-dev.${{ github.run_number }}.${{ github.run_attempt }}"
          npm pkg set version=$version
          "browser_version=$version" | Set-Content "$env:RUNNER_TEMP\browser-version.txt"
      - name: Contract gates
        working-directory: apps/metaengine-browser
        run: |
          npm run check
          npm test
      - name: Seed production profile continuity marker
        shell: powershell
        run: |
          $profile = Join-Path $env:APPDATA 'METAENGINE Browser'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $marker = Join-Path $profile 'bootstrap-profile-preservation.marker'
          "source=${{ github.sha }}" | Set-Content $marker
          $marker | Set-Content "$env:RUNNER_TEMP\profile-marker-path.txt"
      - name: Build one production-identity NSIS candidate
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx --yes electron-builder@26.15.7 --win nsis --x64 --config electron-builder.bootstrap.json --publish never
          $production = Get-ChildItem dist-bootstrap -Filter 'METAENGINE-Browser-Setup-*.exe' -File | Select-Object -First 1
          $productionBlockmap = Get-ChildItem dist-bootstrap -Filter 'METAENGINE-Browser-Setup-*.exe.blockmap' -File | Select-Object -First 1
          if (-not $production -or -not $productionBlockmap) { throw 'bootstrap_candidate_missing' }
          $version = node -p "require('./package.json').version"
          if ($production.Name -notmatch [regex]::Escape("-$version-x64.exe")) { throw 'bootstrap_version_binding_invalid' }
          # Compatibility filename only: executable contents still carry production appId/productName.
          $alias = Join-Path $production.DirectoryName "METAENGINE-Browser-Test-Setup-$version-x64.exe"
          $aliasBlockmap = "$alias.blockmap"
          Copy-Item $production.FullName $alias
          Copy-Item $productionBlockmap.FullName $aliasBlockmap
          $sha512Provider = [System.Security.Cryptography.SHA512]::Create()
          try { $sha512 = [Convert]::ToBase64String($sha512Provider.ComputeHash([System.IO.File]::ReadAllBytes($alias))) }
          finally { $sha512Provider.Dispose() }
          $channel = Join-Path (Get-Location) 'dist-bootstrap\dev.yml'
          @(
            "version: $version",
            'files:',
            "  - url: $(Split-Path $alias -Leaf)",
            "    sha512: $sha512",
            "    size: $((Get-Item $alias).Length)",
            "path: $(Split-Path $alias -Leaf)",
            "sha512: $sha512",
            "releaseDate: '$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'))'",
            'stagingPercentage: 100'
          ) | Set-Content -Path $channel -Encoding utf8
          $alias | Set-Content "$env:RUNNER_TEMP\installer-path.txt"
          $aliasBlockmap | Set-Content "$env:RUNNER_TEMP\blockmap-path.txt"
          $channel | Set-Content "$env:RUNNER_TEMP\channel-yml-path.txt"
          (Get-FileHash $alias -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$env:RUNNER_TEMP\installer-sha256.txt"
          $asar = Join-Path (Resolve-Path 'dist-bootstrap\win-unpacked\resources').Path 'app.asar'
          $listing = npx --yes @electron/asar list $asar
          $listingText = (($listing -join "`n") -replace '\\','/')
          foreach ($required in @('/src/native-supervisor-client.mjs','/src/supervisor-keepalive.mjs','/src/supervisor-lifecycle-runtime.mjs','/src/chatgpt-session-monitor.mjs','/src/chatgpt-retry-policy.mjs','/src/self-update-runtime.mjs','/src/host-resilience-runtime.mjs','/src/browser-sentinel-worker.cjs')) {
            if (-not $listingText.Contains($required)) { throw "bootstrap_module_missing:$required" }
          }
          $updateConfig = Join-Path (Resolve-Path 'dist-bootstrap\win-unpacked\resources').Path 'app-update.yml'
          if (-not (Test-Path $updateConfig)) { throw 'bootstrap_update_config_missing' }
          if ((Get-Content $updateConfig -Raw) -notmatch '(?m)^\s*channel:\s*dev\s*$') { throw 'bootstrap_update_channel_not_dev' }
      - name: Install exact bootstrap into METAENGINE Browser identity
        shell: powershell
        run: |
          $installer = (Get-Content "$env:RUNNER_TEMP\installer-path.txt").Trim()
          $expected = (Get-Content "$env:RUNNER_TEMP\installer-sha256.txt").Trim()
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'bootstrap_digest_changed_before_install' }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "bootstrap_install_exit_$($install.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser\METAENGINE Browser.exe'
          if (-not (Test-Path $app)) { throw "production_identity_executable_missing:$app" }
          $app | Set-Content "$env:RUNNER_TEMP\installed-app-path.txt"
          $marker = (Get-Content "$env:RUNNER_TEMP\profile-marker-path.txt").Trim()
          if (-not (Test-Path $marker)) { throw 'profile_marker_deleted_by_install' }
      - name: Verify Development Plane and profile continuity
        shell: powershell
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\installed-app-path.txt").Trim()
          $p = Start-Process -FilePath $app -ArgumentList '--metaengine-devplane-smoke' -PassThru
          if (-not $p.WaitForExit(35000)) { try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}; throw 'bootstrap_devplane_timeout' }
          if ($p.ExitCode -ne 0) { throw "bootstrap_devplane_exit_$($p.ExitCode)" }
          if (-not (Test-Path ((Get-Content "$env:RUNNER_TEMP\profile-marker-path.txt").Trim()))) { throw 'profile_marker_missing_after_devplane' }
      - name: Launch production identity
        shell: powershell
        env:
          METAENGINE_DISABLE_SELF_UPDATE: '1'
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\installed-app-path.txt").Trim()
          $p = Start-Process -FilePath $app -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 500; $p.Refresh(); if ($p.HasExited) { throw "bootstrap_browser_exited:$($p.ExitCode)" }; if ($p.MainWindowHandle -ne 0) { break } } while ((Get-Date) -lt $deadline)
          if ($p.MainWindowHandle -eq 0) { throw 'bootstrap_main_window_missing' }
          if ($p.MainWindowTitle -notmatch '^METAENGINE Browser') { throw "bootstrap_title_invalid:$($p.MainWindowTitle)" }
          "pid=$($p.Id)" | Set-Content "$env:RUNNER_TEMP\launch-proof.txt"
          "product_name=METAENGINE Browser" | Add-Content "$env:RUNNER_TEMP\launch-proof.txt"
          "profile_marker_preserved=true" | Add-Content "$env:RUNNER_TEMP\launch-proof.txt"
          try { $p.CloseMainWindow() | Out-Null } catch {}
          if (-not $p.WaitForExit(5000)) { try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {} }
      - name: Physical crash sentinel recovery
        shell: powershell
        env:
          METAENGINE_DISABLE_SELF_UPDATE: '1'
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\installed-app-path.txt").Trim()
          $p = Start-Process -FilePath $app -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 500; $p.Refresh(); if ($p.HasExited) { throw 'sentinel_source_exited' }; if ($p.MainWindowHandle -ne 0) { break } } while ((Get-Date) -lt $deadline)
          if ($p.MainWindowHandle -eq 0) { throw 'sentinel_source_window_missing' }
          Start-Sleep -Seconds 6
          $oldPid = $p.Id
          $statePath = Join-Path $env:APPDATA 'METAENGINE Browser\metaengine-browser-sentinel-v1.json'
          if (-not (Test-Path $statePath)) { throw 'sentinel_state_missing' }
          $source = Get-Content $statePath -Raw | ConvertFrom-Json
          if ([int]$source.parent_pid -ne $oldPid) { throw 'sentinel_parent_binding_invalid' }
          $sourceToken = [string]$source.token
          $receiptPath = "$statePath.relaunch-v1.json"
          Remove-Item $receiptPath -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $oldPid -Force -ErrorAction Stop
          $p.WaitForExit()
          $receiptDeadline = (Get-Date).AddSeconds(30)
          $receipt = $null
          do {
            Start-Sleep -Milliseconds 500
            if (Test-Path $receiptPath) {
              try { $r = Get-Content $receiptPath -Raw | ConvertFrom-Json; if ($r.lifecycle -eq 'RELAUNCH_DISPATCHED' -and [string]$r.source_token -eq $sourceToken) { $receipt = $r; break } } catch {}
            }
          } while ((Get-Date) -lt $receiptDeadline)
          if (-not $receipt) { throw 'sentinel_relaunch_receipt_missing' }
          $rp = Get-Process -Id ([int]$receipt.relaunch_pid) -ErrorAction Stop
          $windowDeadline = (Get-Date).AddSeconds(25)
          do { Start-Sleep -Milliseconds 500; $rp.Refresh(); if ($rp.HasExited) { throw 'recovered_browser_exited' }; if ($rp.MainWindowHandle -ne 0) { break } } while ((Get-Date) -lt $windowDeadline)
          if ($rp.MainWindowHandle -eq 0) { throw 'recovered_window_missing' }
          if (-not (Test-Path ((Get-Content "$env:RUNNER_TEMP\profile-marker-path.txt").Trim()))) { throw 'profile_marker_missing_after_recovery' }
          "recovery=PASS" | Set-Content "$env:RUNNER_TEMP\sentinel-proof.txt"
          "source_token=$sourceToken" | Add-Content "$env:RUNNER_TEMP\sentinel-proof.txt"
          "recovered_pid=$($rp.Id)" | Add-Content "$env:RUNNER_TEMP\sentinel-proof.txt"
          try { $rp.CloseMainWindow() | Out-Null } catch {}
          if (-not $rp.WaitForExit(5000)) { try { Stop-Process -Id $rp.Id -Force -ErrorAction SilentlyContinue } catch {} }
      - name: Stage verified bootstrap
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-bootstrap | Out-Null
          $installer = (Get-Content "$env:RUNNER_TEMP\installer-path.txt").Trim()
          $blockmap = (Get-Content "$env:RUNNER_TEMP\blockmap-path.txt").Trim()
          $channel = (Get-Content "$env:RUNNER_TEMP\channel-yml-path.txt").Trim()
          $expected = (Get-Content "$env:RUNNER_TEMP\installer-sha256.txt").Trim()
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'bootstrap_digest_changed_before_promotion' }
          Copy-Item $installer 'release-bootstrap\METAENGINE-Browser-Bootstrap-Setup.exe'
          Copy-Item $blockmap 'release-bootstrap\METAENGINE-Browser-Bootstrap-Setup.exe.blockmap'
          Copy-Item $channel 'release-bootstrap\dev.yml'
          [ordered]@{
            schema='metaengine.browser.bootstrap-release.v1'; version=(node -p "require('./package.json').version"); git_sha=$env:GITHUB_SHA; installer_sha256=$actual;
            app_id='com.metaengine.browser'; product_name='METAENGINE Browser'; profile_path='%APPDATA%\METAENGINE Browser'; profile_marker_preserved=$true;
            development_plane_smoke=$true; crash_sentinel_physical_recovery=$true; update_channel='dev'; compatibility_update_asset_prefix='METAENGINE-Browser-Test-Setup-'; production_safe=$false
          } | ConvertTo-Json -Depth 4 | Set-Content 'release-bootstrap\verified-bootstrap-manifest.json'
      - name: Upload verified bootstrap
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metaengine-browser-bootstrap-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/metaengine-browser/release-bootstrap/
          if-no-files-found: error
      - name: Publish bootstrap prerelease
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$env:GITHUB_SHA" | Out-Null
          $installer = Get-Item (Get-Content "$env:RUNNER_TEMP\installer-path.txt")
          $blockmap = Get-Item (Get-Content "$env:RUNNER_TEMP\blockmap-path.txt")
          $channel = Get-Item (Get-Content "$env:RUNNER_TEMP\channel-yml-path.txt")
          $manifest = Get-Item 'release-bootstrap\verified-bootstrap-manifest.json'
          gh release create $tag $installer.FullName $blockmap.FullName $channel.FullName $manifest.FullName --verify-tag --prerelease --title "METAENGINE Browser Bootstrap $tag" --notes "Production-identity in-place development bootstrap. Exact artifact passed contract tests, profile continuity marker, DP smoke, installed window and crash-sentinel recovery. Temporary compatibility update filename prefix remains until the first N-to-N+1 self-update E2E. Not production-safe until Authenticode publisher verification is sealed."
          if ($LASTEXITCODE -ne 0) { throw "bootstrap_release_publish_failed:$tag" }
