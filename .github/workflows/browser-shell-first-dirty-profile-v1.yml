name: METAENGINE Browser Shell-First Dirty Profile V1

on:
  push:
    branches:
      - 'physical/build-slsa-provenance-v1'
    paths:
      - 'apps/metaengine-browser/**'
      - 'apps/metaengine-browser/scripts/qualify-installed-owner-consumer.mjs'
      - 'apps/metaengine-browser/scripts/qualify-installed-client-launch.mjs'
      - 'apps/metaengine-browser/test/installed-owner-consumer.test.mjs'
      - 'infra/client-state-runtime/**'
      - 'supabase/migrations/**'
      - '.github/workflows/browser-shell-first-dirty-profile-v1.yml'
  pull_request:
    paths:
      - 'apps/metaengine-browser/src/main.mjs'
      - 'apps/metaengine-browser/test/shell-first-startup-boundary.test.mjs'
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/electron-builder.test.json'
      - 'apps/metaengine-browser/scripts/qualify-installed-owner-consumer.mjs'
      - 'apps/metaengine-browser/scripts/qualify-installed-client-launch.mjs'
      - 'apps/metaengine-browser/test/installed-owner-consumer.test.mjs'
      - 'infra/client-state-runtime/**'
      - 'supabase/migrations/**'
      - '.github/workflows/browser-shell-first-dirty-profile-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  windows-shell-first-dirty-profile:
    # Chromium proxy isolation does not constrain Node supervisor transport.
    if: github.event_name != 'pull_request' || (github.head_ref != 'work/client-owned-state-runtime-v1' && github.head_ref != 'work/client-runtime-restart-singleton-v1' && github.head_ref != 'work/client-restored-pg17-runtime-repair-v1' && github.head_ref != 'work/client-mcp-offline-installer-qualification-v1' && github.head_ref != 'work/client-mcp-db-connect-operator-v1' && github.head_ref != 'work/client-installed-pg17-setup-wizard-v1' && github.head_ref != 'work/client-github-chat-control-v1' && github.head_ref != 'work/client-github-chat-egress-redaction-v1' && github.head_ref != 'work/client-pg17-auto-prepare-durable-v1' && github.head_ref != 'work/client-github-chat-result-egress-v1' && github.head_ref != 'work/client-pg17-private-windows-acl-v1' && github.head_ref != 'work/client-pg17-private-windows-acl-r2-v1' && github.head_ref != 'work/client-pg17-private-windows-acl-r3-v1' && github.head_ref != 'work/client-pg17-private-windows-acl-r4-v1' && github.head_ref != 'work/client-autonomous-continuity-v1')
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install package dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install frozen disposable runtime fixture dependency
        working-directory: infra/client-state-runtime
        run: npm ci --no-audit --no-fund
      - name: Prove shell-first source boundary
        working-directory: apps/metaengine-browser
        run: |
          node --check src/main.mjs
          node --test test/shell-first-startup-boundary.test.mjs test/installed-owner-consumer.test.mjs

      - name: Acquire one-built exact-head installer from Package Smoke
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          ME2_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = '${{ github.event.pull_request.head.sha || github.sha }}'
          $expectedEvent = '${{ github.event_name }}'
          if ($expectedEvent -notin @('push','pull_request')) { throw "shell_first_producer_event_unsupported:$expectedEvent" }
          $work = Join-Path $env:RUNNER_TEMP 'shell-first-qualified-installer'
          $bindingPath = Join-Path $work 'consumer-binding.json'
          .\scripts\qualified-installer-consumer.ps1 -Mode Acquire -ExpectedHead $expectedHead -ExpectedProducerEvent $expectedEvent -WorkRoot $work -BindingPath $bindingPath -ConfigPath './electron-builder.test.json'
          if ($LASTEXITCODE -ne 0) { throw 'shell_first_qualified_installer_acquire_failed' }
          $binding = Get-Content $bindingPath -Raw | ConvertFrom-Json
          if ($binding.schema -ne 'metaengine.browser.qualified-installer-consumer-binding.v1' `
              -or [string]$binding.source_head -ne $expectedHead `
              -or [string]$binding.producer_event -ne $expectedEvent `
              -or [string]$binding.installer_sha256 -notmatch '^[a-f0-9]{64}$' `
              -or $binding.authority_effect -ne $false) {
            throw 'shell_first_qualified_installer_binding_invalid'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ME2_INSTALLER_BINDING_PATH=$bindingPath" -Encoding utf8
          $installer = Get-Item ([string]$binding.installer_path)
          if (-not $installer) { throw 'shell_first_installer_missing' }
          Copy-Item $installer.FullName "$env:RUNNER_TEMP\shell-first-candidate.exe" -Force
          @{
            schema='metaengine.browser.shell-first-dirty-profile-proof.v2'
            source_head=$expectedHead
            package_version=[string](node -p "require('./package.json').version")
            installer_sha256=[string]$binding.installer_sha256
            producer_run_id=[int64]$binding.producer_run_id
            producer_run_number=[int64]$binding.producer_run_number
            producer_run_attempt=[int64]$binding.producer_run_attempt
            producer_event=[string]$binding.producer_event
            producer_completed_at_acquire=[bool]$binding.producer_completed_at_acquire
            stable_visible=$false
            fleet_degraded=$false
            remote_transport_required_for_shell=$false
            producer_terminal_success=$false
            automatic_retry_allowed=$false
            promotion_authorized=$false
            authority_effect=$false
          } | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP\shell-first-dirty-profile-proof.json" -Encoding utf8
      - name: Install candidate for isolated Owner qualification
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\shell-first-candidate.exe"
          $binding = Get-Content $env:ME2_INSTALLER_BINDING_PATH -Raw | ConvertFrom-Json
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$binding.installer_sha256) { throw 'shell_first_installer_binding_changed' }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "shell_first_installer_exit_$($install.ExitCode)" }

      - name: Prove dirty Fleet state and offline remote cannot close local shell
        working-directory: infra/client-state-runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $head = '${{ github.event.pull_request.head.sha || github.sha }}'
          $version = [string](node -p "require('../../apps/metaengine-browser/package.json').version")
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test'
          $bundle = Join-Path $installRoot 'resources\client-state-runtime'
          $manifest = Get-Content (Join-Path $bundle 'offline-runtime-bundle.json') -Raw | ConvertFrom-Json
          $bundleSha = [string]$manifest.bundle_sha256
          if ($bundleSha -notmatch '^[a-f0-9]{64}$') { throw 'owner_consumer_bundle_digest_invalid' }
          # Every run generates empty schema from reviewed source on a NEW cluster.
          # No user Keeper, Owner, credential file or profile is imported.
          $nodeTemp = (node -p "require('node:os').tmpdir()").Trim()
          if (-not [IO.Path]::IsPathRooted($nodeTemp)) { throw 'owner_consumer_os_temp_invalid' }
          $schema = Join-Path $nodeTemp ('owner-consumer-schema-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $schema -ErrorAction Stop | Out-Null
          $evidence = Join-Path $env:RUNNER_TEMP ('owner-consumer-evidence-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $env:LOCAL_STATE_TEST_ATTACHED_BUNDLE_DIRECTORY = $bundle
          $env:LOCAL_STATE_TEST_ATTACHED_BUNDLE_SHA256 = $bundleSha
          $env:LOCAL_STATE_TEST_PROJECT_PG_BIN_DIR = Join-Path $bundle 'runtime/postgresql/bin'
          $env:LOCAL_STATE_TEST_GENERATED_SCHEMA_DIRECTORY = $schema
          npm run test:attached-onboarding
          if ($LASTEXITCODE -ne 0) { throw 'owner_consumer_generated_schema_failed' }
          $dump = Join-Path $schema 'generated-empty-schema-pg17.dump'
          $schemaSha = (Get-Content (Join-Path $schema 'generated-empty-schema-pg17.sha256') -Raw).Trim()
          if ($schemaSha -notmatch '^[a-f0-9]{64}$' -or $schemaSha -ne (Get-FileHash $dump -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'owner_consumer_schema_pin_drift' }
          $env:LOCAL_STATE_TEST_ATTACHED_SCHEMA_DUMP = $dump
          $env:LOCAL_STATE_TEST_ATTACHED_SCHEMA_DUMP_SHA256 = $schemaSha
          $env:LOCAL_STATE_TEST_ATTACHED_INSTALL_ROOT = $installRoot
          $env:LOCAL_STATE_TEST_ATTACHED_INSTALL_SOURCE_HEAD = $head
          $env:LOCAL_STATE_TEST_ATTACHED_INSTALL_VERSION = $version
          $env:LOCAL_STATE_TEST_ATTACHED_INSTALL_EVIDENCE_DIRECTORY = $evidence
          $env:LOCAL_STATE_TEST_ATTACHED_CONSUMER = 'SHELL_FIRST_DIRTY_PROFILE'
          node --test --test-concurrency=1 attached-bundled-runtime.integration.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'owner_consumer_physical_qualification_failed' }
          $positive = Get-Content (Join-Path $evidence 'installed-owner-consumer-proof.json') -Raw | ConvertFrom-Json
          if ($positive.schema -ne 'metaengine.browser.installed-owner-consumer-proof.v1' -or $positive.state -ne 'PASSED_ISOLATED_REAL_RUNTIME' -or $positive.consumer -ne 'SHELL_FIRST_DIRTY_PROFILE' -or $positive.source_head -ne $head -or $positive.package_version -ne $version -or $positive.bundle_sha256 -ne $bundleSha -or $positive.disposable_pg_cleanup_confirmed -ne $true -or $positive.fixture_directory_removed -ne $true -or $positive.process_cleanup_confirmed -ne $true -or $positive.runtime_ports_closed -ne $true -or $positive.attached_postgres_incarnation_preserved -ne $true -or $positive.installed_source_bytes_verified -ne $true -or $positive.live_agent_execution -ne $false -or $positive.production_ready -ne $false -or $positive.authority_effect -ne $false) { throw 'owner_consumer_receipt_invalid' }
          $binding = Get-Content $env:ME2_INSTALLER_BINDING_PATH -Raw | ConvertFrom-Json
          $proof = @{
            schema='metaengine.browser.shell-first-dirty-profile-proof.v2'
            source_head=$head
            package_version=$version
            installer_sha256=[string]$binding.installer_sha256
            producer_run_id=[int64]$binding.producer_run_id
            producer_run_number=[int64]$binding.producer_run_number
            producer_run_attempt=[int64]$binding.producer_run_attempt
            producer_event=[string]$binding.producer_event
            producer_completed_at_acquire=[bool]$binding.producer_completed_at_acquire
            producer_terminal_success=$false
            owner_consumer=$positive
            schema_archive_sha256=$schemaSha
            generated_schema_owner_qualified=$true
            fixture_disposable_pg_cleanup_confirmed=$true
            live_agent_execution=$false
            production_ready=$false
            promotion_authorized=$false
            automatic_retry_allowed=$false
            authority_effect=$false
          }
          if ($positive.fleet_degraded -ne $true -or $positive.current_os_window_visible -ne $true) { throw 'shell_first_readback_invalid' }
          $proof.stable_visible = $positive.stable_window_verified
          $proof.fleet_degraded = $positive.fleet_degraded
          $proof.remote_transport_required_for_shell = $false
          $proof | ConvertTo-Json -Depth 10 | Set-Content "$env:RUNNER_TEMP\shell-first-dirty-profile-proof.json" -Encoding utf8
      - name: Require exact Package Smoke producer terminal success
        env:
          ME2_GITHUB_TOKEN: ${{ github.token }}
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = '${{ github.event.pull_request.head.sha || github.sha }}'
          $expectedEvent = '${{ github.event_name }}'
          $proofPath = "$env:RUNNER_TEMP\shell-first-dirty-profile-proof.json"
          .\scripts\qualified-installer-consumer.ps1 -Mode Wait -ExpectedHead $expectedHead -ExpectedProducerEvent $expectedEvent -BindingPath $env:ME2_INSTALLER_BINDING_PATH -ProofPath $proofPath
          if ($LASTEXITCODE -ne 0) { throw 'shell_first_package_producer_not_terminal_success' }
          $proof = Get-Content $proofPath -Raw | ConvertFrom-Json
          if ($proof.producer_terminal_success -ne $true `
              -or [string]$proof.producer_event -ne $expectedEvent `
              -or $proof.stable_visible -ne $true `
              -or $proof.fleet_degraded -ne $true `
              -or $proof.authority_effect -ne $false) {
            throw 'shell_first_terminal_proof_invalid'
          }

      - name: Prove tracked Browser source checkout unchanged
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git diff --name-only HEAD -- apps/metaengine-browser/src apps/metaengine-browser/ui apps/metaengine-browser/native apps/metaengine-browser/scripts apps/metaengine-browser/test apps/metaengine-browser/package.json apps/metaengine-browser/electron-builder.test.json)"
