name: METAENGINE Client Current Source Qualification

on:
  push:
    branches:
      - work/metaengine-client-wave12-w73-20261015
      - work/preinstall-closure-20261027
      - work/preinstall-shared-inputs-20261027
  pull_request:
    paths:
      - '.github/workflows/client-source-candidate-w73.yml'
      - '.github/workflows/client-source-candidate-w59.yml'
      - '.github/client-ci-train-w82.test.mjs'
      - 'apps/metaengine-browser/**'
      - 'apps/me2-ui/**'
      - 'infra/client-state-runtime/**'
      - 'coordination/operator-control/client-critical-closure.manifest.json'
      - 'coordination/operator-control/client-source-candidate-w73.manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-integrated-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify one full clean source and install frozen source-test dependencies
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git config --bool core.sparseCheckout || echo false)" = false
          test -z "$(git status --porcelain)"
          npm ci --prefix infra/client-state-runtime --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/metaengine-browser --ignore-scripts --no-audit --no-fund
      - name: Build the native job helper before Windows runtime contracts
        if: runner.os == 'Windows'
        working-directory: apps/metaengine-browser
        run: node scripts/prepare-codex-cli-job-runtime.mjs
      - name: Windows UI physical roots, inert harness and actual W73 registration
        if: runner.os == 'Windows'
        working-directory: apps/me2-ui
        shell: pwsh
        # Only filesystem/source fixtures and owned inert Node children. The
        # existing wrapper creates a disposable profile before test imports.
        # Keep this before the seal: an unsealed branch must still fail below.
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'w73_ui_windows_hosted_runner_required'
          }
          $tap = Join-Path $env:RUNNER_TEMP 'w73-windows-ui-root-contracts.tap'
          node ../metaengine-browser/scripts/run-isolated-tests.mjs --test-concurrency=1 --test-reporter=tap scripts/ui-runtime-inventory.test.mjs scripts/ui-source-acceptance.test.mjs | Tee-Object -FilePath $tap
          if ($LASTEXITCODE -ne 0) { throw 'w73_ui_windows_contracts_failed' }
          @'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const lines = fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/);
          assert.ok(!lines.some(line => /^Bail out!/i.test(line)), 'TAP bailout');
          const results = lines.flatMap(line => {
            const match = /^(ok|not ok) \d+ - (.+?)(?: # (SKIP|TODO)(?: .*)?)?$/.exec(line);
            return match ? [{ status: match[1], name: match[2], directive: match[3] ?? null }] : [];
          });
          const requiredPass = [
            'an initially supplied root symlink or Windows junction is refused',
            'root rename followed by a symlink or Windows junction cannot retain a PASS',
            'a byte-identical replacement directory cannot reuse the original physical binding',
            'a root reached through a symlink or Windows junction ancestor is refused',
            'a legacy content-only snapshot cannot establish physical-root immutability',
            'the harness refuses an original root symlink or Windows junction before creating evidence or launching children',
            'W73 invoked package scripts execute all new UI acceptance regressions',
          ];
          // Existing POSIX controls cannot establish Windows ACL/signal proof.
          // No junction, physical-root or registration case may be skipped.
          const allowedSkips = new Set([
            'runtime inventory rejects . mode changes',
            'runtime inventory rejects empty mode changes',
            'runtime inventory rejects server.js mode changes',
            'same-byte link retargeting and file-to-link replacement are detected',
            'internal absolute links retain relocatable identity without executor paths',
            'escaping links, directory cycles and dangling links cannot qualify a snapshot',
            'a running owned server may exit 0 after the harness requests SIGTERM',
            'a running owned server may exit 143 after the harness requests SIGTERM',
            'an ordinary owned SIGTERM signal exit is accepted',
            'a nonzero failure after the owned SIGTERM request is rejected',
            'SIGKILL cleanup of an unresponsive owned child never qualifies as graceful acceptance',
          ]);
          assert.equal(results.length, 32, 'both complete UI fixture files must execute');
          assert.equal(new Set(results.map(row => row.name)).size, 32, 'duplicate test result');
          assert.ok(results.every(row => row.status === 'ok' && row.directive !== 'TODO'), 'failed or TODO test');
          for (const name of requiredPass) {
            const rows = results.filter(row => row.name === name);
            assert.equal(rows.length, 1, 'missing required Windows case: ' + name);
            assert.equal(rows[0].directive, null, 'required Windows case was skipped: ' + name);
          }
          const skipped = results.filter(row => row.directive === 'SKIP');
          assert.equal(skipped.length, allowedSkips.size, 'unexpected Windows skip count');
          assert.ok(skipped.every(row => allowedSkips.has(row.name)), 'unexpected skipped Windows case');
          for (const [key, expected] of Object.entries({tests:32, pass:21, fail:0, cancelled:0, skipped:11, todo:0})) {
            assert.deepEqual(lines.filter(line => line.startsWith('# ' + key + ' ')), ['# ' + key + ' ' + expected], 'TAP summary ' + key);
          }
          assert.deepEqual(lines.filter(line => /^\d+\.\.\d+/.test(line)), ['1..32'], 'TAP plan');
          console.log('W73 Windows UI: 21 PASS, 11 explicitly allowed POSIX skips; all 7 physical-root/harness/registration controls PASS.');
          '@ | node --input-type=module - $tap
          if ($LASTEXITCODE -ne 0) { throw 'w73_ui_windows_required_evidence_failed' }
      - name: Immutable W43-W73 historical ledgers and current critical-closure source seal
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            infra/client-state-runtime/client-source-candidate-w43.test.mjs \
            infra/client-state-runtime/client-source-candidate-w51.test.mjs \
            infra/client-state-runtime/client-source-candidate-w59.test.mjs \
            infra/client-state-runtime/client-source-candidate-w66.test.mjs \
            infra/client-state-runtime/client-source-candidate-w73.test.mjs \
            infra/client-state-runtime/client-critical-closure.test.mjs \
            infra/client-state-runtime/client-candidate-acceptance-w65.test.mjs \
            infra/client-state-runtime/client-c2-existing-worker-w71.test.mjs \
            infra/client-state-runtime/client-current-acl-critic-w72.test.mjs \
            infra/client-state-runtime/client-candidate-acceptance-w57.test.mjs
      - name: Full Client State Runtime Contracts in an isolated profile
        shell: bash
        env:
          APPDATA: ${{ runner.temp }}/critical-client-profile/roaming
          LOCALAPPDATA: ${{ runner.temp }}/critical-client-profile/local
          XDG_CONFIG_HOME: ${{ runner.temp }}/critical-client-profile/config
          XDG_CACHE_HOME: ${{ runner.temp }}/critical-client-profile/cache
        # Includes client-backup-acl-native-w58.test.mjs and
        # client-backup-acl-native-w58.ipc.test.mjs once, including real Windows
        # DACL/file-ID/inheritance/Owner/restore negatives. Do not repeat the
        # same expensive native suite in later source-only steps.
        run: npm --prefix infra/client-state-runtime test
      - name: Complete Browser source and transport regression suite in an isolated profile
        working-directory: apps/metaengine-browser
        shell: bash
        env:
          APPDATA: ${{ runner.temp }}/critical-browser-profile/roaming
          LOCALAPPDATA: ${{ runner.temp }}/critical-browser-profile/local
          XDG_CONFIG_HOME: ${{ runner.temp }}/critical-browser-profile/config
          XDG_CACHE_HOME: ${{ runner.temp }}/critical-browser-profile/cache
        # Includes host-owner-custody-w67.test.mjs, every W74-W79 Browser
        # contract, source sync, native authenticated IPC and SelfUpdate units.
        # Quote the glob so Node expands it without Windows command-line overflow.
        run: |
          set -euo pipefail
          npm run check
          # The real Electron MAIN_PROCESS ASAR regression needs a display.
          # Keep the complete suite and its default main-process qualification.
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node --test --test-concurrency=4 'test/*.test.mjs'
          else
            node --test --test-concurrency=4 'test/*.test.mjs'
          fi
      - name: Additional disposable coding, backup, critic and CI-train contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            infra/client-state-runtime/client-backup-restore-staging-w47.test.mjs \
            infra/client-state-runtime/upgrade-backup-gate.test.mjs \
            infra/client-state-runtime/upgrade-backup-restore-gate.test.mjs \
            infra/client-state-runtime/client-serial-loop-staging-w48.test.mjs \
            infra/client-state-runtime/client-serial-loop-staging-w56.test.mjs \
            infra/client-state-runtime/own-postgres-birth-w61.test.mjs \
            infra/client-state-runtime/client-c2-worker-edit-w80.test.mjs \
            infra/client-state-runtime/client-current-acl-critic-w81.test.mjs
          node --test .github/client-ci-train-w82.test.mjs
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  frozen-me2-seven-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ME2_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.3'
      - name: Frozen ME2 seven view tests, typecheck, build and pack
        working-directory: apps/me2-ui
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test:operator-observatory
          bun run test:operator-primary
          bun run test:goal-admission
          bun run test:project-history
          bun run test:recovery
          bun run typecheck
          bun run build
          bun run pack
          node -e "const m=require('./me2-ui-dist/me2-ui-manifest.json');if(m.schema!=='me2.ui-bundle-manifest.v1'||m.git_sha!==process.env.ME2_BUILD_SHA)process.exit(1)"

