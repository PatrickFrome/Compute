name: C5 Fleet Target Revalidation

on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/src/fleet-target-revalidation.mjs'
      - 'apps/metaengine-browser/test/fleet-target-revalidation.test.mjs'
      - '.github/workflows/c5-fleet-target-revalidation.yml'

permissions:
  contents: read

concurrency:
  group: c5-fleet-target-revalidation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify fresh target revalidation contract
        run: node --test apps/metaengine-browser/test/fleet-target-revalidation.test.mjs
