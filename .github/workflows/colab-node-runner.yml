name: colab-node-runner
# ME2 CHAT-SWARM: запускает узел роя на GitHub Actions (CPU-раннер) вместо Google Colab.
# Цикл: ollama + qwen3:8b -> cloudflared quick-tunnel -> публикация tunnel-URL
# в colab/last-tunnel.json (этой же веткой). Песочница забирает файл и
# регистрирует узел у роя: POST /colab/register?XTransformPort=3046.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 */5 * * *'   # самовосстановление узла каждые 5 часов
permissions:
  contents: write
concurrency:
  group: colab-node-runner
  cancel-in-progress: false
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 330     # ~5.5ч (6ч лимит раннера минус запас)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: context-vault
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start ollama serve
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -s http://127.0.0.1:11434/api/tags | head -c 200
      - name: Pull model qwen3:8b
        run: ollama pull qwen3:8b && ollama list
      - name: Self-test one chat call
        run: |
          curl -s http://127.0.0.1:11434/api/chat -d '{
            "model":"qwen3:8b","stream":false,
            "messages":[{"role":"user","content":"Reply with one word: alive"}],
            "options":{"num_predict":16}
          }' | head -c 400
      - name: Install cloudflared
        run: |
          wget -q -O cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
      - name: Start quick tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:11434 --no-autoupdate > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "TUNNEL FAILED"; tail -20 tunnel.log; exit 1; fi
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
          echo "TUNNEL_URL=$URL"
      - name: Publish tunnel URL to repo (rendezvous)
        run: |
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_id="${GITHUB_RUN_ID}"
          cat > colab/last-tunnel.json <<EOF
          {"url": "$TUNNEL_URL", "model": "qwen3:8b", "name": "gha-qwen3-8b", "publishedAt": "$ts", "runId": "$run_id"}
          EOF
          git config user.email "runner@me2-swarm.local"
          git config user.name "colab-node-runner"
          git add colab/last-tunnel.json
          git commit -m "node rendezvous $ts run=$run_id"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:context-vault
      - name: Keep node alive (probe loop)
        run: |
          # держим раннер живым; ollama+cloudflared уже в фоне
          end=$((SECONDS + 18000))
          while [ $SECONDS -lt $end ]; do
            sleep 300
            curl -s --max-time 10 http://127.0.0.1:11434/api/tags >/dev/null || (nohup ollama serve >> ollama.log 2>&1 &)
          done
