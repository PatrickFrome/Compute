name: C0 Restart Effect Receipt Audit V1

on:
  push:
    branches:
      - 'work/browser-continuous-fleet-audit-v1'
    paths:
      - 'supabase/migrations/20260901235500_compute_unified_restart_actuator_precondition_v2.sql'
      - 'supabase/migrations/20260901144500_compute_unified_restart_effect_receipt_v1.sql'
      - 'supabase/migrations/20260901154500_compute_unified_restart_effect_receipt_persistence_v1.sql'
      - 'supabase/migrations/20260901165000_compute_unified_restart_effect_receipt_readback_v1.sql'
      - 'apps/metaengine-browser/test/c0-restart-effect-receipt-readback-smoke.sql'
      - '.github/workflows/c0-restart-effect-receipt-audit-v1.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260901235500_compute_unified_restart_actuator_precondition_v2.sql'
      - 'supabase/migrations/20260901144500_compute_unified_restart_effect_receipt_v1.sql'
      - 'supabase/migrations/20260901154500_compute_unified_restart_effect_receipt_persistence_v1.sql'
      - 'supabase/migrations/20260901165000_compute_unified_restart_effect_receipt_readback_v1.sql'
      - 'apps/metaengine-browser/test/c0-restart-effect-receipt-readback-smoke.sql'
      - '.github/workflows/c0-restart-effect-receipt-audit-v1.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove exact candidate head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'exact_head=%s\n' "$EXPECTED_HEAD"

      - name: Reject legacy quiescence restart blockers in v2
        run: |
          set -euo pipefail
          FILE=supabase/migrations/20260901235500_compute_unified_restart_actuator_precondition_v2.sql
          ! grep -Eiq "supervisor_generation[^\n]*(IDLE)|NOT_QUIESCENT|pending_wakes[^\n]*= *0|queued_wakes[^\n]*= *0|active_request[^\n]*is null" "$FILE"
          grep -q "verified_download_mutation_active" "$FILE"
          grep -q "active_actuation_lease" "$FILE"
          grep -q "effect_must_be_single_shot" "$FILE"
          grep -q "automatic_retry_allowed', false" "$FILE"

      - name: Continuity precondition, durable restart receipt, and no-retry falsification
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f apps/metaengine-browser/test/c0-restart-effect-receipt-readback-smoke.sql

      - name: Reject pre-existing rogue receipt ledger
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U postgres c0_collision
          psql -h 127.0.0.1 -U postgres -d c0_collision -v ON_ERROR_STOP=1 \
            -c 'create table public.compute_unified_restart_effect_receipt_h205f22 (rogue text);'
          set +e
          psql -h 127.0.0.1 -U postgres -d c0_collision -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260901154500_compute_unified_restart_effect_receipt_persistence_v1.sql \
            >"${RUNNER_TEMP}/c0-collision.log" 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -qi 'already exists' "${RUNNER_TEMP}/c0-collision.log"
          printf 'rogue_schema_rejected=true\n'

      - name: Prove migration remains branch-local
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'production_mutation=false\n'
