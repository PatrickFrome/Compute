name: Browser Windows Package Smoke

on:
  push:
    branches:
      - 'work/browser-continuous-fleet-audit-v1'
      - 'release/self-update-ambiguity-live-v2'
  pull_request:
    paths:
      - 'apps/metaengine-browser/**'
      - 'apps/metaengine-browser/src/**'
      - 'apps/metaengine-browser/ui/**'
      - 'apps/metaengine-browser/native/**'
      - 'apps/metaengine-browser/scripts/build-guardian-native-staging.ps1'
      - 'apps/metaengine-browser/scripts/electron-builder-before-pack.cjs'
      - 'apps/metaengine-browser/scripts/verify-installed-guardian-native-staging.ps1'
      - 'apps/metaengine-browser/test/browser-startup-observability.test.mjs'
      - 'apps/metaengine-browser/test/browser-shell-visual-evidence.mjs'
      - 'apps/metaengine-browser/test/me2-r85-visual-evidence.mjs'
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/electron-builder.test.json'
      - 'apps/metaengine-browser/scripts/verify-me2-ui-bundle.mjs'
      - 'apps/metaengine-browser/scripts/build-me2-daemon-staging.ps1'
      - 'apps/metaengine-browser/scripts/verify-me2-daemon-bundle.mjs'
      - 'apps/me2-ui/**'
      - 'apps/me2-daemon/**'
      - '.github/workflows/browser-windows-installed-chat-qualification.yml'
      - '.github/workflows/browser-final-runtime-activation-v1.yml'
      - '.github/workflows/browser-windows-autonomous-soak-v1.yml'
      - '.github/workflows/metaengine-browser-self-update-e2e.yml'
      - '.github/workflows/browser-shell-first-dirty-profile-v1.yml'
      - '.github/workflows/browser-windows-package-smoke.yml'

permissions:
  actions: read
  contents: read

jobs:
  package_identity_preflight:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.identity.outputs.package_version }}
      source_head: ${{ steps.identity.outputs.source_head }}
    steps:
      - name: Checkout exact candidate head for identity preflight
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse workflow reruns and expose package identity
        id: identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "package_identity_rerun_requires_new_source_and_version" >&2
            exit 1
          fi
          version="$(node -p "require('./apps/metaengine-browser/package.json').version")"
          if [[ ! "$version" =~ ^0\.7\.0-dev\.[0-9]+\.1$ ]]; then
            echo "package_identity_version_invalid:$version" >&2
            exit 1
          fi
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          echo "source_head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

  windows-nsis-package-smoke:
    needs: package_identity_preflight
    runs-on: windows-2025
    timeout-minutes: 35
    concurrency:
      group: browser-windows-package-version-${{ needs.package_identity_preflight.outputs.package_version }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup frozen Browser Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Setup frozen Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.3'

      - name: Refuse duplicate source/version physical build
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          ME2_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/package-build-reservation.mjs `
            --repository "$env:GITHUB_REPOSITORY" `
            --source-head "${{ needs.package_identity_preflight.outputs.source_head }}" `
            --package-version "${{ needs.package_identity_preflight.outputs.package_version }}" `
            --run-id "$env:GITHUB_RUN_ID" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --out "$env:RUNNER_TEMP\package-build-reservation.json"
          if ($LASTEXITCODE -ne 0) { throw 'package_build_reservation_preflight_failed' }

      - name: Publish immutable package-version reservation
        id: version_reservation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-package-version-${{ needs.package_identity_preflight.outputs.package_version }}
          path: ${{ runner.temp }}/package-build-reservation.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Seal package-version reservation before physical build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactId = [string]'${{ steps.version_reservation.outputs.artifact-id }}'
          $artifactDigestRaw = ([string]'${{ steps.version_reservation.outputs.artifact-digest }}').Trim().ToLowerInvariant()
          if ($artifactId -notmatch '^[0-9]+$') { throw 'package_version_reservation_artifact_id_missing' }
          if ($artifactDigestRaw -match '^[a-f0-9]{64}$') {
            $artifactDigest = "sha256:$artifactDigestRaw"
          } elseif ($artifactDigestRaw -match '^sha256:[a-f0-9]{64}$') {
            $artifactDigest = $artifactDigestRaw
          } else {
            throw 'package_version_reservation_artifact_digest_invalid'
          }
          @{
            schema='metaengine.browser.package-version-reservation-seal.v1'
            source_head='${{ needs.package_identity_preflight.outputs.source_head }}'
            package_version='${{ needs.package_identity_preflight.outputs.package_version }}'
            run_id=[int64]$env:GITHUB_RUN_ID
            run_attempt=[int]$env:GITHUB_RUN_ATTEMPT
            reservation_artifact_id=[int64]$artifactId
            reservation_artifact_digest=$artifactDigest
            automatic_retry_allowed=$false
            promotion_authorized=$false
            authority_effect=$false
          } | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP\package-version-reservation-seal.json" -Encoding utf8

      - name: Prove frozen package-lock material before dependency install
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string](node --version) -ne 'v24.21.0') { throw 'package_lock_node_version_drift' }
          if ([string](npm --version) -ne '11.19.0') { throw 'package_lock_npm_version_drift' }
          if ([string](bun --version) -ne '1.3.3') { throw 'package_bun_version_drift' }
          $uiBunLock = "$env:GITHUB_WORKSPACE\apps\me2-ui\bun.lock"
          if (-not (Test-Path $uiBunLock -PathType Leaf)) { throw 'package_me2_ui_bun_lock_missing' }
          node scripts/package-lock-material.mjs --root . --out "$env:RUNNER_TEMP\package-lock-material.json"
          if ($LASTEXITCODE -ne 0) { throw 'package_lock_material_capture_failed' }
          $material = Get-Content "$env:RUNNER_TEMP\package-lock-material.json" -Raw | ConvertFrom-Json
          if ($material.schema -ne 'metaengine.browser.package-lock-material.v1' `
              -or [string]$material.package_lock_sha256 -notmatch '^[a-f0-9]{64}$' `
              -or [string]$material.package_version -ne '${{ needs.package_identity_preflight.outputs.package_version }}' `
              -or [string]$material.node_version -ne 'v24.21.0' `
              -or [string]$material.npm_version -ne '11.19.0' `
              -or $material.authority_effect -ne $false) {
            throw 'package_lock_material_contract_invalid'
          }
          Write-Host ($material | ConvertTo-Json -Compress -Depth 5)

      - name: Install exact frozen Browser dependency tree
        working-directory: apps/metaengine-browser
        run: npm ci --no-audit --no-fund

      - name: Capture exact installed dependency resolution
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/dependency-resolution-digest.mjs --out "$env:RUNNER_TEMP\dependency-resolution.json"
          if ($LASTEXITCODE -ne 0) { throw 'dependency_resolution_capture_failed' }
          $proof = Get-Content "$env:RUNNER_TEMP\dependency-resolution.json" -Raw | ConvertFrom-Json
          if ($proof.schema -ne 'metaengine.browser.dependency-resolution.v1' -or [string]$proof.dependency_resolution_sha256 -notmatch '^[a-f0-9]{64}$' -or [int]$proof.dependency_count -lt 1 -or $proof.authority_effect -ne $false) { throw 'dependency_resolution_proof_invalid' }
          Write-Host ($proof | Select-Object schema,root_name,root_version,node_version,npm_version,dependency_count,dependency_resolution_sha256,authority_effect | ConvertTo-Json -Compress)

      - name: Generate npm CycloneDX SBOM evidence
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm sbom --sbom-format=cyclonedx --sbom-type=application | Set-Content "$env:RUNNER_TEMP\npm-sbom.cdx.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'package_npm_sbom_generation_failed' }
          node scripts/npm-sbom-evidence.mjs `
            --sbom "$env:RUNNER_TEMP\npm-sbom.cdx.json" `
            --package-json package.json `
            --package-lock-material "$env:RUNNER_TEMP\package-lock-material.json" `
            --dependency-resolution "$env:RUNNER_TEMP\dependency-resolution.json" `
            --source-head "${{ github.event.pull_request.head.sha || github.sha }}" `
            --out "$env:RUNNER_TEMP\npm-sbom-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw 'package_npm_sbom_evidence_failed' }
          $sbom = Get-Content "$env:RUNNER_TEMP\npm-sbom-evidence.json" -Raw | ConvertFrom-Json
          $lock = Get-Content "$env:RUNNER_TEMP\package-lock-material.json" -Raw | ConvertFrom-Json
          $dep = Get-Content "$env:RUNNER_TEMP\dependency-resolution.json" -Raw | ConvertFrom-Json
          if ($sbom.schema -ne 'metaengine.browser.npm-sbom-evidence.v1' `
              -or [string]$sbom.semantic_inventory_sha256 -notmatch '^[a-f0-9]{64}$' `
              -or [string]$sbom.raw_sbom_sha256 -notmatch '^[a-f0-9]{64}$' `
              -or [string]$sbom.package_lock_sha256 -ne [string]$lock.package_lock_sha256 `
              -or [string]$sbom.dependency_resolution_sha256 -ne [string]$dep.dependency_resolution_sha256 `
              -or [string]$sbom.package_version -ne '${{ needs.package_identity_preflight.outputs.package_version }}' `
              -or [int]$sbom.component_count -lt 1 `
              -or $sbom.authority_effect -ne $false) {
            throw 'package_npm_sbom_contract_invalid'
          }
          Write-Host ($sbom | ConvertTo-Json -Compress -Depth 4)

      - name: Compute expected Build Identity V3 before packaging
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceHead = '${{ github.event.pull_request.head.sha || github.sha }}'
          $version = [string](node -p "require('./package.json').version")
          node scripts/build-identity-cli.mjs `
            --out "$env:RUNNER_TEMP\expected-build-identity.json" `
            --repository "$env:GITHUB_REPOSITORY" `
            --repository-id "$env:GITHUB_REPOSITORY_ID" `
            --source-head $sourceHead `
            --workflow browser-windows-package-smoke.yml `
            --run-id "$env:GITHUB_RUN_ID" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --package-version $version `
            --platform win32 `
            --arch x64 `
            --config electron-builder.test.json `
            --dependency-resolution "$env:RUNNER_TEMP\dependency-resolution.json" `
            --package-lock-material "$env:RUNNER_TEMP\package-lock-material.json" `
            --me2-ui-bun-lock "$env:GITHUB_WORKSPACE\apps\me2-ui\bun.lock" `
            --package-json package.json `
            --package-lock package-lock.json `
            --bun-version 1.3.3 `
            --electron-builder-version 26.15.7
          if ($LASTEXITCODE -ne 0) { throw 'expected_build_identity_create_failed' }

      - name: Parse exact source before packaging
        working-directory: apps/metaengine-browser
        run: npm run check

      - name: Prove startup observability reducer before packaging
        working-directory: apps/metaengine-browser
        run: node --test test/browser-startup-observability.test.mjs

      - name: Capture deterministic shell-only visual evidence
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          METAENGINE_VISUAL_EVIDENCE_DIR: ${{ runner.temp }}\browser-shell-visual
        run: |
          $ErrorActionPreference = 'Stop'
          node --check test/browser-shell-visual-evidence.mjs
          New-Item -ItemType Directory -Force -Path $env:METAENGINE_VISUAL_EVIDENCE_DIR | Out-Null
          & .\node_modules\.bin\electron.cmd .\test\browser-shell-visual-evidence.mjs
          if ($LASTEXITCODE -ne 0) { throw "visual_evidence_electron_exit_$LASTEXITCODE" }
          $evidencePath = Join-Path $env:METAENGINE_VISUAL_EVIDENCE_DIR 'visual-evidence.json'
          if (-not (Test-Path $evidencePath -PathType Leaf)) { throw 'visual_evidence_json_missing' }
          $evidence = Get-Content $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.schema -ne 'metaengine.browser-shell.visual-evidence.v1') { throw 'visual_evidence_schema_invalid' }
          if ($evidence.shell_only_capture -ne $true -or $evidence.remote_browser_content_captured -ne $false) { throw 'visual_evidence_scope_invalid' }
          if ($evidence.golden_comparison_enabled -ne $false -or $evidence.authority_effect -ne $false) { throw 'visual_evidence_authority_invalid' }
          if ($evidence.route_reset.command_mode -ne 'CMD' -or $evidence.route_reset.restored_mode -ne 'CHAT' -or $evidence.route_reset.restored_chat_class -ne $true) { throw 'visual_evidence_route_reset_invalid' }
          if (@($evidence.captures).Count -ne 2) { throw 'visual_evidence_capture_count_invalid' }
          foreach ($capture in @($evidence.captures)) {
            if ($capture.metrics.systems_visible -ne $false) { throw "visual_evidence_legacy_health_strip_visible:$($capture.name)" }
            if ([string]$capture.metrics.body_operations -ne 'CLOSED') { throw "visual_evidence_advanced_panel_not_closed:$($capture.name)" }
            if ([int64]$capture.bytes -lt 4096 -or -not [string]$capture.sha256) { throw "visual_evidence_png_invalid:$($capture.name)" }
            $pngPath = Join-Path $env:METAENGINE_VISUAL_EVIDENCE_DIR ([string]$capture.file)
            if (-not (Test-Path $pngPath -PathType Leaf)) { throw "visual_evidence_png_missing:$($capture.name)" }
          }
          Write-Host ($evidence | ConvertTo-Json -Compress -Depth 8)

      - name: Build and stage exact-head ME2 UI
        shell: pwsh
        env:
          ME2_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string](bun --version) -ne '1.3.3') { throw 'me2_ui_bun_version_drift' }

          $sourceUi = Join-Path $env:GITHUB_WORKSPACE 'apps\me2-ui'
          $sourceLock = Join-Path $sourceUi 'bun.lock'
          $sourceLockSha = (Get-FileHash $sourceLock -Algorithm SHA256).Hash.ToLowerInvariant()
          $uiRoot = Join-Path $env:RUNNER_TEMP 'me2-ui-package-source'
          Remove-Item $uiRoot -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force $sourceUi $uiRoot
          $tempLock = Join-Path $uiRoot 'bun.lock'
          $tempLockSha = (Get-FileHash $tempLock -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tempLockSha -ne $sourceLockSha) { throw 'me2_ui_temp_lock_copy_drift' }

          Push-Location $uiRoot
          try {
            bun ci
            if ($LASTEXITCODE -ne 0) { throw 'me2_ui_bun_ci_failed' }
            $afterCiLockSha = (Get-FileHash $tempLock -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($afterCiLockSha -ne $sourceLockSha) { throw 'me2_ui_bun_ci_lock_mutation' }

            bun run build
            if ($LASTEXITCODE -ne 0) { throw 'me2_ui_build_failed' }
            node scripts/pack-me2-ui.mjs
            if ($LASTEXITCODE -ne 0) { throw 'me2_ui_pack_failed' }
          } finally { Pop-Location }

          $uiDist = Join-Path $uiRoot 'me2-ui-dist'
          node apps/metaengine-browser/scripts/verify-me2-ui-bundle.mjs --root $uiDist --expected-sha $env:ME2_BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'package_smoke_temp_me2_ui_invalid' }

          Remove-Item apps/metaengine-browser/me2-ui-dist -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force $uiDist apps/metaengine-browser/me2-ui-dist
          node apps/metaengine-browser/scripts/verify-me2-ui-bundle.mjs --root apps/metaengine-browser/me2-ui-dist --expected-sha $env:ME2_BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'package_smoke_staged_me2_ui_invalid' }

      - name: Capture R97 primary chat-fleet visual evidence
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          ME2_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          METAENGINE_R85_VISUAL_UI_DIR: ${{ github.workspace }}\apps\metaengine-browser\me2-ui-dist
          METAENGINE_R85_VISUAL_EVIDENCE_DIR: ${{ runner.temp }}\r85-primary-visual
        run: |
          $ErrorActionPreference = 'Stop'
          node --check test/me2-r85-visual-evidence.mjs
          if ($LASTEXITCODE -ne 0) { throw "r85_visual_harness_parse_exit_$LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path $env:METAENGINE_R85_VISUAL_EVIDENCE_DIR | Out-Null
          $electron = Join-Path (Resolve-Path '.\node_modules\electron\dist').Path 'electron.exe'
          if (-not (Test-Path $electron -PathType Leaf)) { throw 'r85_visual_electron_binary_missing' }
          $visualOut = Join-Path $env:RUNNER_TEMP 'r85-primary-visual.stdout.log'
          $visualErr = Join-Path $env:RUNNER_TEMP 'r85-primary-visual.stderr.log'
          Remove-Item $visualOut,$visualErr -Force -ErrorAction SilentlyContinue
          $visual = Start-Process -FilePath $electron -ArgumentList '.\test\me2-r85-visual-evidence.mjs' -PassThru -NoNewWindow -RedirectStandardOutput $visualOut -RedirectStandardError $visualErr
          $null = $visual.Handle
          if (-not $visual.WaitForExit(135000)) {
            cmd.exe /d /c "taskkill.exe /PID $($visual.Id) /T /F >nul 2>&1 & exit /b 0" | Out-Null
            Get-Content $visualOut -ErrorAction SilentlyContinue
            Get-Content $visualErr -ErrorAction SilentlyContinue
            throw 'r85_visual_evidence_process_timeout'
          }
          $visual.WaitForExit()
          Get-Content $visualOut -ErrorAction SilentlyContinue
          Get-Content $visualErr -ErrorAction SilentlyContinue
          if ($visual.ExitCode -ne 0) { throw "r85_visual_evidence_electron_exit_$($visual.ExitCode)" }
          $evidencePath = Join-Path $env:METAENGINE_R85_VISUAL_EVIDENCE_DIR 'r85-visual-evidence.json'
          if (-not (Test-Path $evidencePath -PathType Leaf)) { throw 'r85_visual_evidence_json_missing' }
          $evidence = Get-Content $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.schema -ne 'metaengine.browser.r97-visual-evidence.v1') { throw 'r97_visual_evidence_schema_invalid' }
          if ([string]$evidence.source_head -ne [string]$env:ME2_BUILD_SHA) { throw 'r85_visual_evidence_source_head_drift' }
          if ($evidence.primary_me2_ui_captured -ne $true `
              -or $evidence.legacy_shell_captured -ne $false `
              -or $evidence.remote_browser_content_captured -ne $false `
              -or $evidence.remote_browser_transport_blocked -ne $true `
              -or -not (@($evidence.blocked_remote_browser_ports) -contains '3042') `
              -or -not (@($evidence.blocked_remote_browser_ports) -contains '3043') `
              -or $evidence.exact_main_workspace -ne $true `
              -or $evidence.advanced_surfaces_settings_only -ne $true `
              -or $evidence.command_search_available -ne $true `
              -or $evidence.command_palette_legibility_verified -ne $true `
              -or $evidence.command_palette_focus_verified -ne $true `
              -or $evidence.native_geometry_verified -ne $true `
              -or $evidence.narrow_agent_picker_verified -ne $true `
              -or $evidence.goal_status_focus_verified -ne $true `
              -or $evidence.settings_routes_verified -ne $true `
              -or $evidence.settings_loading_bounded -ne $true `
              -or $evidence.connected_not_ready_verified -ne $true `
              -or $evidence.positive_readiness_verified -ne $true `
              -or $evidence.paused_readiness_verified -ne $true `
              -or $evidence.stale_readiness_cleared -ne $true `
              -or $evidence.selection_fail_closed -ne $true `
              -or $evidence.ime_submission_guard_verified -ne $true `
              -or $evidence.goal_submit_once_verified -ne $true `
              -or $evidence.presentation_only -ne $true `
              -or $evidence.authority_effect -ne $false) {
            throw 'r97_visual_evidence_contract_invalid'
          }
          if ($evidence.readiness_subject.kind -ne 'CONTROLLED_NATIVE_IPC_FIXTURE' -or $evidence.readiness_subject.live_agent_execution -ne $false) { throw 'ui1_readiness_evidence_subject_invalid' }
          if (@($evidence.captures).Count -ne 11) { throw 'ui1_visual_evidence_capture_count_invalid' }
          if (-not (@($evidence.captures).name -contains 'r97-chat-fleet-main-1440x960')) { throw 'r97_visual_evidence_main_capture_missing' }
          if (-not (@($evidence.captures).name -contains 'r97-client-goal-admitted-1440x960')) { throw 'r97_visual_evidence_client_goal_capture_missing' }
          if (-not (@($evidence.captures).name -contains 'r97-chat-fleet-agent-selected-1440x960')) { throw 'r97_visual_evidence_agent_selection_capture_missing' }
          if (-not (@($evidence.captures).name -contains 'r97-settings-advanced-surface-1440x960')) { throw 'r97_visual_evidence_settings_capture_missing' }
          if (-not (@($evidence.captures).name -contains 'r97-command-search-1440x960')) { throw 'r97_visual_evidence_search_capture_missing' }
          foreach ($capture in @($evidence.captures)) {
            $digest = [string]$capture.sha256
            if ([int64]$capture.bytes -lt 4096 -or $digest.Length -ne 64 -or $digest -notmatch '^[a-f0-9]+') {
              throw "r85_visual_evidence_png_invalid:$($capture.name)"
            }
            $png = Join-Path $env:METAENGINE_R85_VISUAL_EVIDENCE_DIR ([string]$capture.file)
            if (-not (Test-Path $png -PathType Leaf)) { throw "r85_visual_evidence_png_missing:$($capture.name)" }
          }
          Write-Host ($evidence | ConvertTo-Json -Compress -Depth 10)

      - name: Build exact-head unsigned NSIS package through native staging hook
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ME2_BUILD_IDENTITY_REQUIRED: 'true'
          ME2_BUILD_IDENTITY_VERSION: '3'
          ME2_DEPENDENCY_RESOLUTION_PATH: ${{ runner.temp }}\dependency-resolution.json
          ME2_PACKAGE_LOCK_MATERIAL_PATH: ${{ runner.temp }}\package-lock-material.json
          ME2_NPM_VERSION: '11.19.0'
          ME2_BUN_VERSION: '1.3.3'
          ME2_BUN_TOOLCHAIN_REQUIRED: 'true'
          ME2_UI_BUN_LOCK_PATH: ${{ github.workspace }}\apps\me2-ui\bun.lock
          ME2_BUILD_WORKFLOW: browser-windows-package-smoke.yml
          ME2_BUILD_ARCH: x64
          ME2_ELECTRON_BUILDER_VERSION: 26.15.7
        run: |
          $sourceHead = '${{ github.event.pull_request.head.sha || github.sha }}'
          $version = [string](node -p "require('./package.json').version")
          if (-not $version) { throw 'package_version_missing' }
          Remove-Item dist-test -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item native-dist\guardian -Recurse -Force -ErrorAction SilentlyContinue
          $builderVersion = [string](node -p "require('electron-builder/package.json').version")
          if ($builderVersion -ne '26.15.7') { throw "electron_builder_version_drift:$builderVersion" }
          $builder = Join-Path (Get-Location) 'node_modules\.bin\electron-builder.cmd'
          if (-not (Test-Path $builder -PathType Leaf)) { throw 'electron_builder_locked_binary_missing' }
          & $builder --win nsis --x64 --config electron-builder.test.json --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron_builder_exit_$LASTEXITCODE" }
          $buildIdentityPath = "$env:RUNNER_TEMP\build-identity.json"
          $packagedBuildIdentityProofPath = "$env:RUNNER_TEMP\packaged-build-identity-proof.json"
          if (-not (Test-Path $buildIdentityPath -PathType Leaf)) { throw 'build_identity_not_emitted' }
          if (-not (Test-Path $packagedBuildIdentityProofPath -PathType Leaf)) { throw 'packaged_build_identity_proof_missing' }
          $buildIdentity = Get-Content $buildIdentityPath -Raw | ConvertFrom-Json
          $expectedBuildIdentity = Get-Content "$env:RUNNER_TEMP\expected-build-identity.json" -Raw | ConvertFrom-Json
          $packagedBuildIdentity = Get-Content $packagedBuildIdentityProofPath -Raw | ConvertFrom-Json
          if ([string]$expectedBuildIdentity.build_identity_sha256 -ne [string]$buildIdentity.build_identity_sha256) { throw 'build_identity_independent_readback_mismatch' }
          $lockMaterial = Get-Content "$env:RUNNER_TEMP\package-lock-material.json" -Raw | ConvertFrom-Json
          $uiBunLockSha = (Get-FileHash "$env:GITHUB_WORKSPACE\apps\me2-ui\bun.lock" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($buildIdentity.schema -ne 'metaengine.browser.build-identity.v3' `
              -or [string]$buildIdentity.source_head -ne $sourceHead `
              -or [string]$buildIdentity.package_version -ne $version `
              -or [string]$buildIdentity.run_id -ne [string]$env:GITHUB_RUN_ID `
              -or [int]$buildIdentity.run_attempt -ne [int]$env:GITHUB_RUN_ATTEMPT `
              -or [string]$buildIdentity.package_lock_sha256 -ne [string]$lockMaterial.package_lock_sha256 `
              -or [string]$buildIdentity.npm_version -ne [string]$lockMaterial.npm_version `
              -or [string]$buildIdentity.bun_version -ne '1.3.3' `
              -or [string]$buildIdentity.me2_ui_bun_lock_sha256 -ne $uiBunLockSha `
              -or [string]$buildIdentity.build_identity_sha256 -notmatch '^[a-f0-9]{64}$' `
              -or $buildIdentity.authority_effect -ne $false) { throw 'build_identity_contract_invalid' }
          if ($packagedBuildIdentity.schema -ne 'metaengine.browser.packaged-build-identity-proof.v2' `
              -or [string]$packagedBuildIdentity.build_identity_sha256 -ne [string]$buildIdentity.build_identity_sha256 `
              -or [string]$packagedBuildIdentity.dependency_resolution_sha256 -ne [string]$buildIdentity.dependency_resolution_sha256 `
              -or [string]$packagedBuildIdentity.package_lock_sha256 -ne [string]$buildIdentity.package_lock_sha256 `
              -or [string]$packagedBuildIdentity.npm_version -ne [string]$buildIdentity.npm_version `
              -or [string]$packagedBuildIdentity.bun_version -ne [string]$buildIdentity.bun_version `
              -or [string]$packagedBuildIdentity.me2_ui_bun_lock_sha256 -ne [string]$buildIdentity.me2_ui_bun_lock_sha256 `
              -or $packagedBuildIdentity.authority_effect -ne $false) { throw 'packaged_build_identity_contract_invalid' }
          $installer = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$version-x64.exe" -File | Select-Object -First 1
          $blockmap = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$version-x64.exe.blockmap" -File | Select-Object -First 1
          if (-not $installer -or -not $blockmap) { throw 'package_assets_missing' }
          $stagedManifest = Join-Path (Get-Location) 'native-dist\guardian\guardian-native-manifest.json'
          if (-not (Test-Path $stagedManifest -PathType Leaf)) { throw 'before_pack_guardian_staging_not_materialized' }
          $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/installer-provenance.mjs write `
            --installer $installer.FullName `
            --out "$env:RUNNER_TEMP\installer-provenance.json" `
            --source-head $sourceHead `
            --run-id $env:GITHUB_RUN_ID `
            --run-number $env:GITHUB_RUN_NUMBER `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --workflow browser-windows-package-smoke.yml `
            --package-version $version `
            --config electron-builder.test.json `
            --builder 26.15.7 `
            --blockmap $blockmap.FullName `
            --build-identity $buildIdentityPath `
            --dependency-resolution "$env:RUNNER_TEMP\dependency-resolution.json" `
            --package-lock-material "$env:RUNNER_TEMP\package-lock-material.json" `
            --me2-ui-bun-lock "$env:GITHUB_WORKSPACE\apps\me2-ui\bun.lock" `
            --package-json package.json `
            --package-lock package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'installer_provenance_write_failed' }
          $composedSbomPath = "$env:RUNNER_TEMP\browser-composed-sbom.cdx.json"
          $composedEvidencePath = "$env:RUNNER_TEMP\browser-composed-sbom-evidence.json"
          $uiManifestPath = Join-Path (Get-Location) 'me2-ui-dist\me2-ui-manifest.json'
          $daemonManifestPath = Join-Path (Get-Location) 'me2-daemon-dist\me2-daemon-manifest.json'
          $bootstrapBindingPath = Join-Path (Get-Location) 'native-dist\guardian-bootstrap\guardian-machine-bootstrap-binding.json'
          foreach ($materialPath in @($uiManifestPath,$daemonManifestPath,$stagedManifest,$bootstrapBindingPath,"$env:RUNNER_TEMP\installer-provenance.json")) {
            if (-not (Test-Path $materialPath -PathType Leaf)) { throw "browser_composed_sbom_material_missing:$materialPath" }
          }
          node scripts/composed-sbom-evidence.mjs `
            --npm-sbom "$env:RUNNER_TEMP\npm-sbom.cdx.json" `
            --npm-evidence "$env:RUNNER_TEMP\npm-sbom-evidence.json" `
            --ui-manifest $uiManifestPath `
            --daemon-manifest $daemonManifestPath `
            --guardian-manifest $stagedManifest `
            --bootstrap-binding $bootstrapBindingPath `
            --provenance "$env:RUNNER_TEMP\installer-provenance.json" `
            --source-head $sourceHead `
            --package-version $version `
            --out $composedSbomPath `
            --evidence $composedEvidencePath
          if ($LASTEXITCODE -ne 0) { throw 'browser_composed_sbom_generation_failed' }
          $composed = Get-Content $composedEvidencePath -Raw | ConvertFrom-Json
          $composedRawSha = (Get-FileHash $composedSbomPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($composed.schema -ne 'metaengine.browser.composed-sbom-evidence.v1' `
              -or [string]$composed.source_head -ne $sourceHead `
              -or [string]$composed.package_version -ne $version `
              -or [string]$composed.installer_sha256 -ne $digest `
              -or [string]$composed.build_identity_sha256 -ne [string]$buildIdentity.build_identity_sha256 `
              -or [string]$composed.composed_semantic_inventory_sha256 -notmatch '^[a-f0-9]{64}$' `
              -or $composedRawSha -notmatch '^[a-f0-9]{64}$' `
              -or [string]$composed.composition_aggregate -ne 'incomplete' `
              -or [int]$composed.first_party_component_count -ne 5 `
              -or [int]$composed.total_component_count -le [int]$composed.npm_component_count `
              -or $composed.authority_effect -ne $false) {
            throw 'browser_composed_sbom_contract_invalid'
          }
          Copy-Item $uiManifestPath "$env:RUNNER_TEMP\me2-ui-manifest.json" -Force
          Copy-Item $daemonManifestPath "$env:RUNNER_TEMP\me2-daemon-manifest.json" -Force
          Copy-Item $stagedManifest "$env:RUNNER_TEMP\guardian-native-manifest.json" -Force
          @{
            schema='metaengine.browser.windows-package-smoke.v3'
            source_head=$sourceHead
            package_version=$version
            installer_name=$installer.Name
            installer_sha256=$digest
            blockmap_name=$blockmap.Name
            build_identity_sha256=[string]$buildIdentity.build_identity_sha256
            dependency_resolution_sha256=[string]$buildIdentity.dependency_resolution_sha256
            npm_sbom_semantic_inventory_sha256=[string]((Get-Content "$env:RUNNER_TEMP\npm-sbom-evidence.json" -Raw | ConvertFrom-Json).semantic_inventory_sha256)
            npm_sbom_raw_sha256=[string]((Get-Content "$env:RUNNER_TEMP\npm-sbom-evidence.json" -Raw | ConvertFrom-Json).raw_sbom_sha256)
            npm_sbom_component_count=[int]((Get-Content "$env:RUNNER_TEMP\npm-sbom-evidence.json" -Raw | ConvertFrom-Json).component_count)
            package_lock_sha256=[string]$buildIdentity.package_lock_sha256
            composed_sbom_semantic_inventory_sha256=[string]$composed.composed_semantic_inventory_sha256
            composed_sbom_raw_sha256=[string]$composedRawSha
            composed_sbom_total_component_count=[int]$composed.total_component_count
            composed_sbom_first_party_component_count=[int]$composed.first_party_component_count
            composed_sbom_composition_aggregate=[string]$composed.composition_aggregate
            npm_version=[string]$buildIdentity.npm_version
            bun_version=[string]$buildIdentity.bun_version
            me2_ui_bun_lock_sha256=[string]$buildIdentity.me2_ui_bun_lock_sha256
            package_lock_verified=$true
            me2_ui_bun_lock_verified=$true
            guardian_native_staging_required=$true
            guardian_native_built_by_before_pack=$true
            version_probe_verified=$false
            normal_ui_boot_verified=$false
            runtime_import_observability_verified=$false
            second_instance_activation_verified=$false
            signed=$false
            published=$false
            promotion_authorized=$false
            authority_effect=$false
          } | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP\windows-package-proof.json" -Encoding utf8
          $bootstrapDir = Join-Path (Get-Location) 'native-dist\guardian-bootstrap'
          Copy-Item (Join-Path $bootstrapDir 'METAENGINE-Guardian-Bootstrap-*-x64.exe') $env:RUNNER_TEMP
          Copy-Item (Join-Path $bootstrapDir 'guardian-machine-bootstrap-binding.json') $env:RUNNER_TEMP
          Copy-Item $installer.FullName "$env:RUNNER_TEMP\candidate-setup.exe"
          Copy-Item $installer.FullName (Join-Path $env:RUNNER_TEMP $installer.Name)
          Copy-Item $blockmap.FullName (Join-Path $env:RUNNER_TEMP $blockmap.Name)
          Copy-Item package.json "$env:RUNNER_TEMP\package.json" -Force
          Copy-Item package-lock.json "$env:RUNNER_TEMP\package-lock.json" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\apps\me2-ui\bun.lock" "$env:RUNNER_TEMP\me2-ui-bun.lock" -Force

      - name: Publish immutable candidate for parallel downstream qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-windows-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/METAENGINE-Browser-Test-Setup-*-x64.exe
            ${{ runner.temp }}/METAENGINE-Browser-Test-Setup-*-x64.exe.blockmap
            ${{ runner.temp }}/installer-provenance.json
            ${{ runner.temp }}/build-identity.json
            ${{ runner.temp }}/dependency-resolution.json
            ${{ runner.temp }}/npm-sbom.cdx.json
            ${{ runner.temp }}/npm-sbom-evidence.json
            ${{ runner.temp }}/browser-composed-sbom.cdx.json
            ${{ runner.temp }}/browser-composed-sbom-evidence.json
            ${{ runner.temp }}/me2-ui-manifest.json
            ${{ runner.temp }}/me2-daemon-manifest.json
            ${{ runner.temp }}/guardian-native-manifest.json
            ${{ runner.temp }}/package-lock-material.json
            ${{ runner.temp }}/package.json
            ${{ runner.temp }}/package-lock.json
            ${{ runner.temp }}/me2-ui-bun.lock
            ${{ runner.temp }}/package-build-reservation.json
            ${{ runner.temp }}/package-version-reservation-seal.json
            ${{ runner.temp }}/METAENGINE-Guardian-Bootstrap-*-x64.exe
            ${{ runner.temp }}/guardian-machine-bootstrap-binding.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Install exact-head package and prove Browser plus inert Guardian payload
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $proofPath = "$env:RUNNER_TEMP\windows-package-proof.json"
          $proof = Get-Content $proofPath -Raw | ConvertFrom-Json
          if (Get-Service -Name 'METAENGINEBrowserGuardian' -ErrorAction SilentlyContinue) { throw 'guardian_service_preexists_before_package_install' }
          $install = Start-Process -FilePath "$env:RUNNER_TEMP\candidate-setup.exe" -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "package_installer_exit_$($install.ExitCode)" }

          $guardianLine = (& ./scripts/verify-installed-guardian-native-staging.ps1 `
            -ExpectedSourceHead ([string]$proof.source_head) `
            -ExpectedPackageVersion ([string]$proof.package_version) | Where-Object { $_.Trim() } | Select-Object -Last 1)
          if (-not $guardianLine) { throw 'guardian_installed_staging_proof_missing' }
          $guardian = $guardianLine | ConvertFrom-Json
          if ($guardian.schema -ne 'metaengine.browser.guardian-native-installed-staging-proof.v1') { throw 'guardian_installed_staging_proof_schema_invalid' }
          if ([string]$guardian.package_version -ne [string]$proof.package_version) { throw 'guardian_installed_staging_version_drift' }
          if ($guardian.guardian_service_absent -ne $true -or $guardian.staging_only -ne $true -or $guardian.service_activation_authorized -ne $false) { throw 'guardian_installed_staging_proof_invalid' }

          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test'
          $app = Join-Path $installRoot 'METAENGINE Browser Test.exe'
          if (-not (Test-Path $app)) { throw "packaged_browser_missing:$app" }
          $uiEvidence = "$env:RUNNER_TEMP\installed-me2-ui-proof.json"
          node scripts/verify-me2-ui-bundle.mjs `
            --root (Join-Path $installRoot 'resources\me2-ui') `
            --expected-sha ([string]$proof.source_head) `
            --runtime $app --smoke --evidence $uiEvidence
          if ($LASTEXITCODE -ne 0) { throw 'package_smoke_installed_me2_ui_invalid' }
          $uiProof = Get-Content $uiEvidence -Raw | ConvertFrom-Json
          if ($uiProof.runtime_smoke -ne 'PASS' -or [int64]$uiProof.installed_size_bytes -ne [int64]$uiProof.manifest_size_bytes) { throw 'package_smoke_me2_ui_proof_invalid' }
          $proof | Add-Member -NotePropertyName me2_ui_installed_verified -NotePropertyValue $true -Force
          $proof | Add-Member -NotePropertyName me2_ui_installed_size_bytes -NotePropertyValue ([int64]$uiProof.installed_size_bytes) -Force

          $daemonEvidence = "$env:RUNNER_TEMP\installed-me2-daemon-proof.json"
          node scripts/verify-me2-daemon-bundle.mjs `
            --root (Join-Path $installRoot 'resources\me2-daemon') `
            --expected-sha ([string]$proof.source_head) `
            --smoke --evidence $daemonEvidence
          if ($LASTEXITCODE -ne 0) { throw 'package_smoke_installed_me2_daemon_invalid' }
          $daemonProof = Get-Content $daemonEvidence -Raw | ConvertFrom-Json
          if ($daemonProof.runtime_smoke -ne 'PASS' `
              -or $daemonProof.external_bun_required -ne $false `
              -or $daemonProof.smoke_child_external_runtime_path_sanitized -ne $true) { throw 'package_smoke_me2_daemon_proof_invalid' }
          $proof | Add-Member -NotePropertyName me2_daemon_installed_verified -NotePropertyValue $true -Force
          $proof | Add-Member -NotePropertyName me2_daemon_version -NotePropertyValue ([string]$daemonProof.daemon_version) -Force
          $proof | Add-Member -NotePropertyName me2_daemon_executable_sha256 -NotePropertyValue ([string]$daemonProof.executable_sha256) -Force

          $out = "$env:RUNNER_TEMP\package-version-probe.out"
          $err = "$env:RUNNER_TEMP\package-version-probe.err"
          $probe = Start-Process -FilePath $app -ArgumentList '--metaengine-version-probe' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $probe.Handle
          if (-not $probe.WaitForExit(15000)) {
            try { Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw 'package_version_probe_timeout'
          }
          if ($probe.ExitCode -ne 0) {
            Get-Content $err -ErrorAction SilentlyContinue
            throw "package_version_probe_exit_$($probe.ExitCode)"
          }
          $row = (Get-Content $out | Where-Object { $_.Trim() } | Select-Object -Last 1) | ConvertFrom-Json
          if ([string]$row.version -ne [string]$proof.package_version -or $row.primary_instance -ne $true) { throw 'package_version_probe_mismatch' }
          $proof.version_probe_verified = $true

          if ($proof.guardian_native_built_by_before_pack -ne $true) { throw 'guardian_before_pack_proof_missing' }
          if ($proof.signed -ne $false -or $proof.published -ne $false -or $proof.promotion_authorized -ne $false -or $proof.authority_effect -ne $false) { throw 'package_zero_authority_contract_invalid' }
          $proof | Add-Member -NotePropertyName guardian_native_manifest_sha256 -NotePropertyValue ([string]$guardian.manifest_sha256) -Force
          $proof | Add-Member -NotePropertyName guardian_native_staging_verified -NotePropertyValue $true -Force
          $proof | ConvertTo-Json -Depth 6 | Set-Content $proofPath -Encoding utf8
          Write-Host ($proof | ConvertTo-Json -Compress)

      - name: Prove normal packaged UI boot and second-instance activation
        working-directory: apps/metaengine-browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $proofPath = "$env:RUNNER_TEMP\windows-package-proof.json"
          $proof = Get-Content $proofPath -Raw | ConvertFrom-Json
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test'
          $app = Join-Path $installRoot 'METAENGINE Browser Test.exe'
          if (-not (Test-Path $app -PathType Leaf)) { throw "packaged_browser_missing:$app" }

          # Never guess Electron's packaged userData directory from productName.
          # Ask the exact installed binary for app.getPath('userData') through
          # the existing read-only profile probe, then bind every journal read
          # to that exact path. The write flag creates only the probe marker that
          # this pre-existing contract requires; it does not bypass normal boot.
          $profileOut = "$env:RUNNER_TEMP\package-profile-probe.out"
          $profileErr = "$env:RUNNER_TEMP\package-profile-probe.err"
          Remove-Item $profileOut,$profileErr -Force -ErrorAction SilentlyContinue
          $priorProfileWrite = $env:METAENGINE_PROFILE_PROBE_WRITE
          $env:METAENGINE_PROFILE_PROBE_WRITE = '1'
          try {
            $profileProcess = Start-Process -FilePath $app -ArgumentList '--metaengine-profile-probe' -PassThru -RedirectStandardOutput $profileOut -RedirectStandardError $profileErr
            $null = $profileProcess.Handle
            if (-not $profileProcess.WaitForExit(15000)) {
              try { Stop-Process -Id $profileProcess.Id -Force -ErrorAction SilentlyContinue } catch {}
              throw 'package_profile_probe_timeout'
            }
            if ($profileProcess.ExitCode -ne 0) {
              Get-Content $profileErr -ErrorAction SilentlyContinue
              throw "package_profile_probe_exit_$($profileProcess.ExitCode)"
            }
          } finally {
            $env:METAENGINE_PROFILE_PROBE_WRITE = $priorProfileWrite
          }
          $profileLine = Get-Content $profileOut | Where-Object { $_.Trim() } | Select-Object -Last 1
          if (-not $profileLine) { throw 'package_profile_probe_output_missing' }
          $profile = $profileLine | ConvertFrom-Json
          if ($profile.schema -ne 'metaengine.browser.profile-probe.v1' `
              -or [string]$profile.version -ne [string]$proof.package_version `
              -or $profile.primary_instance -ne $true `
              -or $profile.marker_present -ne $true `
              -or -not [string]$profile.user_data_path) {
            $profile | ConvertTo-Json -Depth 6 | Write-Host
            throw 'package_profile_probe_contract_invalid'
          }
          $userData = [string]$profile.user_data_path
          if (-not [System.IO.Path]::IsPathRooted($userData)) { throw 'package_profile_user_data_not_absolute' }
          $journal = Join-Path $userData 'metaengine-browser-startup-journal-v1.json'
          $proof | Add-Member -NotePropertyName user_data_path -NotePropertyValue $userData -Force
          $proof | Add-Member -NotePropertyName user_data_path_source -NotePropertyValue 'PACKAGED_PROFILE_PROBE' -Force
          $proof | ConvertTo-Json -Depth 6 | Set-Content $proofPath -Encoding utf8

          $normalOut = "$env:RUNNER_TEMP\package-normal-ui.out"
          $normalErr = "$env:RUNNER_TEMP\package-normal-ui.err"
          $secondOut = "$env:RUNNER_TEMP\package-second-instance.out"
          $secondErr = "$env:RUNNER_TEMP\package-second-instance.err"
          Remove-Item $journal -Force -ErrorAction SilentlyContinue
          Remove-Item "$journal.corrupt-*" -Force -ErrorAction SilentlyContinue
          Remove-Item $normalOut,$normalErr,$secondOut,$secondErr -Force -ErrorAction SilentlyContinue

          $normal = $null
          try {
            # No probe/smoke flag is allowed here. This must exercise the same
            # main-entry path a user launches from Explorer/Start Menu.
            $normal = Start-Process -FilePath $app -PassThru -RedirectStandardOutput $normalOut -RedirectStandardError $normalErr
            $null = $normal.Handle
            $deadline = [DateTime]::UtcNow.AddSeconds(55)
            $stableEvent = $null
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($normal.HasExited) {
                Get-Content $normalErr -ErrorAction SilentlyContinue
                throw "normal_ui_primary_exited_early:$($normal.ExitCode)"
              }
              if (Test-Path $journal -PathType Leaf) {
                try {
                  $startup = Get-Content $journal -Raw | ConvertFrom-Json
                  if ($startup.schema -ne 'metaengine.browser.startup-journal.v1') { throw 'normal_ui_startup_journal_schema_invalid' }
                  $importFailure = @($startup.events | Where-Object { $_.boot_id -eq $startup.current_boot_id -and $_.state -eq 'RUNTIME_IMPORT_FAILED' } | Select-Object -Last 1)
                  if ($importFailure.Count -gt 0) {
                    $importFailure | ConvertTo-Json -Depth 8 | Write-Host
                    Get-Content $normalErr -ErrorAction SilentlyContinue
                    throw 'normal_ui_runtime_import_failed'
                  }
                  $stableEvent = $startup.events | Where-Object { $_.boot_id -eq $startup.current_boot_id -and $_.state -eq 'PRIMARY_WINDOW_STABLE' } | Select-Object -Last 1
                  if ($stableEvent) { break }
                } catch {
                  if ($_.Exception.Message -eq 'normal_ui_runtime_import_failed') { throw }
                }
              }
              Start-Sleep -Milliseconds 250
              $normal.Refresh()
            }
            if (-not $stableEvent) {
              Get-Content $normalErr -ErrorAction SilentlyContinue
              if (Test-Path $journal) { Get-Content $journal -Raw -ErrorAction SilentlyContinue | Write-Host }
              throw 'normal_ui_stable_window_timeout'
            }

            $startup = Get-Content $journal -Raw | ConvertFrom-Json
            $runtimeImport = $startup.events | Where-Object { $_.boot_id -eq $startup.current_boot_id -and $_.state -eq 'RUNTIME_IMPORT_OK' } | Select-Object -Last 1
            if (-not $runtimeImport) { throw 'normal_ui_runtime_import_success_evidence_missing' }
            if ($stableEvent.details.visible -ne $true) { throw 'normal_ui_stable_window_not_visible' }
            $stableSequence = [int64]$stableEvent.sequence

            # A second ordinary launch must not create a second fleet/runtime.
            # Electron forwards it to the primary, which must show/restore/focus
            # the already-created BaseWindow and record exact-nonce activation.
            $second = Start-Process -FilePath $app -PassThru -RedirectStandardOutput $secondOut -RedirectStandardError $secondErr
            $null = $second.Handle
            if (-not $second.WaitForExit(18000)) {
              try { Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue } catch {}
              throw 'normal_ui_second_instance_did_not_exit'
            }
            if ($second.ExitCode -ne 0) {
              Get-Content $secondErr -ErrorAction SilentlyContinue
              throw "normal_ui_second_instance_exit_$($second.ExitCode)"
            }
            $secondaryLine = Get-Content $secondOut | Where-Object { $_.Trim() } | Select-Object -Last 1
            if (-not $secondaryLine) { throw 'normal_ui_second_instance_ack_output_missing' }
            $secondaryAck = $secondaryLine | ConvertFrom-Json
            if ($secondaryAck.schema -ne 'metaengine.browser.secondary-launch.v1' `
                -or $secondaryAck.state -ne 'PRIMARY_UI_ACTIVATION_ACKNOWLEDGED' `
                -or -not [string]$secondaryAck.launch_id `
                -or $secondaryAck.second_browser_runtime_started -ne $false `
                -or $secondaryAck.authority_effect -ne $false) {
              $secondaryAck | ConvertTo-Json -Depth 6 | Write-Host
              throw 'normal_ui_second_instance_ack_contract_invalid'
            }

            $activationDeadline = [DateTime]::UtcNow.AddSeconds(12)
            $activation = $null
            while ([DateTime]::UtcNow -lt $activationDeadline) {
              $startup = Get-Content $journal -Raw | ConvertFrom-Json
              $activation = $startup.events | Where-Object {
                $_.boot_id -eq $startup.current_boot_id `
                  -and $_.state -eq 'PRIMARY_WINDOW_ACTIVATED' `
                  -and [int64]$_.sequence -gt $stableSequence `
                  -and $_.details.launch_id -eq [string]$secondaryAck.launch_id
              } | Select-Object -Last 1
              if ($activation) { break }
              Start-Sleep -Milliseconds 200
            }
            if (-not $activation) {
              Get-Content $journal -Raw | Write-Host
              Get-Content $secondOut -ErrorAction SilentlyContinue
              Get-Content $secondErr -ErrorAction SilentlyContinue
              throw 'normal_ui_second_instance_activation_missing'
            }
            if ($activation.details.visible -ne $true) { throw 'normal_ui_second_instance_window_not_visible' }
            if ([int64]$secondaryAck.event_sequence -ne [int64]$activation.sequence) { throw 'normal_ui_second_instance_ack_sequence_drift' }
            if ([int64]$secondaryAck.primary_pid -ne [int64]$activation.pid) { throw 'normal_ui_second_instance_ack_pid_drift' }
            if ([string]$secondaryAck.primary_version -ne [string]$activation.version) { throw 'normal_ui_second_instance_ack_version_drift' }

            $normal.Refresh()
            if ($normal.HasExited) { throw 'normal_ui_primary_died_after_second_instance' }

            # Live 0.7.0-dev.2.1 repeatedly crossed the Sentinel's 180-second
            # startup grace and relaunched a healthy parent. Bind the exact
            # packaged process, Sentinel token/boot and useful-progress lease,
            # then stay alive beyond that boundary with no recovery generation.
            $sentinelPath = Join-Path $userData 'metaengine-browser-sentinel-v1.json'
            $progressPath = "$sentinelPath.parent-progress-v1.json"
            $workerHeartbeatPath = "$sentinelPath.worker-heartbeat-v1.json"
            $sentinelDeadline = [DateTime]::UtcNow.AddSeconds(35)
            $sentinelBefore = $null
            $progressBefore = $null
            $workerHeartbeatBefore = $null
            while ([DateTime]::UtcNow -lt $sentinelDeadline) {
              try {
                if ((Test-Path $sentinelPath -PathType Leaf) `
                    -and (Test-Path $progressPath -PathType Leaf) `
                    -and (Test-Path $workerHeartbeatPath -PathType Leaf)) {
                  $sentinelBefore = Get-Content $sentinelPath -Raw | ConvertFrom-Json
                  $progressBefore = Get-Content $progressPath -Raw | ConvertFrom-Json
                  $workerHeartbeatBefore = Get-Content $workerHeartbeatPath -Raw | ConvertFrom-Json
                  if ($sentinelBefore.schema -eq 'metaengine.browser-sentinel.state.v1' `
                      -and [int64]$sentinelBefore.parent_pid -eq [int64]$normal.Id `
                      -and [int64]$sentinelBefore.worker_pid -gt 0 `
                      -and $sentinelBefore.worker_released -eq $false `
                      -and $progressBefore.schema -eq 'metaengine.browser-sentinel.parent-progress.v1' `
                      -and [string]$progressBefore.token -eq [string]$sentinelBefore.token `
                      -and [int64]$progressBefore.parent_pid -eq [int64]$normal.Id `
                      -and $workerHeartbeatBefore.schema -eq 'metaengine.browser-sentinel.worker-heartbeat.v1' `
                      -and [string]$workerHeartbeatBefore.token -eq [string]$sentinelBefore.token `
                      -and [int64]$workerHeartbeatBefore.parent_pid -eq [int64]$normal.Id `
                      -and [int64]$workerHeartbeatBefore.worker_pid -eq [int64]$sentinelBefore.worker_pid `
                      -and $workerHeartbeatBefore.lifecycle -eq 'READY') { break }
                }
              } catch {}
              $sentinelBefore = $null
              $progressBefore = $null
              $workerHeartbeatBefore = $null
              Start-Sleep -Milliseconds 250
            }
            if (-not $sentinelBefore -or -not $progressBefore -or -not $workerHeartbeatBefore) { throw 'normal_ui_sentinel_progress_binding_missing' }
            $sentinelToken = [string]$sentinelBefore.token
            $sentinelCreatedAt = [string]$sentinelBefore.created_at
            $sentinelWorkerPid = [int64]$sentinelBefore.worker_pid
            $recoveryGeneration = [int64]$sentinelBefore.worker_recovery_generation
            $progressSequence = [int64]$progressBefore.progress_seq

            Start-Sleep -Seconds 190
            $normal.Refresh()
            if ($normal.HasExited) { throw 'normal_ui_primary_died_across_sentinel_startup_grace' }
            $startupAfter = Get-Content $journal -Raw | ConvertFrom-Json
            $sentinelAfter = Get-Content $sentinelPath -Raw | ConvertFrom-Json
            $progressAfter = Get-Content $progressPath -Raw | ConvertFrom-Json
            $workerHeartbeatAfter = Get-Content $workerHeartbeatPath -Raw | ConvertFrom-Json
            if ([string]$startupAfter.current_boot_id -ne [string]$startup.current_boot_id) { throw 'normal_ui_boot_id_changed_across_sentinel_startup_grace' }
            if ($sentinelAfter.schema -ne 'metaengine.browser-sentinel.state.v1' `
                -or [string]$sentinelAfter.token -ne $sentinelToken `
                -or [string]$sentinelAfter.created_at -ne $sentinelCreatedAt `
                -or [int64]$sentinelAfter.parent_pid -ne [int64]$normal.Id `
                -or [int64]$sentinelAfter.worker_pid -ne $sentinelWorkerPid `
                -or $sentinelAfter.worker_released -ne $false `
                -or $sentinelAfter.relaunch_attempted -ne $false `
                -or [int64]$sentinelAfter.worker_recovery_generation -ne $recoveryGeneration) {
              throw 'normal_ui_sentinel_identity_or_recovery_drift'
            }
            if ($workerHeartbeatAfter.schema -ne 'metaengine.browser-sentinel.worker-heartbeat.v1' `
                -or [string]$workerHeartbeatAfter.token -ne $sentinelToken `
                -or [int64]$workerHeartbeatAfter.parent_pid -ne [int64]$normal.Id `
                -or [int64]$workerHeartbeatAfter.worker_pid -ne $sentinelWorkerPid `
                -or $workerHeartbeatAfter.lifecycle -ne 'READY') {
              throw 'normal_ui_sentinel_worker_heartbeat_binding_drift'
            }
            $workerHeartbeatAgeSeconds = ([DateTime]::UtcNow - ([DateTime]::Parse([string]$workerHeartbeatAfter.heartbeat_at)).ToUniversalTime()).TotalSeconds
            if ($workerHeartbeatAgeSeconds -lt 0 -or $workerHeartbeatAgeSeconds -gt 15) { throw "normal_ui_sentinel_worker_heartbeat_stale:$workerHeartbeatAgeSeconds" }
            if ($progressAfter.schema -ne 'metaengine.browser-sentinel.parent-progress.v1' `
                -or [string]$progressAfter.token -ne $sentinelToken `
                -or [int64]$progressAfter.parent_pid -ne [int64]$normal.Id `
                -or [int64]$progressAfter.progress_seq -le $progressSequence) {
              throw 'normal_ui_parent_progress_did_not_advance'
            }
            $progressAgeSeconds = ([DateTime]::UtcNow - ([DateTime]::Parse([string]$progressAfter.progress_at)).ToUniversalTime()).TotalSeconds
            if ($progressAgeSeconds -lt 0 -or $progressAgeSeconds -gt 30) { throw "normal_ui_parent_progress_stale:$progressAgeSeconds" }

            $me2Output = ((Get-Content $normalOut -Raw -ErrorAction SilentlyContinue) + [Environment]::NewLine + (Get-Content $normalErr -Raw -ErrorAction SilentlyContinue))
            if ($me2Output -notmatch '"event":"DAEMON_HEALTHY"') { throw 'normal_ui_me2_daemon_health_readback_missing' }
            if ($me2Output -notmatch '"event":"ME2_CONTRACT_OK"') { throw 'normal_ui_me2_contract_readback_missing' }
            # R84 primary-shell regression gate: the previous installer was a
            # false green because ME2 was packaged/healthy while the visible
            # Browser still loaded metaengine://shell. A healthy packaged ME2
            # candidate must now prove the actual normal user-visible startup.
            if ($me2Output -notmatch '"state":"ME2_PRIMARY_SHELL_VISIBLE"') {
              Get-Content $normalOut -ErrorAction SilentlyContinue
              Get-Content $normalErr -ErrorAction SilentlyContinue
              throw 'normal_ui_me2_primary_shell_not_visible'
            }
            if ($me2Output -match '"state":"LEGACY_RECOVERY_SHELL_VISIBLE"') {
              throw 'normal_ui_legacy_shell_used_despite_packaged_me2'
            }
            if ($me2Output -notmatch '"legacy_shell_is_normal_path":false') {
              throw 'normal_ui_primary_shell_contract_missing'
            }
            if ($me2Output -notmatch '"state":"ME2_R97_UI_CONTRACT_CONFIRMED"') {
              Get-Content $normalOut -ErrorAction SilentlyContinue
              Get-Content $normalErr -ErrorAction SilentlyContinue
              throw 'normal_ui_r97_dom_contract_not_confirmed'
            }
            if ($me2Output -match '"state":"ME2_R97_UI_CONTRACT_INCOMPLETE"') {
              throw 'normal_ui_r97_dom_contract_incomplete'
            }
            if ($me2Output -match 'DAEMON_INITIAL_READINESS_FAILED|ME2_CONTRACT_UNREACHABLE|ME2_CONTRACT_MISMATCH') {
              throw 'normal_ui_me2_integration_degraded'
            }
            if ($me2Output -match '\[guard\] lock failed:') {
              Get-Content $normalErr -ErrorAction SilentlyContinue
              throw 'normal_ui_me2_daemon_incarnation_lock_failed'
            }

            Copy-Item $journal "$env:RUNNER_TEMP\browser-startup-journal-v1.json" -Force
            Copy-Item $sentinelPath "$env:RUNNER_TEMP\browser-sentinel-v1.json" -Force
            Copy-Item $progressPath "$env:RUNNER_TEMP\browser-parent-progress-v1.json" -Force
            Copy-Item $workerHeartbeatPath "$env:RUNNER_TEMP\browser-sentinel-worker-heartbeat-v1.json" -Force
            $proof | Add-Member -NotePropertyName me2_browser_integration_verified -NotePropertyValue $true -Force
            $proof | Add-Member -NotePropertyName me2_browser_integration_boot_mode -NotePropertyValue 'primary_me2_shell' -Force
            $proof | Add-Member -NotePropertyName me2_primary_shell_visible_verified -NotePropertyValue $true -Force
            $proof | Add-Member -NotePropertyName me2_r97_dom_contract_verified -NotePropertyValue $true -Force
            $proof | Add-Member -NotePropertyName legacy_shell_used_on_normal_startup -NotePropertyValue $false -Force
            $proof.normal_ui_boot_verified = $true
            $proof.runtime_import_observability_verified = $true
            $proof.second_instance_activation_verified = $true
            $proof | Add-Member -NotePropertyName startup_grace_survival_seconds -NotePropertyValue 190 -Force
            $proof | Add-Member -NotePropertyName same_primary_pid_across_startup_grace -NotePropertyValue $true -Force
            $proof | Add-Member -NotePropertyName same_sentinel_token_across_startup_grace -NotePropertyValue $true -Force
            $proof | Add-Member -NotePropertyName parent_progress_advanced_across_startup_grace -NotePropertyValue $true -Force
            $proof | Add-Member -NotePropertyName sentinel_relaunch_attempted -NotePropertyValue $false -Force
            $proof | Add-Member -NotePropertyName startup_journal_schema -NotePropertyValue 'metaengine.browser.startup-journal.v1' -Force
            $proof | Add-Member -NotePropertyName normal_ui_stable_event_sequence -NotePropertyValue ([int64]$stableEvent.sequence) -Force
            $proof | Add-Member -NotePropertyName second_instance_activation_event_sequence -NotePropertyValue ([int64]$activation.sequence) -Force
            $proof | Add-Member -NotePropertyName second_instance_launch_id -NotePropertyValue ([string]$secondaryAck.launch_id) -Force
            $proof | ConvertTo-Json -Depth 6 | Set-Content $proofPath -Encoding utf8
            Write-Host ($proof | ConvertTo-Json -Compress)
          } finally {
            if ($normal -and -not $normal.HasExited) {
              # Cleanup is not evidence. Native taskkill can return 1 when a child
              # exits between enumeration and termination even after the primary
              # was terminated. Preserve /T tree cleanup but force cleanup-only
              # exit status to zero so it cannot invalidate completed UI proof.
              cmd.exe /d /c "taskkill.exe /PID $($normal.Id) /T /F >nul 2>&1 & exit /b 0" | Out-Null
            }
          }

      - name: Qualify embedded one-shot Guardian machine bootstrap
        shell: powershell
        working-directory: apps/metaengine-browser
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test'
          & ./test/browser-guardian-machine-bootstrap-physical.ps1 `
            -BootstrapDir (Join-Path $install 'resources\guardian-bootstrap') `
            -StagingDir (Join-Path $install 'resources\guardian-native') `
            -ExpectedSourceHead '${{ github.event.pull_request.head.sha || github.sha }}' `
            -EvidencePath "$env:RUNNER_TEMP\guardian-machine-bootstrap-physical-proof.json"
          if ($LASTEXITCODE -ne 0) { throw 'guardian_machine_bootstrap_qualification_failed' }

      - name: Prove source checkout unchanged
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git diff --name-only HEAD -- apps/metaengine-browser/src apps/metaengine-browser/ui apps/metaengine-browser/native apps/metaengine-browser/scripts apps/metaengine-browser/test/browser-startup-observability.test.mjs apps/metaengine-browser/test/browser-shell-visual-evidence.mjs apps/metaengine-browser/test/me2-r85-visual-evidence.mjs apps/metaengine-browser/package.json apps/metaengine-browser/package-lock.json apps/metaengine-browser/electron-builder.test.json apps/me2-ui/bun.lock apps/me2-daemon)"

      - name: Upload exact-head Windows qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metaengine-browser-windows-package-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/windows-package-proof.json
            ${{ runner.temp }}/packaged-build-identity-proof.json
            ${{ runner.temp }}/expected-build-identity.json
            ${{ runner.temp }}/build-identity.json
            ${{ runner.temp }}/dependency-resolution.json
            ${{ runner.temp }}/npm-sbom.cdx.json
            ${{ runner.temp }}/npm-sbom-evidence.json
            ${{ runner.temp }}/browser-composed-sbom.cdx.json
            ${{ runner.temp }}/browser-composed-sbom-evidence.json
            ${{ runner.temp }}/me2-ui-manifest.json
            ${{ runner.temp }}/me2-daemon-manifest.json
            ${{ runner.temp }}/guardian-native-manifest.json
            ${{ runner.temp }}/package-lock-material.json
            ${{ runner.temp }}/package.json
            ${{ runner.temp }}/package-lock.json
            ${{ runner.temp }}/me2-ui-bun.lock
            ${{ runner.temp }}/package-build-reservation.json
            ${{ runner.temp }}/package-version-reservation-seal.json
            ${{ runner.temp }}/guardian-machine-bootstrap-physical-proof.json
            ${{ runner.temp }}/guardian-bootstrap-physical/*.out
            ${{ runner.temp }}/guardian-bootstrap-physical/*.err
            ${{ runner.temp }}/guardian-machine-bootstrap-binding.json
            ${{ runner.temp }}/installed-me2-daemon-proof.json
            ${{ runner.temp }}/browser-startup-journal-v1.json
            ${{ runner.temp }}/browser-sentinel-v1.json
            ${{ runner.temp }}/browser-parent-progress-v1.json
            ${{ runner.temp }}/browser-sentinel-worker-heartbeat-v1.json
            ${{ runner.temp }}/package-profile-probe.out
            ${{ runner.temp }}/package-profile-probe.err
            ${{ runner.temp }}/package-normal-ui.out
            ${{ runner.temp }}/package-normal-ui.err
            ${{ runner.temp }}/package-second-instance.out
            ${{ runner.temp }}/package-second-instance.err
            ${{ runner.temp }}/browser-shell-visual/visual-evidence.json
            ${{ runner.temp }}/browser-shell-visual/*.png
            ${{ runner.temp }}/r85-primary-visual/r85-visual-evidence.json
            ${{ runner.temp }}/r85-primary-visual/*.png
            ${{ runner.temp }}/r85-primary-visual.stdout.log
            ${{ runner.temp }}/r85-primary-visual.stderr.log
          if-no-files-found: warn
          retention-days: 30
