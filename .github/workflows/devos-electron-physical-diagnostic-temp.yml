name: DevOS Electron Physical Diagnostic Temp
# physical proof v4: live renderer/process/bounds evidence, no hosted Viz screenshot dependency

on:
  push:
    branches:
      - 'work/metaengine-devos-multisurface-v1'
    paths:
      - '.github/workflows/devos-electron-physical-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  physical-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: work/metaengine-devos-multisurface-v1
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install Browser dependencies
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          npm config get ignore-scripts
          env | grep -E '^ELECTRON|^NODE_ENV|^NPM_CONFIG' || true
          npm install --no-audit --no-fund

      - name: Inspect Electron payload and sandbox prerequisites
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          electron_pkg=$(node -p "require('./node_modules/electron/package.json').version")
          echo "electron_pkg=$electron_pkg"
          find node_modules/electron -maxdepth 2 -type f -printf '%P %m %u:%g\n' | sort | head -80
          node - <<'NODE'
          try { console.log('electron_binary=' + require('electron')); }
          catch (error) { console.error(error.stack || error); process.exitCode = 3; }
          NODE
          sandbox=node_modules/electron/dist/chrome-sandbox
          if [[ ! -f "$sandbox" ]]; then
            echo "chrome_sandbox_missing=true"
            exit 42
          fi
          echo "before=$(stat -c '%u:%g %a %A' "$sandbox")"
          findmnt -no TARGET,FSTYPE,OPTIONS -T "$sandbox" || true
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          echo "after=$(stat -c '%u:%g %a %A' "$sandbox")"
          test "$(stat -c '%u:%g %a' "$sandbox")" = "0:0 4755"
          ELECTRON_RUN_AS_NODE=1 npx electron -e "console.log(JSON.stringify({electron:process.versions.electron,node:process.versions.node}))"
          xvfb-run -a bash -lc 'npx electron --version' > /tmp/electron-version.log 2>&1 || { rc=$?; cat /tmp/electron-version.log; echo "electron_version_rc=$rc"; exit "$rc"; }
          cat /tmp/electron-version.log

      - name: Run physical E2E with complete output
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xvfb-run -a npx electron test/browser-devos-multisurface-physical.electron.mjs > /tmp/devos-physical.log 2>&1
          rc=$?
          set -e
          cat /tmp/devos-physical.log
          echo "physical_rc=$rc"
          test "$rc" -eq 0
          grep -F '"schema":"metaengine.devos.multisurface-physical-e2e.v1"' /tmp/devos-physical.log
          grep -F '"ok":true' /tmp/devos-physical.log
          grep -F '"simultaneously_attached_webcontents_views":3' /tmp/devos-physical.log
          grep -F '"renderer_load_proven":true' /tmp/devos-physical.log
          grep -F '"renderer_process_proven":true' /tmp/devos-physical.log
