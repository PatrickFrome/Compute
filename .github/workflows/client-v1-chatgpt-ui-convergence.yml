name: Client V1 ChatGPT UI Convergence

on:
  push:
    branches:
      - 'work/client-v1-chatgpt-ui-convergence-v1'
    paths:
      - 'apps/me2-ui/**'
      - 'apps/metaengine-browser/src/main.mjs'
      - 'apps/metaengine-browser/electron-builder.test.json'
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/package-lock.json'
      - 'apps/metaengine-browser/.gitattributes'
      - 'apps/metaengine-browser/test/me2-ui-chatgpt-convergence.test.mjs'
      - 'apps/metaengine-browser/test/legacy-shell-bundle-retirement.test.mjs'
      - 'apps/metaengine-browser/test/shell-first-startup-boundary.test.mjs'
      - 'apps/metaengine-browser/test/browser-policy.test.mjs'
      - '.github/workflows/browser-windows-package-smoke.yml'
      - '.github/workflows/browser-typed-workspaces-v1.yml'
      - 'research/METAENGINE_CLIENT_V1_CHATGPT_UI_CONVERGENCE_CHECKPOINT_2026-10-06.md'
      - '.github/workflows/client-v1-chatgpt-ui-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Setup Bun 1.3.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.3'

      - name: Prove Browser source parses without retired shell inputs
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Prove ChatGPT UI and legacy-shell retirement contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            apps/metaengine-browser/test/me2-ui-chatgpt-convergence.test.mjs \
            apps/metaengine-browser/test/legacy-shell-bundle-retirement.test.mjs \
            apps/metaengine-browser/test/shell-first-startup-boundary.test.mjs \
            apps/metaengine-browser/test/browser-policy.test.mjs

      - name: Install exact ME2 UI dependencies
        working-directory: apps/me2-ui
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Build ME2 UI
        working-directory: apps/me2-ui
        shell: bash
        run: |
          set -euo pipefail
          bun run build

      - name: Prove compiled primary UI has no legacy provider branding or mutations
        shell: bash
        run: |
          set -euo pipefail
          pattern='GLM-5\.3-Flash|z\.ai Agent|chat\.z\.ai|upgrade флот|Снять живую пробу GLM|z-ai-web-dev-sdk'
          if grep -R -E -n --binary-files=without-match "$pattern" apps/me2-ui/.next; then
            echo "compiled_me2_ui_legacy_provider_drift" >&2
            exit 1
          fi

      - name: Prove source inputs unchanged by install/build
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            apps/me2-ui/src \
            apps/me2-ui/package.json \
            apps/me2-ui/bun.lock \
            apps/metaengine-browser/src/main.mjs \
            apps/metaengine-browser/electron-builder.test.json \
            apps/metaengine-browser/package.json \
            apps/metaengine-browser/package-lock.json \
            apps/metaengine-browser/test/me2-ui-chatgpt-convergence.test.mjs \
            apps/metaengine-browser/test/legacy-shell-bundle-retirement.test.mjs
