name: W1 Linux Admission Contract

on:
  push:
    branches:
      - work/w1-linux-worker-safety
      - work/main-roadmap-accelerators-v5
    paths:
      - 'worker/native_linux/admission_contract.py'
      - 'worker/native_linux/admission_candidate.py'
      - 'worker/native_linux/host_safety_envelope_probe.py'
      - 'controller/w1/host_safety_envelope_validator.py'
      - 'controller/w1/host_safety_evidence_bundle.py'
      - 'tests/test_w1_admission_contract.py'
      - 'tests/test_w1_admission_candidate.py'
      - 'tests/test_w1_host_safety_envelope_v2.py'
      - 'supabase/migrations/*w1_persisted_admission_candidate_readback_v1.sql'
      - 'supabase/migrations/*w1_admission_candidate_readback_volatility_fix.sql'
      - '.github/workflows/w1-admission-contract.yml'
      - 'research/W1_DEV_CYCLE_001_ADMISSION_CONTRACT.md'
      - 'research/W1_DEV_CYCLE_001_PERSISTENCE_COMPOSITOR.md'
      - 'research/W1_HOST_SAFETY_ENVELOPE_V2.md'
  pull_request:
    branches: [main]
    paths:
      - 'worker/native_linux/admission_contract.py'
      - 'worker/native_linux/admission_candidate.py'
      - 'worker/native_linux/host_safety_envelope_probe.py'
      - 'controller/w1/host_safety_envelope_validator.py'
      - 'controller/w1/host_safety_evidence_bundle.py'
      - 'tests/test_w1_admission_contract.py'
      - 'tests/test_w1_admission_candidate.py'
      - 'tests/test_w1_host_safety_envelope_v2.py'
      - 'supabase/migrations/*w1_persisted_admission_candidate_readback_v1.sql'
      - 'supabase/migrations/*w1_admission_candidate_readback_volatility_fix.sql'
      - '.github/workflows/w1-admission-contract.yml'
      - 'research/W1_DEV_CYCLE_001_ADMISSION_CONTRACT.md'
      - 'research/W1_DEV_CYCLE_001_PERSISTENCE_COMPOSITOR.md'
      - 'research/W1_HOST_SAFETY_ENVELOPE_V2.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact source head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Compile contracts and active probe
        run: |
          set -euo pipefail
          python3 -m py_compile \
            worker/native_linux/admission_contract.py \
            worker/native_linux/admission_candidate.py \
            worker/native_linux/host_safety_envelope_probe.py \
            controller/w1/host_safety_envelope_validator.py \
            controller/w1/host_safety_evidence_bundle.py

      - name: Run fail-closed W1 tests
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_w1_admission_contract \
            tests.test_w1_admission_candidate \
            tests.test_w1_host_safety_envelope_v2 -v

      - name: Execute active probe on CI host as non-authority smoke
        run: |
          set -euo pipefail
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          set +e
          printf '{"source":{"git_sha":"%s","tree_sha":"%s"}}' "$GITHUB_SHA" "$TREE_SHA" \
            | python3 controller/w1/host_safety_evidence_bundle.py > /tmp/w1-host-safety-bundle.json
          RC=$?
          set -e
          test "$RC" -eq 0 -o "$RC" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/w1-host-safety-bundle.json')
          value = json.loads(p.read_text(encoding='utf-8'))
          assert value['schema'] == 'metaengine.compute.w1-host-safety-evidence-bundle.h205f22.v1'
          assert value['decision']['outcome'] in {'SAFETY_ENVELOPE_ELIGIBLE_NON_PERSISTENT','REJECTED_SAFETY_ENVELOPE'}
          assert value['authority'] == {
              'canonical': False,
              'authority_effect': False,
              'database_mutation': False,
              'provider_mutation': False,
              'reboot_authorized': False,
              'worker_admitted': False,
              'w1_verified': False,
          }
          assert value['persistence_status'] == 'NOT_EVALUATED'
          assert value['provider_identity_status'] == 'NOT_EVALUATED'
          assert value['reboot_status'] == 'NOT_EVALUATED'
          print('W1 active probe CI runtime smoke:', value['decision']['outcome'])
          print('failed checks:', ','.join(value['decision']['failures']))
          PY

      - name: Prove bundle has no external mutation authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = '\n'.join(
              Path(p).read_text(encoding='utf-8')
              for p in (
                  'worker/native_linux/host_safety_envelope_probe.py',
                  'controller/w1/host_safety_envelope_validator.py',
                  'controller/w1/host_safety_evidence_bundle.py',
              )
          )
          forbidden = ('shell=True', 'boto3', 'requests.', 'urllib.', 'socket.socket', 'supabase_url', 'service_role')
          for marker in forbidden:
              assert marker.lower() not in source.lower(), marker
          required = (
              '"provider_mutation": False',
              '"worker_admitted": False',
              '"w1_verified": False',
              'cgroup.kill',
              'pidfd_open',
              'PR_SET_SECCOMP',
          )
          for marker in required:
              assert marker in source, marker
          print('W1 active safety bundle non-authority boundary: PASS')
          PY
