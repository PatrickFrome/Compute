name: A2 Compute Browser B3 R4 Perception

on:
  push:
    branches:
      - 'work/a2-compute-browser-b3-session-scheduler*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  session-perception-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify Node runtime
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const m=Number(process.versions.node.split(".")[0]); if (m < 22) process.exit(1); console.log(process.version)'

      - name: Static session, perception, and authority contracts
        shell: bash
        working-directory: coordination/browser-compute
        run: |
          set -euo pipefail
          find src tests -type f -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
          node --test tests/*.test.mjs
          grep -q "Target.attachToTarget" src/session-scheduler.mjs
          grep -q "flatten: true" src/session-scheduler.mjs
          grep -q "DOMSnapshot.captureSnapshot" src/perception.mjs
          grep -q "Accessibility.getFullAXTree" src/perception.mjs
          grep -q "'perception.snapshot': 'READ_ONLY'" src/rpc-server.mjs
          grep -q '"oopif_complete": false' protocol-v1.json
          grep -q '"engine_session_ids_exposed": false' protocol-v1.json
          grep -q '"engine_node_ids_exposed": false' protocol-v1.json
          grep -q '"runtime_evaluate_used": false' protocol-v1.json
          ! grep -n -E 'case[[:space:]]+.*(cdp|evaluate)|params\?\.(sessionId|backendNodeId|computedStyles|deadlineMs)|rpc.*cdp\.call' src/rpc-server.mjs

      - name: Real Chromium flattened-session and semantic snapshot smoke
        shell: bash
        working-directory: coordination/browser-compute
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          printf 'A2_CHROME_EXECUTABLE=%s\n' "$CHROME"
          readlink -f "$CHROME" || true
          "$CHROME" --version || true
          export A2_CHROME_EXECUTABLE="$CHROME"
          export A2_COMPUTE_STATE_ROOT="$RUNNER_TEMP/a2-compute-browser-b3-r4"
          export CI=true
          export A2_CI_ALLOW_NO_SANDBOX=1
          export A2_SELF_TEST_REMOVE_STATE=1
          node src/cli.mjs self-test | tee "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"ok":true' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"debug_transport":"native_pipe_b3"' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"flattened_session_scheduler_verified":true' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"semantic_snapshot_verified":true' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"semantic_snapshot_scope":"MAIN_TARGET"' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"oopif_complete":false' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"semantic_snapshot_actuation_eligible":false' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"runtime_evaluate_used":false' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"raw_engine_identity_exposed":false' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"
          grep -q '"web_authority_effect":false' "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json"

      - name: Build deterministic B3 R4 evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          mkdir -p dist/a2-compute-browser-b3-r4
          cp "$RUNNER_TEMP/a2-compute-browser-b3-r4-self-test.json" dist/a2-compute-browser-b3-r4/SELF_TEST.json
          printf '%s\n' "$GITHUB_SHA" > dist/a2-compute-browser-b3-r4/SOURCE_COMMIT.txt
          tar --sort=name --mtime="@$EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf dist/a2-compute-browser-b3-r4/A2_COMPUTE_BROWSER_B3_R4.tar \
            coordination/browser-compute \
            research/a2-compute-browser-b3-r4-session-perception/report-source.md
          sha256sum dist/a2-compute-browser-b3-r4/A2_COMPUTE_BROWSER_B3_R4.tar > dist/a2-compute-browser-b3-r4/SHA256SUMS.txt

      - name: Attest evidence bundle provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/a2-compute-browser-b3-r4/A2_COMPUTE_BROWSER_B3_R4.tar

      - name: Upload B3 R4 evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: a2-compute-browser-b3-r4-${{ github.sha }}
          path: dist/a2-compute-browser-b3-r4/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
