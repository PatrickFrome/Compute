name: Client Canonical Native W44

on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/src/main.mjs'
      - 'apps/metaengine-browser/src/operator-canonical-native-w44.mjs'
      - 'apps/metaengine-browser/src/operator-native-context-bridge.mjs'
      - 'infra/client-state-runtime/operator-readonly-gateway.mjs'
      - 'infra/client-state-runtime/operator-canonical-native-w44.test.mjs'
      - '.github/workflows/operator-canonical-native-w44.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w44-trusted-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install hermetic own-PG test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: infra/client-state-runtime
      - name: Exact checkout and no whitespace regressions
        shell: bash
        run: |
          git rev-parse HEAD
          git diff --check
      - name: W44 native Owner/Source/Continuity cross-hop adversarial suite
        shell: bash
        run: |
          node --test --test-concurrency=1 \
            infra/client-state-runtime/operator-canonical-native-w44.test.mjs \
            infra/client-state-runtime/operator-context-convergence-w37.test.mjs \
            infra/client-state-runtime/operator-gateway-security-w28.test.mjs \
            infra/client-state-runtime/operator-readonly-gateway.test.mjs \
            apps/metaengine-browser/test/operator-native-context-bridge.test.mjs
