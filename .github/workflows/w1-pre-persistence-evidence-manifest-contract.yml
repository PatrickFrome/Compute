name: W1 Pre-Persistence Evidence Manifest Contract

on:
  push:
    branches: [work/w1-sandbox-launcher-prep]
    paths:
      - 'controller/w1/pre_persistence_evidence_manifest.py'
      - 'tests/test_w1_pre_persistence_evidence_manifest.py'
      - 'worker/native_linux/w1_lifecycle_evidence_harness.py'
      - 'controller/w1/s2_runtime_canary_receipt.py'
      - 'worker/native_linux/outer_privileged_cgroup_witness.py'
      - '.github/workflows/w1-pre-persistence-evidence-manifest-contract.yml'

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile manifest composer
        run: |
          set -euo pipefail
          python3 -m py_compile controller/w1/pre_persistence_evidence_manifest.py

      - name: Run adversarial manifest tests
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_w1_pre_persistence_evidence_manifest -v

      - name: Assert causal and non-authority boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('controller/w1/pre_persistence_evidence_manifest.py').read_text()
          required = (
              's2_runtime_canary_receipt.validate', 'require_pass=True',
              'EXPECTED_S2_SOURCE_SHA256', 'ELIGIBLE_NONAUTHORITY',
              'PREBOUND_EXACT_CGROUP_KILL_WRITE_ONLY', 'prebound_before_sudo',
              'sudo_before_exact_binding', 'tree_kill_proven', 'post_unpopulated',
              'pre_processes_gone', 'docker_running_after',
              'lifecycle_evidence_sha256', 's2_receipt_sha256',
              'outer_cgroup_witness_sha256', 'post_h1_h13_sha256',
              'PRE_PERSISTENCE_ELIGIBLE_NONAUTHORITY',
              'persist_manifest_and_evidence_in_supabase',
              'persisted_readback_recompose_and_match_manifest_sha256',
          )
          for token in required:
              assert token in text, token
          forbidden = (
              'requests.post(', 'requests.patch(', 'urllib.request.urlopen(',
              'worker_admitted = True', 'w1_verified = True',
              'authority_effect = True', 'persistent_worker_proof = True',
          )
          for token in forbidden:
              assert token not in text, token
          PY
