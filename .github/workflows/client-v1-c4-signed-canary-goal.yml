name: Client V1 C4 Signed Canary Goal Qualification

on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/src/client-control-contract.mjs'
      - 'apps/metaengine-browser/src/client-goal-journal.mjs'
      - 'apps/metaengine-browser/src/main.mjs'
      - 'apps/metaengine-browser/src/native-supervisor-client-base.mjs'
      - 'apps/metaengine-browser/src/preload-shell.cjs'
      - 'apps/metaengine-browser/src/meta-objective-compiler.mjs'
      - 'apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/meta-routes.mjs'
      - 'apps/me2-ui/src/components/me2/shell/me2-shell.tsx'
      - 'apps/metaengine-browser/test/client-goal-readback-integrity.test.mjs'
      - 'apps/metaengine-browser/test/client-v1-agent-origin-result-proof.test.mjs'
      - 'apps/metaengine-browser/test/client-v1-goal-journal.test.mjs'
      - 'apps/metaengine-browser/test/client-v1-goal-progress-reconciliation.test.mjs'
      - 'apps/metaengine-browser/test/client-v1-plan-generation-watermark.test.mjs'
      - 'apps/metaengine-browser/test/client-v1-signed-canary-goal.mjs'
      - 'supabase/migrations/20260929203000_client_v1_plan_generation_watermark_v1.sql'
      - 'supabase/migrations/20260929211500_client_v1_goal_progress_reconciliation_v1.sql'
      - 'supabase/migrations/20260929224500_client_v1_agent_origin_result_proof_v1.sql'
      - '.github/workflows/client-v1-c4-signed-canary-goal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-canary-goal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Request signed enrollment and qualify one Client V1 goal
        shell: bash
        env:
          METAENGINE_CLIENT_V1_CANARY_BASE: https://jhriwwsryeqsvvvufkok.supabase.co/functions/v1/a2-browser-native-supervisor-v14-canary
          METAENGINE_CLIENT_V1_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          METAENGINE_CLIENT_V1_APPROVAL_TIMEOUT_MS: '600000'
          METAENGINE_CLIENT_V1_CANARY_EVIDENCE: ${{ runner.temp }}/client-v1-c4-signed-canary-goal.json
        run: |
          set -euo pipefail
          node --test apps/metaengine-browser/test/client-goal-readback-integrity.test.mjs apps/metaengine-browser/test/client-v1-agent-origin-result-proof.test.mjs apps/metaengine-browser/test/client-v1-goal-journal.test.mjs apps/metaengine-browser/test/client-v1-goal-progress-reconciliation.test.mjs apps/metaengine-browser/test/client-v1-plan-generation-watermark.test.mjs apps/metaengine-browser/test/client-v1-typed-goal-bridge.test.mjs
          node --check apps/metaengine-browser/test/client-v1-signed-canary-goal.mjs
          node apps/metaengine-browser/test/client-v1-signed-canary-goal.mjs

      - name: Upload signed canary goal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-v1-c4-signed-canary-goal-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/client-v1-c4-signed-canary-goal.json
          if-no-files-found: ignore
          retention-days: 30
