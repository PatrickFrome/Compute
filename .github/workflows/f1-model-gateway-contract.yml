name: F1 Model Gateway Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/model-gateway/**'
      - 'spec/f1/model-peer-*.schema.json'
      - '.github/workflows/f1-model-gateway-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Syntax and schema gates
        shell: bash
        run: |
          set -euo pipefail
          for f in apps/model-gateway/api/*.mjs apps/model-gateway/lib/*.mjs apps/model-gateway/test/*.mjs; do
            node --check "$f"
          done
          node -e "const fs=require('fs'); for (const f of ['spec/f1/model-peer-request.schema.json','spec/f1/model-peer-receipt.schema.json']) JSON.parse(fs.readFileSync(f,'utf8'));"

      - name: Model gateway contract tests
        working-directory: apps/model-gateway
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Live Vercel Gateway catalog drift gate (zero inference spend)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request

          url = 'https://ai-gateway.vercel.sh/v1/models'
          payload = None
          last = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'METAENGINE-F1-CI/1'})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      payload = json.load(response)
                  break
              except Exception as exc:
                  last = exc
                  if attempt < 2:
                      time.sleep(2 ** attempt)
          if payload is None:
              raise SystemExit(f'catalog fetch failed after retries: {last}')

          data = payload.get('data')
          if not isinstance(data, list):
              raise SystemExit('catalog payload missing data[]')
          models = {item.get('id'): item for item in data if isinstance(item, dict) and isinstance(item.get('id'), str)}

          free = [
              'minimax/minimax-m3-free',
              'poolside/laguna-s-2.1-free',
              'inclusionai/ling-3.0-flash-fin-free',
          ]
          paid = [
              'anthropic/claude-sonnet-5',
              'google/gemini-3.7-flash',
              'deepseek/deepseek-v4-pro-0813',
              'zai/glm-5.3',
              'spacexai/grok-4.6',
              'alibaba/qwen3.8-flash',
              'alibaba/qwen3.8-max',
          ]

          for model_id in free:
              model = models.get(model_id)
              if model is None:
                  raise SystemExit(f'free model missing from live catalog: {model_id}')
              pricing = model.get('pricing') or {}
              if float(pricing.get('input', -1)) != 0 or float(pricing.get('output', -1)) != 0:
                  raise SystemExit(f'free model repriced: {model_id} pricing={pricing}')

          for model_id in paid:
              if model_id not in models:
                  raise SystemExit(f'allowlisted frontier model missing from live catalog: {model_id}')

          print(json.dumps({
              'catalog_models': len(models),
              'zero_spend_routes_verified': free,
              'frontier_allowlist_present': paid,
              'inference_calls': 0,
              'authority_effect': False,
          }, indent=2))
          PY

      - name: Spend and authority source gates
        shell: bash
        run: |
          set -euo pipefail
          grep -F "minimax/minimax-m3-free" apps/model-gateway/lib/policy.mjs
          grep -F "poolside/laguna-s-2.1-free" apps/model-gateway/lib/policy.mjs
          grep -F "inclusionai/ling-3.0-flash-fin-free" apps/model-gateway/lib/policy.mjs
          grep -F "METAENGINE_ALLOW_PAID_MODELS === '1'" apps/model-gateway/lib/policy.mjs
          grep -F "hardMaxPaidRequestUsd: 0.50" apps/model-gateway/lib/policy.mjs
          grep -F "assertZeroSpend(models)" apps/model-gateway/api/peer.mjs
          grep -F "assertPaidBudget(models" apps/model-gateway/api/peer.mjs
          grep -F "max_output_tokens: maxOutputTokens" apps/model-gateway/lib/gateway.mjs
          grep -F "authority_effect: false" apps/model-gateway/api/peer.mjs
          ! grep -R -E '(ANTHROPIC_API_KEY|GOOGLE_API_KEY|DEEPSEEK_API_KEY|ZAI_API_KEY|XAI_API_KEY)' apps/model-gateway
