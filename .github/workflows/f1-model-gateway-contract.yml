name: F1 Model Gateway Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/model-gateway/**'
      - 'spec/f1/model-peer-*.schema.json'
      - 'spec/f1/advisory-evidence-envelope.schema.json'
      - '.github/workflows/f1-model-gateway-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Syntax and schema gates
        shell: bash
        run: |
          set -euo pipefail
          for f in apps/model-gateway/api/*.mjs apps/model-gateway/lib/*.mjs apps/model-gateway/test/*.mjs; do
            node --check "$f"
          done
          node -e "const fs=require('fs'); for (const f of ['spec/f1/model-peer-request.schema.json','spec/f1/model-peer-receipt.schema.json','spec/f1/advisory-evidence-envelope.schema.json']) JSON.parse(fs.readFileSync(f,'utf8'));"

      - name: Model gateway contract tests
        working-directory: apps/model-gateway
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Live Vercel Gateway catalog drift gate (zero inference spend)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, time, urllib.request

          url = 'https://ai-gateway.vercel.sh/v1/models'
          payload = None
          last = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'METAENGINE-F1-CI/2'})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      payload = json.load(response)
                  break
              except Exception as exc:
                  last = exc
                  if attempt < 2:
                      time.sleep(2 ** attempt)
          if payload is None:
              raise SystemExit(f'catalog fetch failed after retries: {last}')

          data = payload.get('data')
          if not isinstance(data, list):
              raise SystemExit('catalog payload missing data[]')
          models = {item.get('id'): item for item in data if isinstance(item, dict) and isinstance(item.get('id'), str)}

          free = [
              'minimax/minimax-m3-free',
              'poolside/laguna-s-2.1-free',
              'inclusionai/ling-3.0-flash-fin-free',
          ]
          paid = [
              'anthropic/claude-sonnet-5',
              'google/gemini-3.7-flash',
              'deepseek/deepseek-v4-pro-0813',
              'zai/glm-5.3',
              'spacexai/grok-4.6',
              'alibaba/qwen3.8-flash',
              'alibaba/qwen3.8-max',
          ]

          def numeric(value):
              try:
                  parsed = float(value)
              except (TypeError, ValueError):
                  return None
              return parsed if math.isfinite(parsed) and parsed >= 0 else None

          def charges(node):
              out = []
              if isinstance(node, list):
                  for item in node:
                      out.extend(charges(item))
                  return out
              if not isinstance(node, dict):
                  return out
              for name, value in node.items():
                  lower = name.lower()
                  charge_key = (
                      lower in {'input', 'output', 'cost'}
                      or lower.startswith('input_')
                      or lower.startswith('output_')
                      or 'cost_per' in lower
                      or lower.endswith('_cost')
                      or lower.endswith('_price')
                  )
                  if charge_key and isinstance(value, (str, int, float)):
                      parsed = numeric(value)
                      if parsed is not None:
                          out.append(parsed)
                  if isinstance(value, (dict, list)):
                      out.extend(charges(value))
              return out

          privacy = {}
          for model_id in free:
              model = models.get(model_id)
              if model is None:
                  raise SystemExit(f'free model missing from live catalog: {model_id}')
              pricing = model.get('pricing') or {}
              if pricing.get('varies_by_provider') is True:
                  raise SystemExit(f'free model pricing varies by provider: {model_id}')
              values = charges(pricing)
              if numeric(pricing.get('input')) != 0 or numeric(pricing.get('output')) != 0:
                  raise SystemExit(f'free model headline price is not zero: {model_id} pricing={pricing}')
              if len(values) < 2 or any(value != 0 for value in values):
                  raise SystemExit(f'free model has nonzero published charge/tier: {model_id} pricing={pricing}')
              privacy[model_id] = {
                  'zdr': model.get('zdr', 'unknown'),
                  'no_training': model.get('no_training', 'unknown'),
              }

          for model_id in paid:
              if model_id not in models:
                  raise SystemExit(f'allowlisted frontier model missing from live catalog: {model_id}')

          print(json.dumps({
              'catalog_models': len(models),
              'zero_spend_routes_verified': free,
              'zero_spend_privacy_metadata': privacy,
              'frontier_allowlist_present': paid,
              'inference_calls': 0,
              'confidentiality_claim': False,
              'authority_effect': False,
          }, indent=2))
          PY

      - name: Spend privacy authority and evidence source gates
        shell: bash
        run: |
          set -euo pipefail
          grep -F "minimax/minimax-m3-free" apps/model-gateway/lib/policy.mjs
          grep -F "poolside/laguna-s-2.1-free" apps/model-gateway/lib/policy.mjs
          grep -F "inclusionai/ling-3.0-flash-fin-free" apps/model-gateway/lib/policy.mjs
          grep -F "METAENGINE_ALLOW_PAID_MODELS === '1'" apps/model-gateway/lib/policy.mjs
          grep -F "hardMaxPaidRequestUsd: 0.50" apps/model-gateway/lib/policy.mjs
          grep -F "assertZeroSpend(models)" apps/model-gateway/api/peer.mjs
          grep -F "assertPaidBudget(models" apps/model-gateway/api/peer.mjs
          grep -F "secret_like_material_blocked" apps/model-gateway/lib/security.mjs
          grep -F "zero_spend_evidence" apps/model-gateway/api/peer.mjs
          grep -F "confidential_data_supported: false" apps/model-gateway/lib/openai-compat.mjs
          grep -F "max_output_tokens: maxOutputTokens" apps/model-gateway/lib/gateway.mjs
          grep -F "authority_effect: false" apps/model-gateway/api/peer.mjs
          grep -F "HASH_BOUND_ADVISORY_UNATTESTED" apps/model-gateway/lib/advisory-evidence-envelope.mjs
          grep -F "direct_action_allowed: false" apps/model-gateway/lib/advisory-evidence-envelope.mjs
          grep -F "browser_authority: false" apps/model-gateway/lib/advisory-evidence-envelope.mjs
          grep -F "promotion_authority: false" apps/model-gateway/lib/advisory-evidence-envelope.mjs
          grep -F "createCommitteeAdvisoryEvidence" apps/model-gateway/api/committee.mjs
          ! grep -R -E '(ANTHROPIC_API_KEY|GOOGLE_API_KEY|DEEPSEEK_API_KEY|ZAI_API_KEY|XAI_API_KEY)' apps/model-gateway
