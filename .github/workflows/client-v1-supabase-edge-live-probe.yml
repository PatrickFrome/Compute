name: Client V1 Supabase Edge Live Probe

on:
  push:
    branches:
      - work/client-v1-c2-new-supabase-rehome-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe stable and canary health without credentials
        shell: bash
        env:
          STABLE: https://jhriwwsryeqsvvvufkok.supabase.co/functions/v1/a2-browser-native-supervisor-v1/health
          CANARY: https://jhriwwsryeqsvvvufkok.supabase.co/functions/v1/a2-browser-native-supervisor-v14-canary/health
        run: |
          set -euo pipefail
          probe() {
            local name="$1" url="$2"
            local body headers status
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "${name}_status=${status}"
            sed -n '1,40p' "$headers"
            cat "$body"
            echo
            test "$status" = "200"
            node -e '
              const fs=require("fs");
              const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              if(b?.ok!==true) throw new Error("health_ok_missing");
              if(b?.authority_effect!==false) throw new Error("health_authority_effect_invalid");
            ' "$body"
          }
          probe stable "$STABLE"
          probe canary "$CANARY"
