name: Client V1 Supabase Edge Live Probe

on:
  push:
    branches:
      - work/client-v1-c2-new-supabase-rehome-v1
  pull_request:
    paths:
      - 'apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/**'
      - 'coordination/convergence/R83_EDGE_CANARY_QUALIFICATION_V1.json'
      - '.github/workflows/client-v1-supabase-edge-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    # This local-only candidate must not contact the historical hosted runtime.
    if: github.event_name != 'pull_request' || (github.head_ref != 'work/client-owned-state-runtime-v1' && github.head_ref != 'work/client-runtime-restart-singleton-v1' && github.head_ref != 'work/client-restored-pg17-runtime-repair-v1' && github.head_ref != 'work/client-mcp-offline-installer-qualification-v1' && github.head_ref != 'work/client-mcp-db-connect-operator-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe stable and canary health without credentials
        shell: bash
        env:
          STABLE: https://jhriwwsryeqsvvvufkok.supabase.co/functions/v1/a2-browser-native-supervisor-v1/health
          CANARY: https://jhriwwsryeqsvvvufkok.supabase.co/functions/v1/a2-browser-native-supervisor-v14-canary/health
        run: |
          set -euo pipefail
          probe() {
            local name="$1" url="$2"
            local body headers status
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "${name}_status=${status}"
            sed -n '1,40p' "$headers"
            cat "$body"
            echo
            test "$status" = "200"
            node -e '
              const fs=require("fs");
              const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              if(b?.ok!==true) throw new Error("health_ok_missing");
              if(b?.authority_effect!==false) throw new Error("health_authority_effect_invalid");
            ' "$body"
          }
          probe stable "$STABLE"
          probe canary "$CANARY"

      - name: Prove ticket-only redemption rejects unissued tickets on stable and canary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          for (const slug of ['a2-browser-native-supervisor-v1','a2-browser-native-supervisor-v14-canary']) {
            const url = `https://jhriwwsryeqsvvvufkok.supabase.co/functions/v1/${slug}/v1/guardian/enrollment/redeem`;
            const response = await fetch(url, { method:'POST', redirect:'error', signal:AbortSignal.timeout(8000),
              headers:{'content-type':'application/json'},
              body:JSON.stringify({ticket:crypto.randomBytes(32).toString('base64url'),key_fingerprint_sha256:'a'.repeat(64),owner_sid_sha256:'b'.repeat(64)}) });
            const row = await response.json();
            if (response.status !== 409 || row.schema !== 'metaengine.guardian-enrollment-ticket-redemption.v1'
                || row.accepted !== false || row.reason !== 'TICKET_NOT_AVAILABLE' || row.authority_effect !== false) throw new Error('guardian_redemption_rejection_unproven:'+slug);
            if (slug.endsWith('-v1') && response.headers.get('x-metaengine-guardian-redemption-route') !== 'META_QUALIFIED_CANARY') throw new Error('guardian_stable_redemption_route_unproven');
            console.log(JSON.stringify({slug,status:response.status,reason:row.reason,accepted:false,authority_effect:false}));
          }
          NODE
