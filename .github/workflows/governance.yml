name: Compute Fabric Governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  governance-preview:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preview governance transition shape
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$BASE_SHA"...HEAD | wc -l | tr -d ' ')" -ge 1
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/governance.yml').read_text()
          target_gate = "if: $" + "{{ github.event_name == 'pull_request_target' }}"
          unsafe_head_ref = "ref: $" + "{{ github.event.pull_request.head.sha }}"
          pinned_checkout = 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
          assert 'pull_request_target:' in text
          assert target_gate in text
          assert text.count(pinned_checkout) == 2
          # Only the unprivileged preview may checkout the PR head. The
          # authoritative pull_request_target job must keep a trusted base tree.
          assert text.count(unsafe_head_ref) == 1
          for needle in [
              'Fetch PR head object without checkout',
              'git cat-file -e "$HEAD_SHA:',
              'git show "$HEAD_SHA:',
              'git diff --no-ext-diff --name-only "$BASE_SHA" "$HEAD_SHA"',
              'persist-credentials: false',
              'Prevent governance self-authorization',
              'work/chat-control-plane-browser-bridge',
          ]:
              assert needle in text, needle
          PY

      - name: Shadow authoritative object-only checks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

          case "$HEAD_REF" in
            work/w1-linux-worker-safety) EXPECTED_L1='C1' ;;
            work/t0-hermetic-toolchain) EXPECTED_L1='C2' ;;
            work/f1-live-federation) EXPECTED_L1='F1+' ;;
            work/r1-continuity-plane) EXPECTED_L1='R1' ;;
            work/a1-agent-workspace) EXPECTED_L1='C2' ;;
            work/aop1-autonomous-orchestration|work/same-point-duel-v4-*|work/chat-control-plane-browser-bridge) EXPECTED_L1='CROSS-CUTTING' ;;
            analysis/integration) EXPECTED_L1='CROSS-CUTTING' ;;
            *) exit 1 ;;
          esac
          grep -Fq "Canonical Level-1 milestone: $EXPECTED_L1" <<<"${PR_BODY:-}"
          grep -Fq "Level-2 milestone:" <<<"${PR_BODY:-}"

          if git diff --no-ext-diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq '.github/workflows/governance.yml'; then
            case "$HEAD_REF" in
              analysis/integration|work/same-point-duel-v4-*) ;;
              *) exit 1 ;;
            esac
          fi

          for path in README.md docs/CANONICAL_ROADMAP.md docs/CHAT_TOPOLOGY.md docs/ROADMAP_EXECUTION_PROTOCOL.md .github/pull_request_template.md; do
            git cat-file -e "$HEAD_SHA:$path"
          done
          for marker in R1 C1 C17 'F1+' 'Level-2 execution DAG mapping'; do
            git show "$HEAD_SHA:docs/CANONICAL_ROADMAP.md" | grep -Fq "$marker"
          done
          if [ "$HEAD_REF" != 'analysis/integration' ]; then
            ! git diff --no-ext-diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq 'docs/CANONICAL_ROADMAP.md'
          fi

  governance:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject external-fork governance execution
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Compute Fabric governance accepts repository-local workstreams only." >&2
            exit 1
          fi

      - name: Checkout trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch PR head object without checkout
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$HEAD_SHA" != "$BASE_SHA"
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Validate registered workstream and canonical binding
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          case "$HEAD_REF" in
            work/w1-linux-worker-safety)
              EXPECTED_L1='C1'
              ;;
            work/t0-hermetic-toolchain)
              EXPECTED_L1='C2'
              ;;
            work/f1-live-federation)
              EXPECTED_L1='F1+'
              ;;
            work/r1-continuity-plane)
              EXPECTED_L1='R1'
              ;;
            work/a1-agent-workspace)
              EXPECTED_L1='C2'
              ;;
            work/aop1-autonomous-orchestration|work/same-point-duel-v4-*|work/chat-control-plane-browser-bridge)
              EXPECTED_L1='CROSS-CUTTING'
              ;;
            analysis/integration)
              EXPECTED_L1='CROSS-CUTTING'
              ;;
            *)
              echo "Unregistered Compute Fabric workstream branch: $HEAD_REF" >&2
              exit 1
              ;;
          esac

          if ! grep -Fq "Canonical Level-1 milestone: $EXPECTED_L1" <<<"${PR_BODY:-}"; then
            echo "PR must bind branch $HEAD_REF to canonical Level-1 milestone $EXPECTED_L1" >&2
            exit 1
          fi

          if ! grep -Fq "Level-2 milestone:" <<<"${PR_BODY:-}"; then
            echo "PR must state its Level-2 milestone (or N/A for analysis-only work)" >&2
            exit 1
          fi

      - name: Prevent governance self-authorization
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --no-ext-diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq '.github/workflows/governance.yml'; then
            case "$HEAD_REF" in
              analysis/integration|work/same-point-duel-v4-*)
                ;;
              *)
                echo "Only pre-authorized governance paths may modify governance.yml." >&2
                exit 1
                ;;
            esac
          fi

      - name: Validate canonical architecture files from PR tree
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for path in \
            README.md \
            docs/CANONICAL_ROADMAP.md \
            docs/CHAT_TOPOLOGY.md \
            docs/ROADMAP_EXECUTION_PROTOCOL.md \
            .github/pull_request_template.md
          do
            git cat-file -e "$HEAD_SHA:$path"
          done

          git show "$HEAD_SHA:docs/CANONICAL_ROADMAP.md" | grep -Fq 'R1'
          git show "$HEAD_SHA:docs/CANONICAL_ROADMAP.md" | grep -Fq 'C1'
          git show "$HEAD_SHA:docs/CANONICAL_ROADMAP.md" | grep -Fq 'C17'
          git show "$HEAD_SHA:docs/CANONICAL_ROADMAP.md" | grep -Fq 'F1+'
          git show "$HEAD_SHA:docs/CANONICAL_ROADMAP.md" | grep -Fq 'Level-2 execution DAG mapping'

      - name: Prevent silent canonical-roadmap mutation
        if: ${{ github.event.pull_request.head.ref != 'analysis/integration' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --no-ext-diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq 'docs/CANONICAL_ROADMAP.md'; then
            echo 'Implementation workstreams may not silently mutate the canonical Level-1 roadmap.' >&2
            echo 'Route roadmap amendments through analysis/integration and explicit Supervisor architecture review.' >&2
            exit 1
          fi
