name: W1 H1-H13 Prerequisite Probe Contract

on:
  push:
    branches: [work/w1-sandbox-launcher-prep]
    paths:
      - 'worker/native_linux/h1_h13_prereq_probe.py'
      - 'tests/test_w1_h1_h13_prereq_probe.py'
      - '.github/workflows/w1-h1-h13-prereq-probe-contract.yml'

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile probe
        run: python3 -m py_compile worker/native_linux/h1_h13_prereq_probe.py

      - name: Run uid/gid capture regression tests
        run: python3 -m unittest tests.test_w1_h1_h13_prereq_probe -v

      - name: Run passive non-authority probe
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 worker/native_linux/h1_h13_prereq_probe.py > /tmp/w1-h1-h13-prereq.json
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/w1-h1-h13-prereq.json').read_text())
          assert p['schema'] == 'metaengine.compute.w1-h1-h13-prereq-probe.h205f22.v1'
          assert p['canonical'] is False
          assert p['authority_effect'] is False
          assert p['worker_admitted'] is False
          assert p['w1_verified'] is False
          assert isinstance(p['checks'], dict)
          assert p['details']['cgroup'].get('active_canary_skipped') is True
          assert 'ready_for_production_evidence' in p
          print('PASS_NONAUTHORITY_PREREQ_CONTRACT')
          PY
