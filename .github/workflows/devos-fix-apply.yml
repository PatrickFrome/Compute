name: DevOS Fix Apply

on:
  push:
    branches: [fix/devos-070-self-heal-runtime-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/devos-070-self-heal-runtime-v1
          fetch-depth: 0

      - name: Apply exact clean-genesis presentation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/metaengine-browser/src/main.mjs')
          text = path.read_text()
          old_decl = "async function bootstrapDegradableSubsystems() {\n  const quiescentStartup = startupControlState?.supervisor_mode === 'OFF' && startupControlState?.armed === false;\n"
          new_decl = "async function bootstrapDegradableSubsystems() {\n"
          old_gate = "  if (sessionReady && !quiescentStartup) {\n"
          new_gate = "  if (sessionReady) {\n"
          assert text.count(old_decl) == 1, 'unexpected quiescent declaration shape'
          assert text.count(old_gate) == 1, 'unexpected initial tab gate shape'
          text = text.replace(old_decl, new_decl).replace(old_gate, new_gate)
          assert 'sessionReady && !quiescentStartup' not in text
          path.write_text(text)
          PY

      - name: Run focused regression tests
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          node --test test/browser-runtime-clean-genesis.test.mjs test/browser-runtime-presentation-bootstrap.test.mjs test/self-update-ambiguous-reconciliation.test.mjs
          node --check src/main.mjs
          node --check src/self-update-runtime.mjs
          node --check src/self-update-ambiguous-reconciliation.mjs

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/devos-fix-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/metaengine-browser/src/main.mjs apps/metaengine-browser/test/browser-runtime-presentation-bootstrap.test.mjs apps/metaengine-browser/src/self-update-runtime.mjs apps/metaengine-browser/src/self-update-ambiguous-reconciliation.mjs apps/metaengine-browser/test/self-update-ambiguous-reconciliation.test.mjs
          git diff --cached --check
          git commit -m 'fix(devos): decouple clean-genesis presentation from supervisor authority'
          git push origin HEAD:fix/devos-070-self-heal-runtime-v1
