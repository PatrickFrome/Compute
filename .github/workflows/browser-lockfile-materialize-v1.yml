name: Browser Lockfile Materialize V1

on:
  push:
    branches:
      - 'work/build-lockfile-material-v1'
    paths:
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/package-lock.json'
      - 'apps/metaengine-browser/scripts/package-lock-material.mjs'
      - 'apps/metaengine-browser/test/package-lock-material.test.mjs'
      - '.github/workflows/browser-lockfile-materialize-v1.yml'

permissions:
  contents: write

concurrency:
  group: browser-lockfile-materialize-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup exact lockfile toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Generate package-lock with no lifecycle effects
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          rm -rf node_modules
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json
          node scripts/package-lock-material.mjs --root . --out "$RUNNER_TEMP/package-lock-material.json"

      - name: Prove frozen clean install without lifecycle effects
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/dependency-resolution-digest.mjs --out "$RUNNER_TEMP/dependency-resolution-lockfile-smoke.json"
          node --test test/package-lock-material.test.mjs

      - name: Prove package manifest was not rewritten
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- apps/metaengine-browser/package.json

      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git add -- apps/metaengine-browser/package-lock.json
          if git diff --cached --quiet; then
            echo "package_lock_already_current=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: materialize Browser package-lock under Node 24 npm 11"
          git push origin HEAD:work/build-lockfile-material-v1
