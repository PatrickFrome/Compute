name: W1 S2 PID1 Proc Boundary Regression

on:
  push:
    branches:
      - work/w1-sandbox-launcher-prep
    paths:
      - 'controller/w1/s2_pid1_proc_boundary_canary.py'
      - 'tests/test_w1_pid1_runtime_hardening_fail_closed.py'
      - 'worker/native_linux/rootless_sandbox_launcher_v2.py'
      - '.github/workflows/w1-s2-pid1-proc-boundary-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile canary and launcher
        run: |
          set -euo pipefail
          python3 -m py_compile \
            controller/w1/s2_pid1_proc_boundary_canary.py \
            worker/native_linux/rootless_sandbox_launcher_v2.py \
            tests/test_w1_pid1_runtime_hardening_fail_closed.py
      - name: Verify PID1 hardening failure arms
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_w1_pid1_runtime_hardening_fail_closed -v
      - name: Measure direct proc environ boundary
        run: |
          set -euo pipefail
          mkdir -p out
          python3 controller/w1/s2_pid1_proc_boundary_canary.py \
            --output out/w1-s2-pid1-proc-boundary-canary.json
          cat out/w1-s2-pid1-proc-boundary-canary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('out/w1-s2-pid1-proc-boundary-canary.json').read_text())
          assert r['outcome'] == 'PASS_DIRECT_PROC_BOUNDARY_NONAUTHORITY'
          assert all(r['evidence']['checks'].values())
          assert r['evidence']['secret_material_persisted'] is False
          assert r['runtime_isolation_verified'] is False
          assert r['w1_verified'] is False
          assert r['authority_effect'] is False
          print('PID1 proc primitive boundary: PASS_NONAUTHORITY')
          PY
      - name: Upload non-authority kernel boundary receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w1-s2-pid1-proc-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/w1-s2-pid1-proc-boundary-canary.json
          if-no-files-found: error
          retention-days: 14
