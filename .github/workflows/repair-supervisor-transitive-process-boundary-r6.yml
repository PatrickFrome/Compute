name: Repair Supervisor Transitive Process Boundary R6

on:
  push:
    branches:
      - repair/supervisor-transitive-process-boundary-r6
    paths:
      - scripts/apply-supervisor-transitive-process-boundary-r6.py
      - .github/workflows/repair-supervisor-transitive-process-boundary-r6.yml

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: repair/supervisor-transitive-process-boundary-r6
          fetch-depth: 1
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply exact R6 patch
        run: python3 scripts/apply-supervisor-transitive-process-boundary-r6.py
      - name: Parse modified source
        working-directory: apps/metaengine-browser
        run: |
          node --check src/supervisor-keepalive.mjs
          node --check src/supervisor-lifecycle-runtime-core.mjs
      - name: Run focused R4 R5 R6 supervisor regressions
        working-directory: apps/metaengine-browser
        run: |
          node --test test/supervisor-bootstrap-ambiguity-repair-r4.test.mjs test/supervisor-process-boundary-ambiguity-r5.test.mjs
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/metaengine-browser/src/supervisor-keepalive.mjs apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs apps/metaengine-browser/test/supervisor-process-boundary-ambiguity-r5.test.mjs
          git diff --cached --exit-code && { echo no_repair_diff >&2; exit 1; } || true
          git commit -m "fix(browser): recover transitive process-boundary wake ambiguity"
          git push origin HEAD:repair/supervisor-transitive-process-boundary-r6
