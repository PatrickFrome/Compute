name: A2 cognitive bus

on:
  pull_request:
    paths:
      - "orchestration/sovereign/src/a2_*.ts"
      - "orchestration/sovereign/ui/**"
      - "orchestration/sovereign/formal/**"
      - "orchestration/sovereign/scripts/start-a2.sh"
      - "orchestration/sovereign/package.json"
      - "supabase/migrations/*a2*"
      - ".github/workflows/a2-cognitive-bus.yml"
  push:
    branches:
      - "work/same-point-duel-v4-a2-cognitive-bus"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Git whitespace integrity
        run: git diff --check HEAD^ HEAD
      - name: A2 migration topology
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            20260824112049_a2_realtime_multi_agent_cognitive_bus_core.sql
            20260824112546_a2_visibility_readback_and_peer_key_fencing.sql
            20260824113516_a2_event_visibility_projection_and_semantic_fencing.sql
            20260824113730_a2_atomic_visibility_and_sequence_fencing.sql
            20260824114241_a2_replayable_consolidated_contract_v1.sql
            20260824120951_a2_trusted_ingress_receipt_v2.sql
            20260824121554_a2_cursor_frontier_and_fk_index_hardening.sql
            20260824121749_a2_peer_nologin_capability_role.sql
            20260824121943_a2_trusted_ingress_signature_binding_v3.sql
            20260824122043_a2_duel_state_machine_bridge.sql
            20260824122743_a2_ingress_single_preimage_contract.sql
            20260824124953_a2_duel_mode_cognition_fence.sql
          )
          for migration in "${migrations[@]}"; do
            test -s "supabase/migrations/$migration" || { echo "missing A2 migration: $migration"; exit 1; }
          done
          replay="supabase/migrations/20260824114241_a2_replayable_consolidated_contract_v1.sql"
          grep -q "create table if not exists destruktion_meta.compute_fabric_a2_workspace_h205f22" "$replay"
          grep -q "create or replace function public.h205f22_a2_emit_agent_event_v1" "$replay"
          grep -q "create or replace function public.h205f22_a2_read_frontier_v1" "$replay"
          grep -q "create trigger trg_a2_guard_event" "$replay"
          if grep -q "HISTORY MARKER ONLY" "$replay"; then
            echo "consolidated A2 replay contract must not be a history marker"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install sovereign dependencies
        working-directory: orchestration/sovereign
        run: npm install --no-audit --no-fund
      - name: TypeScript contract
        working-directory: orchestration/sovereign
        run: npm run check
      - name: A2 protocol tests
        working-directory: orchestration/sovereign
        run: npm run test:a2:coverage
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: A2 causal invariants
        working-directory: orchestration/sovereign/formal
        run: |
          curl -L --fail --silent --show-error -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c -
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC -config A2CausalBus.cfg A2CausalBus.tla
