name: A1 Legacy GPT Coordination Worker — Quarantined

on:
  pull_request:
    branches: [main]
    paths:
      - 'coordination/gpt-worker/**'
      - '.github/workflows/a1-gpt-coordination-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# R104: validation-only historical lane.
# Canonical METAENGINE Browser agent execution is native Browser + authenticated
# z.ai Agent Web UI. This workflow intentionally has no deployment job, no model
# API secret bindings, and no production authority effect.
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse quarantined worker modules
        run: |
          node --check coordination/gpt-worker/src/guards.mjs
          node --check coordination/gpt-worker/src/index.mjs
      - name: Run legacy lesson-guard regression tests
        run: node --test coordination/gpt-worker/test/guards.test.mjs
      - name: Prove deployment path remains quarantined
        run: node --test coordination/gpt-worker/test/quarantine.test.mjs
      - name: Validate historical Cloudflare bundle without deployment
        working-directory: coordination/gpt-worker
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir /tmp/gpt-worker-dist --config wrangler.jsonc
