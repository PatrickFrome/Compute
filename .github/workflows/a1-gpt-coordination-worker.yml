name: A1 GPT Coordination Worker

on:
  pull_request:
    branches: [main]
    paths:
      - 'coordination/gpt-worker/**'
      - '.github/workflows/a1-gpt-coordination-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse worker modules
        run: |
          node --check coordination/gpt-worker/src/guards.mjs
          node --check coordination/gpt-worker/src/index.mjs
      - name: Run lesson-guard regression tests
        run: node --test coordination/gpt-worker/test/guards.test.mjs
      - name: Validate Cloudflare bundle and Durable Object config
        working-directory: coordination/gpt-worker
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir /tmp/gpt-worker-dist --config wrangler.jsonc

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: deterministic-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy pinned Wrangler build
        working-directory: coordination/gpt-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 deploy --config wrangler.jsonc
      - name: Install runtime secrets
        working-directory: coordination/gpt-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAP_CHATGPT_TOKEN: ${{ secrets.PAP_CHATGPT_TOKEN }}
          WORKER_CONTROL_TOKEN: ${{ secrets.GPT_WORKER_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          test -n "$PAP_CHATGPT_TOKEN"
          test -n "$WORKER_CONTROL_TOKEN"
          printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4.125.0 secret put OPENAI_API_KEY --config wrangler.jsonc
          printf '%s' "$PAP_CHATGPT_TOKEN" | npx --yes wrangler@4.125.0 secret put PAP_CHATGPT_TOKEN --config wrangler.jsonc
          printf '%s' "$WORKER_CONTROL_TOKEN" | npx --yes wrangler@4.125.0 secret put WORKER_CONTROL_TOKEN --config wrangler.jsonc
