name: C5 Server Lease Verifier

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260831165000_c5_server_lease_verifier_v1.sql'
      - 'apps/metaengine-browser/test/c5-server-lease-verifier-smoke.sql'
      - '.github/workflows/c5-server-lease-verifier.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Exact server-time and ACL smoke
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f apps/metaengine-browser/test/c5-server-lease-verifier-smoke.sql
