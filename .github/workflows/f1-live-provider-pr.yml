name: F1 Live External Federation PR Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  producer:
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write, attestations: write}
    outputs:
      evidence_b64: ${{ steps.generate.outputs.evidence_b64 }}
      evidence_sha256: ${{ steps.generate.outputs.evidence_sha256 }}
      expires_at: ${{ steps.generate.outputs.expires_at }}
      external_execution_id: ${{ steps.generate.outputs.external_execution_id }}
      signer_workflow: ${{ steps.generate.outputs.signer_workflow }}
      signer_identity: ${{ steps.generate.outputs.signer_identity }}
      attestation_id: ${{ steps.attest.outputs.attestation-id }}
      attestation_url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Fetch exact execution commit
        shell: bash
        run: |
          set -euo pipefail; git init .; git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"; git fetch --depth=1 origin "${GITHUB_SHA}"; git checkout --detach FETCH_HEAD
      - name: Generate provider evidence
        id: generate
        run: python3 federation/f1/live_provider_verifier.py generate --output federation/f1/provider-evidence.json
      - name: Produce keyless Sigstore attestation
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with: {subject-path: federation/f1/provider-evidence.json}
  verifier:
    needs: producer
    runs-on: ubuntu-latest
    permissions: {contents: read, attestations: read}
    steps:
      - name: Fetch verifier at exact execution commit
        shell: bash
        run: |
          set -euo pipefail; git init .; git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"; git fetch --depth=1 origin "${GITHUB_SHA}"; git checkout --detach FETCH_HEAD
      - name: Rehydrate evidence and prove hash is not verification
        env: {EVIDENCE_B64: "${{ needs.producer.outputs.evidence_b64 }}", EXPECTED_SHA256: "${{ needs.producer.outputs.evidence_sha256 }}"}
        run: |
          python3 - <<'PY'
          import base64,hashlib,os
          d=base64.b64decode(os.environ['EVIDENCE_B64']); assert hashlib.sha256(d).hexdigest()==os.environ['EXPECTED_SHA256']; open('federation/f1/provider-evidence.json','wb').write(d); print('VERIFIED=FALSE_UNTIL_CRYPTO_STEP')
          PY
      - name: Dedicated cryptographic verification
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          gh attestation verify federation/f1/provider-evidence.json --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/f1-live-provider-pr.yml" --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" --cert-oidc-issuer "https://token.actions.githubusercontent.com" --deny-self-hosted-runners --format json > federation/f1/cryptographic-verification.json
      - name: Semantic and replay expiry revocation rotation tests
        run: |
          set -euo pipefail
          python3 federation/f1/live_provider_verifier.py verify-policy --input federation/f1/provider-evidence.json --repository "${GITHUB_REPOSITORY}" --source-digest "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/f1-live-provider-pr.yml" --trust-generation 1
          python3 federation/f1/live_provider_verifier.py self-test --input federation/f1/provider-evidence.json | tee federation/f1/policy-negative-tests.json
      - name: Cryptographic tamper rejection
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail; cp federation/f1/provider-evidence.json federation/f1/tampered.json; printf '\n' >> federation/f1/tampered.json
          if gh attestation verify federation/f1/tampered.json --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/f1-live-provider-pr.yml" --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" --cert-oidc-issuer "https://token.actions.githubusercontent.com" --deny-self-hosted-runners >/dev/null 2>&1; then exit 1; fi
      - name: Verify full live Sigstore TUF chain through trusted_root target
        run: |
          set -euo pipefail; endpoint='https://xpeibufgzjknrhbhpffp.supabase.co/functions/v1/metaengine-sigstore-tuf-chain-verifier-h205f22'; curl --silent --show-error --fail --max-time 60 "$endpoint" -o federation/f1/tuf-chain-verification.json
          jq -e '.verification_status == "FULL_TUF_CHAIN_CRYPTO_VERIFIED" and .evidence.chain.targets_to_trusted_root == true and .evidence.guarantees.target_length_and_sha256_bound_to_verified_targets_metadata == true and .evidence.authority_effect == false' federation/f1/tuf-chain-verification.json >/dev/null
          for mode in content-hash-only target-tamper semantic-tamper; do curl --silent --show-error --fail --max-time 60 "$endpoint?test=$mode" -o "/tmp/f1-$mode.json"; jq -e '.verification_status == "NEGATIVE_TEST_REJECTED"' "/tmp/f1-$mode.json" >/dev/null; done
      - name: Emit evidence receipt with verified DSSE bindings
        env:
          EVIDENCE_SHA256: ${{ needs.producer.outputs.evidence_sha256 }}
          EXPIRES_AT: ${{ needs.producer.outputs.expires_at }}
          EXTERNAL_EXECUTION_ID: ${{ needs.producer.outputs.external_execution_id }}
          SIGNER_WORKFLOW: ${{ needs.producer.outputs.signer_workflow }}
          SIGNER_IDENTITY: ${{ needs.producer.outputs.signer_identity }}
          ATTESTATION_ID: ${{ needs.producer.outputs.attestation_id }}
          ATTESTATION_URL: ${{ needs.producer.outputs.attestation_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          negative=json.loads(Path('federation/f1/policy-negative-tests.json').read_text()); crypto=Path('federation/f1/cryptographic-verification.json').read_bytes(); verified=json.loads(crypto)
          if not isinstance(verified,list) or len(verified)!=1: raise SystemExit('exactly one verified attestation required')
          attestation=verified[0].get('attestation'); bundle=attestation.get('bundle',attestation) if isinstance(attestation,dict) else None; envelope=bundle.get('dsseEnvelope') if isinstance(bundle,dict) else None
          if not isinstance(envelope,dict): raise SystemExit('verified Sigstore bundle has no dsseEnvelope')
          payload_b64=envelope.get('payload'); payload_type=envelope.get('payloadType')
          if not isinstance(payload_b64,str) or not isinstance(payload_type,str) or not payload_type.startswith('application/vnd.in-toto'): raise SystemExit('verified DSSE payload contract invalid')
          payload=base64.b64decode(payload_b64,validate=True); env_bytes=json.dumps(envelope,sort_keys=True,separators=(',',':')).encode(); bundle_bytes=json.dumps(bundle,sort_keys=True,separators=(',',':')).encode(); tuf=Path('federation/f1/tuf-chain-verification.json').read_bytes(); verifier=Path('federation/f1/live_provider_verifier.py').read_bytes(); wf=Path('.github/workflows/f1-live-provider-pr.yml').read_bytes()
          receipt={'schema':'metaengine.compute.f1-live-verification-receipt.h205f22.v3','provider_id':'github-actions-f1-live','provider_kind':'GITHUB_HOSTED_ACTIONS','external_execution_id':os.environ['EXTERNAL_EXECUTION_ID'],'repository':os.environ['GITHUB_REPOSITORY'],'source_digest':os.environ['GITHUB_SHA'],'source_ref':os.environ['GITHUB_REF'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'evidence_sha256':os.environ['EVIDENCE_SHA256'],'attestation_id':os.environ['ATTESTATION_ID'],'attestation_url':os.environ['ATTESTATION_URL'],'signer_workflow':os.environ['SIGNER_WORKFLOW'],'signer_identity':os.environ['SIGNER_IDENTITY'],'oidc_issuer':'https://token.actions.githubusercontent.com','sigstore_instance':'public-good','crypto_channel':'gh-attestation+sigstore','trust_generation':1,'expires_at':os.environ['EXPIRES_AT'],'verifier':{'implementation':subprocess.check_output(['gh','--version'],text=True).splitlines()[0],'id_token_permission':False},'signed_claims_sha256':hashlib.sha256(payload).hexdigest(),'envelope_sha256':hashlib.sha256(env_bytes).hexdigest(),'payload_type':payload_type,'sigstore_bundle_sha256':hashlib.sha256(bundle_bytes).hexdigest(),'cryptographic_verification_sha256':hashlib.sha256(crypto).hexdigest(),'tuf_chain_verification_sha256':hashlib.sha256(tuf).hexdigest(),'verifier_source_blob_sha256':hashlib.sha256(verifier).hexdigest(),'verifier_workflow_blob_sha256':hashlib.sha256(wf).hexdigest(),'tuf_chain_status':'FULL_TUF_CHAIN_CRYPTO_VERIFIED','tests':{'signature_and_identity':'PASS','full_tuf_chain':'PASS','tamper':'REJECTED',**negative['negative_tests']},'verification_status':'CRYPTO_VERIFIED_EVIDENCE_READY','canonical':False,'authority_effect':False}
          body=json.dumps(receipt,sort_keys=True,separators=(',',':')); print('F1_VERIFICATION_RECEIPT_BEGIN'); print(body); print('F1_VERIFICATION_RECEIPT_END'); print('receipt_sha256='+hashlib.sha256(body.encode()).hexdigest())
          PY
