name: A2 CodeQL

on:
  pull_request:
    paths:
      - "orchestration/sovereign/src/a2_*.ts"
      - "orchestration/sovereign/ui/**"
      - ".github/workflows/a2-codeql.yml"
  push:
    branches:
      - "work/same-point-duel-v4-a2-cognitive-bus"
    paths:
      - "orchestration/sovereign/src/a2_*.ts"
      - "orchestration/sovereign/ui/**"
      - ".github/workflows/a2-codeql.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: a2-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript-typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
