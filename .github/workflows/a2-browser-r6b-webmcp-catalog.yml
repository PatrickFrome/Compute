name: A2 Browser R6B WebMCP Catalog

on:
  push:
    branches:
      - 'work/a2-browser-r6b-webmcp-catalog*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  r6b-webmcp-catalog-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Establish source epoch and Node runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          node -e 'const m=Number(process.versions.node.split(".")[0]); if (m < 22) process.exit(1); console.log(process.version)'

      - name: Shared R6A and R6B contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check coordination/browser-shared/webmcp-tools-v1.mjs
          node --check coordination/browser-shared/webmcp-catalog-v1.mjs
          node --check coordination/browser-shared/tests/webmcp-tools-v1.test.mjs
          node --check coordination/browser-shared/tests/webmcp-catalog-v1.test.mjs
          node --check coordination/browser-shared/tests/webmcp-catalog-benchmark.mjs
          node --test \
            coordination/browser-shared/tests/webmcp-tools-v1.test.mjs \
            coordination/browser-shared/tests/webmcp-catalog-v1.test.mjs | tee "$RUNNER_TEMP/r6b-shared-tests.log"
          node coordination/browser-shared/tests/webmcp-catalog-benchmark.mjs | tee "$RUNNER_TEMP/r6b-catalog-benchmark.json"
          grep -q '"ok":true' "$RUNNER_TEMP/r6b-catalog-benchmark.json"
          grep -q '"tool_count":128' "$RUNNER_TEMP/r6b-catalog-benchmark.json"
          grep -q '"full_schema_embedded":false' "$RUNNER_TEMP/r6b-catalog-benchmark.json"
          grep -q '"provider_model_used":false' "$RUNNER_TEMP/r6b-catalog-benchmark.json"
          grep -q "full_schema_embedded: false" coordination/browser-shared/webmcp-catalog-v1.mjs
          grep -q "fresh_hydration_required: true" coordination/browser-shared/webmcp-catalog-v1.mjs
          ! grep -R -n -E -- 'WebMCP\.invokeTool|Runtime\.evaluate' coordination/browser-shared/webmcp-catalog-v1.mjs

      - name: Compute Browser R6B protocol and regressions
        shell: bash
        working-directory: coordination/browser-compute
        run: |
          set -euo pipefail
          node --check src/webmcp.mjs
          node --check src/webmcp-service.mjs
          node --check src/rpc-server.mjs
          node --check tests/webmcp-catalog-service.test.mjs
          node --check tests/r6b-real-webmcp-catalog-smoke.mjs
          node --test tests/*.test.mjs | tee "$RUNNER_TEMP/r6b-compute-tests.log"
          node -e 'const p=require("./protocol-v1.json"); const c=p.webmcp_catalog; if(p.version!=="1.6.0"||c?.stage!=="R6B_PROGRESSIVE_DISCLOSURE"||c?.provider_neutral!==true||c?.full_schema_embedded!==false||c?.fresh_hydration_required!==true||c?.tool_ref_document_bound!==true||c?.annotations_are_hints_only!==true||c?.tool_invocation_exposed!==false||c?.runtime_evaluate_used!==false) process.exit(1)'
          grep -q "'webmcp.catalog': 'READ_ONLY'" src/rpc-server.mjs
          grep -q "'webmcp.describe': 'READ_ONLY'" src/rpc-server.mjs
          ! grep -R -n -E -- 'Runtime\.evaluate|WebMCP\.invokeTool|WebMCP\.cancelInvocation' src
          grep -R -q -- "--remote-debugging-pipe" src
          ! grep -R -n -E -- "(push|concat)\([^)]*['\"]--remote-debugging-(port|address)(=|['\"])" src

      - name: Existing R5 and extension safety regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            coordination/browser-shared/tests/perception-envelope-v1.test.mjs \
            coordination/browser-shared/tests/semantic-action-cache-v1.test.mjs \
            coordination/browser-shared/tests/semantic-action-planner-v1.test.mjs \
            coordination/browser-shared/tests/semantic-planning-broker-v1.test.mjs | tee "$RUNNER_TEMP/r6b-r5-regressions.log"
          node tests/a2_v060_semantic_actions_lab.mjs
          node tests/a2_v060_oopif_perception_lab.mjs
          node tests/a2_r4_semantic_perception_compiler_lab.mjs
          node tests/a2_v063_remote_authority_lab.mjs
          node tests/a2_v063_bridge_disarm_lab.mjs

      - name: Real Chrome R6A discovery regression
        shell: bash
        working-directory: coordination/browser-compute
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          export A2_CHROME_EXECUTABLE="$CHROME"
          export CI=true
          export A2_CI_ALLOW_NO_SANDBOX=1
          export A2_SELF_TEST_REMOVE_STATE=1
          export A2_COMPUTE_STATE_ROOT="$RUNNER_TEMP/a2-compute-browser-r6a-regression"
          node tests/r6a-real-webmcp-smoke.mjs | tee "$RUNNER_TEMP/r6b-r6a-real-smoke.json"
          grep -q '"ok":true' "$RUNNER_TEMP/r6b-r6a-real-smoke.json"
          grep -q '"chrome_webmcp_status":"SUPPORTED"' "$RUNNER_TEMP/r6b-r6a-real-smoke.json"

      - name: Real Chrome R6B catalog smoke
        shell: bash
        working-directory: coordination/browser-compute
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          export A2_CHROME_EXECUTABLE="$CHROME"
          export CI=true
          export A2_CI_ALLOW_NO_SANDBOX=1
          export A2_SELF_TEST_REMOVE_STATE=1
          export A2_COMPUTE_STATE_ROOT="$RUNNER_TEMP/a2-compute-browser-r6b"
          node tests/r6b-real-webmcp-catalog-smoke.mjs | tee "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"ok":true' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"chrome_webmcp_status":"SUPPORTED"' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"progressive_disclosure":true' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"full_schema_embedded":false' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"fresh_hydration_required":true' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"runtime_evaluate_used":false' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"webmcp_invoke_used":false' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"raw_engine_identity_exposed":false' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"
          grep -q '"actuation_used":false' "$RUNNER_TEMP/r6b-real-catalog-smoke.json"

      - name: Build deterministic R6B evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          EPOCH="$SOURCE_DATE_EPOCH"
          mkdir -p dist/a2-browser-r6b/evidence
          cp "$RUNNER_TEMP/r6b-shared-tests.log" dist/a2-browser-r6b/evidence/R6B_SHARED_TESTS.log
          cp "$RUNNER_TEMP/r6b-catalog-benchmark.json" dist/a2-browser-r6b/evidence/R6B_CATALOG_BENCHMARK.json
          cp "$RUNNER_TEMP/r6b-compute-tests.log" dist/a2-browser-r6b/evidence/R6B_COMPUTE_TESTS.log
          cp "$RUNNER_TEMP/r6b-r5-regressions.log" dist/a2-browser-r6b/evidence/R6B_R5_REGRESSIONS.log
          cp "$RUNNER_TEMP/r6b-r6a-real-smoke.json" dist/a2-browser-r6b/evidence/R6B_R6A_REAL_CHROME_REGRESSION.json
          cp "$RUNNER_TEMP/r6b-real-catalog-smoke.json" dist/a2-browser-r6b/evidence/R6B_REAL_CHROME_CATALOG_SMOKE.json
          printf '%s\n' "$GITHUB_SHA" > dist/a2-browser-r6b/evidence/SOURCE_COMMIT.txt
          tar --sort=name --mtime="@$EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf dist/a2-browser-r6b/A2_BROWSER_R6B_WEBMCP_CATALOG.tar \
            coordination/browser-shared/webmcp-tools-v1.mjs \
            coordination/browser-shared/webmcp-catalog-v1.mjs \
            coordination/browser-shared/tests/webmcp-tools-v1.test.mjs \
            coordination/browser-shared/tests/webmcp-catalog-v1.test.mjs \
            coordination/browser-shared/tests/webmcp-catalog-benchmark.mjs \
            coordination/browser-compute/protocol-v1.json \
            coordination/browser-compute/src/webmcp.mjs \
            coordination/browser-compute/src/webmcp-service.mjs \
            coordination/browser-compute/src/rpc-server.mjs \
            coordination/browser-compute/tests/contracts.test.mjs \
            coordination/browser-compute/tests/webmcp.test.mjs \
            coordination/browser-compute/tests/webmcp-catalog-service.test.mjs \
            coordination/browser-compute/tests/r6a-real-webmcp-smoke.mjs \
            coordination/browser-compute/tests/r6b-real-webmcp-catalog-smoke.mjs \
            research/A2_BROWSER_R6B_WEBMCP_CATALOG_COMPILER_DEEP_RESEARCH_2026-08-28.md \
            research/A2_BROWSER_R6B_WEBMCP_CATALOG_CHECKPOINT_2026-08-28.md
          sha256sum dist/a2-browser-r6b/A2_BROWSER_R6B_WEBMCP_CATALOG.tar > dist/a2-browser-r6b/R6B_SHA256SUMS.txt

      - name: Attest R6B evidence provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/a2-browser-r6b/A2_BROWSER_R6B_WEBMCP_CATALOG.tar

      - name: Upload R6B evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: a2-browser-r6b-webmcp-catalog-${{ github.sha }}
          path: |
            dist/a2-browser-r6b/A2_BROWSER_R6B_WEBMCP_CATALOG.tar
            dist/a2-browser-r6b/R6B_SHA256SUMS.txt
            dist/a2-browser-r6b/evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
