name: W1 Prep Artifact Attestation

on:
  push:
    branches: [work/w1-sandbox-launcher-prep]
    paths:
      - 'controller/w1/**'
      - 'worker/native_linux/**'
      - 'supabase/migrations/*w1*.sql'
      - 'tests/test_w1_*.py'
      - '.github/workflows/w1-*.yml'
  workflow_dispatch:

permissions: {}

jobs:
  attest-w1-prep-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Test deterministic manifest and receipt parsers
        run: |
          set -euo pipefail
          python3 -m py_compile \
            controller/w1/build_w1_prep_attestation_manifest.py \
            controller/w1/s2_source_identity_audit.py \
            controller/w1/w1_attestation_verification_receipt.py
          python3 -m unittest \
            tests.test_w1_prep_attestation_manifest \
            tests.test_w1_s2_source_identity_audit \
            tests.test_w1_attestation_verification_receipt -v

      - name: Enforce exact launcher source-identity bindings
        run: |
          set -euo pipefail
          mkdir -p out
          python3 controller/w1/s2_source_identity_audit.py \
            --root . \
            --output out/w1-s2-source-identity-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('out/w1-s2-source-identity-audit.json').read_text())
          assert result['outcome'] == 'PASS_EXACT_SOURCE_IDENTITY_AUDIT_NONAUTHORITY'
          assert all(result['evidence']['checks'].values())
          assert result['evidence']['undeclared_binding_consumers'] == []
          assert result['runtime_isolation_verified'] is False
          assert result['worker_admitted'] is False
          assert result['w1_verified'] is False
          assert result['authority_effect'] is False
          print('W1 S2 source identity: EXACT_BINDINGS_PASS')
          print('source_sha256=' + result['evidence']['source_sha256'])
          print('evidence_sha256=' + result['evidence_sha256'])
          PY

      - name: Build exact W1 prep manifest
        id: manifest
        run: |
          set -euo pipefail
          mkdir -p out
          tree_sha="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          python3 controller/w1/build_w1_prep_attestation_manifest.py \
            --root . \
            --git-sha "$GITHUB_SHA" \
            --tree-sha "$tree_sha" \
            --source-ref "$GITHUB_REF" \
            --output out/w1-prep-attestation-manifest.json
          sha256sum out/w1-prep-attestation-manifest.json | tee out/w1-prep-attestation-manifest.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('out/w1-prep-attestation-manifest.json').read_text())
          assert p['artifact_attestation_verified'] is False
          assert p['persistent_worker_proof'] is False
          assert p['worker_admitted'] is False
          assert p['w1_verified'] is False
          assert p['canonical'] is False
          assert p['authority_effect'] is False
          print(f"W1 prep manifest files={p['evidence']['file_count']} remains non-authority before attestation")
          PY

      - name: Generate keyless GitHub/Sigstore provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/w1-prep-attestation-manifest.json

      - name: Verify attestation online with strict identity policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify out/w1-prep-attestation-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/w1-prep-artifact-attestation.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json > out/w1-prep-attestation-verification.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          from controller.w1 import w1_attestation_verification_receipt as receipt

          manifest = json.loads(Path('out/w1-prep-attestation-manifest.json').read_text())
          verification = json.loads(Path('out/w1-prep-attestation-verification.json').read_text())
          result = receipt.compose(manifest=manifest, verification=verification)
          Path('out/w1-prep-attestation-receipt.json').write_text(
              json.dumps(result, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          assert result['artifact_attestation_verified'] is True
          assert result['cryptographic_source_provenance_verified'] is True
          assert result['runtime_safety_verified'] is False
          assert result['provider_lifecycle_verified'] is False
          assert result['persistent_worker_proof'] is False
          assert result['worker_admitted'] is False
          assert result['w1_verified'] is False
          assert result['authority_effect'] is False
          print('W1 Sigstore online receipt: VERIFIED_NONAUTHORITY')
          print('receipt_sha256=' + result['receipt_sha256'])
          print('manifest_subject_sha256=' + result['evidence']['manifest_subject_sha256'])
          print('rekor_timestamp=' + result['evidence']['rekor_timestamp'])
          PY

      - name: Capture bundle and trusted root for offline continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/offline
          (
            cd out/offline
            subject_sha="$(sha256sum ../w1-prep-attestation-manifest.json | awk '{print $1}')"
            gh attestation download ../w1-prep-attestation-manifest.json --repo "$GITHUB_REPOSITORY"
            raw_bundle="sha256:${subject_sha}.jsonl"
            test -s "$raw_bundle"
            mv "$raw_bundle" "attestation-bundle-${subject_sha}.jsonl"
            gh attestation trusted-root > trusted_root.jsonl
          )
          bundle_count="$(find out/offline -maxdepth 1 -type f -name 'attestation-bundle-*.jsonl' | wc -l)"
          test "$bundle_count" -eq 1
          test -s out/offline/trusted_root.jsonl
          sha256sum out/offline/*.jsonl | sort > out/offline/offline-inputs.sha256

      - name: Verify attestation offline with no usable network or token
        run: |
          set -euo pipefail
          bundle="$(find out/offline -maxdepth 1 -type f -name 'attestation-bundle-*.jsonl' -print -quit)"
          test -n "$bundle"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            HTTPS_PROXY=http://127.0.0.1:9 \
            HTTP_PROXY=http://127.0.0.1:9 \
            ALL_PROXY=http://127.0.0.1:9 \
            NO_PROXY= \
            gh attestation verify out/w1-prep-attestation-manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --custom-trusted-root out/offline/trusted_root.jsonl \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/w1-prep-artifact-attestation.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --format json > out/offline/w1-prep-attestation-offline-verification.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          from controller.w1 import w1_attestation_verification_receipt as receipt

          manifest = json.loads(Path('out/w1-prep-attestation-manifest.json').read_text())
          online = json.loads(Path('out/w1-prep-attestation-receipt.json').read_text())
          offline_verification = json.loads(Path('out/offline/w1-prep-attestation-offline-verification.json').read_text())
          offline = receipt.compose(manifest=manifest, verification=offline_verification)
          Path('out/offline/w1-prep-attestation-offline-receipt.json').write_text(
              json.dumps(offline, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          assert offline == online, 'offline and online cryptographic receipts diverged'
          print('W1 Sigstore offline verification: MATCH_ONLINE_RECEIPT')
          print('receipt_sha256=' + offline['receipt_sha256'])
          PY

      - name: Upload manifest and online/offline verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w1-prep-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/w1-prep-attestation-manifest.json
            out/w1-prep-attestation-manifest.sha256
            out/w1-prep-attestation-verification.json
            out/w1-prep-attestation-receipt.json
            out/w1-s2-source-identity-audit.json
            out/offline/*.jsonl
            out/offline/*.json
            out/offline/offline-inputs.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preserve non-authority semantics
        run: |
          set -euo pipefail
          echo 'Attestation proves workflow/source provenance only.'
          echo 'Offline verification proves the captured bundle/root can be rechecked without GitHub API access.'
          echo 'Neither proves runtime safety, provider lifecycle, persistent worker status, admission, or W1 verification.'
