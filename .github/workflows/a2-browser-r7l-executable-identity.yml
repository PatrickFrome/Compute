name: A2 Browser R7L Executable Identity Binding

on:
  push:
    branches:
      - work/a2-browser-r7l-executable-identity
    paths:
      - 'coordination/browser-skill-source-linux/**'
      - 'coordination/browser-shared/**'
      - 'research/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING_PRE_RESEARCH_2026-08-28.md'
      - 'research/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING_POST_RESEARCH_2026-08-28.md'
      - '.github/workflows/a2-browser-r7l-executable-identity.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  r7l-executable-identity-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Establish exact platform and source epoch
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          command -v strace
          test "$(rustc --version | awk '{print $2}')" = "1.98.0"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Verify unchanged dependency closure
        shell: bash
        working-directory: coordination/browser-skill-source-linux
        run: |
          set -euo pipefail
          sha256sum Cargo.lock | tee "$RUNNER_TEMP/r7l-lock-sha256.txt"
          test "$(awk '{print $1}' "$RUNNER_TEMP/r7l-lock-sha256.txt")" = \
            "ffdf4d85f832e92b20960ecdbc581103a113cf9ddfa93fa319ba124f21a3d003"
          cargo tree --locked | tee "$RUNNER_TEMP/r7l-cargo-tree.txt"
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path('Cargo.toml').read_text())
          deps = cargo.get('dependencies', {})
          if set(deps) != {'landlock', 'libc', 'rustix', 'seccompiler'}:
              raise SystemExit(f'unexpected direct dependency surface: {sorted(deps)}')
          expected = {
              'landlock': '=0.4.7',
              'libc': '=0.2.189',
              'seccompiler': '=0.5.0',
          }
          for name, version in expected.items():
              if deps.get(name) != version:
                  raise SystemExit(f'{name} version drifted: {deps.get(name)!r}')
          rustix = deps.get('rustix')
          if not isinstance(rustix, dict) or rustix.get('version') != '=1.1.4':
              raise SystemExit('rustix version drifted')
          if set(rustix.get('features', [])) != {'fs', 'thread'}:
              raise SystemExit(f'unexpected rustix feature surface: {rustix.get("features")!r}')
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          packages = {(p['name'], p['version']) for p in lock.get('package', [])}
          if len(packages) != 19:
              raise SystemExit(f'unexpected Cargo.lock package-entry count: {len(packages)}')
          PY

      - name: Prove static identity and authority invariants
        shell: bash
        working-directory: coordination/browser-skill-source-linux
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          identity = Path('src/executable_identity.rs').read_text()
          launcher = Path('src/bin/a2-skill-source-launcher.rs').read_text()
          helper = Path('src/bin/a2-skill-source-helper.rs').read_text()
          launch = Path('src/launch_contract.rs').read_text()

          required_identity = [
              'openat2(', 'OFlags::PATH', 'OFlags::CLOEXEC', 'ResolveFlags::BENEATH',
              'ResolveFlags::NO_SYMLINKS', 'ResolveFlags::NO_MAGICLINKS',
              'ResolveFlags::NO_XDEV', 'fstat(&helper_fd)', 'libc::S_ISUID',
              'libc::S_ISGID', 'libc::SYS_execveat', 'libc::AT_EMPTY_PATH',
          ]
          for token in required_identity:
              if token not in identity:
                  raise SystemExit(f'missing R7L identity invariant: {token}')
          required_launcher = [
              'open_fixed_helper()', 'set_no_new_privs()',
              'sanitize_inherited_fds(Some(exec_fd))',
              'verify_clean_inherited_fds(Some(exec_fd))',
              'exec_opened_helper(executable', 'root_not_absolute',
          ]
          for token in required_launcher:
              if token not in launcher:
                  raise SystemExit(f'missing R7L launcher invariant: {token}')
          for forbidden in ['Command::new', '.exec()', 'symlink_metadata', 'HELPER_NAME']:
              if forbidden in launcher:
                  raise SystemExit(f'pathname exec fallback remains in launcher: {forbidden}')
          if 'sanitize_inherited_fds(None)' not in helper or 'verify_clean_inherited_fds(None)' not in helper:
              raise SystemExit('helper post-exec fd defense-in-depth drifted')
          if 'restrict_to_steady_state_syscalls()' not in helper:
              raise SystemExit('R7J seccomp boundary drifted')
          if launch.count('unsafe {') != 1:
              raise SystemExit(f'launch contract unsafe seam count drifted: {launch.count("unsafe {")}')
          if identity.count('unsafe {') != 1:
              raise SystemExit(f'execveat unsafe seam count drifted: {identity.count("unsafe {")}')
          PY

      - name: Compile lint and run all Rust adversarial regressions
        shell: bash
        working-directory: coordination/browser-skill-source-linux
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --features r7l-test-hooks -- -D warnings
          cargo test --locked --all-targets --features r7l-test-hooks -- --nocapture | tee "$RUNNER_TEMP/r7l-rust-tests.log"
          cargo test --locked --test preexec_launcher --features r7l-test-hooks -- --nocapture | tee "$RUNNER_TEMP/r7l-launcher-tests.log"
          cargo test --locked --test helper_process -- --nocapture | tee "$RUNNER_TEMP/r7l-helper-process.log"
          cargo test --locked --test network_boundary -- --nocapture | tee "$RUNNER_TEMP/r7l-network-boundary.log"
          cargo test --locked --test sandbox -- --nocapture | tee "$RUNNER_TEMP/r7l-landlock.log"

      - name: Prove release fd-bound execution on Linux
        shell: bash
        working-directory: coordination/browser-skill-source-linux
        run: |
          set -euo pipefail
          cargo build --locked --release --bin a2-skill-source-launcher --bin a2-skill-source-helper
          LAUNCHER=target/release/a2-skill-source-launcher
          HELPER=target/release/a2-skill-source-helper
          sha256sum "$LAUNCHER" | tee "$RUNNER_TEMP/r7l-launcher-sha256.txt"
          sha256sum "$HELPER" | tee "$RUNNER_TEMP/r7l-helper-sha256.txt"
          stat -c '%s' "$LAUNCHER" | tee "$RUNNER_TEMP/r7l-launcher-size.txt"
          stat -c '%s' "$HELPER" | tee "$RUNNER_TEMP/r7l-helper-size.txt"
          test "$(cat "$RUNNER_TEMP/r7l-launcher-size.txt")" -lt 1048576
          test "$(cat "$RUNNER_TEMP/r7l-helper-size.txt")" -lt 4194304

          ROOT="$RUNNER_TEMP/r7l-real-root"
          mkdir -p "$ROOT/inspect/references"
          cat > "$ROOT/inspect/SKILL.md" <<'EOF'
          ---
          name: inspect
          description: R7L release identity proof
          ---
          Read only.
          EOF
          printf '%s' 'reference-v1' > "$ROOT/inspect/references/REFERENCE.md"

          python3 - <<'PY'
          from pathlib import Path
          import os, struct

          def frame(opcode, request_id, body=b''):
              payload = bytes([1, opcode]) + struct.pack('>H', 0) + struct.pack('>Q', request_id) + body
              return struct.pack('>I', len(payload)) + payload
          name = b'inspect'
          request = frame(1, 201) + frame(2, 202, bytes([len(name)]) + name)
          (Path(os.environ['RUNNER_TEMP']) / 'r7l-request.bin').write_bytes(request)
          PY

          A2_R7L_ENV_SENTINEL=must-not-survive \
          strace -qq -f -s 256 -e trace=openat2,close_range,execve,execveat,prctl,seccomp \
            -o "$RUNNER_TEMP/r7l-launch.trace" \
            "$LAUNCHER" "$ROOT" \
            < "$RUNNER_TEMP/r7l-request.bin" \
            > "$RUNNER_TEMP/r7l-response.bin" \
            2> "$RUNNER_TEMP/r7l-stderr.txt"
          test ! -s "$RUNNER_TEMP/r7l-stderr.txt"

          python3 - <<'PY'
          from pathlib import Path
          import json, os, struct

          temp = Path(os.environ['RUNNER_TEMP'])
          lines = (temp / 'r7l-launch.trace').read_text(errors='replace').splitlines()
          launcher_exec = next((i for i, line in enumerate(lines) if 'execve(' in line and 'a2-skill-source-launcher' in line), None)
          helper_open = next((i for i, line in enumerate(lines) if 'openat2(' in line and 'a2-skill-source-helper' in line), None)
          helper_exec = next((i for i, line in enumerate(lines) if 'execveat(' in line and 'AT_EMPTY_PATH' in line), None)
          if launcher_exec is None or helper_open is None or helper_exec is None:
              raise SystemExit('required launcher/open/execveat evidence missing')
          if not launcher_exec < helper_open < helper_exec:
              raise SystemExit('open-once/exec ordering invalid')
          nnp = next((i for i, line in enumerate(lines) if helper_open < i < helper_exec and 'PR_SET_NO_NEW_PRIVS' in line), None)
          if nnp is None:
              raise SystemExit('no_new_privs missing before execveat')
          cuts = [i for i, line in enumerate(lines) if helper_open < i < helper_exec and 'close_range(' in line]
          if not cuts or not any('CLOSE_RANGE_UNSHARE' in lines[i] for i in cuts):
              raise SystemExit('launcher ambient-fd cut missing before execveat')
          if any('execve(' in line and 'a2-skill-source-helper' in line for line in lines[launcher_exec + 1:]):
              raise SystemExit('pathname helper execve fallback observed')
          helper_cut = next((i for i, line in enumerate(lines) if i > helper_exec and 'close_range(3,' in line and 'CLOSE_RANGE_UNSHARE' in line), None)
          if helper_cut is None:
              raise SystemExit('helper post-exec defense-in-depth cut missing')

          data = (temp / 'r7l-response.bin').read_bytes()
          offset = 0
          frames = []
          while offset < len(data):
              if offset + 4 > len(data):
                  raise SystemExit('truncated response prefix')
              length = struct.unpack('>I', data[offset:offset+4])[0]
              offset += 4
              payload = data[offset:offset+length]
              offset += length
              if len(payload) != length or length < 12:
                  raise SystemExit('truncated response frame')
              version, opcode, status, reserved = payload[:4]
              request_id = struct.unpack('>Q', payload[4:12])[0]
              if version != 1 or reserved != 0 or status != 0:
                  raise SystemExit('unexpected response header')
              frames.append((opcode, request_id, payload[12:]))
          if [(opcode, request_id) for opcode, request_id, _ in frames] != [(1, 201), (2, 202)]:
              raise SystemExit(f'unexpected protocol responses: {[(o, r) for o, r, _ in frames]}')
          if b'inspect' not in frames[0][2] or b'SKILL.md' not in frames[1][2] or b'reference-v1' not in frames[1][2]:
              raise SystemExit('release protocol content proof failed')

          summary = {
              'schema': 'a2.browser.r7l.executable-identity.v1',
              'platform': {'os': 'linux', 'arch': 'x86_64', 'rust': '1.98.0'},
              'openat2_fixed_helper_observed': True,
              'no_new_privs_before_exec': True,
              'ambient_fd_cut_before_exec': True,
              'execveat_at_empty_path_observed': True,
              'pathname_helper_execve_observed': False,
              'helper_post_exec_fd_cut_retained': True,
              'protocol_roundtrip': ['LIST', 'READ_PACKAGE'],
              'browser_authority': False,
              'node_integration': False,
          }
          (temp / 'R7L_EXECUTABLE_IDENTITY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Run shared package and registry regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            coordination/browser-shared/tests/skill-package-identity-v1.test.mjs \
            coordination/browser-shared/tests/skill-registry-v1.test.mjs | tee "$RUNNER_TEMP/r7l-js-regression.log"

      - name: Build deterministic candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist/a2-browser-r7l
          mkdir -p "$OUT/evidence" "$OUT/raw"
          cp "$RUNNER_TEMP/r7l-lock-sha256.txt" "$OUT/evidence/R7L_CARGO_LOCK_SHA256.txt"
          cp "$RUNNER_TEMP/r7l-cargo-tree.txt" "$OUT/evidence/R7L_CARGO_TREE.txt"
          cp "$RUNNER_TEMP/r7l-rust-tests.log" "$OUT/evidence/R7L_RUST_TESTS.log"
          cp "$RUNNER_TEMP/r7l-launcher-tests.log" "$OUT/evidence/R7L_LAUNCHER_TESTS.log"
          cp "$RUNNER_TEMP/r7l-helper-process.log" "$OUT/evidence/R7L_HELPER_PROCESS.log"
          cp "$RUNNER_TEMP/r7l-network-boundary.log" "$OUT/evidence/R7L_NETWORK_BOUNDARY.log"
          cp "$RUNNER_TEMP/r7l-landlock.log" "$OUT/evidence/R7L_LANDLOCK.log"
          cp "$RUNNER_TEMP/r7l-js-regression.log" "$OUT/evidence/R7L_JS_REGRESSION.log"
          cp "$RUNNER_TEMP/r7l-launcher-sha256.txt" "$OUT/evidence/R7L_LAUNCHER_SHA256.txt"
          cp "$RUNNER_TEMP/r7l-helper-sha256.txt" "$OUT/evidence/R7L_HELPER_SHA256.txt"
          cp "$RUNNER_TEMP/r7l-launcher-size.txt" "$OUT/evidence/R7L_LAUNCHER_SIZE.txt"
          cp "$RUNNER_TEMP/r7l-helper-size.txt" "$OUT/evidence/R7L_HELPER_SIZE.txt"
          cp "$RUNNER_TEMP/R7L_EXECUTABLE_IDENTITY.json" "$OUT/evidence/"
          cp "$RUNNER_TEMP/r7l-launch.trace" "$OUT/raw/R7L_LAUNCH.trace"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/evidence/SOURCE_COMMIT.txt"
          printf '%s\n' 'cbdb70e9be5a99251d57a7be7d0c43a95683ebae' > "$OUT/evidence/PARENT_VERIFIED_COMMIT.txt"
          cat > "$OUT/evidence/R7L_CLAIMS.json" <<'JSON'
          {"milestone":"R7L_EXECUTABLE_IDENTITY_BINDING_V1","platform":"linux-x86_64","open_once_exec_same_fd":true,"openat2_fixed_basename":true,"execveat_at_empty_path":true,"exec_fd_cloexec":true,"swap_after_open_redirected":false,"environment_empty":true,"no_new_privs_before_exec":true,"setuid_setgid_rejected":true,"helper_post_exec_fd_cut_retained":true,"positive_seccomp_retained":true,"node_integration":false,"browser_authority":false,"digest_identity_enforced":false}
          JSON
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf "$OUT/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING.tar" \
            coordination/browser-skill-source-linux/Cargo.toml \
            coordination/browser-skill-source-linux/Cargo.lock \
            coordination/browser-skill-source-linux/rust-toolchain.toml \
            coordination/browser-skill-source-linux/src \
            coordination/browser-skill-source-linux/tests \
            research/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING_PRE_RESEARCH_2026-08-28.md \
            "$OUT/evidence"
          if test -f research/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING_POST_RESEARCH_2026-08-28.md; then
            tar --append --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
              -f "$OUT/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING.tar" \
              research/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING_POST_RESEARCH_2026-08-28.md
          fi
          sha256sum "$OUT/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING.tar" > "$OUT/R7L_SHA256SUMS.txt"

      - name: Attest candidate build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/a2-browser-r7l/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING.tar

      - name: Upload R7L candidate evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: a2-browser-r7l-executable-identity-${{ github.sha }}
          path: |
            dist/a2-browser-r7l/A2_BROWSER_R7L_EXECUTABLE_IDENTITY_BINDING.tar
            dist/a2-browser-r7l/R7L_SHA256SUMS.txt
            dist/a2-browser-r7l/evidence/
            dist/a2-browser-r7l/raw/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
