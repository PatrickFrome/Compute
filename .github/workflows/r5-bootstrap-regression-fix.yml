name: R5 Bootstrap Regression Fix

on:
  push:
    branches:
      - repair/supervisor-process-boundary-ambiguity-r1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[r5-bootstrap-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/supervisor-process-boundary-ambiguity-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply fix
        run: python3 scripts/fix-r5-bootstrap-dedicated-root-regression.py
      - name: Syntax and focused regressions
        run: |
          node --check apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs
          node --test apps/metaengine-browser/test/supervisor-lifecycle-bootstrap.test.mjs
          node --test apps/metaengine-browser/test/supervisor-bootstrap-ambiguity-repair-r4.test.mjs
          node --test apps/metaengine-browser/test/supervisor-process-boundary-ambiguity-r5.test.mjs
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs
          git commit -m 'fix(browser): preserve dedicated root outside R5 recovery [r5-bootstrap-fixed]'
          git push origin HEAD:repair/supervisor-process-boundary-ambiguity-r1
