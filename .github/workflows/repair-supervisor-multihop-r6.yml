name: Repair Supervisor Multi-hop Ambiguity R6

on:
  push:
    branches:
      - repair/supervisor-multihop-process-boundary-r1
    paths:
      - .github/workflows/repair-supervisor-multihop-r6.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: repair/supervisor-multihop-process-boundary-r1
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply exact R6 patch
        run: python3 scripts/apply-supervisor-multihop-r6.py
      - name: Parse repaired source
        working-directory: apps/metaengine-browser
        run: node --check src/supervisor-lifecycle-runtime-core.mjs
      - name: Install test dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund
      - name: Run focused R5 and R6 regression gates
        working-directory: apps/metaengine-browser
        run: node --test test/supervisor-process-boundary-ambiguity-r5.test.mjs test/supervisor-process-boundary-ambiguity-r6.test.mjs
      - name: Run full Browser test suite
        working-directory: apps/metaengine-browser
        run: npm test
      - name: Commit repaired source and regression test
        run: |
          git config user.name "metaengine-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs apps/metaengine-browser/test/supervisor-process-boundary-ambiguity-r6.test.mjs
          git diff --cached --check
          git commit -m "fix(browser): recover multi-hop bootstrap ambiguity"
          git push origin HEAD:repair/supervisor-multihop-process-boundary-r1
