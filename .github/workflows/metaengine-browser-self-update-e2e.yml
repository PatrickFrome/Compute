name: METAENGINE Browser Self Update E2E

on:
  push:
    branches:
      - work/self-update-finalization-v1
  pull_request:
    paths:
      - 'apps/metaengine-browser/**'
      - '.github/workflows/metaengine-browser-self-update-e2e.yml'

permissions:
  contents: read

concurrency:
  group: metaengine-browser-self-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund
      - name: Parse and contract gates
        working-directory: apps/metaengine-browser
        run: |
          npm run check
          npm test
      - name: Static update invariants
        run: |
          grep -q 'requestSingleInstanceLock' apps/metaengine-browser/src/single-instance-guard.mjs
          grep -q 'com.metaengine.browser.test' apps/metaengine-browser/src/single-instance-guard.mjs
          grep -q '"allowToChangeInstallationDirectory": false' apps/metaengine-browser/electron-builder.test.json
          grep -q 'self_update_test_feed_not_allowed' apps/metaengine-browser/src/self-update-runtime.mjs
          grep -q 'METAENGINE_SELF_UPDATE_E2E_SUCCESSOR_PROBE' apps/metaengine-browser/src/main-entry.mjs
          ! grep -q 'NEON' apps/metaengine-browser/src/self-update-runtime.mjs

  windows-n-to-n-plus-1:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund
      - name: Contract gates before packaging
        working-directory: apps/metaengine-browser
        run: |
          npm run check
          npm test

      - name: Build baseline N installer
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $baseline = "0.6.3-dev.${{ github.run_number }}.0"
          npm pkg set version=$baseline
          Remove-Item dist-test -Recurse -Force -ErrorAction SilentlyContinue
          npx --yes electron-builder@26.15.7 --win nsis --x64 --config electron-builder.test.json --publish never
          $installer = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$baseline-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw 'baseline_installer_missing' }
          Copy-Item $installer.FullName "$env:RUNNER_TEMP\baseline-setup.exe"
          $baseline | Set-Content "$env:RUNNER_TEMP\baseline-version.txt"
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$env:RUNNER_TEMP\baseline-sha256.txt"

      - name: Install N and seal real profile continuity marker
        shell: powershell
        run: |
          $install = Start-Process -FilePath "$env:RUNNER_TEMP\baseline-setup.exe" -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "baseline_installer_exit_$($install.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\METAENGINE Browser Test\METAENGINE Browser Test.exe'
          if (-not (Test-Path $app)) { throw "baseline_browser_missing:$app" }
          $app | Set-Content "$env:RUNNER_TEMP\installed-app-path.txt"
          $baseline = (Get-Content "$env:RUNNER_TEMP\baseline-version.txt").Trim()

          $probeOut = "$env:RUNNER_TEMP\baseline-version-probe.out"
          $probeErr = "$env:RUNNER_TEMP\baseline-version-probe.err"
          $p = Start-Process -FilePath $app -ArgumentList '--metaengine-version-probe' -PassThru -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr
          $cachedHandle = $p.Handle
          if (-not $p.WaitForExit(15000)) { try { Stop-Process -Id $p.Id -Force } catch {}; throw 'baseline_version_probe_timeout' }
          $exitCode = $p.ExitCode
          if ($exitCode -ne 0) { Get-Content $probeErr -ErrorAction SilentlyContinue; throw "baseline_version_probe_exit_$exitCode" }
          $versionRow = (Get-Content $probeOut | Where-Object { $_.Trim() } | Select-Object -Last 1) | ConvertFrom-Json
          if ([string]$versionRow.version -ne $baseline -or $versionRow.primary_instance -ne $true) { throw 'baseline_version_probe_invalid' }

          $env:METAENGINE_PROFILE_PROBE_WRITE = '1'
          $profileOut = "$env:RUNNER_TEMP\baseline-profile-probe.out"
          $profileErr = "$env:RUNNER_TEMP\baseline-profile-probe.err"
          $profile = Start-Process -FilePath $app -ArgumentList '--metaengine-profile-probe' -PassThru -RedirectStandardOutput $profileOut -RedirectStandardError $profileErr
          $profileHandle = $profile.Handle
          if (-not $profile.WaitForExit(15000)) { try { Stop-Process -Id $profile.Id -Force } catch {}; throw 'baseline_profile_probe_timeout' }
          $profileExit = $profile.ExitCode
          Remove-Item Env:METAENGINE_PROFILE_PROBE_WRITE -ErrorAction SilentlyContinue
          if ($profileExit -ne 0) { Get-Content $profileErr -ErrorAction SilentlyContinue; throw "baseline_profile_probe_exit_$profileExit" }
          $profileRow = (Get-Content $profileOut | Where-Object { $_.Trim() } | Select-Object -Last 1) | ConvertFrom-Json
          if ($profileRow.marker_present -ne $true -or -not $profileRow.user_data_path) { throw 'baseline_profile_probe_invalid' }
          [string]$profileRow.user_data_path | Set-Content "$env:RUNNER_TEMP\baseline-user-data-path.txt"

      - name: Build exact target N plus 1 and feed metadata
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $target = "0.6.3-dev.${{ github.run_number }}.1"
          npm pkg set version=$target
          Remove-Item dist-test -Recurse -Force -ErrorAction SilentlyContinue
          npx --yes electron-builder@26.15.7 --win nsis --x64 --config electron-builder.test.json --publish never
          $installer = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$target-x64.exe" -File | Select-Object -First 1
          $blockmap = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$target-x64.exe.blockmap" -File | Select-Object -First 1
          if (-not $installer) { throw 'target_installer_missing' }
          if (-not $blockmap) { throw 'target_blockmap_missing' }
          $feed = "$env:RUNNER_TEMP\self-update-feed"
          Remove-Item $feed -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $feed | Out-Null
          Copy-Item $installer.FullName (Join-Path $feed $installer.Name)
          Copy-Item $blockmap.FullName (Join-Path $feed $blockmap.Name)
          $sha512Provider = [System.Security.Cryptography.SHA512]::Create()
          try { $sha512 = [Convert]::ToBase64String($sha512Provider.ComputeHash([System.IO.File]::ReadAllBytes($installer.FullName))) }
          finally { $sha512Provider.Dispose() }
          $releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          @(
            "version: $target",
            'files:',
            "  - url: $($installer.Name)",
            "    sha512: $sha512",
            "    size: $($installer.Length)",
            "path: $($installer.Name)",
            "sha512: $sha512",
            "releaseDate: '$releaseDate'",
            'stagingPercentage: 100'
          ) | Set-Content (Join-Path $feed 'dev.yml') -Encoding utf8
          $target | Set-Content "$env:RUNNER_TEMP\target-version.txt"
          $installer.FullName | Set-Content "$env:RUNNER_TEMP\target-installer-path.txt"
          $blockmap.FullName | Set-Content "$env:RUNNER_TEMP\target-blockmap-path.txt"
          (Join-Path $feed 'dev.yml') | Set-Content "$env:RUNNER_TEMP\target-dev-yml-path.txt"
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$env:RUNNER_TEMP\target-sha256.txt"

      - name: Run one physical update transaction N to N plus 1
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          GITHUB_ACTIONS: 'true'
          METAENGINE_SELF_UPDATE_TEST_MODE: '1'
          METAENGINE_DISABLE_CRASH_SENTINEL: '1'
          METAENGINE_SELF_UPDATE_E2E_SUCCESSOR_PROBE: '1'
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $env:METAENGINE_UPDATE_FEED_ROOT = "$env:RUNNER_TEMP\self-update-feed"
          $env:METAENGINE_UPDATE_FEED_PORT = "$port"
          $env:METAENGINE_UPDATE_FEED_READY = "$env:RUNNER_TEMP\self-update-feed.ready"
          Remove-Item $env:METAENGINE_UPDATE_FEED_READY -Force -ErrorAction SilentlyContinue
          $server = $null
          try {
            $server = Start-Process -FilePath (Get-Command node).Source -ArgumentList 'test/self-update-feed-server.cjs' -WorkingDirectory (Get-Location) -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\self-update-feed.out" -RedirectStandardError "$env:RUNNER_TEMP\self-update-feed.err"
            $serverHandle = $server.Handle
            $deadline = (Get-Date).AddSeconds(10)
            while (-not (Test-Path $env:METAENGINE_UPDATE_FEED_READY) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
            if (-not (Test-Path $env:METAENGINE_UPDATE_FEED_READY)) { Get-Content "$env:RUNNER_TEMP\self-update-feed.err" -ErrorAction SilentlyContinue; throw 'self_update_feed_not_ready' }

            $app = (Get-Content "$env:RUNNER_TEMP\installed-app-path.txt").Trim()
            $target = (Get-Content "$env:RUNNER_TEMP\target-version.txt").Trim()
            $env:METAENGINE_SELF_UPDATE_TEST_FEED_URL = "http://127.0.0.1:$port/"
            $env:METAENGINE_SELF_UPDATE_SMOKE_TRACE = "$env:RUNNER_TEMP\self-update-smoke.jsonl"
            $env:METAENGINE_SELF_UPDATE_SUCCESSOR_TRACE = "$env:RUNNER_TEMP\self-update-successor.json"
            Remove-Item $env:METAENGINE_SELF_UPDATE_SMOKE_TRACE -Force -ErrorAction SilentlyContinue
            Remove-Item $env:METAENGINE_SELF_UPDATE_SUCCESSOR_TRACE -Force -ErrorAction SilentlyContinue

            $source = Start-Process -FilePath $app -ArgumentList '--metaengine-self-update-smoke' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\self-update-smoke.out" -RedirectStandardError "$env:RUNNER_TEMP\self-update-smoke.err"
            $sourceHandle = $source.Handle
            $sourcePid = $source.Id
            if (-not $source.WaitForExit(150000)) {
              try { Stop-Process -Id $source.Id -Force } catch {}
              Get-Content $env:METAENGINE_SELF_UPDATE_SMOKE_TRACE -ErrorAction SilentlyContinue
              Get-Content "$env:RUNNER_TEMP\self-update-smoke.err" -ErrorAction SilentlyContinue
              throw 'self_update_source_timeout'
            }

            $traceDeadline = (Get-Date).AddSeconds(10)
            $verified = $false
            $restarting = $false
            do {
              $rows = @()
              if (Test-Path $env:METAENGINE_SELF_UPDATE_SMOKE_TRACE) {
                try { $rows = @(Get-Content $env:METAENGINE_SELF_UPDATE_SMOKE_TRACE | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json }) } catch { $rows = @() }
              }
              $verified = [bool]($rows | Where-Object { $_.metadata_verified -eq $true -and [string]$_.available_version -eq $target })
              $restarting = [bool]($rows | Where-Object { $_.state -eq 'RESTARTING' })
              if ($verified -and $restarting) { break }
              Start-Sleep -Milliseconds 200
            } while ((Get-Date) -lt $traceDeadline)
            if (-not $verified) { throw 'self_update_verified_target_not_observed' }
            if (-not ($rows | Where-Object { $_.ci_test_feed_active -eq $true })) { throw 'self_update_ci_feed_not_active' }
            if (-not $restarting) { throw 'self_update_restarting_state_not_observed' }

            $deadline = (Get-Date).AddSeconds(90)
            while (-not (Test-Path $env:METAENGINE_SELF_UPDATE_SUCCESSOR_TRACE) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path $env:METAENGINE_SELF_UPDATE_SUCCESSOR_TRACE)) { throw 'self_update_forced_successor_trace_missing' }
            $successor = Get-Content $env:METAENGINE_SELF_UPDATE_SUCCESSOR_TRACE -Raw | ConvertFrom-Json
            if ([string]$successor.version -ne $target) { throw "self_update_successor_version_mismatch:$($successor.version):$target" }
            if ($successor.primary_instance -ne $true) { throw 'self_update_successor_not_primary' }
            "source_pid=$sourcePid" | Set-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"
            "target_version=$target" | Add-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"
            "successor_pid=$($successor.pid)" | Add-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"
            'metadata_verified=PASS' | Add-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"
            'forced_relaunch=PASS' | Add-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"
          } finally {
            if ($server -and -not $server.HasExited) { try { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue } catch {} }
          }

      - name: Verify N plus 1 profile continuity and singleton
        shell: powershell
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\installed-app-path.txt").Trim()
          $target = (Get-Content "$env:RUNNER_TEMP\target-version.txt").Trim()

          $probeOut = "$env:RUNNER_TEMP\target-version-probe.out"
          $probeErr = "$env:RUNNER_TEMP\target-version-probe.err"
          $probe = Start-Process -FilePath $app -ArgumentList '--metaengine-version-probe' -PassThru -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr
          $probeHandle = $probe.Handle
          if (-not $probe.WaitForExit(15000)) { try { Stop-Process -Id $probe.Id -Force } catch {}; throw 'target_version_probe_timeout' }
          $probeExit = $probe.ExitCode
          if ($probeExit -ne 0) { Get-Content $probeErr -ErrorAction SilentlyContinue; throw "target_version_probe_exit_$probeExit" }
          $versionRow = (Get-Content $probeOut | Where-Object { $_.Trim() } | Select-Object -Last 1) | ConvertFrom-Json
          if ([string]$versionRow.version -ne $target) { throw "target_version_probe_mismatch:$($versionRow.version):$target" }

          $profileOut = "$env:RUNNER_TEMP\target-profile-probe.out"
          $profileErr = "$env:RUNNER_TEMP\target-profile-probe.err"
          $profile = Start-Process -FilePath $app -ArgumentList '--metaengine-profile-probe' -PassThru -RedirectStandardOutput $profileOut -RedirectStandardError $profileErr
          $profileHandle = $profile.Handle
          if (-not $profile.WaitForExit(15000)) { try { Stop-Process -Id $profile.Id -Force } catch {}; throw 'target_profile_probe_timeout' }
          $profileExit = $profile.ExitCode
          if ($profileExit -ne 0) { Get-Content $profileErr -ErrorAction SilentlyContinue; throw "target_profile_probe_exit_$profileExit" }
          $profileRow = (Get-Content $profileOut | Where-Object { $_.Trim() } | Select-Object -Last 1) | ConvertFrom-Json
          $baselinePath = (Get-Content "$env:RUNNER_TEMP\baseline-user-data-path.txt").Trim()
          if ($profileRow.marker_present -ne $true) { throw 'target_profile_marker_missing' }
          if ([string]$profileRow.user_data_path -ne $baselinePath) { throw "user_data_path_changed:$($profileRow.user_data_path):$baselinePath" }
          $folders = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Directory | Where-Object { $_.Name -eq 'METAENGINE Browser Test' })
          if ($folders.Count -ne 1) { throw "in_place_install_directory_count_invalid:$($folders.Count)" }
          'target_version_probe=PASS' | Add-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"
          'real_user_data_continuity=PASS' | Add-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"
          'in_place_install_directory=PASS' | Add-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"

          $firstOut = "$env:RUNNER_TEMP\singleton-first.out"
          $firstErr = "$env:RUNNER_TEMP\singleton-first.err"
          $first = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput $firstOut -RedirectStandardError $firstErr
          $firstHandle = $first.Handle
          $deadline = (Get-Date).AddSeconds(10)
          while ((-not (Test-Path $firstOut) -or (Get-Item $firstOut -ErrorAction SilentlyContinue).Length -eq 0) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
          $first.Refresh()
          if ($first.HasExited) { Get-Content $firstErr -ErrorAction SilentlyContinue; throw 'singleton_primary_exited_early' }
          $firstRow = (Get-Content $firstOut | Where-Object { $_.Trim() } | Select-Object -Last 1) | ConvertFrom-Json
          if ($firstRow.primary_instance -ne $true) { throw 'singleton_primary_probe_invalid' }
          $second = Start-Process -FilePath $app -ArgumentList '--metaengine-single-instance-probe' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\singleton-second.out" -RedirectStandardError "$env:RUNNER_TEMP\singleton-second.err"
          $secondHandle = $second.Handle
          if (-not $second.WaitForExit(5000)) { try { Stop-Process -Id $second.Id -Force } catch {}; try { Stop-Process -Id $first.Id -Force } catch {}; throw 'singleton_secondary_did_not_exit' }
          $first.Refresh()
          if ($first.HasExited) { throw 'singleton_secondary_displaced_primary' }
          try { Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue } catch {}
          'physical_singleton=PASS' | Add-Content "$env:RUNNER_TEMP\self-update-e2e-proof.txt"

      - name: Stage E2E evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path self-update-evidence | Out-Null
          foreach ($file in @(
            'baseline-version.txt','target-version.txt','baseline-sha256.txt','target-sha256.txt','baseline-user-data-path.txt',
            'baseline-version-probe.out','baseline-profile-probe.out','target-version-probe.out','target-profile-probe.out',
            'self-update-smoke.jsonl','self-update-smoke.out','self-update-smoke.err','self-update-successor.json',
            'self-update-e2e-proof.txt','singleton-first.out','singleton-second.out','self-update-feed.out','self-update-feed.err'
          )) {
            $source = Join-Path $env:RUNNER_TEMP $file
            if (Test-Path $source) { Copy-Item $source self-update-evidence\ }
          }
          git rev-parse HEAD | Set-Content self-update-evidence\git-head.txt

      - name: Upload self-update evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metaengine-browser-self-update-e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: self-update-evidence/
          if-no-files-found: error
