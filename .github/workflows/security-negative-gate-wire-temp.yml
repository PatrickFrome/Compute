name: Security Negative Gate Wire Temp

on:
  push:
    branches:
      - work/metaengine-browser-security-negative-gate-v1

permissions:
  contents: write

jobs:
  patch-and-self-delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: work/metaengine-browser-security-negative-gate-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact remote head
        shell: bash
        env:
          EXPECTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_SHA"
          test "$(git ls-remote origin refs/heads/work/metaengine-browser-security-negative-gate-v1 | cut -f1)" = "$EXPECTED_TRIGGER_SHA"

      - name: Patch and prove executable gate
        shell: bash
        run: |
          set -euo pipefail
          node apps/metaengine-browser/scripts/patch-security-workflow-temp.mjs
          node apps/metaengine-browser/scripts/security-static-gate.mjs
          node --check apps/metaengine-browser/src/main.mjs
          node --test apps/metaengine-browser/test/browser-security-static-gate.test.mjs
          git diff --check

      - name: Self-delete and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/security-negative-gate-wire-temp.yml
          rm apps/metaengine-browser/scripts/patch-security-workflow-temp.mjs
          test "$(git status --porcelain | wc -l)" -eq 4
          git config user.name 'METAENGINE CI'
          git config user.email 'actions@github.com'
          git add .github/workflows/metaengine-browser-shell-v1.yml apps/metaengine-browser/src/main.mjs .github/workflows/security-negative-gate-wire-temp.yml apps/metaengine-browser/scripts/patch-security-workflow-temp.mjs
          git commit -m 'ci(browser): enforce executable security negative gate'
          git push origin HEAD:work/metaengine-browser-security-negative-gate-v1
