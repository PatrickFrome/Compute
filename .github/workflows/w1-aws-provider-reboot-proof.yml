name: W1 AWS Provider Reboot Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/w1-aws-provider-reboot-proof.yml'
      - 'controller/w1/aws_provider_reboot_controller.py'
      - 'controller/w1/aws_provider_reboot_live_guard.py'
      - 'tests/test_w1_aws_provider_reboot_controller.py'
      - 'tests/test_w1_aws_provider_reboot_live_guard.py'
      - 'research/W1_STEP06_GITHUB_OIDC_PROVIDER_REBOOT_CONTROLLER.md'
      - 'research/W1_STEP07_LIVE_PREFLIGHT_HARDENING.md'
  workflow_dispatch:
    inputs:
      instance_id:
        description: 'Existing W1 EC2 instance ID'
        required: true
        type: string
      worker_id:
        description: 'Expected METAENGINE W1 worker_id tag'
        required: true
        type: string
      execute_reboot:
        description: 'Actually call EC2 RebootInstances after preflight'
        required: true
        default: false
        type: boolean
      confirmation:
        description: 'For a real reboot type REBOOT_W1_PERSISTENT_HOST'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  validate-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate controller boundary guard and negative tests
        run: |
          set -euo pipefail
          python3 -m py_compile controller/w1/aws_provider_reboot_controller.py
          python3 -m py_compile controller/w1/aws_provider_reboot_live_guard.py
          python3 -m unittest tests.test_w1_aws_provider_reboot_controller -v
          python3 -m unittest tests.test_w1_aws_provider_reboot_live_guard -v

      - name: Validate live W1 credential and trust-zone contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('.github/workflows/w1-aws-provider-reboot-proof.yml').read_text()
          before,remainder=raw.split('      - name: Validate live W1 credential and trust-zone contract',1)
          _checker,after=remainder.split('\n  preflight-environment:',1)
          p=before+'\n  preflight-environment:'+after
          guard=Path('controller/w1/aws_provider_reboot_live_guard.py').read_text()
          assert p.count('id-token: write') == 1
          assert p.count('aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c') == 1
          assert 'output-env-credentials: false' in p
          assert 'output-credentials: true' in p
          assert 'unset-current-credentials: true' in p
          assert 'inline-session-policy: ${{ steps.session-policy.outputs.policy }}' in p
          assert 'environment: ${{ needs.preflight-environment.outputs.environment_name }}' in p
          assert '/environments/w1-persistent-host-proof' in p
          assert '[[ "$GITHUB_REF" == \'refs/heads/main\' ]]' in p
          assert 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' in p
          assert 'secrets.'+'AWS' not in p
          assert 'vars.'+'AWS_ACCESS_KEY_ID' not in p
          assert p.count('steps.aws-creds.outputs.aws-access-key-id') == 4
          assert p.count('steps.aws-creds.outputs.aws-secret-access-key') == 4
          assert p.count('steps.aws-creds.outputs.aws-session-token') == 4
          assert 'ec2:RebootInstances' in guard
          assert 'cloudtrail:LookupEvents' in guard
          assert 'RunInstances' not in guard
          assert 'TerminateInstances' not in guard
          assert 'credential_export_mode' in guard and 'STEP_OUTPUTS_ONLY' in guard
          post_aws=p.split('      - name: Build live provider receipt candidate',1)[1]
          assert 'steps.aws-creds.outputs' not in post_aws
          assert 'LIVE_PROVIDER_CONTROLLER_RECEIPT_UNINGESTED' in Path('controller/w1/aws_provider_reboot_controller.py').read_text()
          PY

  preflight-environment:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      environment_name: ${{ steps.outputs.outputs.environment_name }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require main-branch dispatch before environment lookup
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]

      - name: Fetch protected W1 environment metadata without cloud credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail-with-body --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/w1-persistent-host-proof" \
            > evidence/w1-environment.json

      - name: Fail closed unless environment requires independent review and branch protection
        run: |
          set -euo pipefail
          python3 controller/w1/aws_provider_reboot_live_guard.py validate-environment \
            --input evidence/w1-environment.json \
            --output evidence/w1-environment-preflight.json
          rm -f evidence/w1-environment.json

      - name: Publish validated environment name
        id: outputs
        run: echo 'environment_name=w1-persistent-host-proof' >> "$GITHUB_OUTPUT"

      - name: Upload credential-free environment preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/w1-environment-preflight.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  provider-controller:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate-controller, preflight-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.preflight-environment.outputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ inputs.instance_id }}
      WORKER_ID: ${{ inputs.worker_id }}
      EXECUTE_REBOOT: ${{ inputs.execute_reboot }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AWS_ROLE_ARN: ${{ vars.W1_AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.W1_AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.W1_AWS_REGION }}
      ROLE_SESSION: w1-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact main execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate immutable AWS configuration and build exact session policy
        id: session-policy
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$WORKER_ID" =~ ^[A-Za-z0-9._:-]{3,160}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws(-[a-z]+)?:iam::${AWS_ACCOUNT_ID}:role/.+ ]]
          if [[ "$EXECUTE_REBOOT" == "true" && "$CONFIRMATION" != "REBOOT_W1_PERSISTENT_HOST" ]]; then
            echo 'real reboot requires exact confirmation token' >&2
            exit 1
          fi
          mkdir -p evidence
          python3 controller/w1/aws_provider_reboot_live_guard.py build-session-policy \
            --instance-id "$INSTANCE_ID" \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --output evidence/w1-aws-session-boundary.json
          POLICY="$(python3 -c "import json;print(json.dumps(json.load(open('evidence/w1-aws-session-boundary.json'))['session_policy'],separators=(',',':')))" )"
          test -n "$POLICY"
          echo "policy=$POLICY" >> "$GITHUB_OUTPUT"

      - name: Configure 15-minute AWS OIDC credentials as step outputs only
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.W1_AWS_ROLE_ARN }}
          aws-region: ${{ vars.W1_AWS_REGION }}
          allowed-account-ids: ${{ vars.W1_AWS_ACCOUNT_ID }}
          role-session-name: w1-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
          inline-session-policy: ${{ steps.session-policy.outputs.policy }}

      - name: Resolve exact W1 implementation head without AWS credentials
        run: |
          set -euo pipefail
          W1_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/work/w1-linux-worker-safety | awk '{print $1}')"
          [[ "$W1_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "W1_SHA=$W1_SHA" >> "$GITHUB_ENV"

      - name: Capture and validate persistent-host preflight
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity --output json > evidence/caller-identity.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('evidence/caller-identity.json'))
          if c.get('Account') != os.environ['AWS_ACCOUNT_ID']:
              raise SystemExit('caller account mismatch')
          PY
          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0]' \
            --output json > evidence/instance.json

          ROOT_VOLUME_ID="$(python3 - <<'PY'
          import json
          i=json.load(open('evidence/instance.json'))
          root=i.get('RootDeviceName')
          for m in i.get('BlockDeviceMappings') or []:
              if m.get('DeviceName') == root and (m.get('Ebs') or {}).get('VolumeId'):
                  print(m['Ebs']['VolumeId'])
                  break
          PY
          )"
          [[ "$ROOT_VOLUME_ID" =~ ^vol-[0-9a-f]+$ ]]
          aws ec2 describe-volumes \
            --volume-ids "$ROOT_VOLUME_ID" \
            --query 'Volumes[0]' \
            --output json > evidence/root-volume.json

          mapfile -t SG_IDS < <(python3 - <<'PY'
          import json
          i=json.load(open('evidence/instance.json'))
          for g in i.get('SecurityGroups') or []:
              print(g['GroupId'])
          PY
          )
          (( ${#SG_IDS[@]} > 0 ))
          aws ec2 describe-security-groups \
            --group-ids "${SG_IDS[@]}" \
            --query 'SecurityGroups' \
            --output json > evidence/security-groups.json

          python3 - <<'PY'
          import json
          out={
            'instance':json.load(open('evidence/instance.json')),
            'security_groups':json.load(open('evidence/security-groups.json')),
            'root_volume':json.load(open('evidence/root-volume.json')),
          }
          json.dump(out,open('evidence/preflight-bundle.json','w'),sort_keys=True,separators=(',',':'))
          PY

          python3 controller/w1/aws_provider_reboot_controller.py validate-preflight \
            --input evidence/preflight-bundle.json \
            --output evidence/preflight-summary.json \
            --instance-id "$INSTANCE_ID" \
            --worker-id "$WORKER_ID" \
            --expected-worker-sha "$W1_SHA"

      - name: Prove exact session has RebootInstances permission without rebooting
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          set +e
          DRY_RUN_OUTPUT="$(aws ec2 reboot-instances --instance-ids "$INSTANCE_ID" --dry-run 2>&1)"
          RC=$?
          set -e
          if [[ $RC -eq 0 || "$DRY_RUN_OUTPUT" != *"DryRunOperation"* ]]; then
            echo 'EC2 RebootInstances DryRun permission check failed' >&2
            printf '%s\n' "$DRY_RUN_OUTPUT" >&2
            exit 1
          fi

      - name: Emit preflight-only nonclaim
        if: inputs.execute_reboot != true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          p=json.load(open('evidence/preflight-summary.json'))
          boundary=json.load(open('evidence/w1-aws-session-boundary.json'))
          body={
            'schema':'metaengine.compute.w1-aws-provider-preflight-run.h205f22.v2',
            'classification':'LIVE_AWS_OIDC_PREFLIGHT_ONLY',
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'role_session':os.environ['ROLE_SESSION'],
            'preflight':p,
            'session_boundary_receipt_sha256':boundary['receipt_sha256'],
            'credential_export_mode':boundary['credential_export_mode'],
            'persistent_worker_proof':False,
            'w1_verified':False,
            'canonical':False,
            'authority_effect':False,
          }
          body['artifact_sha256']=hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          json.dump(body,open('evidence/preflight-run.json','w'),sort_keys=True,separators=(',',':'))
          PY
          sha256sum evidence/preflight-run.json > evidence/preflight-run.sha256
          {
            echo '## W1 AWS provider preflight'
            echo 'Protected environment, OIDC authentication, exact session policy, host checks, and RebootInstances DryRun passed.'
            echo '**NONCLAIM:** no reboot executed; persistent_worker_proof=false; w1_verified=false.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Execute independent provider reboot
        if: inputs.execute_reboot == true
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          REQUESTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          echo "REQUESTED_AT=$REQUESTED_AT" >> "$GITHUB_ENV"
          aws ec2 reboot-instances --instance-ids "$INSTANCE_ID"
          API_RETURNED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          echo "API_RETURNED_AT=$API_RETURNED_AT" >> "$GITHUB_ENV"

      - name: Correlate exact CloudTrail RebootInstances event
        if: inputs.execute_reboot == true
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          START_TIME="$(python3 - <<'PY'
          import os
          from datetime import datetime,timedelta,timezone
          t=datetime.fromisoformat(os.environ['REQUESTED_AT'].replace('Z','+00:00')).astimezone(timezone.utc)-timedelta(minutes=5)
          print(t.isoformat())
          PY
          )"
          FOUND=false
          for _ in $(seq 1 60); do
            END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            aws cloudtrail lookup-events \
              --lookup-attributes AttributeKey=EventName,AttributeValue=RebootInstances \
              --start-time "$START_TIME" \
              --end-time "$END_TIME" \
              --max-results 50 \
              --output json > evidence/cloudtrail-lookup.json
            set +e
            python3 controller/w1/aws_provider_reboot_controller.py select-event \
              --input evidence/cloudtrail-lookup.json \
              --output evidence/cloudtrail-match.json \
              --instance-id "$INSTANCE_ID" \
              --role-session "$ROLE_SESSION" \
              --requested-at "$REQUESTED_AT"
            RC=$?
            set -e
            if [[ $RC -eq 0 ]]; then
              FOUND=true
              break
            fi
            if [[ $RC -ne 2 ]]; then
              exit "$RC"
            fi
            sleep 10
          done
          [[ "$FOUND" == "true" ]] || { echo 'matching CloudTrail reboot event not observed within bounded window' >&2; exit 1; }

      - name: Build live provider receipt candidate without AWS credentials
        if: inputs.execute_reboot == true
        run: |
          set -euo pipefail
          python3 controller/w1/aws_provider_reboot_controller.py build-receipt \
            --preflight evidence/preflight-summary.json \
            --event evidence/cloudtrail-match.json \
            --caller-identity evidence/caller-identity.json \
            --requested-at "$REQUESTED_AT" \
            --api-returned-at "$API_RETURNED_AT" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --role-session "$ROLE_SESSION" \
            --output evidence/provider-reboot-receipt-candidate.json
          sha256sum evidence/provider-reboot-receipt-candidate.json > evidence/provider-reboot-receipt-candidate.sha256
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('evidence/provider-reboot-receipt-candidate.json'))
          print('## W1 AWS provider reboot receipt candidate')
          print(f"- classification: `{r['classification']}`")
          print(f"- provider_instance_id: `{r['provider_instance_id']}`")
          print(f"- action_id: `{r['action_id']}`")
          print(f"- evidence_artifact_sha256: `{r['evidence_artifact_sha256']}`")
          print('- **NONCLAIM:** receipt is not yet ingested/correlated with post-reboot heartbeat; persistent_worker_proof=false; w1_verified=false.')
          PY

      - name: Upload bounded provider evidence without AWS credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w1-aws-provider-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          overwrite: false
          retention-days: 90
