name: Browser Heartbeat Repair Installer

on:
  push:
    branches:
      - 'repair/native-supervisor-transport-resilience-v1-20260914'
    paths:
      - 'apps/metaengine-browser/src/native-supervisor-client-core.mjs'
      - 'apps/metaengine-browser/src/native-supervisor-client-core-base.mjs'
      - 'apps/metaengine-browser/src/compute-bridge-client.mjs'
      - 'apps/metaengine-browser/src/compute-bridge-worker.cjs'
      - 'apps/metaengine-browser/test/native-supervisor-heartbeat-*.test.mjs'
      - 'apps/metaengine-browser/test/native-supervisor-transient-batch-fallback.test.mjs'
      - 'apps/metaengine-browser/test/compute-bridge-*.test.mjs'
      - 'apps/metaengine-browser/package.json'
      - 'apps/metaengine-browser/electron-builder.test.json'
      - 'coordination/browser-compute/package.json'
      - 'coordination/browser-compute/protocol-v1.json'
      - 'coordination/browser-compute/engine-lock.json'
      - 'coordination/browser-compute/src/**'
      - '.github/workflows/browser-heartbeat-repair-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat-contract-and-installer:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'heartbeat_compute_repair_head=%s\n' "$EXPECTED_HEAD"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install Browser build dependencies
        working-directory: apps/metaengine-browser
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Prove heartbeat and transport contracts
        working-directory: apps/metaengine-browser
        shell: bash
        run: |
          set -euo pipefail
          node --check src/native-supervisor-client-core.mjs
          node --check src/native-supervisor-client-core-base.mjs
          node --check src/compute-bridge-client.mjs
          node --check src/compute-bridge-worker.cjs
          node --test test/native-supervisor-heartbeat-watchdog.test.mjs
          node --test test/native-supervisor-heartbeat-route-contract.test.mjs
          node --test test/native-supervisor-transient-batch-fallback.test.mjs
          node --test test/compute-bridge-client.test.mjs
          node --test test/compute-bridge-autostart.test.mjs
          METAENGINE_TEST_COMPUTE_DAEMON=1 node --test test/compute-bridge-daemon-integration.test.mjs

      - name: Build unsigned x64 NSIS repair installer
        working-directory: apps/metaengine-browser
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.7.0-dev.${{ github.run_id }}.1'
          if ($version -notmatch '^0\.7\.0-dev\.[0-9]+\.1$') { throw "repair_version_invalid:$version" }
          npm pkg set version=$version
          $versionReadback = [string](node -p "require('./package.json').version")
          if ($versionReadback -ne $version) { throw "repair_version_readback_mismatch:$versionReadback" }
          Remove-Item dist-test -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item native-dist\guardian -Recurse -Force -ErrorAction SilentlyContinue
          npx --yes electron-builder@26.15.7 --win nsis --x64 --config electron-builder.test.json --publish never
          $installer = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$version-x64.exe" -File | Select-Object -First 1
          $blockmap = Get-ChildItem dist-test -Filter "METAENGINE-Browser-Test-Setup-$version-x64.exe.blockmap" -File | Select-Object -First 1
          if (-not $installer -or -not $blockmap) { throw 'heartbeat_compute_repair_package_assets_missing' }
          $daemonEntry = Join-Path $PWD 'dist-test\win-unpacked\resources\a2-compute-browser\src\cli.mjs'
          $daemonRpc = Join-Path $PWD 'dist-test\win-unpacked\resources\a2-compute-browser\src\rpc-server.mjs'
          if (-not (Test-Path $daemonEntry) -or -not (Test-Path $daemonRpc)) { throw 'bundled_compute_daemon_missing' }
          $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $proof = [ordered]@{
            schema = 'metaengine.browser.heartbeat-compute-repair-installer.v3'
            source_head = '${{ github.sha }}'
            package_version = $version
            installer_name = $installer.Name
            installer_sha256 = $digest
            heartbeat_route = '/v1/heartbeat'
            state_route_preserved = $true
            transient_state_heartbeat_fallback = $true
            transient_state_statuses = @(502,503,504)
            heartbeat_contract_tests_passed = $true
            transient_batch_fallback_tests_passed = $true
            compute_bridge_bundled = $true
            compute_bridge_autostart_test_passed = $true
            compute_bridge_real_daemon_smoke_passed = $true
            compute_bridge_packaged_resource_verified = $true
            compute_bridge_endpoint = 'ephemeral_loopback_http_rpc'
            monotonic_run_id_version = $true
            signed = $false
            published = $false
            authority_effect = $false
          }
          $proof | ConvertTo-Json -Depth 4 | Set-Content dist-test\heartbeat-compute-repair-proof.json -Encoding utf8
          Write-Host ($proof | ConvertTo-Json -Compress)

      - name: Upload heartbeat and compute repair installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metaengine-browser-heartbeat-compute-repair-${{ github.sha }}
          path: |
            apps/metaengine-browser/dist-test/METAENGINE-Browser-Test-Setup-*.exe
            apps/metaengine-browser/dist-test/METAENGINE-Browser-Test-Setup-*.exe.blockmap
            apps/metaengine-browser/dist-test/heartbeat-compute-repair-proof.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
