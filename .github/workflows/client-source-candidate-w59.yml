name: METAENGINE Client W59 Exact Integrated Qualification

# W82: Legacy W59 qualification is *explicitly* re-run on the final exact
# integrated SHA when the W66/W73 candidate manifest changes; its physical PG17
# gates are NOT optional. GitHub dispatch requires workflow on default branch
# (not present on main). No filtered/skipped workflow is a passing gate.
# Avoid queuing six W59 jobs on every unrelated component/Browser change.
on:
  pull_request:
    paths:
      - '.github/workflows/client-source-candidate-w59.yml'
      - 'coordination/operator-control/client-source-candidate-w59.manifest.json'
      - 'coordination/operator-control/client-source-candidate-w51.manifest.json'
      - 'coordination/operator-control/client-source-candidate-w66.manifest.json'
      - 'coordination/operator-control/client-source-candidate-w73.manifest.json'
      - 'coordination/operator-control/client-critical-closure.manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-integrated-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify one full clean source and install isolated Node dependencies
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git config --bool core.sparseCheckout || echo false)" = false
          test -z "$(git status --porcelain)"
          npm ci --prefix infra/client-state-runtime --ignore-scripts --no-audit --no-fund
      - name: Frozen W43/W51 historical baselines and W59 current nineteen-parent ledger
        shell: bash
        run: |
          node --test --test-concurrency=1 \
            infra/client-state-runtime/client-source-candidate-w43.test.mjs \
            infra/client-state-runtime/client-source-candidate-w51.test.mjs \
            infra/client-state-runtime/client-source-candidate-w59.test.mjs \
            infra/client-state-runtime/client-candidate-acceptance-w57.test.mjs
      - name: CI applicability policy W82 (source-only, no skipped-as-green)
        shell: bash
        run: node --test .github/client-ci-train-w82.test.mjs
      - name: Full Client State Runtime Contracts
        shell: bash
        run: npm --prefix infra/client-state-runtime test
      - name: Native context, W38 absent Owner, source sync, completion, critic, BrowserCell and existing scheduler
        shell: bash
        run: |
          node --test --test-concurrency=1 \
            apps/metaengine-browser/test/client-local-contracts-w38.test.mjs \
            apps/metaengine-browser/test/explicit-local-supervisor-provider.test.mjs \
            apps/metaengine-browser/test/explicit-local-supervisor-provider-w40.test.mjs \
            apps/metaengine-browser/test/native-supervisor-local-provider-pin-w40.test.mjs \
            apps/metaengine-browser/test/browsercell-cdp-continuity-readback.test.mjs \
            apps/metaengine-browser/test/browsercell-continuity-integration-w41.test.mjs \
            apps/metaengine-browser/test/client-source-sync-preflight-w50.test.mjs \
            apps/metaengine-browser/test/client-source-sync-native-w55.test.mjs \
            apps/metaengine-browser/test/native-owner-verifier-w52.test.mjs \
            apps/metaengine-browser/test/host-native-owner-producers-w60.test.mjs \
            apps/metaengine-browser/test/host-owner-ipc-w60.test.mjs \
            infra/client-state-runtime/client-backup-acl-native-w58.test.mjs \
            infra/client-state-runtime/client-backup-acl-native-w58.ipc.test.mjs \
            apps/metaengine-browser/test/client-visual-readiness-w54.test.mjs \
            apps/metaengine-browser/test/supervisor-continuity-lease.test.mjs \
            apps/metaengine-browser/test/supervisor-continuity-pg17-chaos.test.mjs \
            apps/metaengine-browser/test/fleet-dag-claim-plan.test.mjs \
            apps/metaengine-browser/test/fleet-dag-cancellation-proof.test.mjs \
            apps/metaengine-browser/test/client-package-convergence-w40.test.mjs \
            apps/metaengine-browser/test/client-windows-source-identity.test.mjs \
            apps/metaengine-browser/test/package-identity-candidates.test.mjs
      - name: Backup and serial coding loop source guards, not installed qualification
        shell: bash
        run: |
          node --test --test-concurrency=1 \
            infra/client-state-runtime/client-backup-restore-staging-w47.test.mjs \
            infra/client-state-runtime/upgrade-backup-gate.test.mjs \
            infra/client-state-runtime/upgrade-backup-restore-gate.test.mjs \
            infra/client-state-runtime/client-serial-loop-staging-w48.test.mjs \
            infra/client-state-runtime/client-serial-loop-staging-w56.test.mjs \
            infra/client-state-runtime/own-postgres-birth-w61.test.mjs

  frozen-me2-seven-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ME2_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.3'
      - name: Frozen ME2 seven view tests, typecheck, build and pack
        working-directory: apps/me2-ui
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test:operator-observatory
          bun run test:operator-primary
          bun run typecheck
          bun run build
          bun run pack
          node -e "const m=require('./me2-ui-dist/me2-ui-manifest.json');if(m.schema!=='me2.ui-bundle-manifest.v1'||m.git_sha!==process.env.ME2_BUILD_SHA)process.exit(1)"

  disposable-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: postgres:17
    steps:
      - name: Install Git in disposable PG17 container
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair checkout ownership inside isolated CI container only
        shell: sh
        run: |
          set -eu
          test "$(id -u)" -eq 0
          test -n "$GITHUB_WORKSPACE"
          test "$(realpath "$GITHUB_WORKSPACE")" = "$(pwd -P)"
          test -d "$GITHUB_WORKSPACE/.git"
          chown -R postgres:postgres "$GITHUB_WORKSPACE"
          test "$(stat -c %U "$GITHUB_WORKSPACE/.git")" = postgres
          test -x /usr/lib/postgresql/17/bin/initdb
      - name: Exact-head source and real PG17 crash/restart as postgres
        shell: sh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          NODE_BIN="$(command -v node)"
          runuser -u postgres -- env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" EXPECTED_HEAD="$EXPECTED_HEAD" W48_PG17_BIN=/usr/lib/postgresql/17/bin NODE_BIN="$NODE_BIN" sh -ec '
            cd "$GITHUB_WORKSPACE"
            test "$(id -un)" = postgres
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            test -z "$(git status --porcelain)"
            "$NODE_BIN" --test infra/client-state-runtime/client-serial-loop-staging-w48.test.mjs infra/client-state-runtime/client-serial-loop-staging-w56.test.mjs
            "$NODE_BIN" --test infra/client-state-runtime/client-serial-loop-staging-w48.pg17.test.mjs infra/client-state-runtime/client-serial-loop-staging-w56.pg17.test.mjs
          '

  w45-physical-pg17:
    name: Exact-source disposable PG17 (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout entire W45 source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout frozen W26 source (read-only fixture input)
        uses: actions/checkout@v4
        with:
          ref: 6498c1596432ea9d9987f343c92505b273d1ac11
          path: w45-source-w26
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout frozen W39 source (read-only fixture input)
        uses: actions/checkout@v4
        with:
          ref: ee39b256e2b54f5dfddf4bff021977c0185fb744
          path: w45-source-w39
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout frozen W30 claim-planning source (read-only fixture input)
        uses: actions/checkout@v4
        with:
          ref: ff9dab18d88a4d656fa91c5cc86f3392fde3f023
          path: w45-source-w30
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact upstream inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C w45-source-w26 rev-parse HEAD)" = "6498c1596432ea9d9987f343c92505b273d1ac11"
          test "$(git -C w45-source-w39 rev-parse HEAD)" = "ee39b256e2b54f5dfddf4bff021977c0185fb744"
          test "$(git -C w45-source-w30 rev-parse HEAD)" = "ff9dab18d88a4d656fa91c5cc86f3392fde3f023"
          echo "W45_SHA=$(git rev-parse HEAD)"
          echo "W26_SHA=$(git -C w45-source-w26 rev-parse HEAD)"
          echo "W39_SHA=$(git -C w45-source-w39 rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frozen local test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix infra/client-state-runtime
      - name: Syntax and metadata
        run: |
          node --check infra/client-state-runtime/own-postgres-birth-w61.mjs
          node --check infra/client-state-runtime/db-api.mjs
          node --check infra/client-state-runtime/client-pg17-qualification-w45.integration.test.mjs
          node --test infra/client-state-runtime/own-postgres-birth-w61.test.mjs
          git diff --check
      - name: Exact-head source contract regressions (never installed evidence)
        run: |
          node --test --test-concurrency=1 infra/client-state-runtime/operator-context-convergence-w37.test.mjs
          node --test --test-concurrency=1 w45-source-w26/apps/metaengine-browser/test/supervisor-continuity-pg17-chaos.test.mjs
          node --test --test-concurrency=1 w45-source-w39/infra/client-state-runtime/operator-agent-completion-bound-w39.test.mjs
          node --test --test-concurrency=1 w45-source-w30/apps/metaengine-browser/test/fleet-dag-claim-plan.test.mjs
      - name: Pull exact PostgreSQL 17.6 image digest
        run: docker pull postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
      - name: Real PG17, disposable generated cluster (no live Owner)
        env:
          W45_PG17_DOCKER: '1'
          W45_REQUIRE_REAL_PG17: '1'
          W45_W26_ROOT: ${{ github.workspace }}/w45-source-w26
          W45_W39_ROOT: ${{ github.workspace }}/w45-source-w39
        run: node --test --test-concurrency=1 infra/client-state-runtime/client-pg17-qualification-w45.integration.test.mjs


  w61-generated-two-cluster-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Genuine generated PG17 two-cluster backup, readback and restore equality
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          W61_DOCKER_PG17: '1'
          W61_REQUIRE_REAL_PG17: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          npm ci --prefix infra/client-state-runtime --ignore-scripts --no-audit --no-fund
          docker pull postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          node --test --test-concurrency=1 infra/client-state-runtime/own-postgres-birth-w61.test.mjs infra/client-state-runtime/client-w61-two-pg17-restore.integration.test.mjs
