name: METAENGINE Browser Trusted Dev Auto Publish V2

on:
  push:
    branches:
      - integration/browser-dev-auto-update
    paths:
      - 'coordination/browser-dev-release-target-v2.json'
      - '.github/workflows/metaengine-browser-dev-autopublish-v2.yml'

permissions: {}

concurrency:
  group: metaengine-browser-dev-autopublish-v2
  cancel-in-progress: false

jobs:
  publish-verified-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TRUSTED_E2E_WORKFLOW_BLOB: eb6f4795dcf33cbdbcdd57debcedd0cfa12cd97c
      TRUSTED_SHELL_WORKFLOW_BLOB: 766834e8a92f62d5da778392686fd5f535a5948e
    steps:
      - name: Read typed release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/coordination/browser-dev-release-target-v2.json?ref=$GITHUB_SHA" > "$RUNNER_TEMP/target-content.json"
          python3 - <<'PY'
          import base64, json, os, re
          from pathlib import Path
          row = json.loads((Path(os.environ['RUNNER_TEMP']) / 'target-content.json').read_text())
          target = json.loads(base64.b64decode(row.get('content', '')).decode('utf-8'))
          if target.get('schema') != 'metaengine.browser.dev-release-target.v2':
              raise SystemExit('release_target_schema_invalid')
          if target.get('authority_effect') is not False:
              raise SystemExit('release_target_authority_invalid')
          if target.get('enabled') is not True:
              raise SystemExit('release_target_disabled')
          source = str(target.get('source_sha') or '').lower()
          if not re.fullmatch(r'[a-f0-9]{40}', source):
              raise SystemExit('release_target_source_sha_invalid')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f'source_sha={source}', file=out)
          PY

      - name: Bind immutable test definitions and exact successful runs
        id: evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          sha="$SOURCE_SHA"
          gh api "repos/$repo/contents/.github/workflows/metaengine-browser-self-update-e2e.yml?ref=$sha" > "$RUNNER_TEMP/e2e-content.json"
          gh api "repos/$repo/contents/.github/workflows/metaengine-browser-shell-v1.yml?ref=$sha" > "$RUNNER_TEMP/shell-content.json"
          gh api "repos/$repo/actions/workflows/metaengine-browser-self-update-e2e.yml/runs?head_sha=$sha&status=success&per_page=30" > "$RUNNER_TEMP/e2e-runs.json"
          gh api "repos/$repo/actions/workflows/metaengine-browser-shell-v1.yml/runs?head_sha=$sha&status=success&per_page=30" > "$RUNNER_TEMP/shell-runs.json"
          gh api "repos/$repo/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          sha = os.environ['SOURCE_SHA']
          e2e_content = json.loads((temp / 'e2e-content.json').read_text())
          shell_content = json.loads((temp / 'shell-content.json').read_text())
          if e2e_content.get('sha') != os.environ['TRUSTED_E2E_WORKFLOW_BLOB']:
              raise SystemExit('trusted_e2e_workflow_blob_mismatch')
          if shell_content.get('sha') != os.environ['TRUSTED_SHELL_WORKFLOW_BLOB']:
              raise SystemExit('trusted_shell_workflow_blob_mismatch')
          def exact(path, workflow_id):
              data = json.loads(path.read_text())
              rows = [r for r in data.get('workflow_runs', [])
                      if r.get('head_sha') == sha
                      and r.get('status') == 'completed'
                      and r.get('conclusion') == 'success'
                      and int(r.get('workflow_id') or 0) == workflow_id]
              if not rows:
                  raise SystemExit(f'exact_successful_run_missing:{path.name}')
              rows.sort(key=lambda r: (r.get('run_started_at') or '', int(r.get('run_attempt') or 0), int(r.get('id') or 0)))
              return rows[-1]
          e2e = exact(temp / 'e2e-runs.json', 345450338)
          shell = exact(temp / 'shell-runs.json', 345209107)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f"e2e_run_id={e2e['id']}", file=out)
              print(f"e2e_run_attempt={e2e['run_attempt']}", file=out)
              print(f"artifact_name=metaengine-browser-self-update-e2e-{sha}-{e2e['run_attempt']}", file=out)
              print(f"shell_run_id={shell['id']}", file=out)
          PY

      - name: Download immutable exact-SHA E2E artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: verified-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.evidence.outputs.e2e_run_id }}

      - name: Verify physical manifest and canonical BOM-free metadata
        id: verify
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          root = Path('verified-release')
          manifest_path = root / 'verified-self-update-manifest.json'
          if not manifest_path.is_file():
              raise SystemExit('verified_manifest_missing')
          raw_manifest = manifest_path.read_bytes()
          try:
              manifest = json.loads(raw_manifest.decode('utf-8', 'strict'))
          except Exception:
              raise SystemExit('verified_manifest_utf8_or_json_invalid')
          if manifest.get('schema') != 'metaengine.browser.self-update-e2e-manifest.v2':
              raise SystemExit('verified_manifest_schema_invalid')
          if manifest.get('git_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('verified_manifest_git_sha_mismatch')
          for key in ('physical_n_to_n_plus_1','durable_successor_binding','forced_successor','profile_continuity','single_install_directory','physical_singleton','development_channel'):
              if manifest.get(key) is not True:
                  raise SystemExit(f'verified_manifest_gate_missing:{key}')
          if manifest.get('production_safe') is not False or manifest.get('update_channel') != 'dev' or manifest.get('update_metadata') != 'dev.yml':
              raise SystemExit('verified_manifest_channel_invalid')
          version = str(manifest.get('version') or '')
          vm = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)-dev\.(\d+)\.1', version)
          if not vm:
              raise SystemExit('verified_dev_version_invalid')
          installer_name = str(manifest.get('installer_name') or '')
          expected_installer = f'METAENGINE-Browser-Test-Setup-{version}-x64.exe'
          if installer_name != expected_installer:
              raise SystemExit('verified_installer_name_binding_invalid')
          blockmap_name = str(manifest.get('blockmap_name') or '')
          if blockmap_name != installer_name + '.blockmap':
              raise SystemExit('verified_blockmap_name_binding_invalid')
          installer = root / installer_name
          blockmap = root / blockmap_name
          dev_yml = root / 'dev.yml'
          for p in (installer, blockmap, dev_yml):
              if not p.is_file() or p.stat().st_size <= 0:
                  raise SystemExit(f'verified_release_asset_missing:{p.name}')
          installer_bytes = installer.read_bytes()
          installer_sha256 = hashlib.sha256(installer_bytes).hexdigest()
          if installer_sha256 != str(manifest.get('installer_sha256') or '').lower():
              raise SystemExit('verified_installer_digest_mismatch')
          raw_dev = dev_yml.read_bytes()
          if raw_dev.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('verified_dev_yml_bom_forbidden')
          try:
              dev_text = raw_dev.decode('utf-8', 'strict').replace('\r', '')
          except UnicodeDecodeError:
              raise SystemExit('verified_dev_yml_utf8_invalid')
          sha512 = base64.b64encode(hashlib.sha512(installer_bytes).digest()).decode()
          lines = [line for line in dev_text.split('\n') if line.strip()]
          expected_lines = {
              f'version: {version}',
              f'  - url: {installer_name}',
              f'    sha512: {sha512}',
              f'    size: {installer.stat().st_size}',
              f'path: {installer_name}',
              f'sha512: {sha512}',
              'stagingPercentage: 100',
          }
          if not expected_lines.issubset(set(lines)):
              raise SystemExit('verified_dev_yml_binding_invalid')
          releases = json.loads((Path(os.environ['RUNNER_TEMP']) / 'releases.json').read_text())
          published = []
          for release in releases:
              mm = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)-dev\.(\d+)\.1', str(release.get('tag_name') or ''))
              if mm:
                  published.append(tuple(map(int, mm.groups())))
          candidate = tuple(map(int, vm.groups()))
          if published and candidate < max(published):
              raise SystemExit('verified_dev_version_rollback')
          outputs = {
              'version': version,
              'tag': f'v{version}',
              'installer': str(installer),
              'blockmap': str(blockmap),
              'dev_yml': str(dev_yml),
              'manifest': str(manifest_path),
              'installer_sha256': installer_sha256,
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in outputs.items():
                  print(f'{key}={value}', file=out)
          PY

      - name: Publish exact verified bytes with ambiguity-safe readback
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          TAG: ${{ steps.verify.outputs.tag }}
          INSTALLER: ${{ steps.verify.outputs.installer }}
          BLOCKMAP: ${{ steps.verify.outputs.blockmap }}
          DEV_YML: ${{ steps.verify.outputs.dev_yml }}
          MANIFEST: ${{ steps.verify.outputs.manifest }}
          INSTALLER_SHA256: ${{ steps.verify.outputs.installer_sha256 }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          verify_release() {
            gh api "repos/$repo/releases/tags/$TAG" > "$RUNNER_TEMP/release-readback.json"
            python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-readback.json').read_text())
          if release.get('prerelease') is not True:
              raise SystemExit('release_not_prerelease')
          expected = {}
          for env_name in ('INSTALLER','BLOCKMAP','DEV_YML','MANIFEST'):
              p = Path(os.environ[env_name])
              expected[p.name] = 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest()
          assets = {str(a.get('name')): str(a.get('digest') or '') for a in release.get('assets', [])}
          if assets != expected:
              raise SystemExit(f'release_asset_digest_mismatch:{assets}:{expected}')
          PY
          }
          if gh api "repos/$repo/git/ref/tags/$TAG" > "$RUNNER_TEMP/tag-readback.json" 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads((Path(os.environ['RUNNER_TEMP']) / 'tag-readback.json').read_text())
          if row.get('object', {}).get('type') != 'commit' or row.get('object', {}).get('sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('existing_tag_target_mismatch')
          PY
          else
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA" > "$RUNNER_TEMP/tag-create.json"
          fi
          if gh api "repos/$repo/releases/tags/$TAG" > /dev/null 2>&1; then
            verify_release
            echo 'exact verified dev release already exists; readback matched'
            exit 0
          fi
          set +e
          gh release create "$TAG" "$INSTALLER" "$BLOCKMAP" "$DEV_YML" "$MANIFEST" \
            --repo "$repo" --prerelease --title "METAENGINE Browser $TAG" \
            --notes "Exact development bytes promoted from physical N→N+1 verification for $SOURCE_SHA. BOM-free UTF-8 metadata, raw-byte integrity client, no rebuild, no production authority."
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if gh api "repos/$repo/releases/tags/$TAG" > /dev/null 2>&1; then
              verify_release
              echo 'release creation returned an ambiguous failure but exact persisted bytes match; accepting readback'
            else
              echo 'release_effect_ambiguous_no_readback' >&2
              exit "$rc"
            fi
          fi
          verify_release
          echo "published_tag=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "installer_sha256=$INSTALLER_SHA256" >> "$GITHUB_STEP_SUMMARY"
