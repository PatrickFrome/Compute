name: METAENGINE Client W30 Fleet DAG Claims

on:
  pull_request:
    paths:
      - 'apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/fleet-dag-claim-plan.mjs'
      - 'apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/devos-routes.mjs'
      - 'apps/metaengine-browser/test/fleet-dag-claim-plan.test.mjs'
      - '.github/workflows/fleet-dag-claim-plan-w30.yml'
  push:
    branches:
      - 'work/metaengine-mass15-w30-20261014'

permissions:
  contents: read

jobs:
  client-w30-fleet-dag-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source SHA
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          printf 'exact_source_sha=%s\n' "$EXPECTED"
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Hermetic original W5 and W30 adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/fleet-dag-claim-plan.mjs
          node --check apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/devos-routes.mjs
          node --check apps/metaengine-browser/test/fleet-dag-claim-plan.test.mjs
          node --test \
            apps/metaengine-browser/test/fleet-coordination-dag.test.mjs \
            apps/metaengine-browser/test/fleet-dag-cancellation-proof.test.mjs \
            apps/metaengine-browser/test/fleet-dag-claim-plan.test.mjs
