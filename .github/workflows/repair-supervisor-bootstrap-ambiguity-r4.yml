name: Apply supervisor bootstrap ambiguity repair R4

on:
  push:
    branches:
      - repair/supervisor-bootstrap-type-ambiguity-r1
    paths:
      - .github/workflows/repair-supervisor-bootstrap-ambiguity-r4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/supervisor-bootstrap-type-ambiguity-r1
          fetch-depth: 0

      - name: Apply fail-closed bootstrap ambiguity repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          keepalive_path = Path('apps/metaengine-browser/src/supervisor-keepalive.mjs')
          keepalive = keepalive_path.read_text()
          keepalive_marker = "  async retireAmbiguousAfterTerminal({ tab_id = null, generation_epoch = null, reason = 'TERMINAL_BOUNDARY_CONFIRMED' } = {}) {"
          assert keepalive.count(keepalive_marker) == 1, 'keepalive insertion marker drifted'
          keepalive_method = r'''  async markAmbiguousContinuationAttempt({ wake_id = null, tab_id = null, composer_sha256 = null } = {}) {
            const pending = this.#state.pending_wake;
            if (this.#state.state !== 'WAKE_AMBIGUOUS' || !pending?.ambiguous_at) return false;
            if (pending.wake_id !== String(wake_id || '')) throw new Error('keepalive_wake_binding_mismatch');
            if (pending.ambiguity_continuation_attempted_at) return false;
            const tabId = String(tab_id || '');
            const composerSha = String(composer_sha256 || '').toLowerCase();
            if (!tabId || !/^[a-f0-9]{64}$/.test(composerSha)) return false;
            pending.ambiguity_continuation_attempted_at = iso(this.#clock);
            pending.ambiguity_continuation_tab_id = tabId;
            pending.ambiguity_continuation_composer_sha256 = composerSha;
            pending.automatic_retry_allowed = false;
            await this.#persist();
            return true;
          }

'''
          keepalive = keepalive.replace(keepalive_marker, keepalive_method + keepalive_marker, 1)
          keepalive_path.write_text(keepalive)

          core_path = Path('apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs')
          core = core_path.read_text()
          old_recovery = r'''    if (row.terminal_ready === true && composerMatches(frame, message) && this.#canActuate() === true) {
              const send = uniqueChatGptControl(frame, 'SEND');
              if (!send) return false;
              await this.#execute({ action: 'TYPED_CLICK', payload: { tab_id: String(tab.tab_id), role: 'button', accessible_name: send.name, semantic_ref: send.semantic_ref }, platform: null });
              const readback = await this.#observeSendReadback(tab.tab_id, pending.wake_id);
              if (readback.ok) {
                await this.#keepalive.resolveAmbiguous({ observed_sent: true });
                this.#activateRequest(pending, tab.tab_id, true);
                this.#lastRecovery = {
                  action: 'RESTART_TYPED_WAKE_SEND_RECOVERED', wake_id: pending.wake_id, tab_id: String(tab.tab_id),
                  proof: 'EXACT_COMPOSER_SHA256_THEN_POSITIVE_SEND_READBACK', confirmed: true, ambiguous: false,
                  prompt_retyped: false, automatic_retry_allowed: false, at: new Date().toISOString(), authority_effect: false,
                };
                return true;
              }
              this.#lastRecovery = {
                action: 'RESTART_TYPED_WAKE_SEND_AMBIGUOUS', wake_id: pending.wake_id, tab_id: String(tab.tab_id),
                proof: 'EXACT_COMPOSER_SHA256_BEFORE_SINGLE_CLICK', confirmed: false, ambiguous: true,
                prompt_retyped: false, automatic_retry_allowed: false, at: new Date().toISOString(), authority_effect: false,
              };
              return true;
            }
'''
          new_recovery = r'''    const composer = unique(frame, 'textbox');
            if (row.terminal_ready === true
              && composer?.value_sha256 === sha256(message)
              && this.#canActuate() === true) {
              const send = uniqueChatGptControl(frame, 'SEND');
              if (!send) return false;
              const continuationArmed = await this.#keepalive.markAmbiguousContinuationAttempt({
                wake_id: pending.wake_id,
                tab_id: tab.tab_id,
                composer_sha256: composer.value_sha256,
              });
              if (!continuationArmed) return false;
              await this.#execute({ action: 'TYPED_CLICK', payload: { tab_id: String(tab.tab_id), role: 'button', accessible_name: send.name, semantic_ref: send.semantic_ref }, platform: null });
              const readback = await this.#observeSendReadback(tab.tab_id, pending.wake_id);
              if (readback.ok) {
                await this.#keepalive.resolveAmbiguous({ observed_sent: true });
                this.#activateRequest(pending, tab.tab_id, true);
                this.#lastRecovery = {
                  action: 'RESTART_TYPED_WAKE_SEND_RECOVERED', wake_id: pending.wake_id, tab_id: String(tab.tab_id),
                  proof: 'DURABLE_SINGLE_CONTINUATION_FENCE_THEN_POSITIVE_SEND_READBACK', confirmed: true, ambiguous: false,
                  prompt_retyped: false, automatic_retry_allowed: false, at: new Date().toISOString(), authority_effect: false,
                };
                return true;
              }
              this.#lastRecovery = {
                action: 'RESTART_TYPED_WAKE_SEND_AMBIGUOUS', wake_id: pending.wake_id, tab_id: String(tab.tab_id),
                proof: 'DURABLE_SINGLE_CONTINUATION_FENCE_BEFORE_CLICK', confirmed: false, ambiguous: true,
                prompt_retyped: false, automatic_retry_allowed: false, at: new Date().toISOString(), authority_effect: false,
              };
              return true;
            }
'''
          assert core.count(old_recovery) == 1, 'ambiguous wake recovery block drifted'
          core = core.replace(old_recovery, new_recovery, 1)

          supervisor_marker = "      let supervisor = await this.#supervisorTab(state);"
          assert core.count(supervisor_marker) == 1, 'supervisor cycle insertion marker drifted'
          bootstrap_reconcile = r'''      let keepalive = this.#keepalive.snapshot();
            if (keepalive.state === 'WAKE_AMBIGUOUS'
              && keepalive.pending_wake?.ambiguous_at
              && !keepalive.conversation_url) {
              const fleetTabs = new Set((state?.fleet?.agents || []).map((a) => a?.tab_id).filter(Boolean).map(String));
              const bootstrapCandidates = (state?.tabs || []).filter((tab) => {
                if (fleetTabs.has(String(tab?.tab_id || ''))) return false;
                const url = String(tab?.url || '');
                return CHAT_ROOT_RE.test(url) || CHAT_RE.test(url);
              });
              const durableTabId = String(
                keepalive.pending_wake?.ambiguity_continuation_tab_id
                || keepalive.tab_id
                || '',
              );
              const scopedCandidates = durableTabId
                ? bootstrapCandidates.filter((tab) => String(tab?.tab_id || '') === durableTabId)
                : bootstrapCandidates;

              if (scopedCandidates.length === 1) {
                const bootstrapTab = scopedCandidates[0];
                try {
                  const frame = await this.#capture(bootstrapTab.tab_id);
                  const frameUrl = String(frame?.url || bootstrapTab?.url || '');
                  if (CHAT_ROOT_RE.test(frameUrl) || CHAT_RE.test(frameUrl)) {
                    const live = tabLiveness(state, bootstrapTab.tab_id);
                    const row = this.#sessionMonitor.observe({ tab_id: bootstrapTab.tab_id, frame, ...live });
                    this.#lastSupervisorGeneration = row.state;
                    await this.#recoverAmbiguousWakeFromFrame(bootstrapTab, frame, row, keepalive);
                    keepalive = this.#keepalive.snapshot();
                    if (keepalive.state !== 'WAKE_AMBIGUOUS' && keepalive.active_wake) {
                      let reboundFrame = frame;
                      if (!CHAT_RE.test(String(reboundFrame?.url || ''))) {
                        try { reboundFrame = await this.#capture(bootstrapTab.tab_id); } catch {}
                      }
                      const reboundUrl = String(reboundFrame?.url || '');
                      if (CHAT_RE.test(reboundUrl)) {
                        await this.#keepalive.bindConversation({ url: reboundUrl, tab_id: bootstrapTab.tab_id });
                        keepalive = this.#keepalive.snapshot();
                      }
                    }
                  }
                } catch (e) {
                  this.#lastError = `bootstrap_ambiguous_reconcile:${String(e?.message || e).slice(0, 200)}`;
                }
              }

              keepalive = this.#keepalive.snapshot();
              if (keepalive.state === 'WAKE_AMBIGUOUS') return this.snapshot();
              if (keepalive.active_wake && !keepalive.conversation_url) return this.snapshot();
              state = await this.#getState();
            }
'''
          core = core.replace(supervisor_marker, bootstrap_reconcile + supervisor_marker, 1)
          core_path.write_text(core)

          test_path = Path('apps/metaengine-browser/test/supervisor-bootstrap-ambiguity-repair-r4.test.mjs')
          test_path.write_text(r'''import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import test from 'node:test';
          import { SupervisorLifecycleRuntime } from '../src/supervisor-lifecycle-runtime-core.mjs';
          import { buildSupervisorWakeMessage } from '../src/supervisor-keepalive.mjs';

          const WAKE_ID = 'wake_bootstrap-r4';

          function seedState() {
            return {
              schema: 'metaengine.supervisor-keepalive.state.v1',
              version: '1.5.0',
              supervisor_id: 'METAENGINE_SUPERVISOR',
              supervisor_epoch: 1,
              cycle_seq: 0,
              state: 'WAKE_AMBIGUOUS',
              conversation_url: null,
              tab_id: null,
              paused: false,
              process_incarnation_id: null,
              admission_state: 'UNKNOWN',
              queued_wakes: [],
              pending_wake: {
                wake_id: WAKE_ID,
                reason: 'CONTINUE_DEVELOPMENT',
                queue_key: 'CONTINUE_DEVELOPMENT:',
                prepared_at: '2026-09-16T00:00:00.000Z',
                supervisor_epoch: 1,
                cycle_seq: 1,
                process_incarnation_id: null,
                ambiguous_at: '2026-09-16T00:00:01.000Z',
                ambiguous_reason: 'TYPE_EFFECT_AMBIGUOUS',
                automatic_retry_allowed: false,
              },
              active_wake: null,
            };
          }

          function wakeMessage() {
            return buildSupervisorWakeMessage({
              supervisorEpoch: 1,
              cycleSeq: 1,
              wakeId: WAKE_ID,
              reason: 'CONTINUE_DEVELOPMENT',
            });
          }

          function composerFrame({ marker = false, composerSha = null } = {}) {
            return {
              url: 'https://chatgpt.com/',
              title: 'ChatGPT',
              text_excerpt: marker ? `message ${WAKE_ID}` : '',
              semantic_targets: [
                ...(composerSha ? [{ role: 'textbox', name: 'Message ChatGPT', semantic_ref: 'composer', value_sha256: composerSha }] : []),
                { role: 'button', name: 'Send prompt', semantic_ref: 'send' },
              ],
            };
          }

          async function makeRuntime({ tabs, frame, onClick = null }) {
            const dir = await fs.mkdtemp(path.join(os.tmpdir(), 'metaengine-r4-'));
            const statePath = path.join(dir, 'keepalive.json');
            await fs.writeFile(statePath, `${JSON.stringify(seedState(), null, 2)}\n`);
            const actions = [];
            const executeCommand = async ({ action, payload }) => {
              actions.push(action);
              if (action === 'CAPTURE') return typeof frame === 'function' ? frame() : structuredClone(frame);
              if (action === 'TYPED_CLICK') {
                if (onClick) return onClick({ action, payload });
                return { ok: true };
              }
              throw new Error(`unexpected_effect:${action}`);
            };
            const runtime = new SupervisorLifecycleRuntime({
              getState: async () => ({ tabs: structuredClone(tabs), fleet: { agents: [] } }),
              executeCommand,
              canActuate: () => true,
              statePath,
              researchMs: 24 * 60 * 60 * 1000,
            });
            return { runtime, actions, statePath };
          }

          test('bare bootstrap root transcript marker resolves ambiguity without a write effect', async () => {
            const { runtime, actions } = await makeRuntime({
              tabs: [{ tab_id: 'root-1', url: 'https://chatgpt.com/', selected: false }],
              frame: composerFrame({ marker: true }),
            });
            const snap = await runtime.start();
            assert.equal(snap.keepalive.state, 'ACTIVE');
            assert.equal(snap.keepalive.pending_wake, null);
            assert.equal(snap.keepalive.active_wake?.wake_id, WAKE_ID);
            assert.equal(actions.includes('TYPED_CLICK'), false);
            assert.equal(actions.includes('SEMANTIC_TYPE'), false);
            assert.equal(actions.includes('NEW_TAB'), false);
          });

          test('exact composer continuation is durably fenced before click and never repeated', async () => {
            const composerSha = crypto.createHash('sha256').update(wakeMessage(), 'utf8').digest('hex');
            let clicks = 0;
            const { runtime, actions, statePath } = await makeRuntime({
              tabs: [{ tab_id: 'root-1', url: 'https://chatgpt.com/', selected: false }],
              frame: composerFrame({ composerSha }),
              onClick: () => {
                clicks += 1;
                throw new Error('simulated_transport_loss_after_click_boundary');
              },
            });
            let snap = await runtime.start();
            assert.equal(snap.keepalive.state, 'WAKE_AMBIGUOUS');
            assert.equal(clicks, 1);
            const durable = JSON.parse(await fs.readFile(statePath, 'utf8'));
            assert.equal(durable.pending_wake.ambiguity_continuation_tab_id, 'root-1');
            assert.equal(durable.pending_wake.ambiguity_continuation_composer_sha256, composerSha);
            assert.ok(durable.pending_wake.ambiguity_continuation_attempted_at);

            snap = await runtime.cycle({ force: true });
            assert.equal(snap.keepalive.state, 'WAKE_AMBIGUOUS');
            assert.equal(clicks, 1);
            assert.equal(actions.includes('SEMANTIC_TYPE'), false);
            assert.equal(actions.includes('NEW_TAB'), false);
          });

          test('duplicate bootstrap candidates fail closed with zero effect continuation', async () => {
            const composerSha = crypto.createHash('sha256').update(wakeMessage(), 'utf8').digest('hex');
            const { runtime, actions } = await makeRuntime({
              tabs: [
                { tab_id: 'root-1', url: 'https://chatgpt.com/', selected: false },
                { tab_id: 'root-2', url: 'https://chatgpt.com/', selected: false },
              ],
              frame: composerFrame({ composerSha }),
            });
            const snap = await runtime.start();
            assert.equal(snap.keepalive.state, 'WAKE_AMBIGUOUS');
            assert.equal(actions.includes('TYPED_CLICK'), false);
            assert.equal(actions.includes('SEMANTIC_TYPE'), false);
            assert.equal(actions.includes('NEW_TAB'), false);
          });
          ''')
          PY

      - name: Verify syntax and focused regression
        shell: bash
        run: |
          node --check apps/metaengine-browser/src/supervisor-keepalive.mjs
          node --check apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs
          node --test apps/metaengine-browser/test/supervisor-bootstrap-ambiguity-repair-r4.test.mjs

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "metaengine-repair-bot"
          git config user.email "metaengine-repair-bot@users.noreply.github.com"
          git add apps/metaengine-browser/src/supervisor-keepalive.mjs \
                  apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs \
                  apps/metaengine-browser/test/supervisor-bootstrap-ambiguity-repair-r4.test.mjs
          git diff --cached --check
          git commit -m "fix(browser): reconcile bootstrap wake ambiguity"
          git push origin HEAD:repair/supervisor-bootstrap-type-ambiguity-r1
