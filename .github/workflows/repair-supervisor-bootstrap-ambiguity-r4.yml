name: Apply supervisor bootstrap ambiguity repair R4

on:
  push:
    branches:
      - repair/supervisor-bootstrap-type-ambiguity-r1
    paths:
      - .github/workflows/repair-supervisor-bootstrap-ambiguity-r4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/supervisor-bootstrap-type-ambiguity-r1
          fetch-depth: 0
      - name: Apply repair
        run: python3 scripts/apply-supervisor-bootstrap-ambiguity-r4.py
      - name: Verify focused repair
        run: |
          node --check apps/metaengine-browser/src/supervisor-keepalive.mjs
          node --check apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs
          node --test apps/metaengine-browser/test/supervisor-bootstrap-ambiguity-repair-r4.test.mjs
      - name: Commit repair
        run: |
          git config user.name "metaengine-repair-bot"
          git config user.email "metaengine-repair-bot@users.noreply.github.com"
          git add apps/metaengine-browser/src/supervisor-keepalive.mjs apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs
          git diff --cached --check
          git commit -m "fix(browser): reconcile bootstrap wake ambiguity"
          git push origin HEAD:repair/supervisor-bootstrap-type-ambiguity-r1
