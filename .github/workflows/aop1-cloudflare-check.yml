name: AOP1 Cloudflare Check

on:
  pull_request:
    branches:
      - "work/aop1-autonomous-orchestration"
    paths:
      - "orchestration/cloudflare/**"
      - "research/AOP1_**"
      - ".github/workflows/aop1-cloudflare-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install pinned AOP1 toolchain
        working-directory: orchestration/cloudflare
        run: npm install --no-audit --no-fund

      - name: Generate bindings and typecheck
        working-directory: orchestration/cloudflare
        run: npm run check
