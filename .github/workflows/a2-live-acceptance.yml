name: A2 live acceptance

on:
  push:
    branches:
      - "work/same-point-duel-v4-a2-cognitive-bus"
    paths:
      - "orchestration/sovereign/**"
      - "supabase/migrations/*a2*"
      - "supabase/functions/metaengine-a2-*/**"
      - ".github/workflows/a2-live-acceptance.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: a2-live-acceptance
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Exchange GitHub OIDC for scoped A2 acceptance capabilities
        shell: bash
        env:
          BROKER_URL: https://xpeibufgzjknrhbhpffp.supabase.co/functions/v1/metaengine-a2-github-oidc-acceptance-h205f22
        run: |
          set -euo pipefail
          oidc="$(curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=metaengine-h205f22-a2-acceptance" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != "null"
          code="$(curl --silent --show-error \
            -X POST "$BROKER_URL" \
            -H "Authorization: Bearer $oidc" \
            -H 'Content-Type: application/json' \
            -o /tmp/a2-acceptance-bundle.json \
            -w '%{http_code}')"
          if [ "$code" != "200" ]; then
            cat /tmp/a2-acceptance-bundle.json >&2 || true
            exit 1
          fi
          jq -e --arg sha "$GITHUB_SHA" '
            .schema == "metaengine.compute.a2-acceptance-bundle.h205f22.v2"
            and .github_sha == $sha
            and .canonical == false
            and .authority_effect == false
            and (.capability.token_sha256 | test("^[0-9a-f]{64}$"))
            and (.bundle.vercel_ai_gateway_api_key_sha256 | test("^[0-9a-f]{64}$"))
          ' /tmp/a2-acceptance-bundle.json >/dev/null
          runtime_token="$(jq -r '.bundle.a2_runtime_token' /tmp/a2-acceptance-bundle.json)"
          ingress_url="$(jq -r '.bundle.a2_ingress_url' /tmp/a2-acceptance-bundle.json)"
          gateway_key="$(jq -r '.bundle.vercel_ai_gateway_api_key' /tmp/a2-acceptance-bundle.json)"
          gateway_sha="$(jq -r '.bundle.vercel_ai_gateway_api_key_sha256' /tmp/a2-acceptance-bundle.json)"
          test -n "$runtime_token" && test -n "$gateway_key" && test -n "$ingress_url"
          echo "::add-mask::$runtime_token"
          echo "::add-mask::$gateway_key"
          printf 'A2_INGRESS_TOKEN=%s\n' "$runtime_token" >> "$GITHUB_ENV"
          printf 'A2_INGRESS_URL=%s\n' "$ingress_url" >> "$GITHUB_ENV"
          printf 'AI_GATEWAY_API_KEY=%s\n' "$gateway_key" >> "$GITHUB_ENV"
          printf 'AI_GATEWAY_API_KEY_SHA256=%s\n' "$gateway_sha" >> "$GITHUB_ENV"
          printf 'A2_WORKSPACE_ID=%s\n' '063e3923-ef85-4226-9843-861ad4ec5a21' >> "$GITHUB_ENV"
          rm -f /tmp/a2-acceptance-bundle.json
          unset oidc runtime_token gateway_key gateway_sha

      - name: Verify deployed Edge ingress and exact model inventory
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$A2_INGRESS_URL/healthz" -o /tmp/a2-health.json
          jq -e '
            .status == "ok"
            and .verification == "EDGE_WEBCRYPTO_ED25519_THEN_DB_SIGNATURE_BOUND_HMAC_V3"
            and .runtime_access == "EPHEMERAL_SCOPED_BEARER_CAPABILITY_SHA256_DB_FENCED"
            and .direct_database_access_for_peers == false
            and .vault_secret_exposed == false
          ' /tmp/a2-health.json >/dev/null
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" \
            https://ai-gateway.vercel.sh/v1/models -o /tmp/a2-models.json
          jq -e '[.data[].id] | index("openai/gpt-5.6-sol") != null and index("zai/glm-5.3") != null' /tmp/a2-models.json >/dev/null
          rm -f /tmp/a2-health.json /tmp/a2-models.json

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install sovereign dependencies
        working-directory: orchestration/sovereign
        run: npm install --no-audit --no-fund

      - name: HTTP Ed25519 negative then positive canary
        working-directory: orchestration/sovereign
        shell: bash
        env:
          A2_CANARY_AGENT: GPT
        run: |
          set -euo pipefail
          export A2_CANARY_CAPABILITY_EPOCH="$((GITHUB_RUN_NUMBER * 100 + 1))"
          npm run test:a2:ingress-canary | tee /tmp/a2-ingress-canary.log
          grep -q '"negative_rejected": true' /tmp/a2-ingress-canary.log
          grep -q '"positive_persisted": true' /tmp/a2-ingress-canary.log
          grep -q '"persisted_ed25519_verified": true' /tmp/a2-ingress-canary.log

      - name: Probe actual exact-model inference readiness before peer registration
        working-directory: orchestration/sovereign
        shell: bash
        run: |
          set -euo pipefail
          status=0
          run_probe() {
            local agent="$1" provider="$2" model="$3" rc output
            set +e
            output="$(A2_AGENT="$agent" A2_PROVIDER="$provider" A2_MODEL="$model" \
              A2_MODEL_URL="https://ai-gateway.vercel.sh" A2_MODEL_TOKEN="$AI_GATEWAY_API_KEY" \
              npx tsx src/a2_model_probe.ts)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            if [ "$rc" -ne 0 ]; then status="$rc"; fi
          }
          run_probe GPT vercel-ai-gateway openai/gpt-5.6-sol
          run_probe GLM vercel-ai-gateway zai/glm-5.3
          if [ "$status" -ne 0 ]; then
            echo "A2 exact inference rail unavailable; no peer session or sync round will be created by this acceptance run." >&2
            exit "$status"
          fi

      - name: Capture exact-model acceptance baseline
        shell: bash
        run: |
          set -euo pipefail
          rpc() { curl --silent --show-error --fail --max-time 20 -X POST "$A2_INGRESS_URL/v1/a2/rpc" -H "Authorization: Bearer $A2_INGRESS_TOKEN" -H 'Content-Type: application/json' --data "$1"; }
          rpc "$(jq -nc --arg w "$A2_WORKSPACE_ID" '{fn:"h205f22_a2_read_snapshot_v1",args:[$w,10]}')" > /tmp/a2-before-snapshot.json
          rpc "$(jq -nc --arg w "$A2_WORKSPACE_ID" '{fn:"h205f22_a2_read_sync_state_v1",args:[$w]}')" > /tmp/a2-before-sync.json
          jq -r '.value.head_commit_seq // 0' /tmp/a2-before-snapshot.json > /tmp/a2-before-head
          jq -r '[.value.recent_rounds[]?.round_seq] | max // 0' /tmp/a2-before-sync.json > /tmp/a2-before-round

      - name: Run exact GPT-5.6 Sol and GLM-5.3 peers without relay
        working-directory: orchestration/sovereign
        shell: bash
        run: |
          set -euo pipefail
          epoch="$((GITHUB_RUN_NUMBER * 100 + 2))"
          gpt_runtime_id="a2-live-gpt-$GITHUB_RUN_ID"
          glm_runtime_id="a2-live-glm-$GITHUB_RUN_ID"
          gpt_key="$(npx tsx src/a2_keygen.ts)"
          glm_key="$(npx tsx src/a2_keygen.ts)"
          echo "::add-mask::$gpt_key"
          echo "::add-mask::$glm_key"
          common=(
            A2_WORKSPACE_ID="$A2_WORKSPACE_ID"
            A2_INGRESS_URL="$A2_INGRESS_URL"
            A2_INGRESS_TOKEN="$A2_INGRESS_TOKEN"
            A2_MODEL_URL="https://ai-gateway.vercel.sh"
            A2_MODEL_TOKEN="$AI_GATEWAY_API_KEY"
            A2_CAPABILITY_EPOCH="$epoch"
            A2_POLL_MS="150"
            A2_WORKSPACE_MODE_POLL_MS="500"
            A2_MICROSTEP_TIMEOUT_MS="30000"
            A2_SYNC_ROUND_TTL_SECONDS="75"
            A2_LEASE_RENEW_MS="20000"
          )
          env "${common[@]}" A2_AGENT=GPT A2_PROVIDER=vercel-ai-gateway A2_MODEL=openai/gpt-5.6-sol \
            A2_RUNTIME_ID="$gpt_runtime_id" A2_ED25519_PRIVATE_KEY_PEM_B64="$gpt_key" \
            npx tsx src/a2_runtime.ts > /tmp/a2-gpt.log 2>&1 &
          gpt_pid=$!
          env "${common[@]}" A2_AGENT=GPT A2_PROVIDER=vercel-ai-gateway A2_MODEL=openai/gpt-5.6-sol \
            A2_RUNTIME_ID="$gpt_runtime_id" A2_ED25519_PRIVATE_KEY_PEM_B64="$gpt_key" \
            npx tsx src/a2_lease_keeper.ts > /tmp/a2-gpt-lease.log 2>&1 &
          gpt_lease_pid=$!
          env "${common[@]}" A2_AGENT=GLM A2_PROVIDER=vercel-ai-gateway A2_MODEL=zai/glm-5.3 \
            A2_RUNTIME_ID="$glm_runtime_id" A2_ED25519_PRIVATE_KEY_PEM_B64="$glm_key" \
            npx tsx src/a2_runtime.ts > /tmp/a2-glm.log 2>&1 &
          glm_pid=$!
          env "${common[@]}" A2_AGENT=GLM A2_PROVIDER=vercel-ai-gateway A2_MODEL=zai/glm-5.3 \
            A2_RUNTIME_ID="$glm_runtime_id" A2_ED25519_PRIVATE_KEY_PEM_B64="$glm_key" \
            npx tsx src/a2_lease_keeper.ts > /tmp/a2-glm-lease.log 2>&1 &
          glm_lease_pid=$!
          cleanup() {
            kill -TERM "$gpt_pid" "$gpt_lease_pid" "$glm_pid" "$glm_lease_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$gpt_pid" 2>/dev/null && ! kill -0 "$gpt_lease_pid" 2>/dev/null \
                 && ! kill -0 "$glm_pid" 2>/dev/null && ! kill -0 "$glm_lease_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -KILL "$gpt_pid" "$gpt_lease_pid" "$glm_pid" "$glm_lease_pid" 2>/dev/null || true
            wait "$gpt_pid" 2>/dev/null || true
            wait "$gpt_lease_pid" 2>/dev/null || true
            wait "$glm_pid" 2>/dev/null || true
            wait "$glm_lease_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          before_round="$(cat /tmp/a2-before-round)"
          rpc() { curl --silent --show-error --fail --max-time 20 -X POST "$A2_INGRESS_URL/v1/a2/rpc" -H "Authorization: Bearer $A2_INGRESS_TOKEN" -H 'Content-Type: application/json' --data "$1"; }
          converged=false
          for _ in $(seq 1 100); do
            if ! kill -0 "$gpt_pid" 2>/dev/null || ! kill -0 "$gpt_lease_pid" 2>/dev/null \
               || ! kill -0 "$glm_pid" 2>/dev/null || ! kill -0 "$glm_lease_pid" 2>/dev/null; then
              echo "exact peer or lease keeper exited before convergence" >&2
              cat /tmp/a2-gpt.log >&2 || true
              cat /tmp/a2-gpt-lease.log >&2 || true
              cat /tmp/a2-glm.log >&2 || true
              cat /tmp/a2-glm-lease.log >&2 || true
              exit 1
            fi
            rpc "$(jq -nc --arg w "$A2_WORKSPACE_ID" '{fn:"h205f22_a2_read_sync_state_v1",args:[$w]}')" > /tmp/a2-sync-live.json
            if jq -e --argjson base "$before_round" '
              [.value.recent_rounds[]? | select(.round_seq > $base and .status == "SEALED") | .deliberation_phase] as $p
              | ($p | index("PROPOSE") != null) and ($p | index("CHALLENGE") != null) and ($p | index("DECIDE") != null)
            ' /tmp/a2-sync-live.json >/dev/null; then
              converged=true
              break
            fi
            sleep 1
          done
          if [ "$converged" != "true" ]; then
            echo "exact lockstep did not converge" >&2
            cat /tmp/a2-sync-live.json >&2 || true
            cat /tmp/a2-gpt.log >&2 || true
            cat /tmp/a2-gpt-lease.log >&2 || true
            cat /tmp/a2-glm.log >&2 || true
            cat /tmp/a2-glm-lease.log >&2 || true
            exit 1
          fi
          sleep 2
          cleanup
          trap - EXIT
          unset gpt_key glm_key

      - name: Verify exact persisted lockstep, peer visibility, and replay
        shell: bash
        run: |
          set -euo pipefail
          before_head="$(cat /tmp/a2-before-head)"
          before_round="$(cat /tmp/a2-before-round)"
          rpc() { curl --silent --show-error --fail --max-time 20 -X POST "$A2_INGRESS_URL/v1/a2/rpc" -H "Authorization: Bearer $A2_INGRESS_TOKEN" -H 'Content-Type: application/json' --data "$1"; }
          rpc "$(jq -nc --arg w "$A2_WORKSPACE_ID" --argjson a "$before_head" '{fn:"h205f22_a2_read_events_v1",args:[$w,$a,1000]}')" > /tmp/a2-live-events.json
          rpc "$(jq -nc --arg w "$A2_WORKSPACE_ID" '{fn:"h205f22_a2_read_sync_state_v1",args:[$w]}')" > /tmp/a2-live-sync.json
          jq -e --argjson base "$before_round" '
            [.value.recent_rounds[]? | select(.round_seq > $base and .status == "SEALED") | .deliberation_phase] as $p
            | ($p | index("PROPOSE") != null) and ($p | index("CHALLENGE") != null) and ($p | index("DECIDE") != null)
          ' /tmp/a2-live-sync.json >/dev/null
          jq -e '
            [.value.events[]? | select(.agent=="GPT" and (.event_type|IN("PLAN","HYPOTHESIS","CLAIM","EVIDENCE","ASSUMPTION","ACTION_PROPOSAL","COUNTERCLAIM","QUESTION","FALSIFIER","CRITIQUE","REQUEST_DUEL"))) | .model_provenance | select(.requested_model=="openai/gpt-5.6-sol" and .reported_model=="openai/gpt-5.6-sol")] | length >= 3
          ' /tmp/a2-live-events.json >/dev/null
          jq -e '
            [.value.events[]? | select(.agent=="GLM" and (.event_type|IN("PLAN","HYPOTHESIS","CLAIM","EVIDENCE","ASSUMPTION","ACTION_PROPOSAL","COUNTERCLAIM","QUESTION","FALSIFIER","CRITIQUE","REQUEST_DUEL"))) | .model_provenance | select(.requested_model=="zai/glm-5.3" and .reported_model=="zai/glm-5.3")] | length >= 3
          ' /tmp/a2-live-events.json >/dev/null
          jq -e '[.value.events[]? | select(.event_type=="PEER_EVENT_APPLIED" and .agent=="GPT")] | length >= 1' /tmp/a2-live-events.json >/dev/null
          jq -e '[.value.events[]? | select(.event_type=="PEER_EVENT_APPLIED" and .agent=="GLM")] | length >= 1' /tmp/a2-live-events.json >/dev/null
          jq -e '[.value.events[]? | select(.payload.deliberation_phase=="CHALLENGE") | .payload.peer_event_hash_addressed | select(type=="string" and length==64)] | length >= 2' /tmp/a2-live-events.json >/dev/null
          rpc "$(jq -nc --arg w "$A2_WORKSPACE_ID" '{fn:"h205f22_a2_read_events_v1",args:[$w,0,1000]}')" | jq -c '[.value.events[]|{commit_seq,event_hash}]' > /tmp/a2-replay-a.json
          rpc "$(jq -nc --arg w "$A2_WORKSPACE_ID" '{fn:"h205f22_a2_read_events_v1",args:[$w,0,1000]}')" | jq -c '[.value.events[]|{commit_seq,event_hash}]' > /tmp/a2-replay-b.json
          cmp /tmp/a2-replay-a.json /tmp/a2-replay-b.json
          echo "A2 exact-model lockstep + peer visibility + deterministic durable replay: PASS"

      - name: Scrub ephemeral capabilities
        if: always()
        shell: bash
        run: |
          printf 'A2_INGRESS_TOKEN=\nAI_GATEWAY_API_KEY=\n' >> "$GITHUB_ENV"
          rm -f /tmp/a2-*.json /tmp/a2-*.log /tmp/a2-before-head /tmp/a2-before-round || true
