name: R1 Trusted Live Recovery Source

on:
  pull_request:
    branches: [main]
    paths:
      - 'controller/r1/live_recovery_source_attestation.py'
      - 'tests/test_r1_live_recovery_source_attestation.py'
      - 'research/R1_STEP07_TRUSTED_LIVE_RECOVERY_SOURCE.md'
      - '.github/workflows/r1-live-recovery-source.yml'
  workflow_dispatch:
    inputs:
      execute_source:
        description: 'Generate a live encrypted logical recovery source after protected-environment approval'
        required: true
        default: false
        type: boolean
      confirmation:
        description: 'For live source generation type GENERATE_R1_ENCRYPTED_RECOVERY_SOURCE'
        required: false
        default: ''
        type: string

concurrency:
  group: r1-live-recovery-source
  queue: max

permissions: {}

env:
  R1_PROJECT_REF: xpeibufgzjknrhbhpffp
  R1_SOURCE_PREDICATE_TYPE: https://github.com/PatrickFrome/Compute/attestations/r1-recovery-source/v1

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile and run STEP07 adversarial tests
        run: |
          set -euo pipefail
          python3 -m py_compile controller/r1/live_recovery_source_attestation.py
          python3 -m unittest tests.test_r1_live_recovery_source_attestation -v
          python3 -m unittest tests.test_r1_recovery_artifact_packager -v
          python3 -m unittest tests.test_r1_recovery_encryption_envelope -v

      - name: Validate source workflow contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('.github/workflows/r1-live-recovery-source.yml').read_text()
          before,remainder=raw.split('      - name: Validate source workflow contract',1)
          _checker,after=remainder.split('\n  preflight-source:',1)
          p=before+'\n  preflight-source:'+after
          source=p.split('\n  source-build:',1)[1].split('\n  attest-source:',1)[0]
          attest=p.split('\n  attest-source:',1)[1].split('\n  verify-source:',1)[0]
          verify=p.split('\n  verify-source:',1)[1]
          assert 'environment: ${{ needs.preflight-source.outputs.source_environment }}' in source
          assert 'SUPABASE_DB_URL' in source
          assert 'id-token: write' not in source and 'attestations: write' not in source
          assert 'supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520' in source
          assert 'version: 2.111.0' in source
          assert 'bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377' in source
          assert '91331dc8ed9b5a0f4317ef6e7c261e49dfc2f11249a1775120a81361349d4c92' in source
          assert 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6' in attest
          assert 'id-token: write' in attest and 'attestations: write' in attest
          assert 'SUPABASE_DB_URL' not in attest and 'SUPABASE_DB_URL' not in verify
          assert 'gh attestation verify' in verify
          assert '--signer-workflow' in verify and '--signer-digest' in verify
          assert '--source-ref refs/heads/main' in verify and '--source-digest' in verify
          assert '--deny-self-hosted-runners' in verify
          assert p.count('id-token: write') == 1
          assert 'archive: false' in p and 'digest-mismatch: error' in p
          for forbidden in ('roles.sql\n          archive:', 'schema.sql\n          archive:', 'data.sql\n          archive:', 'recovery-bundle.tar\n          archive:'):
              assert forbidden not in p
          PY

  preflight-source:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      source_environment: ${{ steps.outputs.outputs.source_environment }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate dispatch and existing protected source environment
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE_SOURCE: ${{ inputs.execute_source }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          if [[ "$EXECUTE_SOURCE" == 'true' && "$CONFIRMATION" != 'GENERATE_R1_ENCRYPTED_RECOVERY_SOURCE' ]]; then
            echo 'live source generation requires exact confirmation token' >&2
            exit 1
          fi
          mkdir -p evidence
          curl --fail-with-body --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/r1-recovery-source" \
            > evidence/source-environment.json
          python3 controller/r1/live_recovery_source_attestation.py validate-environment \
            --input evidence/source-environment.json \
            --output evidence/r1-source-environment-readiness.json

      - name: Publish verified source environment
        id: outputs
        run: echo 'source_environment=r1-recovery-source' >> "$GITHUB_OUTPUT"

  source-build:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_source == true
    needs: preflight-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ needs.preflight-source.outputs.source_environment }}
    permissions:
      contents: read
    outputs:
      ciphertext_artifact_id: ${{ steps.upload-ciphertext.outputs.artifact-id }}
      envelope_artifact_id: ${{ steps.upload-envelope.outputs.artifact-id }}
      predicate_artifact_id: ${{ steps.upload-predicate.outputs.artifact-id }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.111.0

      - name: Fetch and verify exact official age v1.3.1
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/age-v1.3.1-linux-amd64.tar.gz \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          curl --fail --silent --show-error --location \
            --output /tmp/age-v1.3.1-linux-amd64.tar.gz.proof \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz.proof
          echo 'bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age-v1.3.1-linux-amd64.tar.gz' | sha256sum -c -
          echo '91331dc8ed9b5a0f4317ef6e7c261e49dfc2f11249a1775120a81361349d4c92  /tmp/age-v1.3.1-linux-amd64.tar.gz.proof' | sha256sum -c -
          cat > /tmp/age-sigsum-key.pub <<'EOF'
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM1WpnEswJLPzvXJDiswowy48U+G+G1kmgwUE2eaRHZG
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAz2WM5CyPLqiNjk7CLl4roDXwKhQ0QExXLebukZEZFS
          EOF
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.13.1
          "$(go env GOPATH)/bin/sigsum-verify" -k /tmp/age-sigsum-key.pub -P sigsum-generic-2025-1 \
            /tmp/age-v1.3.1-linux-amd64.tar.gz.proof < /tmp/age-v1.3.1-linux-amd64.tar.gz
          mkdir -p /tmp/age-v1.3.1
          tar -xzf /tmp/age-v1.3.1-linux-amd64.tar.gz -C /tmp/age-v1.3.1
          AGE_BIN="$(find /tmp/age-v1.3.1 -type f -name age -perm -u+x | head -n1)"
          test -x "$AGE_BIN"
          "$AGE_BIN" --version | grep -F '1.3.1'
          echo "AGE_BIN=$AGE_BIN" >> "$GITHUB_ENV"

      - name: Validate protected recovery recipients
        env:
          RECIPIENTS: ${{ vars.R1_RECOVERY_AGE_RECIPIENTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RECIPIENTS"
          printf '%s\n' "$RECIPIENTS" > "$RUNNER_TEMP/r1-recovery-recipients.txt"
          python3 - <<'PY'
          from pathlib import Path
          from controller.r1.recovery_encryption_envelope import load_recipients,PROFILE_PRODUCTION_PQ
          r=load_recipients(Path(__import__('os').environ['RUNNER_TEMP'])/'r1-recovery-recipients.txt',PROFILE_PRODUCTION_PQ)
          assert len(r) >= 2
          PY

      - name: Dump fence package and encrypt in one DB-secret-bearing step
        env:
          SUPABASE_DB_URL: ${{ secrets.R1_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SUPABASE_DB_URL"
          command -v psql >/dev/null
          supabase --version | grep -Fx '2.111.0' >/dev/null
          PRIVATE="$RUNNER_TEMP/r1-source-private"
          EVIDENCE="$GITHUB_WORKSPACE/evidence"
          rm -rf "$PRIVATE" "$EVIDENCE"
          mkdir -p "$PRIVATE" "$EVIDENCE"
          cleanup() {
            find "$PRIVATE" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$PRIVATE"
          }
          trap cleanup EXIT

          capture_control() {
            local label="$1"
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
              'select destruktion_meta.compute_fabric_roadmap_status_h205f22()::text' > "$PRIVATE/roadmap-${label}.json"
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
              'select destruktion_meta.compute_fabric_roadmap_alignment_status_h205f22()::text' > "$PRIVATE/alignment-${label}.json"
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
              "select coalesce(jsonb_agg(jsonb_build_object('version',version,'name',name,'statements',statements,'created_by',created_by,'idempotency_key',idempotency_key,'rollback',rollback) order by version),'[]'::jsonb)::text from supabase_migrations.schema_migrations" \
              > "$PRIVATE/migrations-${label}.json"
            LABEL="$label" PRIVATE="$PRIVATE" python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          label=os.environ['LABEL']; root=os.environ['PRIVATE']
          status=json.load(open(f'{root}/roadmap-{label}.json'))
          alignment=json.load(open(f'{root}/alignment-{label}.json'))
          rows=json.load(open(f'{root}/migrations-{label}.json'))
          if not isinstance(rows,list) or not rows:
              raise SystemExit('migration ledger empty')
          body=json.dumps(rows,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          head=((status.get('semantic_head') or {}).get('checkpoint_id'))
          digest=alignment.get('canonical_digest')
          versions=[str(r.get('version','')) for r in rows]
          value={
            'schema':'metaengine.compute.r1-source-control-fence.h205f22.v1',
            'semantic_head':head,
            'canonical_digest':digest,
            'migration_ledger_sha256':hashlib.sha256(body).hexdigest(),
            'migration_rows':len(rows),
            'max_migration_version':max(versions),
            'captured_at':datetime.now(timezone.utc).isoformat(),
          }
          json.dump(value,open(f'{root}/fence-{label}.json','w'),sort_keys=True,separators=(',',':'))
          PY
          }

          capture_control before
          SNAPSHOT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f "$PRIVATE/roles.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema destruktion_meta -f "$PRIVATE/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema destruktion_meta --data-only --use-copy -f "$PRIVATE/data.sql"
          capture_control after

          python3 controller/r1/live_recovery_source_attestation.py build-export-metadata \
            --before "$PRIVATE/fence-before.json" --after "$PRIVATE/fence-after.json" \
            --output "$PRIVATE/export-metadata.json"
          PRIVATE="$PRIVATE" python3 - <<'PY'
          import json,os
          root=os.environ['PRIVATE']
          rows=json.load(open(f'{root}/migrations-before.json'))
          value={'schema':'metaengine.compute.migration-ledger.v1','row_count':len(rows),'rows':rows}
          json.dump(value,open(f'{root}/migration-ledger.json','w'),sort_keys=True,separators=(',',':'))
          PY
          SEMANTIC_HEAD="$(python3 -c "import json;print(json.load(open('$PRIVATE/export-metadata.json'))['semantic_head'])")"

          python3 controller/r1/recovery_artifact_packager.py \
            --project-ref "$R1_PROJECT_REF" --semantic-head "$SEMANTIC_HEAD" \
            --source-git-sha "$GITHUB_SHA" --snapshot-at "$SNAPSHOT_AT" \
            --schema "$PRIVATE/schema.sql" --data "$PRIVATE/data.sql" --roles "$PRIVATE/roles.sql" \
            --migration-ledger "$PRIVATE/migration-ledger.json" --export-metadata "$PRIVATE/export-metadata.json" \
            --output-tar "$PRIVATE/recovery-bundle.tar" --output-receipt "$PRIVATE/bundle-receipt.json"

          python3 controller/r1/recovery_encryption_envelope.py encrypt \
            --bundle "$PRIVATE/recovery-bundle.tar" --bundle-receipt "$PRIVATE/bundle-receipt.json" \
            --recipients-file "$RUNNER_TEMP/r1-recovery-recipients.txt" \
            --profile PRODUCTION_PQ_TWO_RECIPIENT_MIN --age-bin "$AGE_BIN" \
            --output-ciphertext "$EVIDENCE/r1-recovery-ciphertext.age" \
            --output-receipt "$EVIDENCE/r1-recovery-envelope-receipt.json"
          python3 controller/r1/recovery_encryption_envelope.py verify-receipt \
            --ciphertext "$EVIDENCE/r1-recovery-ciphertext.age" \
            --receipt "$EVIDENCE/r1-recovery-envelope-receipt.json"
          python3 controller/r1/live_recovery_source_attestation.py build-predicate \
            --ciphertext "$EVIDENCE/r1-recovery-ciphertext.age" \
            --envelope-receipt "$EVIDENCE/r1-recovery-envelope-receipt.json" \
            --bundle-receipt "$PRIVATE/bundle-receipt.json" \
            --export-metadata "$PRIVATE/export-metadata.json" \
            --source-head-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$EVIDENCE/r1-recovery-source-predicate.json"

          cleanup
          trap - EXIT
          test ! -e "$PRIVATE"
          test -s "$EVIDENCE/r1-recovery-ciphertext.age"
          test -s "$EVIDENCE/r1-recovery-envelope-receipt.json"
          test -s "$EVIDENCE/r1-recovery-source-predicate.json"

      - name: Upload encrypted ciphertext only
        id: upload-ciphertext
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r1-recovery-ciphertext.age
          path: evidence/r1-recovery-ciphertext.age
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Upload non-secret envelope receipt
        id: upload-envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r1-recovery-envelope-receipt.json
          path: evidence/r1-recovery-envelope-receipt.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Upload source predicate candidate
        id: upload-predicate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r1-recovery-source-predicate.json
          path: evidence/r1-recovery-source-predicate.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  attest-source:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_source == true
    needs: source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Download ciphertext by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.source-build.outputs.ciphertext_artifact_id }}
          path: source
          digest-mismatch: error

      - name: Download source predicate by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.source-build.outputs.predicate_artifact_id }}
          path: source
          digest-mismatch: error

      - name: Generate custom Sigstore in-toto source attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: source/r1-recovery-ciphertext.age
          predicate-type: ${{ env.R1_SOURCE_PREDICATE_TYPE }}
          predicate-path: source/r1-recovery-source-predicate.json
          show-summary: true

      - name: Normalize portable attestation bundle name
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp '${{ steps.attest.outputs.bundle-path }}' evidence/r1-recovery-source-attestation.sigstore.jsonl
          test -s evidence/r1-recovery-source-attestation.sigstore.jsonl

      - name: Upload portable Sigstore bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r1-recovery-source-attestation.sigstore.jsonl
          path: evidence/r1-recovery-source-attestation.sigstore.jsonl
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  verify-source:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_source == true
    needs: [source-build, attest-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      verification_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact source-verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download ciphertext envelope and portable attestation by immutable IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.source-build.outputs.ciphertext_artifact_id }},${{ needs.source-build.outputs.envelope_artifact_id }},${{ needs.attest-source.outputs.attestation_artifact_id }}
          path: source
          digest-mismatch: error

      - name: Cryptographically verify exact source attestation policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify --help | grep -F -- '--source-digest' >/dev/null
          gh attestation verify --help | grep -F -- '--signer-digest' >/dev/null
          mkdir -p evidence
          gh attestation verify source/r1-recovery-ciphertext.age \
            --repo "$GITHUB_REPOSITORY" \
            --bundle source/r1-recovery-source-attestation.sigstore.jsonl \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/r1-live-recovery-source.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --predicate-type "$R1_SOURCE_PREDICATE_TYPE" \
            --deny-self-hosted-runners \
            --format json > evidence/gh-attestation-verification.json
          python3 controller/r1/live_recovery_source_attestation.py validate-verification \
            --verification evidence/gh-attestation-verification.json \
            --ciphertext source/r1-recovery-ciphertext.age \
            --envelope-receipt source/r1-recovery-envelope-receipt.json \
            --source-head-sha "$GITHUB_SHA" --source-run-id "$GITHUB_RUN_ID" \
            --output evidence/r1-recovery-source-verification.json
          python3 - <<'PY'
          import json
          v=json.load(open('evidence/r1-recovery-source-verification.json'))
          assert v['source_attestation_verified'] is True
          assert v['authority_effect'] is False
          assert v['r2_proven'] is False
          assert v['persisted_seal_allowed'] is False
          assert v['final_r2_evidence_binding_required'] is True
          PY

      - name: Upload cryptographic source-verification receipt
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r1-recovery-source-verification.json
          path: evidence/r1-recovery-source-verification.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 7
