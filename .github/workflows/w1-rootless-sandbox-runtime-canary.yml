name: W1 S2 Rootless Sandbox V2 Runtime Canary

on:
  push:
    branches: [work/w1-sandbox-launcher-prep]
    paths:
      - 'worker/native_linux/rootless_sandbox_launcher_v2.py'
      - 'worker/native_linux/rootless_sandbox_launcher.py'
      - 'controller/w1/s2_runtime_canary_receipt.py'
      - 'tests/test_w1_s2_runtime_canary_receipt.py'
      - '.github/workflows/w1-rootless-sandbox-runtime-canary.yml'

permissions: {}

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert audited S2 v2 source identity
        shell: bash
        run: |
          set -euo pipefail
          expected='25586bd8e0e97a78988f93d9c68c358b7eea6924015d06721afc135412d386df'
          actual="$(sha256sum worker/native_linux/rootless_sandbox_launcher_v2.py | awk '{print $1}')"
          echo "S2_V2_SHA256=$actual"
          test "$actual" = "$expected"

      - name: Verify runtime receipt contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile controller/w1/s2_runtime_canary_receipt.py
          python3 -m unittest tests.test_w1_s2_runtime_canary_receipt -v

      - name: Run S2 v2 and compose non-authority receipt
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          sandbox_root="/tmp/metaengine-w1-s2-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output_file="/tmp/w1-s2-v2-canary.txt"
          receipt_file="$GITHUB_WORKSPACE/w1-s2-v2-runtime-canary-receipt.json"
          source_sha="$(sha256sum worker/native_linux/rootless_sandbox_launcher_v2.py | awk '{print $1}')"
          rm -rf "$sandbox_root"
          set +e
          python3 worker/native_linux/rootless_sandbox_launcher_v2.py \
            --workspace "$workspace" \
            --sandbox-root "$sandbox_root" \
            -- python3 - <<'PY' > "$output_file" 2>&1
          import errno
          import os
          from pathlib import Path
          import resource
          import socket

          status = Path('/proc/self/status').read_text()
          fields = {}
          for line in status.splitlines():
              if ':' in line:
                  key, value = line.split(':', 1)
                  fields[key] = value.strip()

          root_fs = 'UNKNOWN'
          for line in Path('/proc/self/mountinfo').read_text().splitlines():
              left, sep, right = line.partition(' - ')
              if not sep:
                  continue
              left_fields = left.split()
              right_fields = right.split()
              if len(left_fields) >= 5 and right_fields and left_fields[4] == '/':
                  root_fs = right_fields[0]
                  break

          network_default_deny = False
          sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          sock.settimeout(0.25)
          try:
              sock.connect(('1.1.1.1', 53))
          except OSError:
              network_default_deny = True
          finally:
              sock.close()

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          probe = workspace / '.w1-s2-v2-runtime-canary'
          probe.write_text('ok', encoding='utf-8')
          workspace_rw = probe.read_text(encoding='utf-8') == 'ok'
          probe.unlink()

          pid1_environ_denied = False
          try:
              Path('/proc/1/environ').read_bytes()
          except PermissionError:
              pid1_environ_denied = True
          except OSError as exc:
              pid1_environ_denied = exc.errno in (errno.EACCES, errno.EPERM)

          print('EUID=' + str(os.geteuid()))
          print('PID=' + str(os.getpid()))
          print('PPID=' + str(os.getppid()))
          print('WORKER_IS_NOT_PID1=' + str(os.getpid() != 1).lower())
          print('PARENT_IS_NAMESPACE_PID1=' + str(os.getppid() == 1).lower())
          print('NO_NEW_PRIVS=' + fields.get('NoNewPrivs', '?'))
          print('SECCOMP=' + fields.get('Seccomp', '?'))
          print('ROOT_FS=' + root_fs)
          print('OLDROOT_DETACHED=' + str(not Path('/.oldroot').exists()).lower())
          print('WORKSPACE_RW=' + str(workspace_rw).lower())
          print('NETWORK_DEFAULT_DENY=' + str(network_default_deny).lower())
          print('RLIMIT_CORE_ZERO=' + str(resource.getrlimit(resource.RLIMIT_CORE) == (0, 0)).lower())
          print('PID1_ENVIRON_DENIED=' + str(pid1_environ_denied).lower())
          print('CANONICAL=false')
          print('AUTHORITY_EFFECT=false')
          print('WORKER_ADMITTED=false')
          print('W1_VERIFIED=false')
          PY
          launcher_rc=$?
          set -e
          cat "$output_file"
          echo "LAUNCHER_RC=$launcher_rc"
          rm -rf "$sandbox_root" || true

          python3 controller/w1/s2_runtime_canary_receipt.py \
            --launcher-rc "$launcher_rc" \
            --output "$output_file" \
            --source-sha256 "$source_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --head-sha "$GITHUB_SHA" \
            --receipt "$receipt_file"
          cat "$receipt_file"

      - name: Persist S2 runtime canary receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w1-s2-v2-runtime-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: w1-s2-v2-runtime-canary-receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false
