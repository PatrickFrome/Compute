name: A2 Browser R7J-A Syscall Inventory

on:
  push:
    branches:
      - work/a2-browser-r7j-positive-seccomp-allowlist
    paths:
      - 'coordination/browser-skill-source-linux/**'
      - 'research/A2_BROWSER_R7J_A_SYSCALL_INVENTORY_PRE_RESEARCH_2026-08-28.md'
      - '.github/workflows/a2-browser-r7j-a-syscall-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  r7j-a-syscall-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Establish deterministic environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          command -v strace
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Verify parent supply-chain closure and build helper
        shell: bash
        working-directory: coordination/browser-skill-source-linux
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.98.0"
          test -f Cargo.lock
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = \
            "ffdf4d85f832e92b20960ecdbc581103a113cf9ddfa93fa319ba124f21a3d003"
          cargo tree --locked > "$RUNNER_TEMP/r7j-a-cargo-tree.txt"
          cargo build --locked --release --bin a2-skill-source-helper
          sha256sum target/release/a2-skill-source-helper > "$RUNNER_TEMP/r7j-a-helper-sha256.txt"
          stat -c '%s' target/release/a2-skill-source-helper > "$RUNNER_TEMP/r7j-a-helper-size.txt"

      - name: Build deterministic protocol fixtures
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/r7j-a-fixture"
          mkdir -p "$FIXTURE/inspect/references" "$RUNNER_TEMP/r7j-a-inputs" "$RUNNER_TEMP/r7j-a-traces"
          cat > "$FIXTURE/inspect/SKILL.md" <<'EOF'
          ---
          name: inspect
          description: R7J syscall inventory fixture
          ---
          Read only.
          EOF
          printf 'reference-v1' > "$FIXTURE/inspect/references/REFERENCE.md"
          python3 - <<'PY'
          from pathlib import Path
          import struct

          out = Path('/tmp')
          base = Path(__import__('os').environ['RUNNER_TEMP']) / 'r7j-a-inputs'

          def frame(opcode, request_id, body=b''):
              payload = bytes([1, opcode]) + struct.pack('>H', 0) + struct.pack('>Q', request_id) + body
              return struct.pack('>I', len(payload)) + payload

          def read_body(name):
              raw = name.encode('ascii')
              return bytes([len(raw)]) + raw

          (base / 'happy.bin').write_bytes(
              frame(1, 11) + frame(2, 12, read_body('inspect'))
          )
          (base / 'missing.bin').write_bytes(frame(2, 21, read_body('missing')))
          (base / 'bad_opcode.bin').write_bytes(frame(255, 31))
          max_payload = 12 + 1 + 64
          (base / 'oversized.bin').write_bytes(struct.pack('>I', max_payload + 1))
          PY

      - name: Trace representative helper paths
        shell: bash
        working-directory: coordination/browser-skill-source-linux
        run: |
          set -euo pipefail
          HELPER=target/release/a2-skill-source-helper
          FIXTURE="$RUNNER_TEMP/r7j-a-fixture"
          INPUTS="$RUNNER_TEMP/r7j-a-inputs"
          TRACES="$RUNNER_TEMP/r7j-a-traces"

          trace_case() {
            case_name="$1"
            expected_rc="$2"
            set +e
            strace -qq -f -s 256 -o "$TRACES/${case_name}.trace" \
              "$HELPER" "$FIXTURE" \
              < "$INPUTS/${case_name}.bin" \
              > "$TRACES/${case_name}.stdout" \
              2> "$TRACES/${case_name}.stderr"
            rc=$?
            set -e
            test "$rc" -eq "$expected_rc"
          }

          trace_case happy 0
          trace_case missing 0
          trace_case bad_opcode 70
          trace_case oversized 70

          test -s "$TRACES/happy.stdout"
          test -s "$TRACES/missing.stdout"
          test ! -s "$TRACES/bad_opcode.stdout"
          test ! -s "$TRACES/oversized.stdout"
          grep -qx 'skill_helper_protocol_opcode_unsupported' "$TRACES/bad_opcode.stderr"
          grep -qx 'skill_helper_protocol_frame_too_large' "$TRACES/oversized.stderr"

      - name: Derive and audit syscall inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          trace_dir = Path(os.environ['RUNNER_TEMP']) / 'r7j-a-traces'
          cases = ['happy', 'missing', 'bad_opcode', 'oversized']
          call_re = re.compile(r'^(?:\d+\s+)?([A-Za-z0-9_]+)\(')
          dangerous = {
              'socket','socketpair','connect','bind','listen','accept','accept4',
              'sendto','sendmsg','sendmmsg','recvfrom','recvmsg','recvmmsg','shutdown',
              'clone','clone3','fork','vfork','execve','execveat','ptrace','unshare','setns',
              'mount','umount2','pivot_root','move_mount','fsopen','fsconfig','fsmount','open_tree',
              'bpf','perf_event_open','keyctl','add_key','request_key',
              'io_uring_setup','io_uring_enter','io_uring_register',
              'kexec_load','kexec_file_load','reboot','swapon','swapoff',
          }

          result = {
              'schema': 'a2.browser.r7j-a.syscall-inventory.v1',
              'platform': {'os': 'linux', 'arch': 'x86_64', 'rust': '1.98.0'},
              'cases': {},
          }
          union_all = set()
          union_steady = set()

          for case in cases:
              lines = (trace_dir / f'{case}.trace').read_text(errors='replace').splitlines()
              calls = []
              last_seccomp = None
              for index, line in enumerate(lines):
                  match = call_re.match(line)
                  if not match:
                      continue
                  name = match.group(1)
                  calls.append((index, name))
                  if name == 'seccomp':
                      last_seccomp = index
              if last_seccomp is None:
                  raise SystemExit(f'{case}: no seccomp installation observed')
              all_set = sorted({name for _, name in calls})
              steady = sorted({name for index, name in calls if index > last_seccomp})
              if not steady:
                  raise SystemExit(f'{case}: empty post-seccomp syscall set')
              bad = sorted(set(steady) & dangerous)
              if bad:
                  raise SystemExit(f'{case}: dangerous post-seccomp syscalls observed: {bad}')
              result['cases'][case] = {
                  'all_syscalls': all_set,
                  'steady_state_syscalls': steady,
                  'last_seccomp_trace_line': last_seccomp + 1,
              }
              union_all.update(all_set)
              union_steady.update(steady)

          result['union_all_syscalls'] = sorted(union_all)
          result['union_steady_state_syscalls'] = sorted(union_steady)
          result['union_steady_state_count'] = len(union_steady)
          result['dangerous_steady_state_intersection'] = sorted(union_steady & dangerous)
          result['policy_changed'] = False
          result['authority_effect'] = False

          out = Path(os.environ['RUNNER_TEMP']) / 'r7j-a-syscall-inventory.json'
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(out.read_text())
          PY

      - name: Run inherited R7I regressions
        shell: bash
        working-directory: coordination/browser-skill-source-linux
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets | tee "$RUNNER_TEMP/r7j-a-rust-regressions.log"

      - name: Build deterministic inventory evidence
        shell: bash
        run: |
          set -euo pipefail
          EPOCH="$SOURCE_DATE_EPOCH"
          OUT=dist/a2-browser-r7j-a
          mkdir -p "$OUT/evidence/traces"
          cp "$RUNNER_TEMP/r7j-a-syscall-inventory.json" "$OUT/evidence/R7J_A_SYSCALL_INVENTORY.json"
          cp "$RUNNER_TEMP/r7j-a-cargo-tree.txt" "$OUT/evidence/R7J_A_CARGO_TREE.txt"
          cp "$RUNNER_TEMP/r7j-a-helper-sha256.txt" "$OUT/evidence/R7J_A_HELPER_SHA256.txt"
          cp "$RUNNER_TEMP/r7j-a-helper-size.txt" "$OUT/evidence/R7J_A_HELPER_SIZE.txt"
          cp "$RUNNER_TEMP/r7j-a-rust-regressions.log" "$OUT/evidence/R7J_A_RUST_REGRESSIONS.log"
          cp "$RUNNER_TEMP"/r7j-a-traces/*.trace "$OUT/evidence/traces/"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/evidence/SOURCE_COMMIT.txt"
          printf '%s\n' '8da22eee9426f267f5982e90db246799cfe37e1c' > "$OUT/evidence/PARENT_VERIFIED_COMMIT.txt"
          cat > "$OUT/evidence/R7J_A_CLAIMS.json" <<'JSON'
          {"milestone":"R7J_A_TRACE_DRIVEN_SYSCALL_INVENTORY","runtime_policy_changed":false,"authority_effect":false,"architecture_bound":"linux-x86_64","representative_paths":4,"positive_allowlist_verified":false,"supabase_promotion_allowed":false}
          JSON
          tar --sort=name --mtime="@$EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf "$OUT/A2_BROWSER_R7J_A_SYSCALL_INVENTORY.tar" \
            coordination/browser-skill-source-linux/Cargo.toml \
            coordination/browser-skill-source-linux/Cargo.lock \
            coordination/browser-skill-source-linux/rust-toolchain.toml \
            coordination/browser-skill-source-linux/src \
            coordination/browser-skill-source-linux/tests \
            research/A2_BROWSER_R7J_A_SYSCALL_INVENTORY_PRE_RESEARCH_2026-08-28.md \
            "$OUT/evidence"
          sha256sum "$OUT/A2_BROWSER_R7J_A_SYSCALL_INVENTORY.tar" > "$OUT/R7J_A_SHA256SUMS.txt"

      - name: Attest inventory provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/a2-browser-r7j-a/A2_BROWSER_R7J_A_SYSCALL_INVENTORY.tar

      - name: Upload R7J-A evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: a2-browser-r7j-a-syscall-inventory-${{ github.sha }}
          path: |
            dist/a2-browser-r7j-a/A2_BROWSER_R7J_A_SYSCALL_INVENTORY.tar
            dist/a2-browser-r7j-a/R7J_A_SHA256SUMS.txt
            dist/a2-browser-r7j-a/evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
