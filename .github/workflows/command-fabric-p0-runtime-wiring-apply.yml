name: Command Fabric P0 Runtime Wiring Apply

on:
  push:
    branches:
      - work/browser-command-fabric-v2-p0
    paths:
      - .github/workflows/command-fabric-p0-runtime-wiring-apply.yml

permissions:
  contents: write

jobs:
  apply-exact-bounded-navigation-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: work/browser-command-fabric-v2-p0
          fetch-depth: 0
      - name: Apply exact-fenced runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'apps/metaengine-browser/src/main.mjs';
          let s = fs.readFileSync(p, 'utf8');

          const replaceExact = (from, to, label) => {
            const count = s.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}_expected_once_got_${count}`);
            s = s.replace(from, to);
          };
          const replaceRegex = (pattern, to, label) => {
            const matches = [...s.matchAll(new RegExp(pattern.source, pattern.flags.includes('g') ? pattern.flags : `${pattern.flags}g`))];
            if (matches.length !== 1) throw new Error(`${label}_expected_once_got_${matches.length}`);
            s = s.replace(pattern, to);
          };

          replaceExact(
            "import { NativeSupervisorClient } from './native-supervisor-client.mjs';\n",
            "import { NativeSupervisorClient } from './native-supervisor-client.mjs';\nimport { boundedNavigation } from './bounded-navigation.mjs';\n",
            'bounded_navigation_import',
          );

          replaceExact(
            "  attachSelected();\n  if (load) {\n",
            "  attachSelected();\n  let navigation = null;\n  if (load) {\n",
            'create_tab_navigation_slot',
          );
          replaceExact(
            "    const pendingLoad = view.webContents.loadURL(d.normalized_url);\n    if (awaitLoad) await pendingLoad;\n    else void pendingLoad.catch(() => publishSnapshot().catch(() => {}));\n",
            "    const pendingLoad = boundedNavigation(view.webContents, d.normalized_url);\n    if (awaitLoad) navigation = await pendingLoad;\n    else void pendingLoad.then(() => publishSnapshot().catch(() => {}), () => publishSnapshot().catch(() => {}));\n",
            'create_tab_bounded_load',
          );
          replaceExact(
            "  return { ...tab, webcontents_id: view.webContents.id, load_pending: load && !awaitLoad };\n",
            "  return {\n    ...tab,\n    webcontents_id: view.webContents.id,\n    load_pending: load && !awaitLoad,\n    navigation,\n    effect_outcome: 'CONFIRMED',\n    automatic_retry_allowed: false,\n  };\n",
            'create_tab_result',
          );

          replaceRegex(
            /async function loadTab\(tabId, input\) \{[\s\S]*?\n\}\n\nasync function closeTab/,
            `async function loadTab(tabId, input) {
  const view = views.get(String(tabId));
  if (!view || view.webContents.isDestroyed()) throw new Error('tab_binding_not_live');
  const d = navigationDecision(input);
  if (!d.allow) throw new Error(\`navigation_blocked:\${d.reason}\`);
  const navigation = await boundedNavigation(view.webContents, d.normalized_url);
  const confirmed = navigation.state === 'CONFIRMED';
  if (confirmed) {
    registry.update(String(tabId), { url: d.normalized_url, kind: d.kind });
  } else if (navigation.post_url) {
    const observed = navigationDecision(navigation.post_url);
    if (observed.allow) registry.update(String(tabId), { url: observed.normalized_url, kind: observed.kind });
  }
  invalidatePerception(String(tabId));
  await publishSnapshot();
  return {
    ok: confirmed,
    tab_id: String(tabId),
    url: confirmed ? d.normalized_url : (navigation.post_url || null),
    navigation,
    effect_outcome: confirmed ? 'CONFIRMED' : 'AMBIGUOUS',
    automatic_retry_allowed: false,
  };
}

async function closeTab`,
            'load_tab_function',
          );

          replaceRegex(
            /  if \(command === 'NAVIGATE'\) \{[\s\S]*?\n  \}\n  if \(command === 'BACK'\)/,
            `  if (command === 'NAVIGATE') {
    if (payload?.tab_id) return loadTab(payload.tab_id, payload?.url);
    if (!selectedView) throw new Error('no_selected_tab');
    return loadTab(selected.tab_id, payload?.url);
  }
  if (command === 'BACK')`,
            'selected_navigate_block',
          );

          fs.writeFileSync(p, s);
          NODE

          node --check apps/metaengine-browser/src/main.mjs
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "apps/metaengine-browser/src/main.mjs"
          grep -q "import { boundedNavigation } from './bounded-navigation.mjs';" apps/metaengine-browser/src/main.mjs
          test "$(grep -c 'boundedNavigation(view.webContents' apps/metaengine-browser/src/main.mjs)" = "2"
          ! grep -q 'selectedView.webContents.loadURL' apps/metaengine-browser/src/main.mjs
          git diff -- apps/metaengine-browser/src/main.mjs
      - name: Commit exact runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No change to commit'
            exit 0
          fi
          git config user.name 'METAENGINE CI'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/metaengine-browser/src/main.mjs
          git commit -m 'feat(browser): wire bounded navigation into runtime mutations'
          git push origin HEAD:work/browser-command-fabric-v2-p0
