name: W1 AWS SSM Safety Provision Live

on:
  push:
    branches:
      - work/main-roadmap-accelerators-v5
      - work/w1-linux-worker-safety
    paths:
      - '.github/workflows/w1-aws-ssm-safety-provision-live.yml'
      - 'controller/w1/aws_ssm_safety_live_cli.py'
      - 'controller/w1/aws_ssm_safety_provision_guard.py'
      - 'controller/w1/aws_ssm_safety_provision_provenance.py'
      - 'controller/w1/aws_ssm_safety_send_semantics_guard.py'
      - 'controller/w1/aws_ssm_iid_capture_guard.py'
      - 'controller/w1/aws_iid_courier_verifier.py'
      - 'controller/w1/aws_instance_identity_verifier.py'
      - 'controller/w1/aws_provider_reboot_controller.py'
      - 'infra/w1/ssm/Metaengine-W1-IID-Capture-H205F22.json'
      - 'tests/test_w1_aws_ssm_safety_live_cli.py'
      - 'tests/test_w1_aws_ssm_safety_live_workflow_contract.py'
      - 'research/W1_SSM_SAFETY_LIVE_WORKFLOW.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/w1-aws-ssm-safety-provision-live.yml'
      - 'controller/w1/aws_ssm_safety_live_cli.py'
      - 'controller/w1/aws_ssm_safety_provision_guard.py'
      - 'controller/w1/aws_ssm_safety_provision_provenance.py'
      - 'controller/w1/aws_ssm_safety_send_semantics_guard.py'
      - 'controller/w1/aws_ssm_iid_capture_guard.py'
      - 'controller/w1/aws_iid_courier_verifier.py'
      - 'controller/w1/aws_instance_identity_verifier.py'
      - 'controller/w1/aws_provider_reboot_controller.py'
      - 'infra/w1/ssm/Metaengine-W1-IID-Capture-H205F22.json'
      - 'tests/test_w1_aws_ssm_safety_live_cli.py'
      - 'tests/test_w1_aws_ssm_safety_live_workflow_contract.py'
      - 'research/W1_SSM_SAFETY_LIVE_WORKFLOW.md'
  workflow_dispatch:
    inputs:
      instance_id:
        description: Exact persistent W1 EC2 instance ID
        required: true
        type: string
      worker_id:
        description: Exact W1 worker ID bound by instance tags
        required: true
        type: string
      confirmation:
        description: Type PROVISION_W1_SAFETY_PACKAGE exactly
        required: true
        type: string

permissions: {}

concurrency:
  group: w1-aws-ssm-safety-provision-live
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE_SOURCE_SHA: 73ab09c75b71a6ea40f11e953cbcf9d9b94b9a89
  PROVISION_DOCUMENT_NAME: Metaengine-W1-Safety-Provision-H205F22
  IID_DOCUMENT_NAME: Metaengine-W1-IID-Capture-H205F22

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact source and live-workflow contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile \
            controller/w1/aws_ssm_safety_live_cli.py \
            controller/w1/aws_ssm_safety_provision_guard.py \
            controller/w1/aws_ssm_safety_provision_provenance.py \
            controller/w1/aws_ssm_safety_send_semantics_guard.py \
            controller/w1/aws_ssm_iid_capture_guard.py \
            controller/w1/aws_iid_courier_verifier.py \
            controller/w1/aws_instance_identity_verifier.py \
            controller/w1/aws_provider_reboot_controller.py
          python3 -m unittest \
            tests.test_w1_aws_ssm_safety_provision_guard \
            tests.test_w1_aws_ssm_safety_provision_provenance \
            tests.test_w1_aws_ssm_safety_send_semantics_guard \
            tests.test_w1_aws_ssm_iid_capture_guard \
            tests.test_w1_aws_iid_courier \
            tests.test_w1_aws_instance_identity_verifier \
            tests.test_w1_aws_ssm_safety_live_cli \
            tests.test_w1_aws_ssm_safety_live_workflow_contract -v

  live-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: [contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      instance_id: ${{ steps.gate.outputs.instance_id }}
      worker_id: ${{ steps.gate.outputs.worker_id }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fail closed unless explicit main live invocation
        id: gate
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          WORKER_ID: ${{ inputs.worker_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRMATION" = 'PROVISION_W1_SAFETY_PACKAGE'
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$WORKER_ID" =~ ^[A-Za-z0-9._:-]{3,160}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c "from controller.w1 import build_host_safety_package as p; assert p.SOURCE_COMMIT == '$EXPECTED_PACKAGE_SOURCE_SHA'"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "worker_id=$WORKER_ID" >> "$GITHUB_OUTPUT"

  provision:
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, live-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: w1-persistent-host-proof
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ needs.live-gate.outputs.instance_id }}
      WORKER_ID: ${{ needs.live-gate.outputs.worker_id }}
      AWS_ACCOUNT_ID: ${{ vars.W1_AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.W1_AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.W1_AWS_SSM_PROVISION_ROLE_ARN }}
      ROLE_SESSION: w1-prov-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build exact provisioning session boundary
        id: session
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws(-[a-z]+)?:iam::${AWS_ACCOUNT_ID}:role/.+ ]]
          mkdir -p evidence
          python3 -c "import json,os;from controller.w1 import aws_ssm_safety_provision_guard as g;v=g.build_session_boundary(instance_id=os.environ['INSTANCE_ID'],worker_id=os.environ['WORKER_ID'],account_id=os.environ['AWS_ACCOUNT_ID'],region=os.environ['AWS_REGION']);json.dump(v,open('evidence/provision-session-boundary.json','w'),sort_keys=True,separators=(',',':'))"
          POLICY="$(python3 -c "import json;print(json.dumps(json.load(open('evidence/provision-session-boundary.json'))['session_policy'],separators=(',',':')))" )"
          echo "policy=$POLICY" >> "$GITHUB_OUTPUT"

      - name: Configure narrow provisioning OIDC session
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.W1_AWS_SSM_PROVISION_ROLE_ARN }}
          aws-region: ${{ vars.W1_AWS_REGION }}
          allowed-account-ids: ${{ vars.W1_AWS_ACCOUNT_ID }}
          role-session-name: w1-prov-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
          inline-session-policy: ${{ steps.session.outputs.policy }}

      - name: Validate managed node and immutable remote document
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" --output json > evidence/provision-managed-node.json
          aws ssm describe-document --name "$PROVISION_DOCUMENT_NAME" --document-version '1' --output json > evidence/provision-document-description.json
          aws ssm get-document --name "$PROVISION_DOCUMENT_NAME" --document-version '1' --document-format JSON --output json > evidence/provision-get-document.json
          python3 controller/w1/aws_ssm_safety_live_cli.py validate-remote \
            --managed-node evidence/provision-managed-node.json \
            --description evidence/provision-document-description.json \
            --get-document evidence/provision-get-document.json \
            --instance-id "$INSTANCE_ID" --account-id "$AWS_ACCOUNT_ID" \
            --remote-output evidence/provision-remote.json \
            --plan-output evidence/provision-command-plan.json

      - name: Send exact parameterless provisioning command
        id: send
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          DOCUMENT_HASH="$(python3 -c "import json;print(json.load(open('evidence/provision-command-plan.json'))['document_hash'])")"
          REQUESTED_AT="$(python3 -c "from datetime import datetime,timezone;print(datetime.now(timezone.utc).isoformat())")"
          aws ssm send-command \
            --document-name "$PROVISION_DOCUMENT_NAME" --document-version '1' \
            --document-hash "$DOCUMENT_HASH" --document-hash-type Sha256 \
            --instance-ids "$INSTANCE_ID" --timeout-seconds 120 \
            --output json > evidence/provision-send-response.json
          API_RETURNED_AT="$(python3 -c "from datetime import datetime,timezone;print(datetime.now(timezone.utc).isoformat())")"
          python3 controller/w1/aws_ssm_safety_live_cli.py validate-send \
            --response evidence/provision-send-response.json \
            --plan evidence/provision-command-plan.json \
            --output evidence/provision-send-semantics.json
          COMMAND_ID="$(python3 -c "import json;print(json.load(open('evidence/provision-send-semantics.json'))['evidence']['command_id'])")"
          REQUESTED_AT="$REQUESTED_AT" API_RETURNED_AT="$API_RETURNED_AT" COMMAND_ID="$COMMAND_ID" \
            python3 -c "import json,os;json.dump({'requested_at':os.environ['REQUESTED_AT'],'api_returned_at':os.environ['API_RETURNED_AT'],'command_id':os.environ['COMMAND_ID'],'provisioner_role_arn':os.environ['AWS_ROLE_ARN'],'role_session':os.environ['ROLE_SESSION']},open('evidence/provision-request-metadata.json','w'),sort_keys=True,separators=(',',':'))"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Bounded retry for eventually-consistent command invocation
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          rm -f evidence/provision-command-invocation.json
          for attempt in $(seq 1 36); do
            set +e
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --plugin-name installPinnedSafetyPackage --output json \
              > evidence/provision-command-invocation.tmp \
              2> evidence/provision-command-invocation.err
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              if grep -q 'InvocationDoesNotExist' evidence/provision-command-invocation.err; then sleep 5; continue; fi
              cat evidence/provision-command-invocation.err >&2
              exit "$rc"
            fi
            status="$(python3 -c "import json;print(json.load(open('evidence/provision-command-invocation.tmp')).get('Status',''))")"
            if [[ "$status" == 'Success' ]]; then
              mv evidence/provision-command-invocation.tmp evidence/provision-command-invocation.json
              break
            fi
            case "$status" in Pending|InProgress|Delayed) sleep 5;; *) cat evidence/provision-command-invocation.tmp >&2; exit 1;; esac
          done
          test -s evidence/provision-command-invocation.json
          python3 controller/w1/aws_ssm_safety_live_cli.py validate-invocation \
            --invocation evidence/provision-command-invocation.json \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --output evidence/provision-invocation-transport.json

      - name: Upload credential-free provisioning transport evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w1-ssm-provision-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  iid-capture:
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, live-gate, provision]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: w1-persistent-host-proof
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ needs.live-gate.outputs.instance_id }}
      WORKER_ID: ${{ needs.live-gate.outputs.worker_id }}
      AWS_ACCOUNT_ID: ${{ vars.W1_AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.W1_AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.W1_AWS_SSM_IID_CAPTURE_ROLE_ARN }}
      ROLE_SESSION: w1-iid-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build exact IID capture session boundary
        id: session
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws(-[a-z]+)?:iam::${AWS_ACCOUNT_ID}:role/.+ ]]
          mkdir -p evidence
          python3 controller/w1/aws_ssm_iid_capture_guard.py build-boundary \
            --instance-id "$INSTANCE_ID" --worker-id "$WORKER_ID" \
            --w1-sha "$EXPECTED_PACKAGE_SOURCE_SHA" \
            --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --document-source infra/w1/ssm/Metaengine-W1-IID-Capture-H205F22.json \
            --output evidence/iid-session-boundary.json
          POLICY="$(python3 -c "import json;print(json.dumps(json.load(open('evidence/iid-session-boundary.json'))['session_policy'],separators=(',',':')))" )"
          echo "policy=$POLICY" >> "$GITHUB_OUTPUT"

      - name: Configure narrow IID capture OIDC session
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.W1_AWS_SSM_IID_CAPTURE_ROLE_ARN }}
          aws-region: ${{ vars.W1_AWS_REGION }}
          allowed-account-ids: ${{ vars.W1_AWS_ACCOUNT_ID }}
          role-session-name: w1-iid-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
          inline-session-policy: ${{ steps.session.outputs.policy }}

      - name: Capture signed IID through exact parameterless document
        id: capture
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          aws ssm describe-document --name "$IID_DOCUMENT_NAME" --document-version '1' --output json > evidence/iid-document-description.json
          aws ssm get-document --name "$IID_DOCUMENT_NAME" --document-version '1' --document-format JSON --output json > evidence/iid-get-document.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from controller.w1 import aws_ssm_iid_capture_guard as g
          remote=g.validate_remote_document(
              description=json.load(open('evidence/iid-document-description.json')),
              get_document=json.load(open('evidence/iid-get-document.json')),
              account_id=os.environ['AWS_ACCOUNT_ID'],
              local_document_source=Path('infra/w1/ssm/Metaengine-W1-IID-Capture-H205F22.json').read_bytes(),
          )
          plan=g.build_command_plan(
              instance_id=os.environ['INSTANCE_ID'],
              aws_document_sha256=remote['aws_document_sha256'],
              repository_document_source_sha256=remote['repository_document_source_sha256'],
          )
          json.dump(plan,open('evidence/iid-command-plan.json','w'),sort_keys=True,separators=(',',':'))
          PY
          HASH="$(python3 -c "import json;print(json.load(open('evidence/iid-command-plan.json'))['document_hash'])")"
          aws ssm send-command \
            --document-name "$IID_DOCUMENT_NAME" --document-version '1' \
            --document-hash "$HASH" --document-hash-type Sha256 \
            --instance-ids "$INSTANCE_ID" --timeout-seconds 60 \
            --output json > evidence/iid-send-response.json
          COMMAND_ID="$(python3 - <<'PY'
          import json
          from controller.w1 import aws_ssm_iid_capture_guard as g
          plan=json.load(open('evidence/iid-command-plan.json'))
          print(g.validate_send_command_response(json.load(open('evidence/iid-send-response.json')),plan=plan))
          PY
          )"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Bounded retry for signed IID invocation
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          COMMAND_ID: ${{ steps.capture.outputs.command_id }}
        run: |
          set -euo pipefail
          rm -f evidence/iid-command-invocation.json
          for attempt in $(seq 1 36); do
            set +e
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --plugin-name captureSignedIID --output json \
              > evidence/iid-command-invocation.tmp \
              2> evidence/iid-command-invocation.err
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              if grep -q 'InvocationDoesNotExist' evidence/iid-command-invocation.err; then sleep 5; continue; fi
              cat evidence/iid-command-invocation.err >&2
              exit "$rc"
            fi
            status="$(python3 -c "import json;print(json.load(open('evidence/iid-command-invocation.tmp')).get('Status',''))")"
            if [[ "$status" == 'Success' ]]; then
              mv evidence/iid-command-invocation.tmp evidence/iid-command-invocation.json
              break
            fi
            case "$status" in Pending|InProgress|Delayed) sleep 5;; *) cat evidence/iid-command-invocation.tmp >&2; exit 1;; esac
          done
          test -s evidence/iid-command-invocation.json
          python3 - <<'PY'
          import json,os
          from controller.w1 import aws_ssm_iid_capture_guard as g
          plan=json.load(open('evidence/iid-command-plan.json'))
          command_id=os.environ['COMMAND_ID']
          receipt=g.validate_invocation(
              json.load(open('evidence/iid-command-invocation.json')),
              command_id=command_id,
              instance_id=os.environ['INSTANCE_ID'],
              aws_document_sha256=plan['document_hash'],
              repository_document_source_sha256=plan['repository_document_source_sha256'],
          )
          json.dump(receipt,open('evidence/iid-capture-receipt.json','w'),sort_keys=True,separators=(',',':'))
          json.dump(receipt['courier_envelope'],open('evidence/iid-envelope.json','w'),sort_keys=True,separators=(',',':'))
          PY

      - name: Upload untrusted IID transport only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w1-iid-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  postverify:
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, live-gate, provision, iid-capture]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: w1-persistent-host-proof
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ needs.live-gate.outputs.instance_id }}
      WORKER_ID: ${{ needs.live-gate.outputs.worker_id }}
      AWS_ACCOUNT_ID: ${{ vars.W1_AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.W1_AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.W1_AWS_SSM_VERIFY_ROLE_ARN }}
      AWS_RSA2048_CERT_PEM_BASE64: ${{ vars.W1_AWS_RSA2048_CERT_PEM_BASE64 }}
      ROLE_SESSION: w1-verify-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download credential-free provisioning evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: w1-ssm-provision-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/provision

      - name: Download untrusted IID transport
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: w1-iid-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/iid

      - name: Build independent read-only verifier boundary
        id: session
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws(-[a-z]+)?:iam::${AWS_ACCOUNT_ID}:role/.+ ]]
          mkdir -p evidence/verify
          python3 -c "import json,os;from controller.w1 import aws_ssm_safety_provision_provenance as p;v=p.build_verifier_session_boundary(account_id=os.environ['AWS_ACCOUNT_ID'],region=os.environ['AWS_REGION']);json.dump(v,open('evidence/verify/verifier-session-boundary.json','w'),sort_keys=True,separators=(',',':'))"
          POLICY="$(python3 -c "import json;print(json.dumps(json.load(open('evidence/verify/verifier-session-boundary.json'))['session_policy'],separators=(',',':')))" )"
          echo "policy=$POLICY" >> "$GITHUB_OUTPUT"

      - name: Configure fresh read-only verifier OIDC session
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.W1_AWS_SSM_VERIFY_ROLE_ARN }}
          aws-region: ${{ vars.W1_AWS_REGION }}
          allowed-account-ids: ${{ vars.W1_AWS_ACCOUNT_ID }}
          role-session-name: w1-verify-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
          inline-session-policy: ${{ steps.session.outputs.policy }}

      - name: Independently capture provider host binding and verify signed IID
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json > evidence/verify/verifier-caller.json
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0]' --output json > evidence/verify/instance.json
          ROOT_VOLUME_ID="$(python3 - <<'PY'
          import json
          i=json.load(open('evidence/verify/instance.json'))
          root=i.get('RootDeviceName')
          for mapping in i.get('BlockDeviceMappings') or []:
              if mapping.get('DeviceName') == root and (mapping.get('Ebs') or {}).get('VolumeId'):
                  print(mapping['Ebs']['VolumeId'])
                  break
          PY
          )"
          [[ "$ROOT_VOLUME_ID" =~ ^vol-[0-9a-f]+$ ]]
          aws ec2 describe-volumes --volume-ids "$ROOT_VOLUME_ID" --query 'Volumes[0]' --output json > evidence/verify/root-volume.json
          mapfile -t SG_IDS < <(python3 - <<'PY'
          import json
          for group in json.load(open('evidence/verify/instance.json')).get('SecurityGroups') or []:
              print(group['GroupId'])
          PY
          )
          (( ${#SG_IDS[@]} > 0 ))
          aws ec2 describe-security-groups --group-ids "${SG_IDS[@]}" --query 'SecurityGroups' --output json > evidence/verify/security-groups.json
          python3 - <<'PY'
          import json
          bundle={
              'instance':json.load(open('evidence/verify/instance.json')),
              'security_groups':json.load(open('evidence/verify/security-groups.json')),
              'root_volume':json.load(open('evidence/verify/root-volume.json')),
          }
          json.dump(bundle,open('evidence/verify/preflight-bundle.json','w'),sort_keys=True,separators=(',',':'))
          PY
          python3 - <<'PY'
          import base64,os
          raw=base64.b64decode(os.environ['AWS_RSA2048_CERT_PEM_BASE64'],validate=True)
          assert raw.startswith(b'-----BEGIN CERTIFICATE-----')
          assert raw.rstrip().endswith(b'-----END CERTIFICATE-----')
          open('evidence/verify/aws-rsa2048.pem','wb').write(raw)
          PY
          python3 controller/w1/aws_iid_courier_verifier.py \
            --envelope evidence/iid/iid-envelope.json \
            --certificate evidence/verify/aws-rsa2048.pem \
            --instance-id "$INSTANCE_ID" --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" --output evidence/verify/verified-iid.json
          rm -f evidence/verify/aws-rsa2048.pem

      - name: Independently read SSM node document and invocation
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" --output json > evidence/verify/managed-node.json
          aws ssm describe-document --name "$PROVISION_DOCUMENT_NAME" --document-version '1' --output json > evidence/verify/provision-document-description.json
          aws ssm get-document --name "$PROVISION_DOCUMENT_NAME" --document-version '1' --document-format JSON --output json > evidence/verify/provision-get-document.json
          COMMAND_ID="$(python3 -c "import json;print(json.load(open('evidence/provision/provision-request-metadata.json'))['command_id'])")"
          rm -f evidence/verify/provision-command-invocation.json
          for attempt in $(seq 1 12); do
            set +e
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --plugin-name installPinnedSafetyPackage --output json \
              > evidence/verify/provision-command-invocation.tmp \
              2> evidence/verify/provision-command-invocation.err
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              if grep -q 'InvocationDoesNotExist' evidence/verify/provision-command-invocation.err; then sleep 5; continue; fi
              cat evidence/verify/provision-command-invocation.err >&2
              exit "$rc"
            fi
            mv evidence/verify/provision-command-invocation.tmp evidence/verify/provision-command-invocation.json
            break
          done
          test -s evidence/verify/provision-command-invocation.json
          python3 controller/w1/aws_ssm_safety_live_cli.py validate-invocation \
            --invocation evidence/verify/provision-command-invocation.json \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --output evidence/verify/provision-invocation-validated.json

      - name: Bounded CloudTrail correlation and strict provenance composition
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.W1_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          REQUESTED_AT="$(python3 -c "import json;print(json.load(open('evidence/provision/provision-request-metadata.json'))['requested_at'])")"
          rm -f evidence/verify/cloudtrail-selected.json
          for attempt in $(seq 1 24); do
            END_TIME="$(python3 -c "from datetime import datetime,timezone;print(datetime.now(timezone.utc).isoformat())")"
            aws cloudtrail lookup-events \
              --lookup-attributes AttributeKey=EventName,AttributeValue=SendCommand \
              --start-time "$REQUESTED_AT" --end-time "$END_TIME" \
              --max-results 50 --output json > evidence/verify/cloudtrail.json
            set +e
            python3 controller/w1/aws_ssm_safety_live_cli.py check-cloudtrail \
              --lookup evidence/verify/cloudtrail.json \
              --description evidence/verify/provision-document-description.json \
              --get-document evidence/verify/provision-get-document.json \
              --metadata evidence/provision/provision-request-metadata.json \
              --instance-id "$INSTANCE_ID" --account-id "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" --output evidence/verify/cloudtrail-selected.json \
              2> evidence/verify/cloudtrail-check.err
            rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then break; fi
            if [[ $rc -eq 2 ]] && grep -q 'W1_CLOUDTRAIL_RETRYABLE' evidence/verify/cloudtrail-check.err; then sleep 5; continue; fi
            cat evidence/verify/cloudtrail-check.err >&2
            exit "$rc"
          done
          test -s evidence/verify/cloudtrail-selected.json
          python3 controller/w1/aws_ssm_safety_live_cli.py compose \
            --metadata evidence/provision/provision-request-metadata.json \
            --cloudtrail evidence/verify/cloudtrail.json \
            --verifier-caller evidence/verify/verifier-caller.json \
            --preflight-bundle evidence/verify/preflight-bundle.json \
            --managed-node evidence/verify/managed-node.json \
            --description evidence/verify/provision-document-description.json \
            --get-document evidence/verify/provision-get-document.json \
            --invocation evidence/verify/provision-command-invocation.json \
            --verified-iid evidence/verify/verified-iid.json \
            --instance-id "$INSTANCE_ID" --worker-id "$WORKER_ID" \
            --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --output evidence/verify/strict-provisioning-provenance.json

      - name: Upload independent noncanonical provisioning provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w1-strict-provisioning-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/verify/
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30
