name: R1 Supervisor R2 DB Ingestion

on:
  pull_request:
    branches: [main]
    paths:
      - 'controller/r1/supervisor_r2_db_ingestion.py'
      - 'controller/r1/supervisor_r2_ingestion_authority_gate.py'
      - 'controller/r1/supervisor_r2_ingestion_gate.py'
      - 'controller/r1/final_r2_evidence_package.py'
      - 'tests/test_r1_supervisor_r2_db_ingestion.py'
      - 'tests/test_r1_supervisor_r2_ingestion_authority_gate.py'
      - 'tests/test_r1_supervisor_r2_ingestion_gate.py'
      - 'tests/test_r1_final_r2_evidence_package.py'
      - 'supabase/migrations/20260821234739_r1_step09b_supervisor_db_ingestion_v1.sql'
      - 'research/R1_STEP09B_APPEND_ONLY_DB_TRANSACTION.md'
      - '.github/workflows/r1-supervisor-r2-db-ingestion.yml'

permissions: {}

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile STEP09B runner
        run: |
          set -euo pipefail
          python3 -m py_compile controller/r1/supervisor_r2_db_ingestion.py

      - name: Run STEP09B adversarial runner suite
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_r1_supervisor_r2_db_ingestion -v

      - name: Re-run STEP08 and STEP09A evidence regressions
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_r1_final_r2_evidence_package -v
          python3 -m unittest tests.test_r1_supervisor_r2_ingestion_gate -v
          python3 -m unittest tests.test_r1_supervisor_r2_ingestion_authority_gate -v

      - name: Validate DB-only trust zone and migration authority boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/r1-supervisor-r2-db-ingestion.yml').read_text()
          before,_=wf.split('      - name: Validate DB-only trust zone and migration authority boundary',1)
          runner=Path('controller/r1/supervisor_r2_db_ingestion.py').read_text()
          migration=Path('supabase/migrations/20260821234739_r1_step09b_supervisor_db_ingestion_v1.sql').read_text().lower()
          assert 'workflow_'+'dispatch' not in before
          assert 'id-'+'token: write' not in before
          assert 'security invoker' in migration
          assert 'security definer' not in migration
          assert 'pg_advisory_xact_lock' in migration
          assert 'clock_timestamp()' in migration
          assert 'do update' not in migration
          assert 'compute_continuity_persisted_seal_h205f22' not in migration.split("comment on function",1)[0]
          assert 'FORBIDDEN_CREDENTIAL_ENV' in runner
          assert 'DB_ENV_ALLOWLIST' in runner
          assert 'decode(' in runner and 'base64' in runner
          assert 'canonical_roadmap_r2_promoted' in runner
          PY
