name: METAENGINE Browser Windows Manual Forward Qualification

on:
  push:
    branches:
      - work/preinstall-migration-20261027
  pull_request:
    paths:
      - 'apps/metaengine-browser/scripts/qa-forward-*.mjs'
      - 'apps/metaengine-browser/scripts/qa-forward-registration.ps1'
      - 'apps/metaengine-browser/test/qa-forward-*.test.mjs'
      - '.github/workflows/browser-windows-manual-forward-qualification.yml'
  workflow_dispatch:
    inputs:
      qualification_inputs:
        description: 'Exact manual-forward-inputs.v1 JSON: candidate and reviewed predecessor producer run/attempt, artifact IDs and archive SHA256 pins'
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Interrupting NSIS or publication is an unknown effect. Do not cancel another
# physical qualification because a new source push or dispatch arrives.
concurrency:
  group: browser-manual-forward-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source:
    name: manual-forward-source-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install frozen test dependencies without lifecycle effects
        working-directory: apps/metaengine-browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install frozen runtime test dependencies without lifecycle effects
        working-directory: infra/client-state-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact source and run forward contracts including native filesystem guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          node --test --test-reporter=tap apps/metaengine-browser/test/qa-forward-*.test.mjs > "$RUNNER_TEMP/manual-forward-source-tests.tap"
          cat "$RUNNER_TEMP/manual-forward-source-tests.tap"
          git diff --exit-code HEAD -- .
      - name: Upload source tests separately from physical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-forward-source-${{ matrix.os }}-${{ env.EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manual-forward-source-tests.tap
          if-no-files-found: error
          retention-days: 30

  physical:
    name: disposable-windows-manual-forward-composition
    if: github.event_name == 'workflow_dispatch'
    needs: source
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Checkout the exact candidate consumer source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install frozen verification dependencies without lifecycle effects
        working-directory: apps/metaengine-browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install frozen runtime verification dependencies without lifecycle effects
        working-directory: infra/client-state-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require a disposable hosted Windows runner and exact checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows' -or $env:GITHUB_ACTIONS -ne 'true' -or $env:CI -ne 'true') { throw 'manual_forward_disposable_windows_required' }
          if ($env:GITHUB_REPOSITORY -ne 'PatrickFrome/Compute' -or (git rev-parse HEAD) -ne $env:EXACT_HEAD -or $env:EXACT_HEAD -ne $env:GITHUB_SHA) { throw 'manual_forward_exact_source_required' }
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'manual_forward_archive_reader_missing' }
      - name: Acquire exact terminal-success producer artifacts by explicit pins
        working-directory: apps/metaengine-browser
        shell: pwsh
        env:
          ME2_GITHUB_TOKEN: ${{ github.token }}
          ME2_FORWARD_PIN_JSON: ${{ inputs.qualification_inputs }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Join-Path $env:RUNNER_TEMP 'manual-forward-pins.json'
          [System.IO.File]::WriteAllText($pins, $env:ME2_FORWARD_PIN_JSON, [System.Text.UTF8Encoding]::new($false))
          $inputsRoot = Join-Path $env:RUNNER_TEMP 'manual-forward-inputs'
          & node scripts/qa-forward-install-evidence.mjs acquire --pins $pins --out $inputsRoot --expected-head $env:EXACT_HEAD 1> "$env:RUNNER_TEMP\manual-forward-acquisition.json" 2> "$env:RUNNER_TEMP\manual-forward-acquisition-error.json"
          if ($LASTEXITCODE -ne 0) { throw 'manual_forward_inputs_BLOCKED' }
          $descriptor = Join-Path $inputsRoot 'verified-inputs.json'
          $pin = (Get-FileHash -LiteralPath $descriptor -Algorithm SHA256).Hash.ToLowerInvariant()
          "ME2_FORWARD_INPUTS=$descriptor" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "ME2_FORWARD_INPUTS_SHA256=$pin" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Compose real predecessor NSIS Owner PostgreSQL migration and restart once
        working-directory: apps/metaengine-browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts/qa-forward-install-physical.mjs --inputs $env:ME2_FORWARD_INPUTS --inputs-sha256 $env:ME2_FORWARD_INPUTS_SHA256 --evidence "$env:RUNNER_TEMP\manual-forward-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'manual_forward_physical_HOLD_or_BLOCKED' }
          git diff --exit-code HEAD -- .
          if ($LASTEXITCODE -ne 0) { throw 'manual_forward_source_changed' }
      - name: Upload only allowlisted redacted qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-forward-physical-${{ env.EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/manual-forward-acquisition.json
            ${{ runner.temp }}/manual-forward-acquisition-error.json
            ${{ runner.temp }}/manual-forward-evidence/*.json
          if-no-files-found: error
          retention-days: 30
