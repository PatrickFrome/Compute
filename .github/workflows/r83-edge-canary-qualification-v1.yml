name: R83 Edge Canary Qualification V1

on:
  push:
    branches:
      - 'work/r81-browser-release-convergence-v1'
    paths:
      - 'apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/**'
      - 'apps/metaengine-browser/test/postgres-command-wake.test.mjs'
      - 'apps/metaengine-browser/test/native-supervisor-realtime-command-wake-migration.test.mjs'
      - 'apps/metaengine-browser/test/rsi-result-delivery-integration.test.mjs'
      - 'apps/metaengine-browser/test/rsi-result-delivery-runtime-wiring.test.mjs'
      - 'apps/metaengine-browser/test/emergency-routes.test.mjs'
      - 'apps/metaengine-browser/test/cognitive-delta-edge-route.test.mjs'
      - 'coordination/convergence/R83_EDGE_CANARY_QUALIFICATION_V1.json'
      - '.github/workflows/r83-edge-canary-qualification-v1.yml'
  pull_request:
    paths:
      - 'apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/**'
      - 'apps/metaengine-browser/test/postgres-command-wake.test.mjs'
      - 'apps/metaengine-browser/test/native-supervisor-realtime-command-wake-migration.test.mjs'
      - 'apps/metaengine-browser/test/rsi-result-delivery-integration.test.mjs'
      - 'apps/metaengine-browser/test/rsi-result-delivery-runtime-wiring.test.mjs'
      - 'apps/metaengine-browser/test/emergency-routes.test.mjs'
      - 'apps/metaengine-browser/test/cognitive-delta-edge-route.test.mjs'
      - 'coordination/convergence/R83_EDGE_CANARY_QUALIFICATION_V1.json'
      - '.github/workflows/r83-edge-canary-qualification-v1.yml'

permissions:
  contents: read

jobs:
  static-canary-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact candidate head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Prove source equivalence to deployed v14 canary pin
        run: |
          set -euo pipefail
          MANIFEST=coordination/convergence/R83_EDGE_CANARY_QUALIFICATION_V1.json
          PIN="$(node -p "require('./' + process.argv[1]).candidate.source_pin" "$MANIFEST")"
          test -n "$PIN"
          git cat-file -e "$PIN^{commit}"
          git merge-base --is-ancestor "$PIN" HEAD
          git diff --exit-code "$PIN" HEAD --             apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1             supabase/migrations

      - name: Validate qualification manifest is fail-closed
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('coordination/convergence/R83_EDGE_CANARY_QUALIFICATION_V1.json', 'utf8'));
          if (m.schema !== 'metaengine.r83.edge-canary-qualification.v1') throw new Error('schema');
          if (!/^[0-9a-f]{40}$/.test(m.candidate.source_pin)) throw new Error('candidate_pin');
          if (!/^[0-9a-f]{64}$/.test(m.candidate.ezbr_sha256)) throw new Error('candidate_digest');
          if (!/^[0-9a-f]{40}$/.test(m.rollback.source_pin)) throw new Error('rollback_pin');
          if (!/^[0-9a-f]{64}$/.test(m.rollback.ezbr_sha256)) throw new Error('rollback_digest');
          if (m.candidate.source_binding_complete !== true) throw new Error('candidate_source_binding_must_be_complete');
          if (!Array.isArray(m.candidate.observed_import_pins) || m.candidate.observed_import_pins.length !== 1 || m.candidate.observed_import_pins[0] !== m.candidate.source_pin) {
            throw new Error('candidate_import_pin_binding_invalid');
          }
          if (m.rollback.source_binding_complete !== true && m.live_qualification.completed !== false) {
            throw new Error('rollback_source_drift_requires_open_live_qualification');
          }
          if (m.rollback.source_binding_complete !== true && m.promotion_authorized !== false) {
            throw new Error('rollback_source_drift_forbids_promotion');
          }
          if (m.rollback.source_binding_mode === 'PINNED_MIXED_IMPORT_CLOSURE_EXACT_ARTIFACT_CLONE') {
            if (!Array.isArray(m.rollback.observed_import_pins) || m.rollback.observed_import_pins.length < 1) {
              throw new Error('rollback_import_closure_missing');
            }
            if (m.rollback.observed_import_pins.some((pin) => !/^[0-9a-f]{40}$/.test(pin))) {
              throw new Error('rollback_import_closure_pin_invalid');
            }
            if (!m.rollback.observed_import_pins.includes(m.rollback.source_pin)) {
              throw new Error('rollback_primary_pin_not_in_closure');
            }
            if (m.rollback.exact_stable_artifact_digest_match !== true || m.rollback.rollback_snapshot_deployed !== true) {
              throw new Error('rollback_exact_artifact_clone_unproven');
            }
          }
          if (m.live_evidence?.rollback_drill_completed !== false) throw new Error('rollback_drill_must_remain_open_in_source');
          if (m.live_qualification.completed !== false) throw new Error('live_qualification_must_remain_open');
          if (m.live_qualification.signed_health_required !== true) throw new Error('signed_health_gate_required');
          if (m.live_qualification.installed_electron_signed_e2e_required !== true) throw new Error('installed_electron_gate_required');
          if (m.live_qualification.bounded_durable_lease_readback_required !== true) throw new Error('durable_lease_gate_required');
          if (m.live_qualification.result_receipt_readback_required !== true) throw new Error('result_receipt_gate_required');
          if (m.live_qualification.postgres_notify_accelerator_required !== false) throw new Error('postgres_notify_must_remain_optional_accelerator');
          if (m.live_qualification.rollback_drill_required !== true) throw new Error('rollback_drill_gate_required');
          if (m.evidence_policy?.mode !== 'EXTERNAL_SHA_BOUND') throw new Error('external_sha_bound_evidence_policy_required');
          if (m.evidence_policy?.build_once_test_exact_artifact !== true) throw new Error('build_once_policy_required');
          if (m.evidence_policy?.live_evidence_must_bind_exact_source_sha !== true) throw new Error('live_evidence_sha_binding_required');
          if (m.evidence_policy?.source_manifest_mutation_after_live_evidence !== false) throw new Error('source_manifest_post_evidence_mutation_forbidden');
          if (m.evidence_policy?.authority_effect !== false) throw new Error('evidence_policy_authority_effect');
          if (m.live_evidence?.mode !== 'EXTERNAL_SHA_BOUND') throw new Error('live_evidence_mode_invalid');
          if (m.live_evidence?.recorded_in_source_manifest !== false) throw new Error('live_evidence_must_not_be_committed_into_candidate');
          if (m.live_evidence?.completed !== false || m.live_evidence?.authority_effect !== false) throw new Error('source_manifest_live_evidence_must_remain_fail_closed');
          if (m.promotion_authorized !== false || m.authority_effect !== false) throw new Error('promotion_must_remain_fail_closed');
          const required = new Set([
            'createDbInspectRoutes',
            'createEmergencyCommandRoutes',
            'createPostgresCommandWakeHub',
            'createRsiResultReceiptReadback',
            'createCognitiveDeltaRoutes',
            'h205f22_a2_browser_supervisor_issue_native_v1',
            '/v1/commands/issue-tool',
          ]);
          for (const item of m.required_capabilities || []) required.delete(item);
          if (required.size) throw new Error('required_capability_manifest_gap:' + [...required].join(','));
          NODE

      - name: Prove required candidate capabilities exist in exact source
        run: |
          set -euo pipefail
          SRC=apps/metaengine-browser/supabase/a2-browser-native-supervisor-v1/index.ts
          grep -q 'createDbInspectRoutes' "$SRC"
          grep -q 'createEmergencyCommandRoutes' "$SRC"
          grep -q 'createPostgresCommandWakeHub' "$SRC"
          grep -q 'createRsiResultReceiptReadback' "$SRC"
          grep -q 'createCognitiveDeltaRoutes' "$SRC"
          grep -q 'h205f22_a2_browser_supervisor_issue_native_v1' "$SRC"
          grep -q '/v1/commands/issue-tool' "$SRC"

      - name: Run focused Edge convergence contracts
        working-directory: apps/metaengine-browser
        run: |
          set -euo pipefail
          node --test             test/postgres-command-wake.test.mjs             test/native-supervisor-realtime-command-wake-migration.test.mjs             test/rsi-result-delivery-integration.test.mjs             test/rsi-result-delivery-runtime-wiring.test.mjs             test/emergency-routes.test.mjs             test/cognitive-delta-edge-route.test.mjs

      - name: Prove static qualification has no authority effect
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
