name: A2 Browser Operator v0.6.5 Final

on:
  push:
    branches:
      - 'work/a2-browser-operator-v065-final*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: JavaScript syntax
        run: |
          for f in coordination/chat-control-plane/extension/*.js; do node --check "$f"; done
          for f in tests/a2_v060_*.mjs tests/a2_v063_*.mjs tests/a2_v064_*.mjs tests/a2_v065_*.mjs; do node --check "$f"; done
          node --check supabase/functions/a2-browser-supervisor-v4/index.ts

      - name: v0.6.5 final hardening labs
        run: |
          node tests/a2_v065_release_contract_lab.mjs
          node tests/a2_v064_supervisor_chat_guard_lab.mjs
          node tests/a2_v063_supervisor_device_transport_lab.mjs
          node tests/a2_v063_supervisor_device_edge_contract_lab.mjs
          node tests/a2_v063_supervisor_session_lab.mjs
          node tests/a2_v063_bridge_disarm_lab.mjs
          node tests/a2_v063_remote_authority_lab.mjs
          node tests/a2_v063_snapshot_ingress_lab.mjs
          node tests/a2_v063_supervisor_chat_session_lab.mjs
          node tests/a2_v063_trusted_supervisor_chat_lab.mjs
          node tests/a2_v063_supervisor_incident_lab.mjs
          node tests/a2_v063_supervisor_chat_action_lab.mjs

      - name: Existing Browser Operator regression labs
        run: |
          node tests/a2_v060_debugger_broker_lab.mjs
          node tests/a2_v060_operator_control_lab.mjs
          node tests/a2_v060_perception_lab.mjs
          node tests/a2_v060_oopif_perception_lab.mjs
          node tests/a2_v060_operator_actions_lab.mjs
          node tests/a2_v060_semantic_actions_lab.mjs
          node tests/a2_v060_update_manager_lab.mjs
          node tests/a2_v060_compat_config_lab.mjs
          node tests/a2_v060_supervisor_control_lab.mjs
          node tests/a2_v060_sidepanel_board_lab.mjs
          node tests/a2_v060_pairing_epoch_lab.mjs

      - name: Python contracts
        run: |
          python3 -m unittest -v tests.test_a2_browser_operator_v060_p0
          python3 -m unittest -v tests.test_a2_browser_operator_v060_debugger_integration

      - name: MV3 pack smoke
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --no-sandbox --disable-gpu --pack-extension="$GITHUB_WORKSPACE/coordination/chat-control-plane/extension"
          test -s coordination/chat-control-plane/extension.crx

      - name: Build reproducible v0.6.5 generic bundle
        run: |
          rm -rf dist/a2-browser-operator-v0.6.5
          mkdir -p dist/a2-browser-operator-v0.6.5
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('coordination/chat-control-plane/extension')
          out=Path('dist/a2-browser-operator-v0.6.5/METAENGINE_A2_Browser_Operator_v0.6.5_GENERIC.zip')
          fixed=(1980,1,1,0,0,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  info=zipfile.ZipInfo(path.relative_to(root).as_posix(),fixed)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o644 & 0xFFFF)<<16
                  zf.writestr(info,path.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          cp coordination/chat-control-plane/extension.crx dist/a2-browser-operator-v0.6.5/METAENGINE_A2_Browser_Operator_v0.6.5_GENERIC.crx
          printf '%s\n' "$GITHUB_SHA" > dist/a2-browser-operator-v0.6.5/GIT_COMMIT
          (cd dist/a2-browser-operator-v0.6.5 && sha256sum METAENGINE_A2_Browser_Operator_v0.6.5_GENERIC.zip METAENGINE_A2_Browser_Operator_v0.6.5_GENERIC.crx > SHA256SUMS)
          unzip -t dist/a2-browser-operator-v0.6.5/METAENGINE_A2_Browser_Operator_v0.6.5_GENERIC.zip

      - name: Assert final v0.6.5 contracts
        run: |
          node -e 'const m=require("./coordination/chat-control-plane/extension/manifest.json"); if(m.version!=="0.6.5") process.exit(1); if(Number(m.minimum_chrome_version)<125) process.exit(2)'
          grep -F '0.6.5-final.1' coordination/chat-control-plane/extension/bridge-runtime-v065.js
          grep -F '0.6.5-final.1' coordination/chat-control-plane/extension/runtime-marker-v065.js
          grep -F 'a2-browser-supervisor-v4"' coordination/chat-control-plane/extension/supervisor-device-transport-v063.js
          ! grep -F 'SIGNED_BASE = "https://xpeibufgzjknrhbhpffp.supabase.co/functions/v1/a2-browser-supervisor-v4-canary"' coordination/chat-control-plane/extension/supervisor-device-transport-v063.js
          grep -F 'h205f22_a2_browser_supervisor_complete_v4' supabase/functions/a2-browser-supervisor-v4/index.ts
          grep -F 'h205f22_a2_browser_device_rotate_embedded_bootstrap_v1' supabase/functions/a2-browser-supervisor-v4/index.ts
          grep -F 'bridgeSecret: ""' coordination/chat-control-plane/extension/bootstrap-config.js
          ! grep -R -E 'EXECUTE_JS|eval\(command|new Function\(' coordination/chat-control-plane/extension/supervisor-*.js

      - name: Upload generic install evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a2-browser-operator-v0.6.5-final-${{ github.sha }}
          path: dist/a2-browser-operator-v0.6.5/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
