name: METAENGINE Dark Workspace V2 Patch Temp

on:
  push:
    branches:
      - work/metaengine-browser-dark-workspace-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact dark workspace patch and repair stale proof contracts
        run: node .github/scripts/dark-workspace-v2-repair.mjs
      - name: Parse changed runtime and harness
        working-directory: apps/metaengine-browser
        run: |
          node --check src/main.mjs
          node --check src/shell-layout.mjs
          node --check test/browser-shell-visual-evidence.mjs
          node --check test/browser-final-shell-ui.test.mjs
          node --check test/browser-shell-accessibility-ui.test.mjs
          node --check test/browser-chatgpt-fast-open.test.mjs
          node --check test/browser-devos-layout-adaptation.test.mjs
      - name: Run targeted dark workspace contracts
        working-directory: apps/metaengine-browser
        run: node --test test/browser-final-shell-ui.test.mjs test/browser-shell-accessibility-ui.test.mjs test/browser-chatgpt-fast-open.test.mjs test/browser-devos-layout-adaptation.test.mjs test/browser-devos-session-surface-ui.test.mjs test/browser-security-static-gate.test.mjs
      - name: Remove one-shot patch machinery
        run: git rm .github/scripts/dark-workspace-v2-patch.mjs .github/scripts/dark-workspace-v2-runner.mjs .github/scripts/dark-workspace-v2-repair.mjs .github/workflows/dark-workspace-v2-patch-temp.yml
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/metaengine-browser
          git diff --cached --check
          git commit -m "feat(browser): converge dark browser-first workspace v2"
          git push origin HEAD:work/metaengine-browser-dark-workspace-v2
