name: Repair Supervisor Multihop Ambiguity R6

on:
  push:
    branches:
      - repair/supervisor-multihop-ambiguity-r1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: repair/supervisor-multihop-ambiguity-r1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply repair
        run: python3 scripts/apply-supervisor-multihop-ambiguity-r6.py
      - name: Focused gates
        run: |
          node --check apps/metaengine-browser/src/supervisor-keepalive.mjs
          node --check apps/metaengine-browser/src/supervisor-lifecycle-runtime-core.mjs
          node --test apps/metaengine-browser/test/supervisor-process-boundary-ambiguity-r5.test.mjs
      - name: Commit repair
        run: |
          rm .github/workflows/repair-supervisor-multihop-ambiguity-r6.yml scripts/apply-supervisor-multihop-ambiguity-r6.py
          git config user.name 'METAENGINE Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(browser): preserve multihop ambiguity fence'
          git push origin HEAD:repair/supervisor-multihop-ambiguity-r1
