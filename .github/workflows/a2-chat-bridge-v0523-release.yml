name: A2 Chat Bridge v0.5.23 Final
on:
  push:
    branches: [release/a2-chat-bridge-v0.5.23]
    paths:
      - 'coordination/chat-control-plane/extension/**'
      - 'tests/test_a2_chat_bridge_v0523_final.py'
      - 'tests/a2_v0523_playwright_smoke.mjs'
      - '.github/workflows/a2-chat-bridge-v0523-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: |
          for f in coordination/chat-control-plane/extension/*.js; do node --check "$f"; done
      - name: v0.5.23 adversarial contract
        run: python3 -m unittest -v tests.test_a2_chat_bridge_v0523_final
      - name: Deterministic ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          src=Path('coordination/chat-control-plane/extension'); out=Path('METAENGINE_A2_Chat_Bridge_v0.5.23_STRICT_GLM_FIRST_FINAL.zip')
          with ZipFile(out,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
            for p in sorted(x for x in src.rglob('*') if x.is_file()):
              info=ZipInfo(p.relative_to(src).as_posix(),date_time=(1980,1,1,0,0,0)); info.compress_type=ZIP_DEFLATED; info.external_attr=0o100644<<16; info.create_system=3
              z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          PY
          unzip -t METAENGINE_A2_Chat_Bridge_v0.5.23_STRICT_GLM_FIRST_FINAL.zip
          sha256sum METAENGINE_A2_Chat_Bridge_v0.5.23_STRICT_GLM_FIRST_FINAL.zip | tee METAENGINE_A2_Chat_Bridge_v0.5.23_STRICT_GLM_FIRST_FINAL.zip.sha256
      - name: Chromium pack smoke
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --no-sandbox --disable-gpu --pack-extension="$GITHUB_WORKSPACE/coordination/chat-control-plane/extension"
          test -s coordination/chat-control-plane/extension.crx
      - name: Playwright 1.62.1 MV3 service-worker gate
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/a2_v0523_playwright_smoke.mjs
      - name: Release metadata
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('METAENGINE_A2_Chat_Bridge_v0.5.23_STRICT_GLM_FIRST_FINAL.zip')
          r={'release':'0.5.23','git_sha':os.environ['GITHUB_SHA'],'zip_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'ordering_policy':'STRICT_GLM_FIRST_ACTUATED_V1','glm_first':True,'gpt_gate':'GLM_ACTUATED_OR_A2_GLM_ALREADY_SUBMITTED','pending_command_journal':True,'pairing_secret_vault':'IndexedDB','content_send_capability':False,'authority_effect':False}
          Path('METAENGINE_A2_Chat_Bridge_v0.5.23_RELEASE.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: METAENGINE-A2-Chat-Bridge-v0.5.23-FINAL-STRICT-GLM-FIRST
          path: |
            METAENGINE_A2_Chat_Bridge_v0.5.23_STRICT_GLM_FIRST_FINAL.zip
            METAENGINE_A2_Chat_Bridge_v0.5.23_STRICT_GLM_FIRST_FINAL.zip.sha256
            METAENGINE_A2_Chat_Bridge_v0.5.23_RELEASE.json
            coordination/chat-control-plane/extension.crx
          if-no-files-found: error
          retention-days: 30
