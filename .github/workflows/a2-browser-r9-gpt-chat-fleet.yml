name: A2 Browser R9 GPT Chat Fleet

on:
  push:
    branches:
      - work/a2-browser-r9-gpt-chat-fleet
    paths:
      - 'coordination/browser-shared/agent-fleet-core-v1.mjs'
      - 'coordination/browser-shared/evidence-blackboard-v1.mjs'
      - 'coordination/browser-shared/agent-fleet-scheduler-v1.mjs'
      - 'tests/a2_r9_*.test.mjs'
      - 'research/A2_BROWSER_R9_**'
      - '.github/workflows/a2-browser-r9-gpt-chat-fleet.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  r9-fleet-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact R8D parent and source boundary
        shell: bash
        run: |
          set -euo pipefail
          PARENT=4d6d6afe7b97e1972cb01aed1ab24054bd761cce
          git merge-base --is-ancestor "$PARENT" "$GITHUB_SHA"
          git diff --name-only "$PARENT" "$GITHUB_SHA" | tee "$RUNNER_TEMP/r9-changed-files.txt"
          if git diff --name-only "$PARENT" "$GITHUB_SHA" | grep -Eq '(^|/)(package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.(toml|lock))$'; then
            echo 'R9 must add no source dependency packages' >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Static zero-authority checks
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            coordination/browser-shared/agent-fleet-core-v1.mjs
            coordination/browser-shared/evidence-blackboard-v1.mjs
            coordination/browser-shared/agent-fleet-scheduler-v1.mjs
          )
          for f in "${FILES[@]}"; do
            node --check "$f"
            ! grep -Eq 'chrome\.|Input\.dispatch|Runtime\.evaluate|fetch\(|WebSocket|child_process|exec\(|eval\(' "$f"
          done
          grep -q 'automatic_retry_allowed: false' coordination/browser-shared/agent-fleet-core-v1.mjs
          grep -q 'direct_peer_messaging: false' coordination/browser-shared/agent-fleet-scheduler-v1.mjs
          grep -q 'content_digest' coordination/browser-shared/evidence-blackboard-v1.mjs
          ! grep -q 'raw_response' coordination/browser-shared/evidence-blackboard-v1.mjs

      - name: R9 lifecycle, blackboard and scheduler tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/a2_r9_*.test.mjs

      - name: R8 regression fence
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/a2_r8a_*.test.mjs tests/a2_r8b_*.test.mjs tests/a2_r8c_*.test.mjs tests/a2_r8d_*.test.mjs

      - name: Build deterministic R9 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist/a2-browser-r9
          mkdir -p "$OUT/evidence"
          cp "$RUNNER_TEMP/r9-changed-files.txt" "$OUT/evidence/R9_CHANGED_FILES.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/evidence/SOURCE_COMMIT.txt"
          printf '%s\n' '4d6d6afe7b97e1972cb01aed1ab24054bd761cce' > "$OUT/evidence/PARENT_R8D_COMMIT.txt"
          cat > "$OUT/evidence/R9_CLAIMS.json" <<'JSON'
          {"milestone":"R9_GPT_CHAT_FLEET_V1","manager_pattern":true,"one_active_assignment_per_agent":true,"lost_auto_retry":false,"rollover_preserves_agent_id":true,"append_only_evidence_blackboard":true,"evidence_body_stored":false,"direct_peer_messaging":false,"adaptive_spawn_plan_side_effect":false,"browser_authority":false,"new_source_dependency_packages":0}
          JSON
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf "$OUT/A2_BROWSER_R9_GPT_CHAT_FLEET.tar" \
            coordination/browser-shared/agent-fleet-core-v1.mjs \
            coordination/browser-shared/evidence-blackboard-v1.mjs \
            coordination/browser-shared/agent-fleet-scheduler-v1.mjs \
            tests/a2_r9_agent_fleet_core.test.mjs \
            tests/a2_r9_evidence_blackboard.test.mjs \
            tests/a2_r9_agent_fleet_scheduler.test.mjs \
            research/A2_BROWSER_R9_GPT_CHAT_FLEET_PRE_RESEARCH_2026-08-29.md \
            "$OUT/evidence"
          sha256sum "$OUT/A2_BROWSER_R9_GPT_CHAT_FLEET.tar" > "$OUT/R9_SHA256SUMS.txt"

      - name: Attest R9 evidence
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/a2-browser-r9/A2_BROWSER_R9_GPT_CHAT_FLEET.tar

      - name: Upload R9 evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: a2-browser-r9-${{ github.sha }}
          path: |
            dist/a2-browser-r9/A2_BROWSER_R9_GPT_CHAT_FLEET.tar
            dist/a2-browser-r9/R9_SHA256SUMS.txt
            dist/a2-browser-r9/evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
