[package]
name = "a2-skill-source-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
r7l-test-hooks = []

[dependencies]
landlock = "=0.4.7"
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["fs", "thread"] }
seccompiler = "=0.5.0"

[[bin]]
name = "a2-r7l-preexec-probe"
path = "tests/support/r7l_preexec_probe.rs"
required-features = ["r7l-test-hooks"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = "symbols"
