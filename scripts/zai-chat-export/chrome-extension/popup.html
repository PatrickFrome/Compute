<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { width: 280px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; background: #0b1120; color: #e5e7eb; }
  h1 { margin: 0 0 4px; font-size: 14px; }
  .sub { color: #94a3b8; font-size: 11px; margin-bottom: 12px; }
  label.toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer; font-size: 12px; color: #cbd5e1; }
  .row { display: flex; gap: 8px; }
  button.fmt, button.util { flex: 1; padding: 9px 0; border-radius: 9px; border: 1px solid #334155; background: #1e293b; color: #e5e7eb; font: 600 12px/1 system-ui, sans-serif; cursor: pointer; }
  button.fmt:hover, button.util:hover { background: #334155; }
  button.fmt.md { border-color: #10b981; }
  button.util:disabled { opacity: .55; cursor: wait; }
  button.fmt:disabled { opacity: .55; cursor: wait; }
  .util-row { display: flex; gap: 8px; margin-top: 8px; }
  #status { margin-top: 12px; min-height: 32px; font-size: 11.5px; color: #94a3b8; white-space: pre-wrap; word-break: break-word; }
  #status.ok { color: #34d399; }
  #status.err { color: #f87171; }
  .hint { margin-top: 10px; font-size: 10.5px; color: #64748b; }
</style>
</head>
<body>
  <h1>Z.ai Chat Export</h1>
  <div class="sub">Экспорт всего текста чата: авто-прокрутка + дедупликация</div>
  <label class="toggle"><input type="checkbox" id="autoscroll" checked> Прокручивать историю вверх (грузить всё)</label>
  <div class="row">
    <button class="fmt md" data-format="md">Markdown</button>
    <button class="fmt" data-format="json">JSON</button>
    <button class="fmt" data-format="txt">TXT</button>
  </div>
  <div class="util-row">
    <button class="util" id="copy">Скопировать текст</button>
  </div>
  <div id="status">Готов. Формат: клик по кнопке; на странице есть кнопка «Export chat», хоткей Ctrl+Shift+Y.</div>
  <div class="hint">Файл скачивается в стандартную папку загрузок Chrome.</div>
  <script src="popup.js"></script>
</body>
</html>
