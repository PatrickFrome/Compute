# ---- Pigsty-flavored tuning (rootless sandbox profile) ----
# Canonical copy of the live PGDATA/pigsty-tuning.conf.
# Included from postgresql.conf via:  include = 'pigsty-tuning.conf'
# Adjust unix_socket_directories + cron.host when relocating PGDATA.
listen_addresses = '*'
port = 55432
unix_socket_directories = '/home/z/my-project/pigsty/rootless/run'
max_connections = 100
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB
huge_pages = off
max_worker_processes = 8
max_parallel_workers = 2
max_parallel_workers_per_gather = 2
# logical: required by the supabase_realtime publication restored from the dump
wal_level = logical
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
autovacuum = on
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
shared_preload_libraries = 'pg_stat_statements,pg_cron,pg_net'
cron.database_name = 'postgres'
# sandbox has no IPv4 localhost -> connect via the cluster's unix socket dir
cron.host = '/home/z/my-project/pigsty/rootless/run'
# run jobs as background workers: no libpq connect at all (sandbox-proof,
# lower overhead; this is what made the 5 fabric cron jobs succeed)
cron.use_background_workers = on
pg_net.max_batch_size = 500
track_io_timing = on
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'
